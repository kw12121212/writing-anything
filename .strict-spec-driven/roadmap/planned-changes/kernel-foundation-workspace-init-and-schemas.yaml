summary: 实现 wa-cli init / validate / status 与产物的 JSON Schema 校验
details: wa-cli init 在目标目录创建 .writing-anything/ 工作区（Workspace），包含 config.yaml（语言、默认文体、启用的规范包、关卡强度 Gate Level）以及 sources/、works/ 目录；重复运行只补齐缺失文件，不覆盖已有文件。产物的 JSON Schema 用 embed 打包进二进制；validate 校验单个产物或整个工作区；status 汇总工作区状态。测试夹具（Test Fixture）放在各包的 testdata/ 下。
depends_on:
