schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: methods
operations:
  ADDED: {}
  MODIFIED:
    method-data:
      strength: MUST
      statement: 写作法模板（Method Template）必须是纯数据，含 id、title、可选的 description、kind 与可选的 rubric（评分标准（Rubric）条目，字段同文体的 rubric）：kind 为 article（文章类，必须有 sections：按顺序排列的必需章节，每项含 id、title 与可选的 description）、structure（结构类，必须有 beats：节拍，每项另含 position.min 与 position.max，取值 0 到 1，表示按字数比例在全文中的位置范围，以及可选的 tension：目标张力（Target Tension），0 到 10 的整数，作为情绪曲线（Emotion Curve）与张力曲线（Tension Curve）的目标走势）或 planning（规划类，必须有 steps：规划步骤（Planning Step），每项含 id、title、可选的 description 与可选的 product：规划产物（Planning Product），取值 characters（设定集人物条目）、scenes（单元树场景单元）或 scene-contracts（场景契约（Scene Contract）），声明该步骤的产物链接（Plan Link）类型，供 plan 命令按 plan 主规格校验）；三种列表只能出现与 kind 对应的一种，不得有其他字段；product 取值不在枚举内时报告 artifact.schema-violation（field 为 methods[i].steps[j].product）。wa-cli 必须随二进制提供内置文章类写作法：pyramid-scqa（金字塔原理与 SCQA）、general-specific-general（总分总）、inverted-pyramid（倒金字塔）、diataxis-tutorial、diataxis-how-to、diataxis-reference 与 diataxis-explanation（Diátaxis 的教程、操作指南、参考与解释），营销写作法 aida（AIDA：注意、兴趣、欲望、行动）与 pas（PAS：问题、放大、解决），内置结构类写作法：three-act（三幕结构（Three-Act Structure）：setup、confrontation、climax 与 resolution 四个节拍）、save-the-cat（救猫咪节拍表（Save the Cat! Beat Sheet），15 个节拍）、seven-point（七点结构（Seven-Point Story Structure）：hook、plot-turn-1、pinch-1、midpoint、pinch-2、plot-turn-2 与 resolution 七个节拍）、qichengzhuanhe（起承转合：qi、cheng、zhuan 与 he 四个节拍）、hero-journey（英雄之旅（Hero's Journey），12 个阶段）、golden-three（黄金三章（Golden Three Chapters）：hook（钩子）、protagonist（主角亮相）与 core-conflict（核心冲突与金手指）三个节拍，供覆盖开头三章的根单元或部单元选用）与 volume-structure（卷结构（Volume Structure）：goal（目标）、climax（高潮）与 cliffhanger（断章）三个节拍，供部（卷）单元选用），以及内置规划类写作法 snowflake（雪花写作法（Snowflake Method）十步：one-sentence（一句话概括）、one-paragraph（一段话概括）、character-sketch（人物概要）、one-page-synopsis（一页纲要）、character-details（人物详述）、four-page-synopsis（四页纲要）、character-bible（人物宝典）、scene-list（场景列表）、scene-details（场景详述）与 start-writing（开始写作）；character-sketch、character-details 与 character-bible 的 product 为 characters，scene-list 为 scenes，scene-details 为 scene-contracts，其余不声明 product）；内置结构类的每个节拍都声明 position 与 tension。规范包（Pack）可以在 methods 中定义写作法；文体（Genre）可以在 default_method 中声明默认写作法，取值必须是内置写作法（否则报告 genre.unknown-method）。同一个规范包中写作法 id 重复，或同一个写作法中章节、节拍、步骤或评分项的 id 重复时报告 artifact.duplicate-id；节拍的 position.min 大于 max 时报告 method.invalid-position；节拍的 tension 不是 0 到 10 的整数时报告 method.invalid-tension；写作法 id 为 none（写作简报中表示不用写作法）时报告 method.reserved-id；这些问题由 wa-cli validate 报告，field 指向出错的位置（如 methods[0].beats[1].position 或 methods[0].steps[0].product）。
      scenarios:
        pack-method-problem:
          - GIVEN: '工作区规范包 house 的 methods[0] 是结构类写作法，第二个节拍的 position 为 {min: 0.9, max: 0.1}，config.yaml 的 packs 为 [house]'
          - WHEN: 运行 wa-cli validate --dir D --json
          - THEN: diagnostics 中有一条错误码为 method.invalid-position、field 为 methods[0].beats[1].position 的诊断，退出码为 1
        builtin-marketing-methods:
          - GIVEN: 已初始化的工作区
          - WHEN: 运行 wa-cli method show aida --dir D --json 与 wa-cli method show pas --dir D --json
          - THEN: aida 为文章类，sections 依次为 attention、interest、desire、action；pas 为文章类，sections 依次为 problem、agitate、solution；source 都为 builtin，退出码为 0
        structure-builtin-methods:
          - GIVEN: 已初始化的工作区
          - WHEN: 运行 wa-cli method show three-act --dir D --json 与 wa-cli method show save-the-cat --dir D --json
          - THEN: three-act 为结构类，beats 依次为 setup（position 为 0 到 0.3）、confrontation、climax（position 为 0.7 到 1）与 resolution，每个节拍含 0 到 10 整数的 tension；save-the-cat 为结构类，beats 恰好 15 项；source 都为 builtin，退出码为 0
        pack-tension-out-of-range:
          - GIVEN: 工作区规范包 house 的 methods[0] 是结构类写作法，第一个节拍的 tension 为 12，config.yaml 的 packs 为 [house]
          - WHEN: 运行 wa-cli validate --dir D --json
          - THEN: diagnostics 中有一条错误码为 method.invalid-tension、field 为 methods[0].beats[0].tension 的诊断，退出码为 1
        builtin-planning-method:
          - GIVEN: 已初始化的工作区
          - WHEN: 运行 wa-cli method show snowflake --dir D --json
          - THEN: snowflake 为规划类，steps 依次为 one-sentence、one-paragraph、character-sketch、one-page-synopsis、character-details、four-page-synopsis、character-bible、scene-list、scene-details 与 start-writing，其中 character-sketch、character-details 与 character-bible 的 product 为 characters，scene-list 为 scenes，scene-details 为 scene-contracts，其余步骤没有 product；source 为 builtin，退出码为 0
        builtin-web-structure:
          - GIVEN: 已初始化的工作区
          - WHEN: 运行 wa-cli method show golden-three --dir D --json 与 wa-cli method show volume-structure --dir D --json
          - THEN: golden-three 为结构类，beats 依次为 hook、protagonist 与 core-conflict；volume-structure 为结构类，beats 依次为 goal、climax 与 cliffhanger；两者的每个节拍都含 position 的 min 与 max 及 0 到 10 整数的 tension；source 都为 builtin，退出码为 0
        pack-product-invalid:
          - GIVEN: 工作区规范包 house 的 methods[0] 是规划类写作法，第一个步骤的 product 为 robots，config.yaml 的 packs 为 [house]
          - WHEN: 运行 wa-cli validate --dir D --json
          - THEN: diagnostics 中有一条错误码为 artifact.schema-violation、field 为 methods[0].steps[0].product 的诊断，退出码为 1
    method-list-show:
      strength: MUST
      statement: wa-cli method list 必须只读地列出工作区可用的写作法：内置写作法，以及 config.yaml 的 packs（为空时为内置 default 规范包）按顺序定义的写作法，同一 id 由后出现的来源覆盖；--json 输出的 methods 按 id 排序，每项含 id、title、description（没有时为空字符串）、kind、source（builtin 或 pack:<id>）、sections、beats、steps 与 rubric（没有时为空数组），beats 每项另含 position 的 min 与 max，以及节拍声明了目标张力（Target Tension）时的 tension，steps 每项另含声明了规划产物（Planning Product）时的 product。wa-cli method show <method> 必须只读地输出该写作法（字段同 method list 的每项）；不存在时报告 method.not-found（next 包含 wa-cli method list --dir <dir> --json），method 为 null，退出码为 1。
      scenarios:
        list-builtin:
          - GIVEN: 刚初始化的工作区 D
          - WHEN: 运行 wa-cli method list --dir D --json
          - THEN: methods 依次为 aida、diataxis-explanation、diataxis-how-to、diataxis-reference、diataxis-tutorial、general-specific-general、golden-three、hero-journey、inverted-pyramid、pas、pyramid-scqa、qichengzhuanhe、save-the-cat、seven-point、snowflake、three-act 与 volume-structure，其中 hero-journey、golden-three、qichengzhuanhe、save-the-cat、seven-point、three-act 与 volume-structure 为结构类且 beats 每项含 tension，snowflake 为规划类，其余为文章类，source 都为 builtin，退出码为 0
        pack-overrides:
          - GIVEN: 工作区规范包 house 定义了 id 为 general-specific-general 的写作法，config.yaml 的 packs 为 [house]
          - WHEN: 运行 wa-cli method list --dir D --json
          - THEN: general-specific-general 的 source 为 pack:house，退出码为 0
        show-unknown:
          - GIVEN: 刚初始化的工作区 D
          - WHEN: 运行 wa-cli method show nope --dir D --json
          - THEN: diagnostics 中有一条错误码为 method.not-found 的诊断，其 next 包含 wa-cli method list 命令；method 为 null，退出码为 1
        show-planning-product:
          - GIVEN: 刚初始化的工作区 D
          - WHEN: 运行 wa-cli method show snowflake --dir D --json
          - THEN: steps 中 character-sketch、character-details 与 character-bible 的 product 为 characters，scene-list 的 product 为 scenes，scene-details 的 product 为 scene-contracts，其余步骤不输出 product，退出码为 0
  REMOVED: {}
