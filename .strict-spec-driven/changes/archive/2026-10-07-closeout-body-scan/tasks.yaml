      text: 运行完整回归（含覆盖率阈值 80%）
      status: complete
      command: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out
  Verification:
    verify-change:
      text: 运行 strict-spec-cli verify closeout-body-scan 确认任务与 delta spec 一致
      status: complete
      command: strict-spec-cli verify closeout-body-scan
