schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: handoff
  title: 交接记录（Handoff Note）
requirements:
  handoff-show:
    strength: MUST
    statement: wa-cli handoff show [--last N] [--unit <单元引用>] 必须只读地输出交接记录：默认最近一条，--last N 输出最近 N 条（N 为 1 到 50 的整数，超出范围报告 input.invalid-value，field 为 last，next 含 wa-cli help handoff show --json）；--unit 接受作品（Work）或其任一单元的单元引用（Unit Reference），解析到所属作品后只输出关联该作品的记录与未关联作品的记录，作品或单元不存在时按 work.not-found 或 unit.not-found 报告（field 为 unit）；--json 输出 notes 数组，按写入顺序倒序（最近在前），每项含 id、writtenAt、可选的 work（关联的作品 id，未关联时缺省）、done、todo、instructions 与 risks（数组永不为 null）；没有任何记录（含没有 handoffs.yaml，以及 --unit 过滤后无可见记录）时 notes 为空数组、退出码为 0；handoffs.yaml 不通过 Schema 或领域校验（id 不符合 handoff-<n> 顺序递增形态或重复）时报告其诊断、退出码为 1；途经符号链接按 artifact.not-found。changedPaths 为空数组。不加 --json 时以人读文本按同样顺序输出每条的 id、时间（关联时含作品）、完成与待办（及指示与风险）。wa-cli next 的每个单元条目含 handoff 字段：取该条目所属作品可见的最近一条交接记录——关联该作品的记录与未关联作品的记录中较新的一条（含 id、todo 数组与 instructions 数组，数组永不为 null），没有时（含 handoffs.yaml 不合法）为 null；next 的其余输出（blockers、action、commands、feedback、progress）不变。不加 --json 时，next 至少列出一个单元且步骤附带交接记录时，文本输出在同一条交接记录被引用的第一条步骤之前显示一次其 id 与写入时间，并逐条列出未完成事项（todo）与作者新指示（instructions），内容与 handoff 字段一致；全部步骤共享同一条记录时该段位置与之前一致；没有交接记录时文本输出不含交接段、与之前一致。wa-cli validate 整体校验纳入 .writing-anything/handoffs.yaml（存在时）的 Schema 与领域校验并计入 checked；wa-cli validate <path> 对该文件执行同样的检查。
    scenarios:
      show-latest:
        - GIVEN: handoffs.yaml 有三条，最近一条 todo 为 [场景三待收口]
        - WHEN: 运行 wa-cli handoff show --dir D --json
        - THEN: notes 只含最近一条（id 为 handoff-3、todo 含 场景三待收口），退出码为 0
      show-last-n:
        - GIVEN: 同上
        - WHEN: 运行 wa-cli handoff show --last 2 --dir D --json
        - THEN: notes 依次为 handoff-3 与 handoff-2（倒序），退出码为 0
      show-empty:
        - GIVEN: 工作区没有 handoffs.yaml
        - WHEN: 运行 wa-cli handoff show --dir D --json 与 wa-cli next --dir D --json
        - THEN: 前者 notes 为空数组、退出码 0；后者每个单元条目的 handoff 为 null 且其余输出与之前一致
      show-unit-filter:
        - GIVEN: 作品 w1 与 w2 各有一条关联自身的交接记录（w2 的较新），另有一条更早的未关联记录
        - WHEN: 运行 wa-cli handoff show --unit w2 --dir D --json
        - THEN: notes 依次为 w2 关联的记录与未关联的记录（倒序），不含 w1 的记录，退出码为 0
      show-unit-unknown:
        - GIVEN: 作品 w1 存在但没有单元 nope
        - WHEN: 运行 wa-cli handoff show --unit w1/nope --dir D --json
        - THEN: 报告 unit.not-found（field 为 unit），退出码为 1
      next-shows-latest:
        - GIVEN: 工作区只有未关联的交接记录（最近一条含 instructions [保持第一人称]），作品 my-novel 有未完成场景
        - WHEN: 运行 wa-cli next my-novel/scene-2 --dir D --json
        - THEN: 该条目含 handoff 字段（id 为最近一条、todo 数组非空、instructions 含 保持第一人称），blockers 与 commands 不变，退出码为 0
      next-work-scoped:
        - GIVEN: 作品 w1 与 w2 各有一条关联自身的交接记录（w2 的较新），各有未完成单元
        - WHEN: 运行 wa-cli next --dir D --json
        - THEN: w1 各步骤的 handoff 为 w1 的记录、w2 各步骤的 handoff 为 w2 的记录，互不串入，退出码为 0
      next-newer-wins:
        - GIVEN: 作品 w1 有一条关联自身的记录 handoff-1 与一条更新的未关联记录 handoff-2
        - WHEN: 运行 wa-cli next w1/<单元> --dir D --json
        - THEN: 该步骤的 handoff 为 handoff-2（关联与未关联中较新的一条），退出码为 0
      next-text-shows-latest:
        - GIVEN: 同 next-shows-latest，最近一条为 handoff-2，todo 为 [场景三待收口]
        - WHEN: 运行 wa-cli next --dir D（不加 --json）
        - THEN: 文本输出在第一个单元步骤之前出现一次 handoff-2，并列出 场景三待收口 与 保持第一人称，之后仍按原格式列出各单元的阶段与下一步，退出码为 0
      next-text-no-handoff:
        - GIVEN: 工作区没有 handoffs.yaml，作品 my-novel 有未完成场景
        - WHEN: 运行 wa-cli next --dir D（不加 --json）
        - THEN: 文本输出不含交接记录段，只列出各单元的阶段与下一步，退出码为 0
  handoff-write:
    strength: MUST
    statement: wa-cli handoff write [--unit <单元引用>] 必须从 --file（相对 --dir 或为绝对路径）或标准输入读取交接记录输入并整体追加到工作区（Workspace）的 .writing-anything/handoffs.yaml：输入为 YAML，含非空的 done（完成了什么，字符串数组）、可省略或为空数组的 todo（未完成事项，字符串数组，干净收尾时可为空）及可选的 instructions（作者的新指示，字符串数组）与 risks（需要注意的风险，字符串数组），元素为非空文本；输入还可含可选的 work（关联作品（Work）的作品 id），给出时作品必须存在，不存在按 work.not-found 报告（field 为 work）。--unit 接受作品或其任一单元的单元引用（Unit Reference），写入时把该条记录归到所属作品（记录的 work 为作品 id，可给出作品本身或其任一单元），作品或单元不存在时按 work.not-found 或 unit.not-found 报告（field 为 unit）；--unit 与输入 work 都给出且指向不同作品时报告 input.invalid-value（field 为 unit），指向同一作品时正常写入；这些失败都不写文件、退出码为 1。两者都缺省时记录不关联作品，与既有行为一致。产物含 schema_version（1）与 notes 数组，每条含 id（handoff-<n>，n 从条目数加一递增到不重复）、written_at（UTC，YYYY-MM-DDTHH:MM:SSZ）、仅在关联时写入的 work、done、todo、instructions 与 risks（省略的可选节为空数组）。输入不符合 Schema 或无法解析时报告 artifact.schema-violation 或 artifact.parse-error（field 为输入中的位置，path 为空）；条目数已达到上限 200 时报告 handoff.too-many（message 提示作者归档清理旧记录），不写文件；这些失败退出码为 1。成功时在 notes 末尾追加一条（节点树追加，保留其他内容与 YAML 注释；途经符号链接按 artifact.not-found 处理；notes 经由 YAML 锚点、别名或合并键得到时报告 handoff.anchored-value），changedPaths 为 [handoffs.yaml]，--json 输出的 note 字段含 id、writtenAt、仅在关联时输出的 work、done、todo、instructions 与 risks，退出码为 0。没有 handoff write 之外的写入命令：交接记录只能追加（没有编辑或删除命令）。
    scenarios:
      write-first:
        - GIVEN: 刚初始化的工作区 D，输入含 done [完成场景一] 与 todo [场景二待收口]
        - WHEN: 运行 wa-cli handoff write --dir D --json（标准输入为输入）
        - THEN: handoffs.yaml 被创建，首条 id 为 handoff-1、written_at 为 UTC 时间、没有 work 键，changedPaths 含 handoffs.yaml，退出码为 0
      write-appends:
        - GIVEN: handoffs.yaml 已有一条 handoff-1，文件中有作者注释
        - WHEN: 运行 wa-cli handoff write --dir D --json（标准输入为第二条输入）
        - THEN: 追加 id 为 handoff-2 的条目，注释保留，退出码为 0
      write-unit-associates:
        - GIVEN: 工作区 D 有作品 w1 及其单元 w1/s1
        - WHEN: 运行 wa-cli handoff write --unit w1/s1 --dir D --json（输入只含 done）
        - THEN: 新条目含 work 为 w1（输入给的是单元也归到所属作品），changedPaths 含 handoffs.yaml，--json 的 note.work 为 w1，退出码为 0
      write-unit-unknown:
        - GIVEN: 工作区 D 有作品 w1 但没有单元 nope
        - WHEN: 运行 wa-cli handoff write --unit w1/nope --dir D --json
        - THEN: 报告 unit.not-found（field 为 unit），handoffs.yaml 未被创建或修改，退出码为 1
      write-unit-input-conflict:
        - GIVEN: '工作区 D 有作品 w1 与 w2，输入含 work: w1'
        - WHEN: 运行 wa-cli handoff write --unit w2 --dir D --json
        - THEN: 报告 input.invalid-value（field 为 unit），文件未变，退出码为 1
      write-input-work-missing:
        - GIVEN: '工作区 D 没有作品 nope，输入含 work: nope'
        - WHEN: 运行 wa-cli handoff write --dir D --json
        - THEN: 报告 work.not-found（field 为 work），文件未变，退出码为 1
      write-no-todo:
        - GIVEN: 刚初始化的工作区 D，输入只含 done [全部场景已收口]（省略 todo）
        - WHEN: 运行 wa-cli handoff write --dir D --json
        - THEN: 成功创建首条 handoff-1，该条 todo 为空数组，退出码为 0；wa-cli validate --dir D --json 通过；handoff show 与 next 对该条不列未完成事项
      write-invalid-input:
        - GIVEN: 输入缺少 done 节
        - WHEN: 运行 wa-cli handoff write --dir D --json
        - THEN: 报告 artifact.schema-violation，handoffs.yaml 未被创建或修改，退出码为 1
      write-cap:
        - GIVEN: handoffs.yaml 已有 200 条
        - WHEN: 运行 wa-cli handoff write --dir D --json
        - THEN: 报告 handoff.too-many，文件未变，退出码为 1
