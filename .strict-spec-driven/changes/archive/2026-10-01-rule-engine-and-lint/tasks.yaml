schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: rule-engine-and-lint
sections:
  Implementation:
    lint-package:
      text: internal/lint：正文模型与屏蔽区域、七种规则类型的参数定义与校验、检查函数、单处豁免、发现项排序与 Run
      status: complete
    cli-lint:
      text: internal/cli：新增 lint 命令（注册表、sampleArgs、JSON 与人读输出、lint.findings 汇总诊断与 next、rule.invalid-params 诊断）
      status: complete
    default-pack:
      text: 内置 default 规范包：ai-cliche 改为 error，新增 banned-terms（error）与 term-consistency（warning）
      status: complete
    docs:
      text: docs/GLOSSARY.md 新增屏蔽区域（Masked Region）与破折号密度（Dash Density）
      status: complete
  Testing:
    lint:
      text: gofmt 检查本变更的 Go 文件
      status: complete
      command: test -z "$(gofmt -l internal/lint internal/cli/lint.go internal/cli/lint_test.go)"
    unit-tests:
      text: 单元测试：屏蔽区域与段落；每种规则类型的命中、不命中与参数校验；词边界；破折号密度；字数与段落长度；必需章节；单处豁免（段内、单独成段、缺理由、未知规则）；排序；CLI 的 findings、waived、退出码、诊断与 next、没有正文
      status: complete
      command: go test ./internal/...
    full-regression:
      text: 运行完整回归命令，覆盖率不低于 80%
      status: complete
      command: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out
  Verification:
    spec-alignment:
      text: 对照 lint delta spec 的每个场景确认实现与测试覆盖，并按实际实现修正 delta spec
      status: complete
    strict-ready:
      text: 运行 strict-spec-cli ready 与 strict-spec-cli verify，确认变更产物有效
      status: complete
      command: strict-spec-cli ready rule-engine-and-lint && strict-spec-cli verify rule-engine-and-lint
    archive-readiness:
      text: 确认 delta spec 能合并进主规格（新建 lint 主规格），归档后路线图中的 rule-engine-and-lint 标记为完成
      status: complete
testing_gates:
  validation_task: full-regression
  unit_test_task: unit-tests
