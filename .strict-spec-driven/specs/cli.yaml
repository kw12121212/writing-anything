schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: cli
  title: 命令行工具（CLI）
requirements:
  version-command:
    strength: MUST
    statement: wa-cli version 必须在标准输出打印一行 'wa-cli <version> (commit <commit>)' 并以退出码 0 退出；加 --json 时必须输出统一的 JSON 输出信封，并在其中包含 version 与 commit 字段。version 与 commit 优先取构建时注入的值；未注入时取 Go 构建信息中的主模块版本（为空或为 (devel) 时视为缺失）与源码提交（构建时源码有未提交的修改则加 -dirty 后缀）；仍缺失时 version 为 dev、commit 为 unknown。
    scenarios:
      version-text:
        - GIVEN: 构建时注入版本 v1.2.3 与提交 abc1234 的 wa-cli 二进制
        - WHEN: 运行 wa-cli version
        - THEN: 标准输出为一行 'wa-cli v1.2.3 (commit abc1234)'，退出码为 0
      version-json:
        - GIVEN: 构建时注入版本 v1.2.3 与提交 abc1234 的 wa-cli 二进制
        - WHEN: 运行 wa-cli version --json
        - THEN: 标准输出是可解析的 JSON 对象，valid 为 true，diagnostics 与 changedPaths 为空数组，version 为 v1.2.3，commit 为 abc1234，退出码为 0
      version-go-install:
        - GIVEN: 用 go install github.com/kw12121212/writing-anything/cmd/wa-cli@v1.2.3 安装、未注入版本的 wa-cli
        - WHEN: 运行 wa-cli version --json
        - THEN: version 为 v1.2.3；构建信息中没有源码提交时 commit 为 unknown
      version-unstamped:
        - GIVEN: 未注入版本且 Go 构建信息中既没有模块版本也没有源码提交的 wa-cli
        - WHEN: 运行 wa-cli version
        - THEN: 标准输出为一行 'wa-cli dev (commit unknown)'，退出码为 0
  usage-error:
    strength: MUST
    statement: 未提供命令、命令未知、参数未知、参数缺少取值、不接受取值的参数带了取值、同一非列表参数（列表参数可重复）重复出现、缺少必需的位置参数或位置参数多余时，wa-cli 必须以退出码 2 退出；未加 --json 时必须把用法说明写到标准错误；加 --json 时必须在标准输出写出 valid 为 false、含 usage 领域错误码诊断的 JSON 输出信封。写出用法错误本身失败时按 exit-codes 以退出码 1 退出。
    scenarios:
      no-command:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 不带任何参数运行 wa-cli
        - THEN: 标准错误包含用法说明，退出码为 2
      unknown-command:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli 一个不存在的命令
        - THEN: 标准错误指出未知命令并包含用法说明，退出码为 2
      unknown-flag:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli version --unknown
        - THEN: 标准错误指出未知参数，退出码为 2
      json-unknown-command:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli nope --json
        - THEN: 标准输出是 valid 为 false 的 JSON 输出信封，diagnostics 中有一条错误码为 usage.unknown-command 的诊断，标准错误为空，退出码为 2
      flag-takes-no-value:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli version --help=yes --json
        - THEN: 标准输出的诊断错误码为 usage.flag-takes-no-value，message 指出 --help=yes，退出码为 2
      duplicate-flag:
        - GIVEN: 已初始化的工作区与已创建的作品 my-post
        - WHEN: 同一次调用重复给出同一非列表参数（如 wa-cli brief set my-post --message m1 --message-text 甲 --message m2 --message-text 乙 --json）
        - THEN: 诊断错误码为 usage.duplicate-flag，message 指明重复的参数名与取值，valid 为 false，退出码为 2，brief.yaml 不变
      unexpected-argument:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli version extra
        - THEN: 标准错误指出多余的参数 extra 并包含 version 的用法说明，退出码为 2
      missing-argument:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli config set gate_level --json
        - THEN: valid 为 false，diagnostics 中有一条错误码为 usage.missing-argument 的诊断，message 指出缺少 <value>，next 包含 wa-cli help config set --json，退出码为 2
  json-output-envelope:
    strength: MUST
    statement: 所有 wa-cli 命令都必须接受 --json；加 --json 时标准输出必须恰好是一个 JSON 对象，即输出信封（Output Envelope）（例外：流式命令如 feedback watch 与 preview --serve 每个事件输出一行信封；wa-cli mcp 的标准输出是 MCP 协议消息，--json 时只在退出前多写一行汇总信封，见 mcp 主规格），包含 valid（布尔值）、diagnostics（数组）与 changedPaths（数组）字段，命令专属字段与之并列放在顶层；没有诊断或没有变更的产物时对应字段为空数组而不是 null。
    scenarios:
      envelope-on-success:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli version --json 或 wa-cli help --json
        - THEN: 标准输出是单个 JSON 对象，含 valid、diagnostics、changedPaths 三个字段，diagnostics 与 changedPaths 为空数组
  diagnostic-fields:
    strength: MUST
    statement: 每条诊断（Diagnostic）必须包含稳定的错误码（Error Code）code、severity（error 或 warning）、说明 message，以及至少一条可执行的下一步命令 next；与某个产物或字段相关时必须包含产物路径 path 与字段路径 field。存在 severity 为 error 的诊断时 valid 必须为 false。
    scenarios:
      usage-diagnostic:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli version --unknown --json
        - THEN: diagnostics 中有一条诊断，code 为 usage.unknown-flag，severity 为 error，message 指出 --unknown，next 包含 wa-cli help version --json，valid 为 false
  exit-codes:
    strength: MUST
    statement: wa-cli 必须以退出码（Exit Code）0 表示成功，1 表示校验失败或执行失败，2 表示用法错误；输出写入失败属于执行失败，即使发生在写出用法错误时也必须以退出码 1 退出；help 中列出的每条命令的退出码只能取这三个值。
    scenarios:
      success-exit:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli help
        - THEN: 退出码为 0
      declared-exit-codes:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli help --json
        - THEN: 每条命令的 exitCodes 都带含义说明，code 只取 0、1、2
      usage-error-write-failure:
        - GIVEN: 已构建的 wa-cli 二进制，标准输出不可写（重定向到 /dev/full）
        - WHEN: 运行 wa-cli nope --json
        - THEN: 标准错误报告写入输出失败，退出码为 1
  help-command:
    strength: MUST
    statement: wa-cli help 与 wa-cli --help 必须列出所有命令及其摘要；wa-cli help <command>、wa-cli help <command> --help 与 wa-cli <command> --help 必须输出该命令的用法并以退出码（Exit Code）0 退出；加 --json 时信封必须包含 commands 数组，每项列出 name、summary、usage、args、flags、outputKeys 与 exitCodes，指定命令时数组只含该命令；help 指定的命令不存在时为用法错误。用法说明中的占位符必须使用英文标识符（如 <command>、<value>），与 help --json 中的参数名一致。
    scenarios:
      help-text:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli help
        - THEN: 标准输出列出 help 与 version 等全部命令及其摘要，退出码为 0
      root-help-flag:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli --help
        - THEN: 标准输出与 wa-cli help 相同，标准错误为空，退出码为 0
      help-json:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli help --json
        - THEN: commands 数组包含每条已注册命令，每项有 name、summary、usage、args、flags、outputKeys、exitCodes，flags 中包含 --json 与 --help
      help-one-command:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli help version --json
        - THEN: commands 数组只含 version，其 outputKeys 包含 version
      command-help-flag:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli version --help
        - THEN: 标准输出为 version 的用法说明，退出码为 0
      help-command-help-flag:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli help version --help
        - THEN: 标准输出与 wa-cli help version 相同，为 version 的用法说明，退出码为 0
      help-unknown-command:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli help nope --json
        - THEN: valid 为 false，诊断错误码为 usage.unknown-command，退出码为 2
      english-placeholders:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli help 与 wa-cli help help
        - THEN: 用法说明中的占位符为 <command> 等英文标识符，不出现 <命令> 等中文占位符
      help-unknown-command-help-flag:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli help nope --help --json
        - THEN: valid 为 false，诊断错误码为 usage.unknown-command，退出码为 2
  command-groups:
    strength: MUST
    statement: 命令名可以由命令组与子命令两个词组成（如 config set）。wa-cli <group> <subcommand>、wa-cli <group> <subcommand> --help 与 wa-cli help <group> <subcommand> 必须按完整命令名识别该命令；help 列表与 help --json 中的 name 为完整命令名。只给出命令组名，或命令组下不存在该子命令时，必须按用法错误处理，错误码为 usage.unknown-command，message 列出该命令组可用的子命令；存在名称以该组名开头的独立命令（如 decision 组与 decisions 命令）时，message 另以「相关命令：」列出它们（按名称排序），next 依次为它们的 wa-cli help <命令> --json 与 wa-cli help --json。help --json 中 args 的每一项必须包含 required 字段；用法说明中必需的位置参数写作 <name>，可选的写作 [<name>]。
    scenarios:
      group-command-runs:
        - GIVEN: 已构建的 wa-cli 二进制与一个已初始化的工作区 D
        - WHEN: 运行 wa-cli config set gate_level fast --dir D --json
        - THEN: 命令按 config set 执行，退出码为 0
      group-help:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli help config set --json
        - THEN: commands 数组只含 name 为 config set 的一项，其 args 为 key 与 value，二者的 required 均为 true，退出码为 0
      group-help-flag:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli config set --help
        - THEN: 标准输出与 wa-cli help config set 相同，用法中含 <key> <value>，退出码为 0
      bare-group:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli config --json
        - THEN: valid 为 false，诊断错误码为 usage.unknown-command，message 列出 config set，退出码为 2
      unknown-subcommand:
        - GIVEN: 已构建的 wa-cli 二进制
        - WHEN: 运行 wa-cli help config nope --json
        - THEN: valid 为 false，诊断错误码为 usage.unknown-command，退出码为 2
      unknown-subcommand-related:
        - GIVEN: decision 命令组只有 decision add，另有独立命令 decisions
        - WHEN: 运行 wa-cli decision show dec-1 --json
        - THEN: 诊断错误码为 usage.unknown-command，message 含「相关命令：decisions」，next 依次为 wa-cli help decisions --json 与 wa-cli help --json，退出码为 2
  release-artifacts:
    strength: MUST
    statement: 发布工具 go run ./internal/tools/release -version <version> 必须在输出目录（默认 dist）为 linux、darwin、windows 各自的 amd64 与 arm64 生成 wa-cli 二进制，命名为 wa-cli-<os>-<arch>，windows 的加 .exe 后缀，并生成 SHA256SUMS 校验文件：每个本次生成的二进制一行，格式为 '<小写 SHA-256 十六进制>  <文件名>'，可被 sha256sum -c 校验。构建前先删除输出目录中旧的 SHA256SUMS 与全部目标的旧发布产物，输出目录中的其他文件保留。每个二进制的 wa-cli version 报告 -version 给出的版本与 -commit 给出的提交（未给 -commit 时为仓库当前的 git 提交）；-version 与 -commit 只允许字母、数字与 ._+-。-targets 可用逗号分隔的 <os>/<arch> 限定目标。缺少 -version、取值含不允许的字符、目标不受支持或构建失败时以非零退出，并且不写出 SHA256SUMS。
    scenarios:
      all-targets:
        - GIVEN: 仓库源码
        - WHEN: 运行 go run ./internal/tools/release -version v1.2.3 -commit abc1234 -out D
        - THEN: D 中恰有 wa-cli-linux-amd64、wa-cli-linux-arm64、wa-cli-darwin-amd64、wa-cli-darwin-arm64、wa-cli-windows-amd64.exe、wa-cli-windows-arm64.exe 与 SHA256SUMS；SHA256SUMS 有 6 行，每行的哈希与对应文件的 SHA-256 一致，退出码为 0
      stamped-binary:
        - GIVEN: 用 -version v1.2.3 -commit abc1234 -targets 为本机平台生成的二进制
        - WHEN: 运行该二进制的 version --json
        - THEN: version 为 v1.2.3，commit 为 abc1234
      missing-version:
        - GIVEN: 仓库源码
        - WHEN: 不带 -version 运行 go run ./internal/tools/release -out D
        - THEN: 以非零退出，标准错误指出缺少 -version，D 中没有 SHA256SUMS
      unsupported-target:
        - GIVEN: 仓库源码
        - WHEN: 运行 go run ./internal/tools/release -version v1.2.3 -targets plan9/mips -out D
        - THEN: 以非零退出，标准错误指出不支持的目标 plan9/mips，D 中没有 SHA256SUMS
      invalid-stamp:
        - GIVEN: 仓库源码
        - WHEN: 运行 go run ./internal/tools/release -version 'v1 -X x=y' -out D
        - THEN: 以非零退出，标准错误指出 -version 含有不允许的字符，D 中没有 SHA256SUMS
      stale-assets:
        - GIVEN: D 中有旧的 SHA256SUMS、wa-cli-windows-arm64.exe 与 notes.txt
        - WHEN: 运行 go run ./internal/tools/release -version v1.2.3 -targets linux/amd64 -out D
        - THEN: D 中的 SHA256SUMS 只有 wa-cli-linux-amd64 一行，wa-cli-windows-arm64.exe 已被删除，notes.txt 保留
  install-script:
    strength: MUST
    statement: 安装脚本（Install Script）install.sh（Linux 与 macOS）与 install.ps1（Windows）必须按当前操作系统与 CPU 架构（amd64 或 arm64）下载对应的发布产物 wa-cli-<os>-<arch>[.exe] 与 SHA256SUMS，校验该产物的 SHA-256 与 SHA256SUMS 中的记录一致后，才把它安装为安装目录下的 wa-cli（Windows 为 wa-cli.exe），不需要 root 或管理员权限。默认下载地址为 https://github.com/kw12121212/writing-anything/releases 的最新版本；环境变量 WA_VERSION 指定版本（下载 <base>/download/<version>/<文件>，未指定时下载 <base>/latest/download/<文件>），WA_BASE_URL 覆盖 <base>，WA_INSTALL_DIR 覆盖安装目录（install.sh 默认 $HOME/.local/bin，install.ps1 默认 %LOCALAPPDATA%\Programs\wa-cli 并加入用户级 PATH）。平台不受支持、下载失败、SHA256SUMS 中没有该产物、哈希不一致或安装目标是目录时，脚本必须以非零退出并说明原因，且不改动安装目录中已有的 wa-cli，也不在安装目录中留下临时文件。安装成功后打印安装路径；安装目录不在 PATH 中（install.ps1 为指定了 WA_INSTALL_DIR 时）打印把它加入 PATH 的提示。install.ps1 以 irm <url> | iex 运行时与以 -File 运行时行为相同，并且不在调用者的会话中留下设置、变量或函数。
    scenarios:
      install-linux-amd64:
        - GIVEN: uname -s 为 Linux、uname -m 为 x86_64，WA_BASE_URL 指向提供产物与 SHA256SUMS 的地址，WA_INSTALL_DIR 为 I
        - WHEN: 运行 sh install.sh
        - THEN: I/wa-cli 的内容与 wa-cli-linux-amd64 相同且可执行，标准输出含安装路径，退出码为 0
      install-darwin-arm64:
        - GIVEN: uname -s 为 Darwin、uname -m 为 arm64，其余同上
        - WHEN: 运行 sh install.sh
        - THEN: I/wa-cli 的内容与 wa-cli-darwin-arm64 相同，退出码为 0
      install-version:
        - GIVEN: WA_VERSION 为 v1.2.3
        - WHEN: 运行 sh install.sh
        - THEN: 脚本从 <base>/download/v1.2.3/ 下载产物与 SHA256SUMS
      checksum-mismatch:
        - GIVEN: SHA256SUMS 中该产物的哈希与下载内容不一致，I/wa-cli 为旧版本
        - WHEN: 运行 sh install.sh
        - THEN: 以非零退出，标准错误指出校验失败，I/wa-cli 仍为旧版本
      unsupported-platform:
        - GIVEN: uname -s 为 FreeBSD 或 uname -m 为 i686
        - WHEN: 运行 sh install.sh
        - THEN: 以非零退出，标准错误指出不支持的操作系统或架构，I 中没有新文件
      install-windows:
        - GIVEN: Windows 上 PROCESSOR_ARCHITECTURE 为 AMD64，WA_BASE_URL 与 WA_INSTALL_DIR 同上
        - WHEN: 运行 install.ps1
        - THEN: I\wa-cli.exe 的内容与 wa-cli-windows-amd64.exe 相同，退出码为 0
      install-iex:
        - GIVEN: Windows 上 PROCESSOR_ARCHITECTURE 为 AMD64，WA_BASE_URL 与 WA_INSTALL_DIR 同上
        - WHEN: 把按 UTF-8 解码的 install.ps1 内容交给 Invoke-Expression 运行
        - THEN: I\wa-cli.exe 的内容与 wa-cli-windows-amd64.exe 相同，标准错误为空；之后调用者会话中的 $ErrorActionPreference 不变，也没有脚本定义的函数
      target-is-directory:
        - GIVEN: I/wa-cli 是一个目录
        - WHEN: 运行 sh install.sh
        - THEN: 以非零退出，标准错误指出目标是目录，I/wa-cli 目录中没有新文件
  diagnostic-next-concrete:
    strength: MUST
    statement: 生命周期主路径命令的 error 级诊断，其 next 必须至少含一条不是 wa-cli help 的可直接运行的只读命令，并带上该诊断涉及的单元引用（Unit Reference）或作品；wa-cli help <command> --json 只作补充、排在具体命令之后：brief set 由参数引起的问题（没有 path）与 brief.anchored-value 的 next 第一条为 wa-cli brief show <unit> --dir <dir> --json；outline set、outline remove 与 scene contract 由参数引起的问题与 outline.anchored-value 的第一条为 wa-cli outline show <unit> --dir <dir> --json（子单元的节拍不存在时另给出根单元的 outline show）；scene close-out 由收口输入引起、没有 path 的问题中，契约缺口、收口状态、输入不合法与引用不存在的事件或伏笔的第一条为 wa-cli outline show <unit> --dir <dir> --json，引用不存在的设定条目或人物为 wa-cli canon list <work> --dir <dir> --json，单元不是场景或参数取值不合法为 wa-cli status --dir <dir> --json，warning 级 closeout.suspected-name 同样先给出 wa-cli canon list <work> --dir <dir> --json；draft write 的输入问题（input.read-failed、draft.empty、draft.too-large、draft.edits-anchored）的第一条为 wa-cli context <unit> --dir <dir> --json；review record 的 input.read-failed、review resolve 由参数引起的问题与 review.anchored-value、accept.incomplete-confirmation 的第一条为 wa-cli review show <unit> --dir <dir> --json；advance 的 work.anchored-value 为 wa-cli next <unit> --dir <dir> --json；volume.not-volume 为 wa-cli status --dir <dir> --json，volume.incomplete-confirmation 为 wa-cli next <unit> --dir <dir> --json；默认 next 中 draft.not-found 为 wa-cli context <unit> --dir <dir> --json，artifact.unknown-kind 为整体校验 wa-cli validate --dir <dir> --json，config.unknown-key 与 config.anchored-value 为 wa-cli config resolved --dir <dir> --json。用法错误（usage.*）、wa-cli new 的参数问题、unit add 与 unit move 的参数问题，以及其他主规格明确规定 next 为 wa-cli help 的诊断不受此约束；主规格已写明 next 含某条 wa-cli help 命令的诊断仍包含该命令。
    scenarios:
      brief-param-next:
        - GIVEN: 作品 my-post 已有 brief.yaml
        - WHEN: 运行 wa-cli brief set my-post --length 3000-1500 --dir D --json
        - THEN: diagnostics 中有一条错误码为 input.invalid-value、没有 path 的诊断，next 的第一条为 wa-cli brief show my-post --dir D --json，且 next 含 wa-cli help brief set --json；brief.yaml 不变，退出码为 1
      closeout-gap-next:
        - GIVEN: 场景 my-novel/scene-1 的场景契约声明了必须发生的状态变化 sc-1，收口输入没有对应的状态变化
        - WHEN: 运行 wa-cli scene close-out my-novel/scene-1 --file gap-input.yaml --dir D --json
        - THEN: diagnostics 中有一条错误码为 closeout.missing-state-change 的诊断，next 的第一条为 wa-cli outline show my-novel/scene-1 --dir D --json，且 next 含 wa-cli help scene close-out --json 与 wa-cli help scene contract --json
      closeout-unknown-entry-next:
        - GIVEN: 收口输入的状态变化引用了设定集中不存在的条目 canon-9
        - WHEN: 运行 wa-cli scene close-out my-novel/scene-1 --file entry-input.yaml --dir D --json
        - THEN: diagnostics 中有一条错误码为 state.unknown-entry 的诊断，next 的第一条为 wa-cli canon list my-novel --dir D --json，且 next 含 wa-cli help scene close-out --json
      draft-empty-next:
        - GIVEN: 作品 my-post 处于草稿阶段
        - WHEN: 以只含空白的标准输入运行 wa-cli draft write my-post --dir D --json
        - THEN: diagnostics 中有一条错误码为 draft.empty 的诊断，next 的第一条为 wa-cli context my-post --dir D --json，且 next 含 wa-cli help draft write --json；没有写出 draft.md，退出码为 1
      accept-confirmation-next:
        - GIVEN: 作品 my-post 处于需要验收的阶段
        - WHEN: 运行 wa-cli accept my-post --confirmed-by-author --dir D --json（缺少 --confirmation）
        - THEN: diagnostics 中有一条错误码为 accept.incomplete-confirmation 的诊断，next 的第一条为 wa-cli review show my-post --dir D --json，且 next 含 wa-cli help accept --json；没有写出 acceptance.yaml，退出码为 1
      volume-confirmation-next:
        - GIVEN: 部 my-novel/part-one 已生成卷末检查点
        - WHEN: 运行 wa-cli volume confirm my-novel/part-one --confirmed-by-author --dir D --json（缺少 --confirmation）
        - THEN: diagnostics 中有一条错误码为 volume.incomplete-confirmation 的诊断，next 的第一条为 wa-cli next my-novel/part-one --dir D --json，且 next 含 wa-cli help volume confirm --json；退出码为 1
      draft-not-found-next:
        - GIVEN: 作品 my-post 还没有 draft.md
        - WHEN: 运行 wa-cli provenance my-post --dir D --json
        - THEN: diagnostics 中有一条错误码为 draft.not-found、path 为 .writing-anything/works/my-post/draft.md 的诊断，next 为 wa-cli context my-post --dir D --json 与 wa-cli help draft write --json，退出码为 1
      config-key-next:
        - GIVEN: 工作区 D
        - WHEN: 运行 wa-cli config set schema_version 2 --dir D --json
        - THEN: diagnostics 中有一条错误码为 config.unknown-key 的诊断，next 的第一条为 wa-cli config resolved --dir D --json，且 next 含 wa-cli help config set --json，退出码为 1
  audit-log:
    strength: MUST
    statement: wa-cli 的每次调用（成功、失败与用法错误都算，命令已启动为前提）必须在项目的 .writing-anything/audit.log 追加一行 JSON 对象（JSONL）：含 at（UTC，YYYY-MM-DDTHH:MM:SSZ）、command（命令名，如 review record）、args（参数数组，每个参数截断到 200 个字符）、exit（退出码）、codes（诊断错误码数组，没有时为空数组）与 unit（关键命令——draft write、review record、accept、export——已解析的首个位置参数即单元引用，供回捞配对；其他命令省略该键）。audit.log 是 append-only 的运维痕迹（Audit Log）：不进 JSON Schema 校验（wa-cli validate 不检查它）、不出现在 changedPaths；只读命令写审计是「只读不写产物」规则的显式例外（见技术标准 precheck-before-side-effects 与 atomic-writes 的豁免）。MCP 服务为资源订阅轮询而执行的只读命令不记审计（服务自身发起的轮询不是调用方的动作；经 tools/call 执行的命令照常记录）。没有 .writing-anything/ 工作区时不写；写入失败时向标准错误写一行说明、不改变命令的退出码与输出契约；追加用单次写入保证行完整性，文件超过 1 MiB 时轮转为 audit.log.1（替换旧备份）后再追加。命令未启动的失败（PATH 错误、打错的命令名等 shell 层问题）不在记录范围内，由技能会话协议在 shell 层兜底。
    scenarios:
      audit-failed-command:
        - GIVEN: 工作区 D 存在，review record 因缺少评分结论以退出码 1 失败
        - WHEN: 读取 D/.writing-anything/audit.log 的最后一行
        - THEN: 该行为 JSON：command 为 review record、exit 为 1、codes 含 review.missing-verdict、unit 为该单元引用；命令的退出码与输出与不记审计时逐字节一致
      audit-rotate:
        - GIVEN: 工作区 D 的 audit.log 已为 1 MiB
        - WHEN: 运行任一命令后读取素材目录
        - THEN: audit.log.1 存在（轮转前的内容），audit.log 只含新行
