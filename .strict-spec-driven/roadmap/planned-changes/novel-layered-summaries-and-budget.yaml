planned_change:
  id: layered-summaries-and-budget
  milestone: novel
status: planned
summary: 分层摘要（Layered Summary）与按契约组装上下文
details: 在系列阶段引入的摘要机制上扩展：已验收场景的摘要逐层汇总为章、卷、全书摘要，由 Agent 撰写，wa-cli 校验结构与过期状态。wa-cli context <scene> 按场景契约的显式引用组装，优先级从高到低为：契约本身、出场人物的状态快照、视角人物的知情表、相关的未回收伏笔、前一两个场景的原文结尾、各层摘要、规范包要点；超出上下文预算时从低优先级开始裁剪，并报告实际占用和被裁剪的内容。测试夹具包含至少三章的长篇，验证任一场景的 context 都不超过预算，且同一输入的输出完全一致。
depends_on:
  - multi-level-units
  - series-shared-context
  - scene-close-out
