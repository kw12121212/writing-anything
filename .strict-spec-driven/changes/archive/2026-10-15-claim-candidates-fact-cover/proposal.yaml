schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: claim-candidates-fact-cover
  status: proposed
summary:
  what:
    - claim-candidates 的数据候选新增覆盖来源：kind 为 fact 且关联了至少一份素材的已登记论断，其文字出现处覆盖数据区间时该数据候选视为已登记；亲历候选仍只由 cover_kinds 中的论断覆盖。
    - claim-candidates 发现项的 message 末尾按 claims.yaml 顺序追加未参与覆盖的论断说明：类型不在 cover_kinds 中的论断说明其实际取值（为默认时标注「默认」）与「未参与覆盖」；kind 为 fact、未关联素材且与未覆盖数据区间重叠的论断说明「未关联素材，不能覆盖数据候选」。
    - wa-draft 技能（internal/skills/skills/wa-draft/SKILL.md）补一句论断类型选择指引：亲历、观点、案例与作者自己的数据关联作者素材，外部事实数据用 fact 关联 reference 素材。
  why:
    - 已登记为 fact 且关联素材的外部数据陈述是最标准的登记方式，却不能覆盖数据候选、被误报为「尚未登记」，语义上说不通（上游建议第 2 条；用户选定「fact 只覆盖数据候选」方案）。
    - 发现项不解释已登记论断为何未生效，排查要跨 cover_kinds 默认取值、论断 kind 与素材关联三层，一行诊断可以省掉整个排查（上游建议第 1 条：高价值低成本）。
scope:
  in:
    - internal/lint/claims.go：checkCandidates 的覆盖计算与发现项 message。
    - internal/lint/claims_test.go 与受影响的 internal/cli 断言：覆盖语义与 message 断言。
    - .strict-spec-driven/specs/lint.yaml：claim-rule-types 需求 MODIFIED 与场景。
    - internal/skills/skills/wa-draft/SKILL.md：论断类型选择指引一句。
  out:
    - SCQA 大纲节顺序约束的诊断（上游建议第 3 条：已经是好的，不修）。
    - claim-sources 规则（kinds、source_types 及其 message）与 cover_kinds 的参数名及默认取值。
    - 亲历候选的检测与覆盖判定（代词、标记词、区间切分）。
    - docs/GLOSSARY.md：不引入新专有名词。
unchanged_behavior:
  - claim-sources 的检查与发现项 message 完全不变。
  - cover_kinds 的参数名、默认取值 [experience, opinion, case, data] 与参数校验不变。
  - 亲历候选的覆盖判定不变：只有 kind 在 cover_kinds 中的论断文字覆盖亲历区间才算已登记。
  - 候选检测本身（代词与标记词默认词表、数据模式、标题与引用块处理、MaxHits 截断与 lint.truncated）不变。
  - claim-candidates 发现项的位置、text 与「请用 wa-cli claim add…」提示语不变，只在 message 末尾追加论断说明。
