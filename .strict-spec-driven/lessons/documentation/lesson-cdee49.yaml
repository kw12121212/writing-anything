  title: 夹具文档同样执行术语表首现双语；量化声明须带可复验锚点
category: documentation
status: active
created_at: '2026-10-04T17:01:04.126Z'
updated_at: '2026-10-04T17:01:04.126Z'
context: docs-runbook 为 novel 语料目录编写 README
observation: DESIGN.md 对同类词条全部按「中文（English）」首现标注，README 却漏注十处；「约 1.35 万字」实测 1.34 万——README 里唯一没有测试锚点的量化声明恰好漂移了。
takeaway: testdata 下面向维护者的文档（README/DESIGN/格式规范）与 docs/ 同属面向人的文字，同样执行 GLOSSARY 首现双语；写入 runbook 的数字要么对应测试断言或命令输出，要么用区间/精确值并注明口径，避免无锚点的近似值。
applies_when: 在 testdata/ 或 docs/ 下编写或修订面向维护者的文档并引用量化事实时
