schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: review
  title: 审稿与验收（Review and Acceptance）
requirements:
  review-record:
    strength: MUST
    statement: wa-cli review record <unit> 必须从 --file（相对 --dir 或为绝对路径）或标准输入读取审稿（Review）输入并整体替换单元目录下的 review.yaml。输入为 YAML：rubric 为评分结论数组，每项含 item（评分项 id）、verdict（pass 或 fail）、evidence（非空）与可选的 paragraphs（段落编号数组，可以为空或省略，如评作者选定标题的评分项；写出时规范化为数组）；findings 为发现项（Finding）数组，每项含 paragraph 与 message，可选 id、rubric、quote 与 suggestion。段落编号从 1 开始，与 wa-cli provenance 的段落一致。单元的评分标准（Rubric）为合并后的评分标准（见 wa-cli config resolved），加上单元选用的写作法附带的评分项（见 methods 主规格的 method-rubric）；其中每个评分项都必须恰有一个结论：缺少时报告 review.missing-verdict（field 为 rubric，message 含评分项 id 与标题），item 或 rubric 不是单元的评分项时报告 review.unknown-rubric-item，同一评分项有多个结论时报告 review.duplicate-verdict；段落编号大于正文段落数时报告 review.unknown-paragraph；quote 不出现在所引段落的原文中时报告 review.quote-not-found；发现项 id 重复时报告 artifact.duplicate-id；输入不符合审稿输入的 Schema 时报告 artifact.schema-violation 或 artifact.parse-error。这些诊断的 path 为空、field 为输入中的位置（如 findings[0].quote），next 依次包含 wa-cli help review record --json、wa-cli review show <unit> --dir <dir> --json（其 rubric 为必须逐项给结论的评分项清单）、wa-cli provenance <unit> --dir <dir> --json 、wa-cli config resolved --dir <dir> --json 与 wa-cli brief show <unit> --dir <dir> --json；单元没有正文时报告 draft.not-found；都不修改文件，退出码为 1。给出 --reaffirm 时不读取审稿输入：单元必须已有通过校验的 review.yaml（否则报告 review.reaffirm-no-review，next 含 wa-cli review record 的整份录入用法），--summary <变化摘要>（非空白）必填；既有 rubric 结论与 findings 原样沿用（不重校验 quote 是否仍在正文——措辞修改后引文移位是重申的常态），--resolve 与 --waive 的发现项 id 必须存在且为 open（否则报告 review resolve 的既有错误码），标记为 resolved 或 waived；draft_sha256 更新为当前 draft.md 的 SHA-256，并在 review.yaml 的 reaffirms 数组追加一条重申（Reaffirm）记录（at、summary、draft_sha256 与本次标记的发现项 id），changedPaths 为 [review.yaml]。整份录入成功时写出的 review.yaml 含 schema_version 1、draft_sha256（当前 draft.md 原始字节的 SHA-256）、rubric 与 findings，省略的发现项 id 取 rf-<n>（n 从 1 递增，跳过输入中已用的 id），每个发现项的 status 为 open；changedPaths 为 [review.yaml]，--json 输出的 review 字段含 unit、path、stale、draftSha256、rubric（每项另含评分项的 title 与 blocking）与 findings，退出码为 0。
    scenarios:
      record-review:
        - GIVEN: 作品 my-post（minimal，评分标准为 clarity）处于审稿阶段，正文有两个段落，第二段含「可能」
        - WHEN: 运行 wa-cli review record my-post --dir D --json，标准输入为 clarity 的 fail 结论（paragraphs [2]）、一个 id 为 rf-1 的发现项与一个不带 id、quote 为「可能」的发现项
        - THEN: review.yaml 的 draft_sha256 为当前正文的 SHA-256，findings 依次为 rf-1 与 rf-2，status 都为 open；review.rubric[0].title 为 清晰；changedPaths 为 [.writing-anything/works/my-post/review.yaml]，退出码为 0
      missing-verdict:
        - GIVEN: 同上
        - WHEN: 标准输入的 rubric 为空数组
        - THEN: diagnostics 中有一条错误码为 review.missing-verdict、field 为 rubric 的诊断，其 next 包含 wa-cli help review record --json；没有写出 review.yaml，退出码为 1
      unknown-paragraph:
        - GIVEN: 同上，正文只有两个段落
        - WHEN: 标准输入的结论引用第 3 段
        - THEN: diagnostics 中有一条错误码为 review.unknown-paragraph、field 为 rubric[0].paragraphs[0] 的诊断，退出码为 1
      quote-not-found:
        - GIVEN: 同上，第一段不含「例子」
        - WHEN: 标准输入的发现项引用第 1 段、quote 为「例子」
        - THEN: diagnostics 中有一条错误码为 review.quote-not-found、field 为 findings[0].quote 的诊断，退出码为 1
      verdict-without-paragraphs:
        - GIVEN: wechat-marketing 作品 my-post 处于 review 阶段，评分标准含 headline-useful
        - WHEN: '审稿输入中 headline-useful 的结论为 {item: headline-useful, verdict: pass, evidence: 作者选定的标题说明了读者收益}，没有 paragraphs，其余评分项各有结论，运行 wa-cli review record my-post --dir D --json'
        - THEN: 退出码为 0，写出的 review.yaml 与输出中该结论的 paragraphs 为空数组
      reaffirm-small-edit:
        - GIVEN: my-post 已有通过的 review（含 open 发现项 rf-1），正文做了小改（措辞修正，引文移位）
        - WHEN: 运行 wa-cli review record my-post --reaffirm --summary 措辞修正：rf-1 的引文对应句子 --resolve rf-1 --dir D --json
        - THEN: rubric 结论沿用、rf-1 的 status 变 resolved、draft_sha256 为当前正文哈希、reaffirms 追加一条（含 summary 与 rf-1），退出码 0；wa-cli review show 不再报 stale，accept 不因 review 过期阻塞
      reaffirm-no-review:
        - GIVEN: my-post 没有 review.yaml
        - WHEN: 运行 wa-cli review record my-post --reaffirm --summary 摘要 --dir D --json
        - THEN: 报告 review.reaffirm-no-review（next 引导整份录入的 review record 用法），文件不变，退出码 1
      reaffirm-blank-summary:
        - GIVEN: my-post 已有 review
        - WHEN: 运行 wa-cli review record my-post --reaffirm --summary 空白 --dir D --json（summary 为空白）
        - THEN: 报告输入错误（message 指明 summary 必须是非空白的变化摘要），文件不变，退出码 1
  review-show:
    strength: MUST
    statement: wa-cli review show <unit> 必须只读地汇总单元的审稿与验收（Acceptance）情况，changedPaths 为空数组：review 为 review.yaml 的内容（字段同 review record 的输出，stale 为 draft_sha256 是否与当前正文不同；没有审稿或不通过校验时为 null，不通过校验时报告其诊断、退出码为 1）；lint 为本单元文本检查（Lint）的 ran、errors 与 warnings（未被豁免的 error 级与 warning 级发现项数）；revisions 为修订任务（Revision Task）数组：review.yaml 中 status 为 open 的发现项（source 为 review），以及该单元未处理（open 或 accepted）的作者反馈（source 为 feedback），每项含 source、id、status、paragraph 与 message；decisions 为关联该单元、status 为 open 的决策，每项含 id、question 与 blocking；gate 含 level（工作区配置的 gate_level）、blockers（按 accept-gate 在已给出作者确认时的阻塞项，每项含 code、path、ref 与 message）、ready（blockers 为空）与 confirmationRequired（level 为 strict 时为 true）；acceptance 为已有的 acceptance.yaml（gateLevel、draftSha256、confirmedByAuthor、confirmation、acceptedAt 与 stale），没有时为 null；rubric 为该单元审稿必须逐项给出结论的评分项数组，与 review record 校验 review.missing-verdict 使用的评分标准相同（合并后的评分标准加上单元选用的写作法附带的评分项），每项含 id、title、description（没有时为空字符串）与 blocking，单元没有可读取的正文或配置合并失败时为空数组。
    scenarios:
      show-revisions:
        - GIVEN: 作品 my-post 的审稿有两个 open 的发现项，另有一条 open 的作者反馈 fb-1，工作区的 gate_level 为 standard
        - WHEN: 运行 wa-cli review show my-post --dir D --json
        - THEN: revisions 依次为两个 source 为 review 的发现项与 source 为 feedback 的 fb-1；gate.level 为 standard，gate.ready 为 false，gate.blockers 的 code 依次为 accept.open-finding、accept.open-finding 与 accept.open-feedback；changedPaths 为空数组，退出码为 0
      show-no-review:
        - GIVEN: 作品 my-post 处于审稿阶段、没有 review.yaml，gate_level 为 standard
        - WHEN: 运行 wa-cli review show my-post --dir D --json
        - THEN: review 为 null，gate.blockers 只有一项 code 为 accept.review-missing，退出码为 0
      show-rubric:
        - GIVEN: tech-blog 作品 my-post 选用写作法 pyramid-scqa，处于 review 阶段，还没有审稿
        - WHEN: 运行 wa-cli review show my-post --dir D --json
        - THEN: rubric 依次列出 tech-blog 合并后的全部评分项与 pyramid-scqa 附带的评分项，每项含 id、title、description 与 blocking；按这些 id 各给一个结论运行 wa-cli review record 不报告 review.missing-verdict
  review-resolve:
    strength: MUST
    statement: wa-cli review resolve <unit> <finding> 必须把 review.yaml 中发现项的 status 改为 --status（resolved、waived 或 open，省略时为 resolved），给出 --note 时把处理说明设为该值；只改动这两个字段，保留其他内容与 YAML 注释。status 为 waived 时必须有处理说明（本次给出或已有），否则报告 review.missing-note。成功时 --json 输出的 finding 字段含修改后的发现项，changedPaths 为 [review.yaml]，取值未变时不写文件、changedPaths 为空数组，退出码为 0。单元没有审稿或其中没有该发现项时报告 review.finding-not-found（next 包含 wa-cli review show <unit> --dir <dir> --json）；--status 不在取值范围内或 --note 为空白时报告 artifact.schema-violation；发现项经由 YAML 锚点、别名或合并键得到时报告 review.anchored-value；这些情况都不修改文件，退出码为 1。
    scenarios:
      waive-with-note:
        - GIVEN: 作品 my-post 的审稿有 open 的发现项 rf-2，review.yaml 中有作者的注释
        - WHEN: 运行 wa-cli review resolve my-post rf-2 --status waived --note 作者说保留 --dir D --json
        - THEN: finding.status 为 waived，finding.note 为 作者说保留；作者的注释保留；changedPaths 为 [.writing-anything/works/my-post/review.yaml]，退出码为 0
      waive-without-note:
        - GIVEN: 同上，rf-2 没有处理说明
        - WHEN: 运行 wa-cli review resolve my-post rf-2 --status waived --dir D --json
        - THEN: diagnostics 中有一条错误码为 review.missing-note 的诊断，review.yaml 不变，退出码为 1
  accept-gate:
    strength: MUST
    statement: 'wa-cli accept <unit> 必须按工作区配置的关卡强度（Gate Level）检查验收的阻塞项，有阻塞项时为每项给出一条 error 级诊断、不写任何文件、退出码为 1。所有关卡强度下的阻塞项：本单元文本检查未被豁免的 error 级发现项（accept.lint-errors，path 为 draft.md，next 包含 wa-cli lint <unit> --dir <dir> --json）、使文本检查无法完成的 error 级问题（保留其错误码）、关联该单元的 open 阻塞决策（decision.blocking，next 包含 wa-cli decisions --dir <dir> --json），决策队列无法加载（decision.invalid-queue，message 说明决策队列无法加载），以及写后收口（Close-out）阻塞项——单元为场景且其大纲任一节声明了非空的 state_changes、plants、recovers 或 events（契约要求收口的场景）时：单元目录下没有 closeout.yaml 报告 closeout.missing（path 为单元目录，next 包含 wa-cli scene close-out <unit> --dir <dir> --json 与 wa-cli help scene close-out --json）；closeout.yaml 不通过校验或途经符号链接时报告 closeout.invalid（保留其诊断，next 同上）；closeout.yaml 的 draft_sha256 与当前正文 draft.md 不同报告 closeout.stale（path 为 closeout.yaml，next 同上）；closeout.yaml 记录的 state 与 knowledge 提议仍有 status 为 proposed 的条目报告 closeout.pending-proposals（next 另含 wa-cli state list <work> --dir <dir> --json 与 wa-cli knowledge list <work> --dir <dir> --json）；按当前契约与台账复查收口的契约对照失败时报告 closeout.missing-state-change、closeout.missing-recovery、closeout.missing-plant 或 closeout.missing-event（path 为 closeout.yaml，next 同上）。场景大纲没有声明上述契约字段且单元目录下没有 closeout.yaml 时不做任何收口检查。以及连续性审查（Continuity Review，见 continuity 主规格）阻塞项——单元为场景时，wa-cli continuity 的 error 级发现项（未建卡出场人物、保留词终态人物出场、同场景多名一卡、按场景过滤的悬空引用与伏笔超期）每项一条诊断（错误码同发现项，path 为该场景大纲所在单元目录，next 包含 wa-cli continuity <unit> --dir <dir> --json 与 wa-cli decisions --dir <dir> --json）；已被作者决策豁免的（场景、错误码）不再阻塞，未豁免而阻塞时按 continuity 主规格幂等地生成阻塞决策（changedPaths 如实列出决策队列路径）；没有 error 级发现项的场景与未声明场景契约扩展字体的单元不做连续性检查。standard 与 strict 另有：没有 review.yaml（accept.review-missing）、review.yaml 不通过校验（保留其诊断）、审稿的 draft_sha256 与当前正文不同（accept.review-stale）、单元的评分项（见 review-record）没有结论（review.missing-verdict），每个 status 为 open 的审稿发现项（accept.open-finding，next 包含 wa-cli help review resolve --json）与每条未处理的作者反馈（accept.open-feedback，next 包含 wa-cli feedback list <unit> --dir <dir> --json）。strict 另有：单元的评分项（来自文体、规范包或选用的写作法）声明 blocking: true 且审稿结论为 fail（accept.blocking-rubric），以及没有给出 --confirmed-by-author 与 --confirmation（accept.unconfirmed，next 包含 wa-cli help accept --json）。审稿结论为 fail 在 fast、standard 下以及未声明 blocking 的评分项上都不阻塞。每条阻塞项诊断的 next 都包含能复查它的 wa-cli review show <unit> --dir <dir> --json。'
    scenarios:
      continuity-blocks-accept:
        - GIVEN: novel 作品 my-novel 的场景 s1 处于审稿阶段，其余验收条件满足，出场人物之一在设定集中没有同名 character 条目（continuity.unknown-character），尚无相关决策
        - WHEN: 运行 wa-cli accept my-novel/s1 --confirmed-by-author --confirmation 作者：可以 --dir D --json
        - THEN: diagnostics 中有一条错误码为 continuity.unknown-character 的诊断（next 含 wa-cli continuity my-novel/s1 与 wa-cli decisions），决策队列幂等新增一条阻塞决策，没有写出 acceptance.yaml，退出码为 1
      continuity-waived-passes:
        - GIVEN: 同上，作者已对豁免场景 s1 的 continuity.unknown-character 的阻塞决策选择允许
        - WHEN: 运行 wa-cli accept my-novel/s1 --confirmed-by-author --confirmation 作者：可以 --dir D --json
        - THEN: 没有 continuity 诊断，验收成功，退出码为 0
      no-contract-scene-unchanged:
        - GIVEN: short-story 场景的大纲只声明 characters 与 reveal（无场景契约扩展字段），出场人物没有设定卡
        - WHEN: 运行 wa-cli accept <该场景> --confirmed-by-author --confirmation 作者：可以 --dir D --json
        - THEN: 没有 continuity 诊断，验收行为与引入连续性审查前一致，退出码为 0
  accept-record:
    strength: MUST
    statement: wa-cli accept <unit> 只能在单元当前阶段的必需产物（Required Artifact）含 acceptance 时使用，否则报告 accept.wrong-stage（next 包含 wa-cli next <unit> --dir <dir> --json）。--confirmed-by-author 与 --confirmation <作者原话摘要> 必须同时给出且摘要不为空白，否则报告 accept.incomplete-confirmation（next 包含 wa-cli help accept --json）。没有阻塞项时必须整体替换单元目录下的 acceptance.yaml，记录 schema_version 1、gate_level、draft_sha256（当前正文的 SHA-256）、confirmed_by_author、confirmation（给出作者确认时）与 accepted_at（UTC 时间，格式 YYYY-MM-DDTHH:MM:SSZ），即确认记录（Confirmation Record）；changedPaths 为 [acceptance.yaml]，--json 输出的 acceptance 字段含 unit、path、gateLevel、draftSha256、confirmedByAuthor、confirmation 与 acceptedAt，退出码为 0。standard 与 fast 下没有给出作者确认时照常验收，confirmed_by_author 为 false，并给出一条 warning 级 accept.unconfirmed。accept 不改变单元的阶段；之后正文被修改、验收记录不通过校验或工作区的关卡强度变得比记录的 gate_level 更严时，advance 与 next 分别报告 acceptance.stale、acceptance.invalid 与 acceptance.weaker-gate（见 units-and-lifecycle 主规格的 advance-stage）。
    scenarios:
      accept-confirmed:
        - GIVEN: gate_level 为 strict，作品 my-post 没有验收阻塞项
        - WHEN: 运行 wa-cli accept my-post --confirmed-by-author --confirmation 作者：可以发了 --dir D --json
        - THEN: acceptance.yaml 的 confirmed_by_author 为 true、confirmation 为 作者：可以发了、gate_level 为 strict；diagnostics 为空，changedPaths 为 [.writing-anything/works/my-post/acceptance.yaml]，退出码为 0；work.yaml 的 stage 仍为 review
      accept-unconfirmed-standard:
        - GIVEN: gate_level 为 standard，作品 my-post 没有验收阻塞项
        - WHEN: 运行 wa-cli accept my-post --dir D --json
        - THEN: 退出码为 0，acceptance.confirmedByAuthor 为 false，diagnostics 中有一条 severity 为 warning、错误码为 accept.unconfirmed 的诊断
      wrong-stage:
        - GIVEN: 作品 my-post 处于草稿阶段
        - WHEN: 运行 wa-cli accept my-post --dir D --json
        - THEN: diagnostics 中有一条错误码为 accept.wrong-stage 的诊断，其 next 包含 wa-cli next my-post 命令，退出码为 1
      incomplete-confirmation:
        - GIVEN: 作品 my-post 处于审稿阶段
        - WHEN: 运行 wa-cli accept my-post --confirmed-by-author --dir D --json
        - THEN: diagnostics 中有一条错误码为 accept.incomplete-confirmation 的诊断，没有写出 acceptance.yaml，退出码为 1
  review-validation:
    strength: MUST
    statement: wa-cli validate 整体校验时，必须对每个可加载作品的每个单元目录中存在的 review.yaml 与 acceptance.yaml 做 Schema 校验并计入 checked（途经符号链接或不是普通文件时同样计入 checked，并报告 artifact.not-found；advance、next、review show、review resolve 与 accept 对它们报告同一问题，不当作不存在）；review.yaml 另须满足评分结论的 item 不重复（否则 review.duplicate-verdict）、发现项 id 不重复（否则 artifact.duplicate-id），且每条重申（Reaffirm）记录的 resolved 与 waived 引用的发现项 id 都存在于该审稿的发现项中（否则 review.finding-not-found，field 为 reaffirms[i].resolved[j] 或 reaffirms[i].waived[j]）。wa-cli validate <path> 按产物所在位置识别 review.yaml 与 acceptance.yaml 并执行相同的检查。评分项可以声明布尔字段 blocking，供 accept-gate 在 strict 下使用。
    scenarios:
      validate-review:
        - GIVEN: 作品 my-post 的 review.yaml 中两个发现项的 id 都为 rf-1
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有一条错误码为 artifact.duplicate-id、path 为 .writing-anything/works/my-post/review.yaml 的诊断，退出码为 1
      validate-symlink:
        - GIVEN: 作品 my-post 的 acceptance.yaml 是指向项目目录之外的符号链接
        - WHEN: 运行 wa-cli validate --dir D --json 与 wa-cli advance my-post --dir D --json
        - THEN: validate 的 checked 含该 acceptance.yaml，diagnostics 中有一条错误码为 artifact.not-found、path 为该文件的诊断；advance 报告 acceptance.invalid 并且不推进，两者退出码都为 1
      validate-acceptance:
        - GIVEN: 作品 my-post 的 acceptance.yaml 只有 schema_version
        - WHEN: 运行 wa-cli validate .writing-anything/works/my-post/acceptance.yaml --dir D --json
        - THEN: diagnostics 中有一条错误码为 artifact.schema-violation 的诊断，退出码为 1
      validate-reaffirm-dangling:
        - GIVEN: 作品 my-post 的 review.yaml 的 reaffirms[0].resolved 引用了不存在的发现项 rf-9
        - WHEN: 运行 wa-cli validate --dir D --json 与 wa-cli review show my-post --dir D --json
        - THEN: 两者都报告 review.finding-not-found（field 为 reaffirms[0].resolved[0]），退出码都为 1
  acceptance-channel:
    strength: MUST
    statement: 经作者确认的验收（confirmed_by_author 为 true）必须在 acceptance.yaml 中记录确认渠道（Confirmation Channel）channel：wa-cli accept 写入 cli，作者在本地阅读页（Reading View，见 preview 主规格的 preview-confirm）确认写入 preview；未经作者确认的验收不记录 channel。channel 的取值只能是 cli 或 preview，否则报告 artifact.schema-violation（field 为 channel）；没有 channel 的已有记录照常通过校验并按 cli 解释。wa-cli accept 与 review show 的 --json 输出的 acceptance 含 channel：经作者确认时为记录的渠道（缺失时为 cli），未经作者确认时为 null。渠道是可审计的流程约束而非安全隔离：不拒绝 cli 渠道的确认，accept 的阻塞项、退出码与其他字段不因渠道改变。
    scenarios:
      accept-records-cli:
        - GIVEN: gate_level 为 strict，作品 my-post 没有验收阻塞项
        - WHEN: 运行 wa-cli accept my-post --confirmed-by-author --confirmation 作者：可以发了 --dir D --json
        - THEN: 'acceptance.yaml 含 channel: cli，--json 输出的 acceptance.channel 为 cli，退出码为 0'
      legacy-without-channel:
        - GIVEN: acceptance.yaml 是引入渠道前写入的确认记录，没有 channel 字段
        - WHEN: 运行 wa-cli review show my-post --dir D --json
        - THEN: acceptance.channel 为 cli，wa-cli validate 不报告该文件的问题
  review-show-author-review:
    strength: MUST
    statement: wa-cli review show <unit> 与 wa-cli next 的 --json 输出必须含 pendingAuthorReviews 数组，列出待作者复核（Pending Author Review）的确认：工作区 gate_level 为 strict 时，单元所在作品（next 省略单元时为全部作品）中渠道为 cli（含缺失渠道的旧记录）、且 .writing-anything/author-reviews.yaml 中没有对应复核记录的三类确认——已确认的验收（kind 为 acceptance，ref 为单元引用，确认时间为 accepted_at）、已确认的卷末检查点（kind 为 volume-checkpoint，ref 为部单元引用，确认时间为 confirmed_at）与钦定设定修改（kind 为 canon-decision：status 为 decided、choice 为 a、问题为修改或删除作者钦定条目的授权决策、units 含该作品，ref 为决策 id，确认时间为 decided_at）；按验收、卷末检查点（各按单元树先序）、钦定设定修改（按决策队列顺序）排列。每项含 key（<kind>:<ref>@<确认时间>）、kind、work、ref、path（确认记录所在产物）、confirmation、confirmedAt 与 command（wa-cli preview <work> --serve --dir <dir> --json）。gate_level 为 standard 或 fast 时为空数组。不通过校验的验收、检查点与决策队列不计入；复核记录不通过校验时全部确认都算未复核，并报告其诊断。不加 --json 时列出待复核项与打开阅读页的命令。
    scenarios:
      show-lists-cli-acceptance:
        - GIVEN: gate_level 为 strict，场景 my-novel/scene-1 经 wa-cli accept 验收（渠道 cli），尚未复核
        - WHEN: 运行 wa-cli review show my-novel/scene-1 --dir D --json
        - THEN: pendingAuthorReviews 有一项 kind 为 acceptance、ref 为 my-novel/scene-1、command 含 wa-cli preview my-novel --serve，退出码为 0
      preview-channel-not-listed:
        - GIVEN: gate_level 为 strict，场景 scene-9 的验收由作者在阅读页确认（渠道 preview）
        - WHEN: 运行 wa-cli next my-novel --dir D --json
        - THEN: pendingAuthorReviews 不含 scene-9 的验收
      standard-not-listed:
        - GIVEN: 同 show-lists-cli-acceptance，但 gate_level 为 standard
        - WHEN: 运行 wa-cli review show my-novel --dir D --json
        - THEN: pendingAuthorReviews 为空数组
  author-review-ledger:
    strength: MUST
    statement: .writing-anything/author-reviews.yaml 是复核记录（Author Review Record）：含 schema_version（1）与 reviews 数组，每项含 kind（acceptance、canon-decision 或 volume-checkpoint）、work（作品 id）、ref、confirmed_at（被复核那一次确认的时间）、channel（只能为 preview）与 reviewed_at（UTC，YYYY-MM-DDTHH:MM:SSZ）；字段形态不符时报告 artifact.schema-violation。复核记录只由阅读页的批量复核（见 preview 主规格的 preview-author-review）追加；一项待复核确认当且仅当存在 kind、ref 与 confirmed_at 都相同的记录时视为已复核，因此确认重写（确认时间改变）后需要重新复核。wa-cli validate 整体校验时文件存在即做 Schema 校验并计入 checked；wa-cli validate .writing-anything/author-reviews.yaml 做同样的校验；文件途经符号链接或不是普通文件时按 artifact.not-found 处理。 追加时 reviews 经由 YAML 锚点、别名或合并键得到时报告 author-review.anchored-value（field 为 reviews），不写文件。
    scenarios:
      validate-ledger:
        - GIVEN: author-reviews.yaml 有一条 channel 为 cli 的记录
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: 报告 artifact.schema-violation，退出码为 1
      reconfirm-needs-review:
        - GIVEN: scene-1 的命令行验收已复核，之后在另一时间重新经 wa-cli accept 验收
        - WHEN: 运行 wa-cli review show my-novel --dir D --json（gate_level 为 strict）
        - THEN: pendingAuthorReviews 再次列出 scene-1 的验收（confirmedAt 为新的 accepted_at）
