      command: test -z "$(gofmt -l internal/lint internal/draft internal/catalog internal/cli/lint.go internal/cli/lint_test.go internal/cli/sources.go internal/cli/sources_test.go internal/cli/cli_test.go internal/cli/registry.go)"
