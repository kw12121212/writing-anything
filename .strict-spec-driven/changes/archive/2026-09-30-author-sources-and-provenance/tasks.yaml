schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: author-sources-and-provenance
sections:
  Implementation:
    schema-kinds:
      text: internal/schema：产物类型改为 Patterns 列表；新增 source.schema.json、provenance.schema.json、claims.schema.json 并登记 source、provenance、claims 三种产物类型（provenance 与 claims 同时匹配 works/*/ 与 works/*/units/*/）；在 testdata/ 下为每种类型各准备合法与不合法夹具
      status: complete
    stdin-injection:
      text: cli.Run 增加 stdin io.Reader 参数并存入 invocation，cmd/wa-cli 传入 os.Stdin；更新测试辅助函数
      status: complete
    source-package:
      text: 新增 internal/source：登记素材（类型、默认 id、source.exists、source.empty）、逐字节存档原文与写出 source.yaml、加载与列出素材、校验存档完整性（source.id-mismatch、存档缺失 artifact.not-found、source.modified）
      status: complete
    draft-package:
      text: 新增 internal/draft：段落切分（空行、围栏代码块）、段落与整篇哈希、写入 draft.md 与 provenance.yaml（出处保留、未变不写、创建子单元目录）、最长公共子序列对齐与区间配对推导出处、单元级汇总、论断登记与校验（claim.unknown-source、artifact.duplicate-id）
      status: complete
    cli-commands:
      text: 在 internal/cli 注册表新增 source add、source list、draft write、provenance、claim add：声明 args、flags（--type、--file、--title、--id、--kind、--text、--sources）、outputKeys（source、sources、draft、provenance、claim）、exitCodes 与 sampleArgs/mutatingSamples；--file 相对 --dir 解析、省略时读标准输入（input.read-failed）；诊断 next 可直接运行；不加 --json 时输出人读文本
      status: complete
    validate-integration:
      text: 扩展 wa-cli validate：整体校验时检查 sources/ 下每个素材目录，以及每个作品的每个单元目录中存在的 provenance.yaml 与 claims.yaml，并计入 checked；validate <path> 识别三种新产物并执行对应的领域检查
      status: complete
    glossary:
      text: 在 docs/GLOSSARY.md 加入本变更引入的术语：写入记录（Draft Record）、段落（Paragraph）等尚未收录的词，以及出处取值 human、agent、agent-draft-human-edited 的说明
      status: complete
  Testing:
    unit-tests:
      text: 为 schema、source、draft 与 cli 编写单元测试：素材登记与各错误码、逐字节存档与篡改检测、段落切分与哈希、出处推导（改一段、加一段、删一段、无写入记录、重写保留作者段落）、单元级汇总、论断登记与素材引用检查、标准输入与 --file、validate 对新产物的检查；断言使用规格中的字面量
      status: complete
      command: go test ./internal/...
    full-regression:
      text: 运行完整回归命令，覆盖率不低于 80%
      status: complete
      command: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out
  Verification:
    spec-alignment:
      text: 对照 sources-and-provenance 与 workspace delta spec 的每个场景确认实现与测试覆盖，并按实际实现修正 delta spec 与 delta tech
      status: complete
    strict-ready:
      text: 运行 strict-spec-cli ready 与 strict-spec-cli verify，确认变更产物有效
      status: complete
      command: strict-spec-cli ready author-sources-and-provenance && strict-spec-cli verify author-sources-and-provenance
    archive-readiness:
      text: 确认 delta spec 能合并进 workspace 主规格与新建的 sources-and-provenance 主规格，delta tech 能合并进 go-project-structure 与 workspace-artifacts，归档后路线图中的 author-sources-and-provenance 标记为完成
      status: complete
testing_gates:
  validation_task: full-regression
  unit_test_task: unit-tests
