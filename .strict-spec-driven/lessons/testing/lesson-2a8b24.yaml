  - origin: dsh-native-review
    date: '2026-10-22'
    evidence: TestPreviewServeGuidance 仍按字面量 --serve 筛选技能；本变更新增 review_surface 的 dsh 分支时同样漏掉 wa-auto 第 4 步（经 pendingAuthorReviews 的 command 交出 preview.url）与 wa-assemble 第 5 步（交出「阅读页地址」），fresh-context 审查发现；改为按语义标记（preview.url、阅读页地址）逐步骤检查的 TestPreviewHandoffStepsBranch 后补齐。
