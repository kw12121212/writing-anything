schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: go-project-structure
  title: Go 工程结构与回归关卡
  category: architecture
rules:
  thin-entry:
    strength: MUST
    statement: wa-cli 的入口位于 cmd/wa-cli/，只转交参数、输入输出流与退出码；全部实现位于 internal/ 下。
    rationale: 覆盖率统计范围只含 internal/**，逻辑放在 cmd/ 会逃出回归关卡。
    enforcement:
      method: review
    examples:
      good:
        - main 调用 cli.Run(os.Args[1:], os.Stdin, os.Stdout, os.Stderr) 并 os.Exit 其返回值
      bad:
        - 在 cmd/wa-cli/main.go 中解析子命令并实现业务逻辑
  coverage-gate:
    strength: MUST
    statement: config.yaml 中 review_evidence.project_regression.command 声明的完整回归命令必须通过；其中 internal/tools/covercheck 按语句加权统计 internal/**（不含 internal/tools/**）的覆盖率，低于声明的阈值即失败。
    rationale: 回归命令与阈值只在 config.yaml 维护一处，避免标准与配置漂移；覆盖率不足是阻塞性失败而非提示。
    enforcement:
      method: test
  testdata-fixtures:
    strength: MUST
    statement: 测试夹具（Test Fixture）放在各包的 testdata/ 目录下；仓库根目录不创建 .writing-anything/；testdata/ 下不放 go.mod，需要 go.mod 的场景在测试中用 t.TempDir() 生成。
    rationale: 夹具随包就近维护，避免仓库根目录出现产品工作区与真实工作区混淆；testdata 中的 go.mod 会形成嵌套模块边界，使夹具脱离外层模块。
    enforcement:
      method: review
  stdlib-first:
    strength: SHOULD
    statement: 工具与内核实现优先使用 Go 标准库；引入第三方依赖需在变更设计中说明理由。
    rationale: 保持单文件二进制精简、构建可复现。
    enforcement:
      method: review
  injectable-io:
    strength: SHOULD
    statement: 命令与开发工具的实现接收 args []string、stdin io.Reader 与 stdout、stderr io.Writer（开发工具不读标准输入时可省略 stdin）并返回 int 退出码；除 cmd/ 与 internal/tools/* 的 main 函数外，不调用 os.Exit，也不直接读写 os.Stdin、os.Stdout、os.Stderr。
    rationale: 这样命令可以在进程内测试并计入覆盖率，无需为每个用例启动子进程；draft write 与 source add 从标准输入读取内容，标准输入同样需要注入。
    enforcement:
      method: review
    examples:
      good:
        - func Run(args []string, stdin io.Reader, stdout, stderr io.Writer) int
      bad:
        - 在 internal/cli 中调用 os.Exit(2)、fmt.Println 或 io.ReadAll(os.Stdin)
  dev-tools-isolation:
    strength: MUST
    statement: 只在开发时使用的工具放在 internal/tools/<name>/，写成 package main，不计入覆盖率范围；产品包（cmd/wa-cli 与 internal/ 下其他包）不得 import internal/tools/**。
    rationale: 覆盖率排除 internal/tools/** 的前提是这些工具不属于产品运行时。
    enforcement:
      method: test
      detail: cmd/wa-cli/main_test.go 的 TestNoDevToolDependency 用 go list -deps 断言产品二进制不依赖 internal/tools/**。
  domain-problems:
    strength: SHOULD
    statement: 领域包（如 internal/schema、internal/workspace）只返回结构化的问题（错误码、路径、字段、行号、说明），由 internal/cli 统一转换为诊断并填写 next；领域包不 import internal/cli。
    rationale: 下一步命令取决于调用方式（--dir、命令名），属于命令层；领域包保持与输出格式无关，后续 MCP 服务也能复用同样的问题。
    enforcement:
      method: review
  output-sync-in-tests:
    strength: SHOULD
    statement: 流式或轮询命令的测试用输出作为同步点（轮询输出直到出现哨兵事件或期望的内容），不以固定的 sleep 假定后台扫描已经完成；测试中写入待观测的文件时先写临时文件再重命名。
    rationale: 固定等待在慢速或满载的 CI 上会让基线扫描晚于测试动作，事件被算进基线后测试只能等到超时失败；非原子写入会让扫描读到写了一半的文件，产生另一种诊断。
    enforcement:
      method: review
      detail: internal/cli 的 TestFeedbackWatch 以 --all 输出的哨兵反馈作为启动扫描完成的同步点，并用 atomicWrite 写入不合法的 feedback.yaml。
    examples:
      good:
        - waitFor(t, out, "哨兵") 后再追加反馈
      bad:
        - time.Sleep(200 * time.Millisecond) 后假定 watch 已完成启动扫描
  failure-tests-assert-code:
    strength: SHOULD
    statement: 断言命令或函数失败的测试应当断言具体的错误码（以及需要时的 path 与 field），不只断言「有问题」或退出码为 1；构造失败场景的夹具只应触发被测的那一个问题。
    rationale: 只断言存在问题的测试会因为夹具中别的错误而通过（如复制的提议 id 与文件名不一致），被测分支实际上没有证据。
    enforcement:
      method: review
      detail: 审查新增的失败场景测试：断言了规格中的错误码字面量，夹具没有附带其他会先报告的问题。
  float-equality-in-stats:
    strength: SHOULD
    statement: 统计判定中「为 0」或「相等」的条件，应先检查样本是否全部相同，或按输出精度舍入后再比较；不得直接对浮点运算结果用 <= 0 或 == 判断。
    rationale: 完全相同的 0.1 求出的总体标准差是 1.39e-17，直接比较会把「标准差为 0 不判定」绕过去，产生「超过 2 个标准差（标准差 0）」这样自相矛盾的结论。
    enforcement:
      method: test
      detail: internal/stylemetric 的 TestIdenticalBaselineNotJudged 用三个 0.1 作为基准，断言不判定。
  shared-term-matcher:
    strength: SHOULD
    statement: 对正文按词表计数或匹配（AI 腔、禁用词等）时，应复用 internal/lint 的多词匹配器（lint.CountTerms 或规则引擎），一次扫描完成，屏蔽区域与去重口径与 lint 一致；不得对每个词各扫描一次正文。
    rationale: 词表条数只受节点上限约束，逐词扫描的耗时随词表增长（3 万个词、30 万字时约 6 秒），也会与 lint 的计数口径不一致（重复词、重叠词、代码与注释）。
    enforcement:
      method: test
      detail: internal/lint 的 TestCountTerms 与 internal/stylemetric 的 TestMeasureDetails 断言去重、重叠与屏蔽区域的计数。
  testdata-design-artifact-validation:
    strength: SHOULD
    statement: 检入 testdata/ 且作为跨变更契约（稳定编号、稳定字段）被后续变更解析的设计产物（测试矩阵、命令脚本、黄金索引等），应附带同包结构校验测试，断言：标识符唯一且格式一致、必填字段齐备、清单覆盖约定面（如特性枚举）完备、对其他设计文档的引用（编号、单元或条目 id）可解析。引用不一致应在设计产物的校验层失败，而不是在使用方（重放器、对账器）落地时才暴露。
    rationale: corpus-design 变更建立了该模式：TestNovelCorpusDesign 以结构校验测试锁住测试矩阵与设计文档的契约面，直接缓解 novel-e2e 里程碑风险清单中的「断言与矩阵脱节」；后续 corpus-authoring、replay-harness、matrix-check 都以矩阵编号为锚点，缺字段或编号冲突越早拦截返工面越小。
    enforcement:
      method: test
      detail: 校验测试与产物同包放置（如 internal/cli），随 go test 默认执行；数量类约束（如最少伏笔链数）以枚举或正则锚点计数，断言钉住具体事实而非超集。
  replay-corpus-hash-commitments:
    strength: SHOULD
    statement: 检入的可重放命令脚本中以内容哈希作承诺的参数（如 draft write --base 的正文 SHA-256）必须等于对应检入输入文件内容的 SHA-256，由同包结构校验测试复算断言；修订语料输入文件时同步复算脚本中的哈希承诺，不一致应在语料校验层失败，而不是在重放器落地时才暴露。
    rationale: corpus-authoring 的 --base 哈希是「真实执行、可重放」最硬的证据（280 步全量重放通过），但此前没有测试钉住它；不沉淀则修订正文时哈希漂移只会在 replay-harness 落地时才暴露，违背 testdata-design-artifact-validation 的 rationale。
    enforcement:
      method: test
      detail: 断言实现在 internal/cli 的 TestNovelCorpusScript：遍历脚本步骤中的 --base 参数与 ch1-s3-author.md 的 SHA-256 比对。
  injectable-clock:
    strength: MUST
    statement: 领域包写入时间戳（decided_at、confirmed_at、recorded_at、written_at 等）必须以 time.Time 参数接收时钟，由 internal/cli 统一传包级 now()（cli/review.go 定义、测试可替换）；internal/ 非测试代码不得直取 time.Now() 或硬编码 time.Date 时刻，预检查函数（如 draft.Precheck）与实际写入必须传入同一时钟；唯一例外是 internal/canon 系列级同 id 覆盖的 ConfirmedAt（canon.go），新增例外须登记在本规则排除清单并由 TestInjectableClock 静态扫描强制。
    rationale: 同一缺陷模式反复出现：decision/handoff/volume/review 先接入注入时钟，后加的 state/knowledge/plan/draft 又私取系统时钟、cli 新调用点直传 time.Now()，语料重放双跑一致性全部失守；fix-state-knowledge-clock 修复后以 TestInjectableClock（internal/cli）静态扫描强制，防止下一个时间戳再漏网。
    enforcement:
      method: lint
      detail: 强制测试：internal/cli TestInjectableClock 扫描 internal/** 非测试 .go 文件的 time.Now() 与硬编码 time.Date(202* 行，白名单为 cli/review.go（now 定义处）与 canon/canon.go（登记排除）。
  matrix-assertion-reconciliation:
    strength: SHOULD
    statement: 以清单（测试矩阵、对账表等）登记断言意图时，应附双向对账校验测试：每条清单条目都必须解析到真实存在的断言（缺失项清单化输出），且全部实质断言（黄金文件、负向断言码、脚本内嵌断言等）都必须被至少一条清单条目引用。两条硬性细则：(1) 无断言过滤的宽匹配锚点只作存在性锚点，不得作为反向登记来源；(2) 反向清单的输入必须从断言源（测试源码字面量、脚本 YAML、黄金目录）机械推导，不得手工转录。
    rationale: matrix-check 建立了该模式：对账测试首轮就抓到 6 处 evidence 与脚本事实不符、以及宽 token 使三个负向码的反向覆盖变成顺带命中的漏洞；手工转录的负向码清单与机械推导的清单之间的差距正是「断言漏登」的温床。
    enforcement:
      method: test
      detail: 强制实例：internal/cli TestNovelCorpusMatrix（负向码从 novel_corpus_golden_test.go 源码 diagCode/codes 字面量推导；黄金目录与黄金测试采集清单一一对应）。
  project-skill-location:
    strength: MUST
    statement: 仓库级项目技能（指导开发流程、不随二进制分发的 Agent Skills）放在 .agents/skills/<name>/SKILL.md：frontmatter 只含 name 与 description，name 与目录名相同，格式与内置技能一致；格式与引用完整性由 internal/skills 的结构校验测试覆盖。产品运行时（wa-cli、内置技能、MCP 服务）不得依赖这些文件
    rationale: 复用既有目录约定：skills install --agent codex 的目标目录就是 .agents/skills（Codex 在仓库中扫描的位置），internal/skills.Parse 已实现同一格式约束；校验测试使技能引用的仓库路径漂移在回归中失败
    enforcement:
      method: test
      detail: internal/skills 的 TestProjectSkills 遍历 .agents/skills/*/SKILL.md，用 skills.Parse 校验格式，并断言技能正文引用的关键仓库路径存在
  path-spelling-normalization:
    strength: SHOULD
    statement: 对来自不同 API 的路径（os.Getwd、TMPDIR 派生的临时目录、用户或测试给出的绝对路径等）做包含判定、前缀比较或按目录分组显示时，不得只做字符串前缀比较：先把两侧已存在的前缀用 filepath.EvalSymlinks 归一为 OS 报告的真实路径拼写再比较，或按文件身份（os.SameFile）逐级确认；路径不存在导致归一失败时保持原拼写，并以身份检查兜底
    rationale: macOS 的 TMPDIR（/var → /private/var 符号链接）使同一目录呈现两种拼写，字符串比较会把之内误判为之外：本变更一次修复了两处（internal/skills.Install 的 inside 判定与显示、internal/cli fakeGit 测试的 TMPDIR 拼写失配），干净 HEAD 复现证明是既有陷阱，未来接受绝对路径的命令与测试还会踩到
    enforcement:
      method: review
      detail: internal/skills.Install（rootAbs 与已存在祖先 EvalSymlinks 后重算 base 与 missing）、internal/cli fakeGit（TMPDIR 归一）；与 workspace-artifacts 相关规则中按 os.SameFile 身份确认的手段并列
