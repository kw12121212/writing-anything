summary: 结构化决策队列（Decision Queue）与 decide 命令
details: wa-cli decision add 记录待决事项：问题、选项、Agent 推荐、是否阻塞（Blocking）、关联单元。阻塞决策未解决时，关联单元不能推进；wa-cli decisions 列出待决项并可按是否阻塞分组，方便一次性询问作者；wa-cli decide 记录作者的选择和确认原话摘要，形成确认记录（Confirmation Record）。
