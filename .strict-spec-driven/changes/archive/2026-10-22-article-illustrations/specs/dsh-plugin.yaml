schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: dsh-plugin
operations:
  ADDED: {}
  MODIFIED:
    review-proxy:
      strength: MUST
      statement: 插件 host 必须以固定同源路由代理当前会话阅读页服务的数据与提交接口：GET /dsh-writing-viewer/review/page.json 对应阅读页服务的 GET /page.json，GET（与 HEAD）/dsh-writing-viewer/review/illustration 对应阅读页服务的 GET（与 HEAD）/illustration（只转发查询参数 unit 与 id，其他查询参数丢弃；见 preview 主规格的 preview-illustration），POST /dsh-writing-viewer/review/feedback、/dsh-writing-viewer/review/confirm 与 /dsh-writing-viewer/review/author-review 对应同名 POST；其他子路径（含 GET /dsh-writing-viewer/review/ 与阅读页 HTML）返回 404，不访问上游。代理向上游请求时由 host 注入会话令牌（GET 与 HEAD 的 token 查询参数、POST 的 X-WA-Token 头），丢弃浏览器带来的 token 查询参数与 X-WA-Token 头，上游 Host 为 127.0.0.1:<port>；请求体超过 64 KiB 时返回 400 且不转发。上游响应的状态码与正文原样回传（配图图片的字节同样逐字节回传），响应头原样保留，只去掉描述传输本身而由宿主重新派生的头（content-length、content-encoding、transfer-encoding、connection、keep-alive）。没有进行中的会话时返回可读的「没有进行中的审阅」JSON 提示（GET、HEAD 与 POST 相同），不访问任何上游；上游不可达或超时时返回可读的 JSON 提示，不回显原始错误信息。经代理写入的结果与直接使用阅读页完全相同，确认渠道（Confirmation Channel）仍为 preview；代理接口与面板不得依赖仅安全上下文（Secure Context）可用的浏览器 API，使作者经 http 的 Tailscale MagicDNS 地址访问时可用
      scenarios:
        proxy-page-json:
          - GIVEN: 有 my-post 的会话，作者浏览器经 http://gamepc.tail1234.ts.net:13080 访问且该权威已在 allowedHosts 放行
          - WHEN: 同源 GET /dsh-writing-viewer/review/page.json
          - THEN: 返回 200 与 application/json，units[0].ref 为 my-post 且含正文段落；响应中不出现阅读页令牌或 127.0.0.1 地址
        proxy-html-gone:
          - GIVEN: 有 my-post 的会话
          - WHEN: 同源 GET /dsh-writing-viewer/review/ 或 GET /dsh-writing-viewer/review/index.html
          - THEN: 返回 404，上游阅读页服务没有收到请求
        proxy-feedback:
          - GIVEN: 同上，draft.md 含「连接池很重要」一次
          - WHEN: '同源 POST /dsh-writing-viewer/review/feedback（不带 X-WA-Token）：{unit: my-post, quote: 连接池很重要, text: 补一个例子}'
          - THEN: 返回 200，feedback.id 为 fb-1；wa-cli feedback list my-post --json 列出这条反馈
        proxy-no-session:
          - GIVEN: 没有进行中的会话
          - WHEN: 同源 GET /dsh-writing-viewer/review/page.json 或 POST /dsh-writing-viewer/review/feedback
          - THEN: 都返回可读的「没有进行中的审阅」JSON 提示，feedback.yaml 不被创建
        proxy-forged-token-ignored:
          - GIVEN: 有进行中的会话
          - WHEN: '同源 POST /dsh-writing-viewer/review/feedback 携带 X-WA-Token: forged'
          - THEN: 上游收到的是会话令牌而非 forged，请求按正常反馈处理
        proxy-confirm-decision-channel:
          - GIVEN: 作品 my-post 的决策队列中有关联 my-post 的 open 决策 dec-1（选项 a、b），有 my-post 的审阅会话
          - WHEN: '同源 POST /dsh-writing-viewer/review/confirm：{kind: decision, id: dec-1, option: a, confirmation: 作者：用甲}'
          - THEN: '返回 200，confirmation 的 kind 为 decision、id 为 dec-1、channel 为 preview；decisions.yaml 中该决策记录 channel: preview'
        proxy-illustration:
          - GIVEN: 有 my-post 的审阅会话，my-post 登记了可用的 PNG 配图 fig-1
          - WHEN: 同源 GET /dsh-writing-viewer/review/illustration?unit=my-post&id=fig-1&token=forged
          - THEN: 上游收到的是带会话令牌的 GET /illustration?unit=my-post&id=fig-1（不含 forged）；返回 200 与 image/png，正文与 illustrations/fig-1.png 的字节完全相同，响应中不出现阅读页令牌或 127.0.0.1 地址
        proxy-illustration-not-found:
          - GIVEN: 有 my-post 的审阅会话，my-post 没有 id 为 ghost 的配图
          - WHEN: 同源 GET /dsh-writing-viewer/review/illustration?unit=my-post&id=ghost
          - THEN: 上游返回的 404 状态码与正文原样回传，响应中不含图片数据
        proxy-illustration-no-session:
          - GIVEN: 没有进行中的会话
          - WHEN: 同源 GET /dsh-writing-viewer/review/illustration?unit=my-post&id=fig-1
          - THEN: 返回可读的「没有进行中的审阅」JSON 提示，没有访问任何上游
    review-native-view:
      strength: MUST
      statement: 面板的单元详情必须提供「审阅」按钮；点击它或经 review-pending-discovery 的入口激活后，启动该单元的审阅会话（项目目录取面板当前显示的目录，含路径切换所选目录），成功后在详情区以 DSH 面板原生组件呈现审阅视图（Review View），不使用 iframe。视图内容取自同源代理的 page.json：按单元树先序列出单元引用与阶段，逐段显示正文与段落序号，按出处（human、agent、agent-draft-human-edited）区分标记并可切换着色，段落下列出文本检查与审稿发现项（标签、severity、说明与建议），全文级发现项、说明与最近失败的命令单列；单元有配图（Illustration，page.json 单元的 illustrations，见 preview 主规格的 preview-page-json）时，在引用配图的段落之后按该段 illustrations 的顺序以 img 节点显示图像：src 由面板以固定的同源代理路由 /dsh-writing-viewer/review/illustration 与 URL 编码的 unit、id 构造，不使用正文或 page.json 中的其他地址；alt 取替代文字，并以纯文本显示氛围图（Mood Image）或信息图（Infographic）、出处（agent 或 author）标记与信息图关联的论断和素材 id；作品根单元的封面图（Cover Image）显示在该单元开头并标「封面」；referenced 为 false 的正文配图在单元末尾列出并标「未引用」；available 为 false 的配图不加载图片，改为显示不可用说明；没有配图时视图与没有配图功能时相同。待作者确认区逐项显示说明、决策选项与推荐、原话摘要输入框与确认控件（可拒绝的事项另有拒绝控件，需要答复的决策提供答复输入）；strict 关卡下另显示待作者复核区（默认勾选的复选框与「复核所选」）；没有事项时显示与阅读页相同的空提示。作者在单个段落内选中文字后可提交反馈（文字与可选快捷标记 stuck、good、question），也可对整个单元提交反馈；选区为空、跨段落或在正文之外时不发出请求并提示。每次提交经代理 POST 到 wa-cli，成功后重新拉取 page.json 刷新视图；失败时显示 wa-cli 诊断的可读信息并保留作者已填写的内容。来自工作区的全部文字一律以纯文本显示，不解释其中的 HTML 或脚本。审阅视图随 DSH 明暗主题切换保持可读，并遵守 overview-theme-and-narrow 的窄屏布局。视图提供「刷新」与「结束审阅」按钮，结束后关闭视图并刷新快照。启动进行中显示可读提示；启动失败、审阅路由被请求来源校验拒绝（提示在插件配置 allowedHosts 中放行当前访问的权威，如 Tailscale MagicDNS 名与端口）或会话已结束时，显示可读原因与重新审阅入口，不显示空白视图。会话是否已结束由面板在每次拉取 page.json、窗口重新获得焦点或页面重新可见时查询会话状态路由判定（不调用 wa-cli），并比对会话摘要的 unit 与所审单元——会话不存在、属于其他单元或载荷缺失 unit 时按已结束处理。全部控件必须可经键盘激活
      scenarios:
        native-render:
          - GIVEN: 作品 my-post 正文两段（第一段出处 human、第二段 agent），第二段有一条 warning 级文本检查发现项，决策队列中有关联 my-post 的 open 决策 dec-1（选项 a、b，推荐 a）
          - WHEN: 作者在单元详情点「审阅」
          - THEN: 详情区出现审阅视图且页面中没有 iframe 元素；两段正文带不同的出处标记，第二段下列出该发现项；待作者确认区列出 dec-1、两个选项（a 带推荐标记）与原话摘要输入框
        native-feedback:
          - GIVEN: 同上，第一段含「连接池很重要」一次
          - WHEN: 作者在第一段选中「连接池很重要」，填写「补一个例子」并提交
          - THEN: wa-cli feedback list my-post --json 列出 quote 为「连接池很重要」、text 为「补一个例子」的反馈；视图随后重新拉取了 page.json
        native-confirm-decision:
          - GIVEN: 同 native-render
          - WHEN: 作者为 dec-1 选 a、填写原话摘要「作者：用甲」并确认
          - THEN: 'decisions.yaml 中 dec-1 已决定且记录 channel: preview；刷新后的待作者确认区不再列出 dec-1'
        native-author-review:
          - GIVEN: gate_level 为 strict，my-post 有一条经 cli 渠道写入的验收待作者复核
          - WHEN: 作者在审阅视图的待作者复核区保持默认勾选并点「复核所选」
          - THEN: author-reviews.yaml 记录该项、渠道为 preview；刷新后待作者复核区显示「没有待作者复核的确认」
        native-text-safety:
          - GIVEN: my-post 的一段正文为 <script>alert(1)</script><b>粗</b>
          - WHEN: 打开 my-post 的审阅视图
          - THEN: 该段按原文字符显示，脚本不执行，页面中不生成来自正文的 script 或 b 元素
        native-selection-invalid:
          - GIVEN: my-post 的审阅视图已打开
          - WHEN: 作者选中跨越第一段与第二段的文字后提交反馈
          - THEN: 面板不发出反馈请求，提示只在一个段落内选中文字或改为对整个单元提交，feedback.yaml 不变
        native-submit-failed:
          - GIVEN: my-post 的审阅视图已打开，作者为需要答复的决策填写了答复
          - WHEN: 提交时 wa-cli 返回 400 诊断
          - THEN: 视图显示诊断的可读信息，作者填写的答复仍保留在输入框中
        native-session-replaced:
          - GIVEN: 本标签页正在审阅 my-post，另一浏览器标签页随后启动了 other-post 的审阅
          - WHEN: 本标签页窗口重新获得焦点
          - THEN: 本标签页显示审阅已结束与重新审阅入口，不显示 other-post 的内容
        native-origin-rejected:
          - GIVEN: 作者经未在 allowedHosts 放行的权威访问，快照路由已放行而审阅路由被拒
          - WHEN: 作者点「审阅」
          - THEN: 单元详情显示在 allowedHosts 中放行当前权威的提示，不显示空白审阅视图
        native-end:
          - GIVEN: my-post 的审阅视图已打开
          - WHEN: 作者用键盘激活「结束审阅」
          - THEN: 审阅视图关闭，GET /dsh-writing-viewer/review-session 报告没有会话，快照已刷新
        native-illustrations:
          - GIVEN: 作品 my-post 根单元登记了封面图 cover，正文第 2 段引用可用的信息图 fig-1（origin 为 agent，claims 为 [c1]），另有未被引用的正文配图 fig-2
          - WHEN: 作者在单元详情点「审阅」
          - THEN: 单元开头显示封面图像并标「封面」；第 2 段之后有 alt 为 fig-1 替代文字的 img 节点，其 src 以 /dsh-writing-viewer/review/illustration?unit=my-post&id=fig-1 为地址，旁边显示「信息图」、出处 agent 与 c1；fig-2 在单元末尾标「未引用」；页面中没有 iframe 元素
        native-illustration-unavailable:
          - GIVEN: 正文引用的配图 fig-1 在 page.json 中 available 为 false
          - WHEN: 打开 my-post 的审阅视图
          - THEN: fig-1 处显示不可用说明，面板没有请求 /dsh-writing-viewer/review/illustration
        native-no-illustrations:
          - GIVEN: 作品 my-post 没有配图，page.json 中 illustrations 都为空数组
          - WHEN: 打开 my-post 的审阅视图
          - THEN: 视图中没有 img 节点，其余内容与 native-render 相同
  REMOVED: {}
