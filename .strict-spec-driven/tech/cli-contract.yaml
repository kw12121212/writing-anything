schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: cli-contract
  title: wa-cli 命令契约
  category: architecture
rules:
  registry-declared:
    strength: MUST
    statement: 每条 wa-cli 命令必须在 internal/cli 的命令注册表（Command Registry）中声明 name、summary、位置参数、flags、outputKeys 与 exitCodes，参数解析与 help 输出都只从注册表派生；参数类型为 bool、string 或 list（可重复出现、按出现顺序收集的多个取值）；不得绕过注册表单独解析参数。
    rationale: 注册表是 help --json、后续 MCP tools 生成与 Skill 命令校验的唯一依据，绕过它会使帮助与实际行为漂移。
    enforcement:
      method: test
      detail: internal/cli 的 TestRegistryConsistency 遍历 help --json：断言每条命令 --json 输出的顶层字段恰好等于声明的 outputKeys，声明的每个 flag 都被解析器接受，且 exitCodes 非空；未声明的参数由解析器拒绝（usage.unknown-flag）。list 参数由 TestParseListFlag 覆盖重复出现与顺序。
    examples:
      good:
        - 新增命令时在注册表加一项并声明其 flags 与 outputKeys
      bad:
        - 在某个命令的 run 函数里手写 for 循环解析 os.Args
  shared-envelope:
    strength: MUST
    statement: 命令的 --json 输出必须通过共享的输出信封（Output Envelope）类型写出，顶层始终含 valid、diagnostics、changedPaths；任何层级的数组字段（包括嵌套在命令专属字段中的数组，如 resolved.unitTypes[].children）都不得为 null，没有元素时为空数组；命令专属字段与之并列，且必须在 outputKeys 中声明。
    rationale: Agent 与 MCP 按同一形状解析所有命令输出；逐命令自定义 JSON 会破坏契约，嵌套数组为 null 同样会让按数组遍历的调用方出错。
    enforcement:
      method: test
      detail: internal/cli 的测试递归遍历 config resolved 的 JSON 输出，断言除可为 null 的对象字段外没有 null。
  stable-error-codes:
    strength: MUST
    statement: 诊断（Diagnostic）的错误码（Error Code）采用 <领域>.<kebab-case> 格式，以常量定义在产生它的包中；已发布的错误码不得改名、删除后复用或改变含义，新增错误码不得与已有错误码重名。
    rationale: Agent、MCP 与 Skill 依据错误码分支处理，改名或复用会让它们静默出错。
    enforcement:
      method: review
    examples:
      good:
        - usage.unknown-flag
      bad:
        - 把 usage.unknown-flag 改名为 usage.bad-flag
  exit-code-convention:
    strength: MUST
    statement: 命令只使用退出码（Exit Code）0（成功）、1（校验失败或执行失败）、2（用法错误），并在注册表的 exitCodes 中逐一声明含义。
    rationale: 统一退出码让脚本与 Agent 不解析输出也能判断结果类别。
    enforcement:
      method: test
  contract-literals-in-tests:
    strength: SHOULD
    statement: 测试断言错误码、JSON 输出键与退出码时使用规格中的字面量（如 "usage.unknown-flag"），不引用实现包中的常量。
    rationale: 以常量断言时，常量被改名或改值后测试会一并通过，stable-error-codes 就失去自动化防线。
    enforcement:
      method: review
    examples:
      good:
        - if d.Code != "usage.unknown-flag"
      bad:
        - if d.Code != codeUnknownFlag
  runnable-next:
    strength: MUST
    statement: 诊断的 next 中每一条都必须是可以直接粘贴到 shell 运行的完整命令：参数按 shell 规则加引号（internal/cli 的 shellCommand），不得包含 <value> 这类需要替换的占位符；需要作者给出取值时，在 message 中说明，next 给出 wa-cli help <command> --json 或列出每个允许取值的命令。
    rationale: Agent 会直接执行 next；占位符中的 < 与 > 会被 shell 当作重定向，可能截断或创建文件。
    enforcement:
      method: test
      detail: internal/cli 的 runWS 测试辅助函数断言每条工作区命令的诊断 next 都不含 < 或 >；TestShellCommandQuoting 覆盖带空格与单引号的参数。
    examples:
      good:
        - wa-cli config set gate_level strict --dir . --json
      bad:
        - wa-cli config set gate_level <value> --dir .
  sample-invocation:
    strength: MUST
    statement: 每条命令都必须在 internal/cli 的 sampleArgs 中登记一次成功的调用：只读命令，以及能以取值不变的方式成功的命令（如 config set 设为当前值、init 重复运行），登记不变更产物的调用；只能通过变更产物才能成功的命令（如 new、unit add、advance）登记一次在临时工作区中变更产物的调用，并在 mutatingSamples 中列出。工作区命令在临时工作区中通过 --dir 运行，测试不得在包目录中创建 .writing-anything/。
    rationale: TestRegistryConsistency 依靠这些调用检查 --json 输出键与声明一致；创建作品、追加单元与推进阶段的命令不存在不变更产物的成功调用，要求它们不变更产物会使这些命令无法登记；显式列出会变更产物的样例，测试才能对其 changedPaths 断言非空、对其他命令断言为空。不带 --dir 的工作区命令会在包目录中创建真实工作区。
    enforcement:
      method: test
      detail: TestRegistryConsistency 对 help --json 列出的每条命令调用 sampleArgs，缺少登记时测试失败；mutatingSamples 中的命令断言 changedPaths 为非空数组，其余命令断言为空数组。
    examples:
      good:
        - sampleArgs 为 advance 返回一个已有作品与 brief.yaml 的临时工作区中的 advance 调用，并把 advance 列入 mutatingSamples
      bad:
        - 为 new 登记一次会报告 work.exists 的失败调用，以满足不变更产物的要求
  workspace-dir-flag:
    strength: MUST
    statement: 读写工作区的命令都必须声明 internal/cli 共享的 --dir 参数（项目目录，默认当前目录），只在该目录下寻找 .writing-anything/，不向上查找父目录；找不到工作区时报告 workspace.not-found，next 为 wa-cli init --dir <dir> --json。
    rationale: 显式目录让命令行为确定、易于在进程内测试，也避免 Agent 在子目录中意外操作到上层的另一个工作区；统一的参数与诊断让 Agent 用同一套方式调用所有工作区命令。
    enforcement:
      method: review
    examples:
      good:
        - 'flags: []flagSpec{dirFlag}'
      bad:
        - 新命令用 os.Getwd() 向上逐级查找 .writing-anything/
  next-rechecks-problem:
    strength: SHOULD
    statement: 诊断 next 中给出的复查命令必须能重新检出该问题：涉及多个产物的问题（引用、合并、内置产物与工作区产物的冲突）给出整体校验 wa-cli validate --dir <dir> --json，不得给出只校验单个文件、会报告 valid 为 true 的命令；命令按自身改写 next（如指向 wa-cli help <command>）时，只改写由本次参数引起的问题，已有产物中存在的问题保留默认的复查命令。判断问题是否由本次参数引起时，按诊断字段是否为参数名（或其下标、子字段）的白名单判断，不以「字段不以产物内路径开头」推断：已有产物的根级问题（如 schema_version、未定义的字段）也属于已有产物。修改已有产物的命令在写前复查（修改后重新解析与校验）中发现、而修改前的产物本身合法的问题，同样由本次参数引起：诊断不填 path，字段换成对应的参数名，next 给出 wa-cli help <command> --json；能在修改前检查的参数取值（如只含空白的文本、重复的 id）应在修改前报告。
    rationale: Agent 按 next 复查；复查命令检不出问题时，Agent 会误以为问题已经解决；把已有产物的问题也改成查看用法，Agent 会反复调整参数而问题始终存在；以前缀排除会漏掉根级字段（fresh-context 审查在 decision add 与 claim add 中都复现）。写前复查的问题若带上产物路径，next 给出的单文件复查会报通过，因为文件并未写入（brief set 的审查复现）。
    enforcement:
      method: test
      detail: internal/cli 的测试对跨产物错误码断言 next 为整体校验并能重新检出；TestClaimAdd、TestFeedbackAdd 与 TestDecisionAdd 断言已有产物的问题（含根级字段）保留默认的复查命令。TestBriefSetRejects 断言空白文本、重复 id 等参数问题不填 path、next 为 wa-cli help brief set --json；internal/brief 的 TestSetRejects 断言写前复查问题的字段为参数名。
    examples:
      good:
        - paramField(d.Field, "question", "options", "id", "recommendation") 为真时才改写为 wa-cli help decision add --json
        - brief.Set 在写前复查失败时清空 path，把 key_messages[0].text 映射为 message-text
      bad:
        - '!strings.HasPrefix(d.Field, "decisions") 时改写 next，schema_version 的问题也被改成查看用法'
        - 写前复查失败时返回 path 为 brief.yaml 的诊断，next 为 wa-cli validate brief.yaml，复查报告 valid 为 true
  streaming-envelopes:
    strength: MUST
    statement: 持续输出事件的流式命令（如 feedback watch）在 --json 模式下每个事件输出一行完整的输出信封（valid、diagnostics、changedPaths 与声明的输出键），不得输出不带信封的裸对象；流式命令必须提供使其在输出指定条数后结束的参数（如 --max）与轮询间隔参数，以便在进程内测试并登记样例调用。
    rationale: Agent 与 MCP 用同一方式解析所有命令的输出，逐行信封让流式事件也符合 shared-envelope；可结束的参数让 TestRegistryConsistency 与行为测试不必启动子进程或依赖超时。
    enforcement:
      method: test
      detail: internal/cli 的 TestRegistryConsistency 以 --all --max 1 调用 feedback watch 并断言输出为一行信封；TestFeedbackWatch 在并发追加反馈时断言每行都是信封。
    examples:
      good:
        - feedback watch --max 1 --json 输出一行 {"valid":true,"diagnostics":[],"changedPaths":[],"feedback":{...}}
      bad:
        - feedback watch --json 每行只输出 {"id":"fb-2",...}
  invalid-value-code:
    strength: SHOULD
    statement: 参数取值不合法（如应为正整数、应为枚举取值）且不对应任何产物字段时，统一报告错误码 input.invalid-value，诊断不填 path，message 说明参数名、给出的取值与期望，next 为 wa-cli help <command> --json；取值写入产物字段时仍由 Schema 校验报告 artifact.schema-violation。
    rationale: Agent 依据错误码分支处理，同一类参数错误各命令各自造错误码会让分支逻辑膨胀；与写入产物的字段错误区分开，Agent 才知道该改参数还是改产物。
    enforcement:
      method: review
    examples:
      good:
        - feedback watch --interval 0 报告 input.invalid-value，next 为 wa-cli help feedback watch --json
      bad:
        - feedback watch --interval 0 报告 feedback.bad-interval
  precheck-before-side-effects:
    strength: MUST
    statement: 一条命令会写入多个产物时，必须在第一次写入之前完成全部可能失败的检查（包括针对已有产物的检查，如段落上限、写入记录的校验），领域包提供的预检查函数（如 draft.Precheck）与实际写入共用同一套检查；任一检查失败时所有产物逐字节不变，changedPaths 为空。只读命令不得因读到推导出的数据（如正文批注）而写文件，推导出的记录只在显式的变更命令中记入，并出现在该命令的 changedPaths 中。
    rationale: draft write 先记入批注再写正文，若只在写正文时才发现已有正文过大，feedback.yaml 已被修改而命令报告失败，Agent 看到的结果与工作区不一致（fresh-context 审查实测）；读取命令写文件会让 watch 轮询反复写入、changedPaths 失真。
    enforcement:
      method: test
      detail: internal/cli 的 TestRejectedWriteTouchesNothing 断言被拒绝与过大正文的 draft write 不创建 feedback.yaml；TestCommentFeedback 断言 feedback list 不创建 feedback.yaml。
    examples:
      good:
        - draft.Precheck 通过后才调用 feedback.ImportComments，再调用 draft.Write
      bad:
        - 先记入批注，draft.Write 发现现有正文过大后返回 draft.too-large
