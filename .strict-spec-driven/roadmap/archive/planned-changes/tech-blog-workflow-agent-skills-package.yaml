summary: 内置技能（Skill）与 wa-cli skills install
details: 提供少量稳定的 Skill：wa-init、wa-brief、wa-outline、wa-draft、wa-review、wa-revise、wa-publish、wa-auto。每个 Skill 只说明何时调用哪些 wa-cli 命令、何时必须停下来询问作者，不实现业务逻辑。Skill 文件用 embed 打包进二进制；wa-cli skills install --agent claude-code|codex 把它们写入对应 Agent 的技能目录。目录结构与通用 Agent Skills 格式兼容，因此也可以用第三方 skills 工具安装。测试校验 Skill 元数据格式，以及每个 Skill 引用的 wa-cli 命令都存在于 help --json 中。
