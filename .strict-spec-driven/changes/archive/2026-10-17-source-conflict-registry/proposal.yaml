schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: source-conflict-registry
  status: proposed
summary:
  what:
    - 设计提案：素材矛盾的登记与作者知情机制。两方案比选后由作者定案：A 新建冲突（Conflict）产物（conflicts.yaml + conflict add/waive 命令族 + 独立 advance 阻塞器）；B 决策队列（Decision Queue）子类型（矛盾登记为结构化决策 + lint 规则「正文引用未决矛盾任一方的说法即 error」）。本变更只形成提案与比选材料，实现另立变更
    - 方案 B 落地：decision add 增加结构化冲突（Conflict）载荷（--conflict-about 与两说各带素材 id 与引文），复用既有 decide/waiver/blocking/复核/preview 待确认区；lint 新规则 conflict-sources：open 冲突的任一方引文（规范化匹配，与 claim 覆盖同机制）出现在正文即 error；GLOSSARY 增加冲突（Conflict）词条
  why:
    - 下游实测两份素材对同一参数矛盾（InsideEVs「10 喷嘴」vs 腾讯/文学城「4 推进器」），工具无登记处，agent 只能在正文回避，作者对此不知情（反馈 P1-2【已验证】）——知情权与审计链双双缺失。上游复审对方案 A 有保留：与既有决策队列概念平行生长、重复
    - 下游实测素材矛盾无登记处、agent 正文回避、作者不知情（反馈 P1-2）；作者已定案方案 B（决策子类型，零新机制）与引文匹配粒度
scope:
  in:
    - .strict-spec-driven/changes/source-conflict-registry/ 全部规划产物；实现范围（供后续变更，视方案而定）：新产物 Schema 或决策结构扩展、登记命令、lint 联动规则、advance 阻塞、preview 展示
    - internal/schema/schemas/decisions.schema.json（可选 conflict 载荷）；internal/decision（结构化载荷与校验）；internal/cli/decisions.go 的 add 参数与视图、preview_confirm 的确认队列 Detail；internal/lint 新规则 conflict-sources 与内置文体的规则声明；decisions 与 lint 主规格；docs/GLOSSARY.md
  out:
    - 实现代码（本变更不写）；素材侧自动矛盾检测（语义比对不可行，登记靠 agent 发现 + 作者确认）；对已导出内容的追溯改写
    - conflicts.yaml 新产物与独立命令族（方案 A，作者已否）；「引用被否定一方」的 decided 后检查（留待后续）；素材侧自动矛盾检测；advance 阻塞的新机制（复用既有 blocking 决策）
unchanged_behavior:
  - 不引入登记机制前的全部行为（本变更零代码）
  - 不带冲突载荷的 decision add 行为与 decisions.schema 既有字段；既有 lint 规则；decide/waiver/复核/preview 对普通决策的行为；advance 的阻塞规则
roadmap:
  milestone: boundary-semantics-silent-failure
  planned_change: source-conflict-registry
