schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: export
  title: 导出（Export）
requirements:
  export-markdown:
    strength: MUST
    statement: 'wa-cli export <work> [--format markdown] 必须把作品中验收记录有效的单元导出为一个 Markdown 文件：按单元树先序（根单元在前）拼接各单元的 draft.md，单元之间空一行，文件以换行结尾；去掉作者批注（<!-- 之后为 @me: 或 @me(kind): 且有非空文字的注释，可以跨行但不能跨空行、不能包含另一个 <!--，与作者反馈的批注一致）与单处豁免注释（与文本检查一致：内容为 lint-ignore <规则 id>: 理由，注释到其后第一个 -->，行首的注释可以跨空行，不在行首的不能）；没有对应 --> 或不满足这些条件的写法不是注释，原样保留；去掉后只剩空白的行整行去掉，不因此留下连续空行，注释一直延伸到行尾时去掉它之前留下的行尾空白，其余空白（如 Markdown 行尾两个空格的硬换行）原样保留；围栏代码块与行内代码（识别与文本检查、作者反馈一致：围栏的结束行为同一字符且长度不短于开头，行内代码为 n 个反引号到之后恰好 n 个反引号）及其他 HTML 注释原样保留；各单元正文开头的 BOM 去掉，CRLF 换成 LF。正文超过 2 MiB 的单元不导出（同 export.unaccepted）。验收记录有效指单元目录下有 acceptance.yaml、通过校验、draft_sha256 与当前正文一致、gate_level 不比工作区当前的关卡强度宽松（见 units-and-lifecycle 主规格的 advance-stage），且单元有配图（Illustration，含封面图（Cover Image），见 illustrations 主规格的 illustration-add 与 illustration-cover）时 illustrations_sha256 等于当前的配图摘要、没有配图时 illustrations_sha256 为 null 或缺省（见 illustrations 主规格的 illustration-digest）。没有正文或验收无效的单元不导出，各给出一条 warning 级 export.unaccepted（path 为单元目录，next 包含 wa-cli review show <unit> --dir <dir> --json）；没有任何可导出的单元时报告 export.nothing-accepted（next 包含 wa-cli next --dir <dir> --json），不写文件，退出码为 1。给出 --front-matter 时在开头附带 YAML 文件头元数据（Front Matter），依次含 title（依次取根单元 marketing.yaml 中标题决策状态为 decided 时选定的标题（见 marketing 主规格的 marketing-show；决策队列无法加载、marketing.yaml 缺失或状态不是 decided 时视为没有选定标题）、第一个导出单元正文中围栏代码块之外的第一个一级标题，结尾的 # 只在与文字之间有空白时视为关闭序列；都没有时为作品 id）、description（依次取根单元 marketing.yaml 的 digest 与根单元写作简报的 purpose，都没有时省略）、genre、units 与 accepted_at（导出单元中最晚的验收时间），导出的配图中有封面时再含 cover（封面在资产目录中的路径，相对导出文件），有 AI 参与说明且放置位置含 metadata 时再含 ai_disclosure（见 ai-disclosure）。有 AI 参与说明且放置位置含 footer 时，在正文末尾追加一个空行、一行 ---、一个空行与说明文字。导出单元正文中的本地配图引用（Local Illustration Reference，识别见 illustrations 主规格的 illustration-references）所指的已登记配图，以及根单元被导出时作品根单元登记的封面，必须复制到导出文件同目录的资产目录（Asset Directory）：目录名为导出文件名去掉最后一个扩展名（没有扩展名时为整个文件名）加 .assets（如 .writing-anything/exports/post.assets/）；资产文件名在根单元的配图为 <work>.<配图 id>.<扩展名>，在子单元的配图为 <work>.<单元 id>.<配图 id>.<扩展名>（扩展名为登记的 png 或 jpg；id 不含点号，因此不同单元的同名配图不会冲突），内容与工作区中的图片字节相同；同一配图被引用多次时只复制一次。正文中这些引用的地址改写为 <资产目录名>/<资产文件名>（相对导出文件），替代文字、标题与其余字节不变；围栏代码块、行内代码与 HTML 注释中的写法、外部地址（如 http 与 https）的图片以及没有对应登记项的本地配图引用原样保留，不复制。资产目录与图片文件的路径检查与写入见 export-output。成功时 --json 输出的 export 含 work、format、path、units（导出的单元引用，按顺序）、skipped（每项含 unit 与 reason）、chars、images（Markdown 格式为空数组）、imageList（Markdown 格式为 null）与 assets（复制到资产目录的配图，封面在前、其余按在导出正文中首次被引用的顺序；每项含 unit（单元引用）、id、role（body 或 cover）、origin（agent 或 author）、source（工作区中的图片路径）与 path（资产文件路径），都为相对项目目录的路径；没有时为空数组），changedPaths 依次为新建的目录、导出文件、新建的资产目录与写入的资产文件（按 assets 的顺序），退出码为 0。没有本地配图引用且没有导出封面时不创建资产目录，导出文件与 changedPaths 与没有配图登记时相同。--format 不是 markdown、wechat-html（见 wechat-html-export）或 text（见 plain-text-export）时报告 input.invalid-value（field 为 format）；<work> 是子单元引用时报告 work.not-found（field 为 work）；这些情况不写文件，退出码为 1。'
    scenarios:
      front-matter-decided-headline:
        - GIVEN: wechat-marketing 作品 post 已验收，正文没有一级标题，根单元 marketing.yaml 的标题决策状态为 decided（选定候选的文字「三步搞定连接池」），digest 为「一篇讲连接池的短文」
        - WHEN: 运行 wa-cli export post --front-matter --dir D --json
        - THEN: front matter 的 title 为「三步搞定连接池」、description 为「一篇讲连接池的短文」，退出码为 0
      front-matter-stale-fallback:
        - GIVEN: 同 front-matter-decided-headline，但标题候选的文字在决策之后被改过（标题决策状态为 stale），正文首个一级标题为「连接池实战」
        - WHEN: 运行 wa-cli export post --front-matter --dir D --json
        - THEN: front matter 的 title 为「连接池实战」，description 仍为 digest「一篇讲连接池的短文」，退出码为 0
      export-accepted:
        - GIVEN: 作品 my-post 已验收，子单元 intro 没有验收
        - WHEN: 运行 wa-cli export my-post --output dist/post.md --dir D --json
        - THEN: dist/post.md 只含 my-post 的正文；diagnostics 中有一条 severity 为 warning、错误码为 export.unaccepted、path 为 .writing-anything/works/my-post/units/intro 的诊断；changedPaths 为 [dist, dist/post.md]，退出码为 0
      nothing-accepted:
        - GIVEN: 作品 my-post 没有验收
        - WHEN: 运行 wa-cli export my-post --dir D --json
        - THEN: diagnostics 中有一条错误码为 export.nothing-accepted 的诊断，没有写出文件，退出码为 1
      strip-process-comments:
        - GIVEN: '已验收单元的正文含独占一行的 <!-- lint-ignore ai-cliche: 引用原话 --> 与行尾的 <!-- @me: 太长 -->'
        - WHEN: 运行 wa-cli export my-post --dir D --json
        - THEN: 导出文件中没有这两处注释，独占一行的注释所在行被去掉
      unclosed-annotation:
        - GIVEN: '已验收单元的正文为「段落 A。<!-- @me: 这里太长」、空行、「段落 B。」'
        - WHEN: 运行 wa-cli export my-post --dir D --json
        - THEN: 导出文件含段落 A 与段落 B 的全部文字（漏写 --> 的不是批注）
      copy-illustrations:
        - GIVEN: 作品 post 的根单元登记了正文配图 shop（jpg，origin 为 agent）与封面 cover（jpg，origin 为 agent），正文含 ![店门口](illustrations/shop.jpg "周六的店")，已验收
        - WHEN: 运行 wa-cli export post --front-matter --dir D --json
        - THEN: '导出文件中该引用为 ![店门口](post.assets/post.shop.jpg "周六的店")，front matter 含 cover: post.assets/post.cover.jpg；.writing-anything/exports/post.assets/ 下的 post.cover.jpg 与 post.shop.jpg 与工作区中的图片字节相同；export.assets 依次为 cover 与 shop，images 为空数组、imageList 为 null；changedPaths 在导出文件之后依次含 .writing-anything/exports/post.assets、post.cover.jpg 与 post.shop.jpg 的路径，退出码为 0'
      child-unit-asset-name:
        - GIVEN: 作品 post 的根单元与子单元 intro 都已验收，两者各登记了 id 为 fig 的正文配图并在正文中引用
        - WHEN: 运行 wa-cli export post --dir D --json
        - THEN: 资产目录中有 post.fig.jpg 与 post.intro.fig.jpg 两个文件，两处引用分别改写为对应路径，export.assets 有两项，退出码为 0
      illustration-replaced-after-accept:
        - GIVEN: 作品 post 只有根单元，已验收，之后用 wa-cli illustration add post --id shop --replace 换了一张图
        - WHEN: 运行 wa-cli export post --dir D --json
        - THEN: diagnostics 中有一条 warning 级 export.unaccepted（path 为 .writing-anything/works/post）与 export.nothing-accepted，不写导出文件与资产目录，退出码为 1
      no-illustrations-unchanged:
        - GIVEN: 作品 post 已验收，没有配图登记，正文含外部图片 ![图](https://example.com/a.png) 与写在行内代码中的 `![x](illustrations/x.jpg)`
        - WHEN: 运行 wa-cli export post --dir D --json
        - THEN: 两处写法原样保留，没有创建 .writing-anything/exports/post.assets，export.assets 为空数组，changedPaths 只含新建的目录与导出文件，退出码为 0
  export-output:
    strength: MUST
    statement: wa-cli export 的 --output 必须是相对项目目录（--dir）的文件路径，省略时为 .writing-anything/exports/<work>.md（--format wechat-html 时为 .writing-anything/exports/<work>.html；配图清单的路径同样经过这些检查）；绝对路径、含反斜杠、规整后离开项目目录、以 / 结尾，或落在工作区 .writing-anything/ 之中但不在 .writing-anything/exports/ 之下（导出不能覆盖工作区产物；按不区分大小写比较，写入前再按文件身份确认途经的工作区目录之下只能是 exports）时报告 export.invalid-output（field 为 output，next 包含 wa-cli help export --json）；输出文件所在的每一级目录都必须是真实目录（不存在时逐级创建），已存在的输出文件必须是普通文件，途经或指向符号链接时报告 export.invalid-output，path 为出问题的路径。资产目录（见 export-markdown）与其中的资产文件经过同样的检查：资产目录必须是真实目录（不存在时创建），已存在的资产文件必须是普通文件，途经或指向符号链接（按文件身份确认）时报告 export.invalid-output，path 为出问题的路径；导出文件、配图清单、资产目录与全部资产文件的路径都在创建任何目录或写入任何文件之前检查，任一不通过时不写任何文件，退出码为 1。资产目录中已有的其他文件不删除。读取工作区中的配图时不跟随符号链接。导出文件与资产文件原子写入，已存在时覆盖。
    scenarios:
      output-outside:
        - GIVEN: 作品 my-post 已验收
        - WHEN: 运行 wa-cli export my-post --output ../x.md --dir D --json
        - THEN: diagnostics 中有一条错误码为 export.invalid-output 的诊断，项目目录之外没有新文件，退出码为 1
      output-workspace-artifact:
        - GIVEN: 作品 my-post 已验收
        - WHEN: 运行 wa-cli export my-post --output .writing-anything/config.yaml --dir D --json
        - THEN: diagnostics 中有一条错误码为 export.invalid-output 的诊断，config.yaml 不变，退出码为 1
      output-symlink:
        - GIVEN: 项目目录下的 link 是指向项目目录之外的符号链接
        - WHEN: 运行 wa-cli export my-post --output link/post.md --dir D --json
        - THEN: diagnostics 中有一条错误码为 export.invalid-output、path 为 link 的诊断，链接目标中没有新文件，退出码为 1
      asset-dir-symlink:
        - GIVEN: 作品 post 已验收且有导出封面，.writing-anything/exports/post.assets 是指向项目目录之外的符号链接
        - WHEN: 运行 wa-cli export post --dir D --json
        - THEN: diagnostics 中有一条错误码为 export.invalid-output、path 为 .writing-anything/exports/post.assets 的诊断，没有写出 post.md，链接目标中没有新文件，退出码为 1
  tech-blog-e2e:
    strength: MUST
    statement: 用 internal/cli/testdata/e2e 中的作者素材（author-note、interview 与 reference 各一份）、正文与审稿输入，必须能只通过 wa-cli 命令在 tech-blog 文体、strict 关卡强度下完成一篇技术博客：init、new、source add、brief set、advance、按写作法角色 outline set、advance、draft write、claim add、lint（没有 error 级发现项）、advance、review record、review resolve、accept（缺少作者确认时被拒绝，给出确认后通过）、advance 到 done，最后 export --front-matter 得到与 testdata/e2e/export.md 逐字节相同的文件，之后 validate 通过。
    scenarios:
      blog-to-markdown:
        - GIVEN: internal/cli/testdata/e2e 中的作者素材、正文、审稿输入与期望的导出文件
        - WHEN: 按需求中的顺序运行 wa-cli 命令（验收时间固定为 2026-10-01T09:30:00Z）
        - THEN: 每个命令的退出码都为 0（缺少确认的 accept 为 1）；导出的 .writing-anything/exports/pool.md 与 testdata/e2e/export.md 逐字节相同
  wechat-html-export:
    strength: MUST
    statement: 'wa-cli export <work> --format wechat-html 必须按 export-markdown 选出验收记录有效的单元、去掉作者批注与单处豁免注释，把各单元正文（单元之间空一行）转成一个只含内联样式（Inline Style）的 HTML 片段：最外层为一个 section；识别围栏代码块（识别同文本检查）为 pre、ATX 标题（1 至 3 个 # 为 h1 至 h3，更多为 h4）、以 > 开头的引用块为 blockquote、以 - * + 或「数字.」开头的列表项为 ul 或 ol 中的 li（一层，缩进的后续行并入上一项）、由 3 个以上 - * 或 _ 组成的行为 hr、其余由空行分隔的行为 p（行尾两个空格或反斜杠为 br）；行内的行内代码为 code，**文字** 与 __文字__ 为 strong，*文字* 为 em。正文中的原始 HTML 与其他文字一律转义，不跨越空行的已闭合 HTML 注释去掉（跨越空行的按文字输出），不支持的写法（如表格）按段落文字输出；_ 在单词（含汉字）中间时不是强调。输入规模有界：引用块嵌套超过 8 层时更深的 > 按文字处理，强调嵌套超过 16 层时按文字处理，链接文字与图片的替代文字、标题各至多 1000 个字符、地址至多 1000 字节，超过时按文字输出；正文上限 2 MiB 内的输入在线性时间内完成。图片 ![替代文字](地址 "标题") 输出为第 n 个配图（Illustration）的占位：独占一段时为一个带「【配图 n】替代文字」与说明（标题，没有时为地址）的 section 块，否则为行内文字「【配图 n：替代文字】」；链接 [文字](地址) 输出为文字加 sup 脚注编号「[k]」，存在链接时文末追加一个参考链接段落，按编号列出地址文字；有 AI 参与说明且放置位置含 footer 时，最后再追加一个说明段落（样式同参考链接，见 ai-disclosure）。输出只能含 section、h1、h2、h3、h4、p、strong、em、code、pre、blockquote、ul、ol、li、hr、br 与 sup 标签，每个标签只能有 style 属性（br 与 sup 之外都带 style），不得含 script、style 或 link 元素、class、id、href、src 或事件属性；style 取自合并后的 htmlTheme（见 genres-and-packs 主规格的 pack-html-theme），渲染时再按同样的取值格式检查一次，不符合的取值输出为空的 style。正文中的本地配图引用与根单元的封面按 export-markdown 复制到资产目录（HTML 中的占位与编号规则不变，编号只计正文中的图片）。存在配图或导出封面时在导出文件同目录写出配图清单（Image List）：文件名为导出文件去掉 .html 后缀（没有时为整个文件名）加 .images.md，内容为标题「配图清单」与按编号的列表（替代文字、地址与标题）；有导出封面时在编号列表之前先列一个「封面」项（替代文字与资产文件相对配图清单的路径）；对已复制到资产目录的配图，编号项另列资产文件相对配图清单的路径；origin 为 agent 的封面与配图另标注「AI 生成」。清单的写法：封面项为一行「- 封面：<替代文字>；文件：<资产路径>」，origin 为 agent 时末尾加「；AI 生成」，其后空一行；编号项在原有内容之后依次追加「；文件：<资产路径>」与「；AI 生成」；编号按正文中图片出现的顺序与资产对应。没有配图登记时清单内容与只有替代文字、地址与标题时相同。成功时 export.format 为 wechat-html，images 为正文配图数组（每项含 index、alt、src（正文中写的地址）与 title，正文没有图片时为空数组），assets 同 export-markdown，imageList 为配图清单的路径（正文没有图片且没有导出封面时为 null，不写清单文件；只有封面时 images 为空数组而 imageList 不为 null），changedPaths 依次为新建的目录、导出文件、配图清单、新建的资产目录与写入的资产文件；全部路径都在创建任何目录或写入之前检查（见 export-output）。不写清单时已有的同名清单文件不删除。--front-matter 与 --format wechat-html 同时给出时报告 input.invalid-value（field 为 front-matter），不写文件，退出码为 1。'
    scenarios:
      only-inline-styles:
        - GIVEN: 作品 post 已验收，正文含标题、段落、加粗、行内代码、围栏代码块、引用、列表、链接与 <script>alert(1)</script>
        - WHEN: 运行 wa-cli export post --format wechat-html --dir D --json
        - THEN: 导出文件为 .writing-anything/exports/post.html；其中每个标签都属于允许列表、只有 style 属性；不含 <script、class=、href= 与 <style；<script>alert(1)</script> 以转义后的文字出现；链接文字后有 [1]，文末的参考链接列出该地址；退出码为 0
      image-placeholders:
        - GIVEN: 同上，正文有独占一段的 ![店内实拍](shop.jpg "周六的店") 与行内的 ![图标](icon.png)
        - WHEN: 运行 wa-cli export post --format wechat-html --dir D --json
        - THEN: 导出文件含「【配图 1】店内实拍」与说明「周六的店」的 section 块和行内的「【配图 2：图标】」；.writing-anything/exports/post.images.md 列出两张配图；export.images 有两项，imageList 为该路径，changedPaths 含两个文件
      wechat-front-matter:
        - GIVEN: 作品 post 已验收
        - WHEN: 运行 wa-cli export post --format wechat-html --front-matter --dir D --json
        - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 front-matter 的诊断，不写文件，退出码为 1
      changed-dirs:
        - GIVEN: 作品 post 已验收，正文有配图，dist/ 不存在
        - WHEN: 运行 wa-cli export post --format wechat-html --output dist/sub/post.html --dir D --json
        - THEN: changedPaths 依次为 dist、dist/sub、dist/sub/post.html 与 dist/sub/post.images.md，退出码为 0
      unsafe-theme-value-dropped:
        - GIVEN: 样式主题的取值含 onclick、url(、引号、$1 等不符合取值格式的内容
        - WHEN: 渲染公众号 HTML
        - THEN: 这些元素的 style 为空，输出只含允许的标签与 style 属性
      wechat-cover-and-local:
        - GIVEN: 作品 post 已验收，根单元登记了封面 cover（origin 为 agent）与正文配图 shop（origin 为 agent），正文有独占一段的 ![店门口](illustrations/shop.jpg) 与行内的外部图片 ![图标](https://example.com/icon.png)
        - WHEN: 运行 wa-cli export post --format wechat-html --dir D --json
        - THEN: 导出文件含「【配图 1】店门口」与「【配图 2：图标】」；post.images.md 先列「封面」项（替代文字、post.assets/post.cover.jpg 与「AI 生成」），配图 1 另列 post.assets/post.shop.jpg 与「AI 生成」，配图 2 没有资产路径与 AI 标注；export.images 两项的 src 为 illustrations/shop.jpg 与外部地址，export.assets 依次为 cover 与 shop，退出码为 0
      wechat-cover-only:
        - GIVEN: 作品 post 已验收，正文没有图片，根单元登记了封面 cover
        - WHEN: 运行 wa-cli export post --format wechat-html --dir D --json
        - THEN: export.images 为空数组，imageList 为 .writing-anything/exports/post.images.md，清单只含「封面」项，资产目录中有 post.cover.jpg，退出码为 0
  ai-disclosure:
    strength: MUST
    statement: wa-cli export 必须按导出单元的段落出处（见 sources-and-provenance 主规格的 provenance-derivation）汇总 AI 参与情况：出处为 agent 或 agent-draft-human-edited 的段落为 AI 参与段落；单元有写入记录但无法推导出处时给出一条 warning 级 export.unknown-provenance（path 为该单元的 provenance.yaml，next 包含 wa-cli provenance <unit> --dir <dir> --json），并把该单元的全部段落算作 AI 参与；没有写入记录的单元全部出自作者（即使其正文超过出处推导的段落上限）。段落数与字数按 draft.md 的段落（见 paragraph-model）计算；只由本地配图引用（见 illustrations 主规格的 illustration-references）与空白组成的段落是插入的配图位置，不计入段落数与字数，也不算 AI 参与段落（配图按下面的配图数计入）。导出的配图（export.assets 中的每一项）中 origin 为 agent 的张数记为 AI 配图数，assets 的项数记为配图数。导出的单元中有 AI 参与段落或 AI 配图数大于 0 时生成 AI 参与说明（AI-generated Content Label），否则不生成。有 AI 参与段落时正文说明为合并结果中的模板（规范包的 ai_disclosure_template，后面的规范包覆盖前面的；都没有时为内置模板「本文在 AI 辅助下完成：约 {ai_percent}% 的内容由 AI 起草，均经作者审阅确认。」，来源为 default）替换占位符后的文字：{ai_percent} 为 AI 参与段落的字数占全部段落字数的百分比（四舍五入为整数），{ai_paragraphs} 与 {paragraphs} 为 AI 参与段落数与全部段落数；模板必须是不超过 500 个字符的一行非空文字且只能含这三个占位符，否则 wa-cli validate 与 wa-cli config resolved 报告 artifact.schema-violation（field 为 ai_disclosure_template），以退出码 1 退出。AI 配图数大于 0 时配图说明为合并结果中的配图模板（规范包的 ai_disclosure_image_template，后面的规范包覆盖前面的；都没有时为内置模板「文中 {ai_images} 张配图由 AI 生成。」，来源为 default）替换占位符后的文字：{ai_images} 为 AI 配图数，{images} 为配图数；配图模板必须是不超过 200 个字符的一行非空文字且只能含这两个占位符，否则 wa-cli validate 与 wa-cli config resolved 报告 artifact.schema-violation（field 为 ai_disclosure_image_template），以退出码 1 退出。说明文字为正文说明后直接接配图说明（中间不加空格）；只有其中一项时为该项。放置位置为 config.yaml 的 ai_disclosure：footer（文末声明）、metadata（导出元数据）或 both（两者都用），未设置时为 both；Markdown 与 wechat-html 的具体放置见 export-markdown 与 wechat-html-export。--json 输出的 export.disclosure 在生成说明时含 text、placement、aiParagraphs、paragraphs、aiPercent、aiImages（AI 配图数）与 images（配图数），不生成时为 null。
    scenarios:
      agent-paragraphs:
        - GIVEN: 作品 post 的正文由 wa-cli draft write 写入（两段都出自 agent），已验收，config.yaml 没有 ai_disclosure
        - WHEN: 运行 wa-cli export post --front-matter --dir D --json
        - THEN: export.disclosure 的 placement 为 both、aiParagraphs 与 paragraphs 都为 2、aiPercent 为 100；导出文件的 front matter 含 ai_disclosure，正文末尾有 --- 与说明文字，退出码为 0
      human-only:
        - GIVEN: 作品 post 的 draft.md 由作者直接写入（没有写入记录），已验收
        - WHEN: 运行 wa-cli export post --front-matter --dir D --json
        - THEN: export.disclosure 为 null，front matter 不含 ai_disclosure，正文末尾没有说明
      edited-paragraph:
        - GIVEN: 正文由 Agent 写入两段，作者改写了其中一段并另加一段，之后验收
        - WHEN: 运行 wa-cli export post --dir D --json
        - THEN: disclosure.aiParagraphs 为 2（agent 与 agent-draft-human-edited 各一段），paragraphs 为 3
      footer-only-wechat:
        - GIVEN: 同 agent-paragraphs，config.yaml 的 ai_disclosure 为 footer，规范包 brand 的 ai_disclosure_template 为「AI 参与了 {ai_paragraphs}/{paragraphs} 段」
        - WHEN: 运行 wa-cli export post --format wechat-html --dir D --json
        - THEN: HTML 的最后一个段落为「AI 参与了 2/2 段」，disclosure.placement 为 footer、text 为该文字
      bad-template:
        - GIVEN: 规范包 brand 的 ai_disclosure_template 为「{model} 写的」
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有一条错误码为 artifact.schema-violation、field 为 ai_disclosure_template 的诊断，退出码为 1
      unknown-provenance:
        - GIVEN: 作品 post 已验收，之后 provenance.yaml 被改坏而 draft.md 未变
        - WHEN: 运行 wa-cli export post --dir D --json
        - THEN: diagnostics 中有一条 warning 级 export.unknown-provenance，disclosure 的 aiParagraphs 等于 paragraphs，退出码为 0
      totals-and-rounding:
        - GIVEN: 作品 post 的根单元两段出自 Agent（共 8 字），子单元 intro 一段由作者直接写入（5 字），两者都已验收，ai_disclosure 为 footer
        - WHEN: 运行 wa-cli export post --front-matter --dir D --json
        - THEN: disclosure 的 aiParagraphs 为 2、paragraphs 为 3、aiPercent 为 62；front matter 不含 ai_disclosure，正文末尾为 --- 与说明
      large-human-draft:
        - GIVEN: 作者直接写入（没有写入记录）的正文有 10001 个段落，已验收
        - WHEN: 运行 wa-cli export post --dir D --json
        - THEN: disclosure 为 null，没有 export.unknown-provenance
      ai-images-appended:
        - GIVEN: 同 agent-paragraphs，根单元另登记了封面 cover 与正文配图 shop（origin 都为 agent，shop 在正文中被引用），config.yaml 的 ai_disclosure 为 footer
        - WHEN: 运行 wa-cli export post --dir D --json
        - THEN: 正文末尾的说明为「本文在 AI 辅助下完成：约 100% 的内容由 AI 起草，均经作者审阅确认。文中 2 张配图由 AI 生成。」，disclosure 的 aiImages 与 images 都为 2，退出码为 0
      ai-images-only:
        - GIVEN: 作品 post 的 draft.md 由作者直接写入（没有写入记录）并引用了 origin 为 author 的正文配图 photo，根单元另登记了 origin 为 agent 的封面 cover，已验收
        - WHEN: 运行 wa-cli export post --dir D --json
        - THEN: disclosure.text 为「文中 1 张配图由 AI 生成。」，aiParagraphs 为 0、aiPercent 为 0、aiImages 为 1、images 为 2，退出码为 0
      image-template-override:
        - GIVEN: 同 ai-images-only，规范包 brand 的 ai_disclosure_image_template 为「{ai_images}/{images} 张图由 AI 绘制」
        - WHEN: 运行 wa-cli export post --dir D --json
        - THEN: disclosure.text 为「1/2 张图由 AI 绘制」
      bad-image-template:
        - GIVEN: 规范包 brand 的 ai_disclosure_image_template 为「{model} 画的」
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有一条错误码为 artifact.schema-violation、field 为 ai_disclosure_image_template 的诊断，退出码为 1
      image-only-paragraphs-not-counted:
        - GIVEN: 作品 post 的正文全部出自作者（没有写入记录之外的 Agent 段落），Agent 用 draft write 只插入了一段 ![店内一角](illustrations/shop.jpg)，shop 的 origin 为 agent，作品已验收
        - WHEN: 运行 wa-cli export post --dir D --json
        - THEN: export.disclosure.aiParagraphs 为 0，paragraphs 不含配图引用段落，text 只含配图说明「文中 1 张配图由 AI 生成。」
  plain-text-export:
    strength: MUST
    statement: 'wa-cli export <work> --format text 必须按 export-markdown 同样的规则选出验收记录有效的单元、去掉作者批注与单处豁免注释、去掉各单元正文开头的 BOM、CRLF 换成 LF，按单元树先序拼接各单元正文（单元之间空一行，文件以换行结尾），并把正文转为纯文本（Plain Text）：ATX 标题去掉行首的 1 至 6 个 # 与其后的空白，保留标题文字；行内代码与强调（**文字** 与 __文字__ 为加粗、*文字* 与 _文字_ 为斜体，_ 在单词中间时不是强调）只保留文字；链接 [文字](地址) 只保留文字，图片 ![替代文字](地址) 输出「【图：替代文字】」；引用块行去掉行首的 > 与其后的一个空格（没有空格时只去掉 >）；围栏代码块去掉开头与结束的围栏行，内容行原样保留；不跨越空行的已闭合 HTML 注释去掉（跨越空行的按文字输出）；其余文字原样保留。去掉标记后只剩空白的行整行去掉，连续的空行规整为一个；标记延伸到行尾时去掉它之前留下的行尾空白，其余空白（如行尾两个空格的硬换行）原样保留。AI 参与说明（AI-generated Content Label，见 ai-disclosure）在放置位置含 footer 时按 export-markdown 的文末格式追加；placement 为 metadata 或 both 时纯文本没有元数据位置，同样只按 footer 追加。--output 省略时为 .writing-anything/exports/<work>.txt，输出路径检查与原子写入同 export-output；图片占位是纯文字，没有配图清单；本地配图引用同样输出「【图：替代文字】」，不复制配图与封面、不创建资产目录，因而 AI 参与说明不计配图（见 ai-disclosure）。成功时 --json 输出的 export.format 为 text、images 为空数组、imageList 为 null、assets 为空数组，其余字段同 export-markdown，changedPaths 为新建的目录与导出文件，退出码为 0。--front-matter 与 --format text 同时给出时报告 input.invalid-value（field 为 front-matter），不写文件，退出码为 1。'
    scenarios:
      plain-text-content:
        - GIVEN: 已验收作品的正文含二级标题、加粗、行内代码、链接、引用块、围栏代码块与图片
        - WHEN: 运行 wa-cli export post --format text --dir D --json
        - THEN: '.writing-anything/exports/post.txt 的标题行没有 # 前缀，加粗与行内代码只剩文字，链接只剩链接文字，图片为「【图：替代文字】」，引用块行没有 > 前缀，代码内容保留且没有围栏行，退出码为 0'
      text-front-matter-rejected:
        - GIVEN: 作品 post 已验收
        - WHEN: 运行 wa-cli export post --format text --front-matter --dir D --json
        - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 front-matter 的诊断，不写文件，退出码为 1
      text-skips-unaccepted:
        - GIVEN: 作品 post 的根单元未验收，子单元 s1 已验收
        - WHEN: 运行 wa-cli export post --format text --dir D --json
        - THEN: 导出文件只含 s1 的正文，diagnostics 中有一条 warning 级 export.unaccepted（path 为根单元目录），退出码为 0
      text-ai-footer:
        - GIVEN: 作品 post 的正文全部由 Agent 起草且已验收，config.yaml 的 ai_disclosure 为 footer
        - WHEN: 运行 wa-cli export post --format text --dir D --json
        - THEN: 导出文件末尾为空行、一行 ---、空行与 AI 参与说明文字；export.disclosure 的 placement 为 footer，退出码为 0
      text-ignores-illustrations:
        - GIVEN: 作品 post 的正文由作者直接写入并含 ![店门口](illustrations/shop.jpg)，根单元登记了 shop 与 origin 为 agent 的封面 cover，已验收
        - WHEN: 运行 wa-cli export post --format text --dir D --json
        - THEN: 导出文件中该引用为「【图：店门口】」，没有创建 .writing-anything/exports/post.assets，export.assets 为空数组，disclosure 为 null，退出码为 0
  export-reopen-next:
    strength: MUST
    statement: wa-cli export 的各种导出格式（markdown、wechat-html、text）跳过某个单元时，若该单元可以被 wa-cli reopen 退回（stage 为 done 的非汇总单元，文体有需要验收的阶段，且验收失效或没有验收记录，见 units-and-lifecycle 主规格的 reopen-stage），其 warning 级 export.unaccepted 诊断的 next 必须依次为 wa-cli reopen <unit> --dir <dir> --json 与 wa-cli review show <unit> --dir <dir> --json；其他被跳过的单元（包括验收仍有效、只因其他原因被跳过的 done 单元）仍只给出 wa-cli review show <unit> --dir <dir> --json。导出对验收失效单元的拒绝不变。
    scenarios:
      export-done-stale-next:
        - GIVEN: 作品 my-post（minimal）已验收并推进到 done，之后用 wa-cli draft write 修改了正文
        - WHEN: 运行 wa-cli export my-post --format wechat-html --dir D --json
        - THEN: diagnostics 中有一条 warning 级 export.unaccepted（path 为 .writing-anything/works/my-post），其 next 依次为 wa-cli reopen my-post --dir D --json 与 wa-cli review show my-post --dir D --json；另有 export.nothing-accepted，不写导出文件，退出码为 1
      export-done-oversized-next:
        - GIVEN: 作品 my-post（minimal）已验收并推进到 done，验收有效，但正文超过导出的字节上限
        - WHEN: 运行 wa-cli export my-post --dir D --json
        - THEN: export.unaccepted 的 next 只含 wa-cli review show my-post --dir D --json，不含 wa-cli reopen
  paste-html-export:
    strength: MUST
    statement: 'wa-cli export <work> --format paste-html 必须按 export-markdown 选出验收记录有效的单元（跳过单元的诊断同 export-markdown 与 export-reopen-next，没有可导出单元时报告 export.nothing-accepted、不写任何文件、退出码为 1），去掉作者批注与单处豁免注释，写出一个可粘贴页（Paste-ready Page）：一个完整的 HTML 文档，--output 的规则同 export-output，省略时为 .writing-anything/exports/<work>.paste.html，文件原子写入。页面的正文容器按 wechat-html-export 的规则渲染（同样的标签、样式主题与取值检查、转义、输入上限，链接转为脚注编号与文末参考链接），只有以下不同：独占一段、地址为可用本地配图（已登记、文件存在、SHA-256 与登记一致、格式为 PNG 或 JPEG，见 illustrations 主规格）的图片输出为 img 元素——src 为 data:image/png 或 data:image/jpeg 的 data URI，alt 为替代文字，只带 src、alt 与 style 属性——其后为一个图说段落（标题，没有时为替代文字）。原始字节超过 1 MiB 的配图为粘贴重新编码：宽高之积超过 4000 万像素时不内嵌；否则缩到最长边不超过 1600 像素、在白底上合成后编码为 JPEG，依次尝试质量 85、75、65、55，仍超过 1 MiB 时最长边降到 1200、再到 900 重试，取第一个不超过 1 MiB 的结果以 data:image/jpeg 内嵌，都超过时不内嵌；资产目录与配图清单中仍为原图。内嵌按内嵌后的字节累计（同一张图只计一次），总量不超过 32 MiB，超出后的配图、不能内嵌的配图与其余图片（行内图片、外链地址）按 wechat-html-export 输出「【配图 n】」占位，编号只计正文中的图片、规则不变；根单元的封面图（Cover Image）不出现在页面中；页面始终不含 AI 参与说明（AI-generated Content Label），不受 ai_disclosure 设置影响，--json 的 export.disclosure 仍按 ai-disclosure 计算并报告。正文按内嵌图像分段：顶层块依次归入当前段，加入某块会使当前段的内嵌图像超过 7 张时从该块开始新段（单个块超过 7 张时独占一段），每段是一个独立的根 section，参考链接段落在最后一段。只有一段时，正文容器之外只有一个「复制图文」按钮与一行操作说明；有多段时，按段给出「复制第 n 段（图 a–b）」按钮，另有一个「复制全文」按钮，操作说明提示公众号每次粘贴最多 7 张图、需要分段粘贴。页面的 title 按统一的标题解析取值：依次取根单元 marketing.yaml 中标题决策状态为 decided 时选定的标题（见 marketing 主规格的 marketing-show；决策队列无法加载、marketing.yaml 缺失或状态不是 decided 时视为没有选定标题）、第一个导出单元正文的首个一级标题（同 export-markdown 的 front matter title）、作品 id。根单元有选定标题时，工具栏另有一个「复制标题」按钮，标题文字放在正文容器之外的单独标题容器中；根单元 marketing.yaml 有非空 digest 时，工具栏另有一个「复制摘要」按钮，摘要文字放在正文容器之外的单独摘要容器中；这两个按钮复用同一 data-copy 复制机制与脚本（把对应容器以 text/html 与 text/plain 两种格式写入剪贴板，失败时退回为选中后复制）。没有选定标题或没有 digest 时不显示对应按钮与容器。正文 HTML 不插入一级标题：公众号编辑器的标题与摘要输入框在正文之外，标题与摘要经上述按钮复制。点击按钮把对应段（或全文）的内容以 text/html 与 text/plain 两种格式写入剪贴板，剪贴板接口不可用或被拒绝时退回为选中对应内容后复制，并在页面上显示是否成功；页面只含一个内容固定、不随导出内容变化的 script 元素，带 Content-Security-Policy（default-src ''none''，只放行内联样式、data: 图片与按 SHA-256 哈希放行的该脚本），不引用任何外部资源，可以离线打开。正文中的本地配图与根单元封面按 export-markdown 复制到资产目录（导出文件去掉扩展名加 .assets），并按 wechat-html-export 的规则在导出文件同目录写出配图清单（导出文件去掉 .html 后缀加 .images.md），作为目标编辑器不接受内嵌图片时的兜底；--json 输出与 wechat-html 相同的 export 字段（含 path、images、assets、imageList 与 disclosure）。--front-matter 时报告 input.invalid-value（field 为 front-matter），不写文件，退出码为 1。不加 --json 时与其他格式一样输出说明行（导出路径、AI 参与说明统计、配图清单与资产目录）。'
    scenarios:
      paste-title-copy-buttons:
        - GIVEN: wechat-marketing 作品 post 已验收，正文没有一级标题，根单元 marketing.yaml 的标题决策状态为 decided（选定「三步搞定连接池」）且有非空 digest
        - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
        - THEN: 页面的 title 为「三步搞定连接池」；工具栏有「复制标题」与「复制摘要」按钮，标题与摘要文字各在正文容器 wa-article 之外的容器中；正文 HTML 不含因标题解析而插入的一级标题；页面其余结构、分段按钮与 CSP 不变，退出码为 0
      paste-no-headline-no-buttons:
        - GIVEN: tech-blog 作品 post 已验收（根单元没有 marketing.yaml），正文首个一级标题为「连接池实战」
        - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
        - THEN: 页面没有「复制标题」「复制摘要」按钮与对应容器，title 为「连接池实战」，页面其余内容与本变更之前相同，退出码为 0
      paste-embedded:
        - GIVEN: 作品 post 已验收，正文由 wa-cli draft write 写入（有 AI 参与段落），第 2 段为独占一段的 ![连接池示意](illustrations/fig-1.png "连接池")，fig-1 已登记且可用，根单元另登记了封面 cover，config.yaml 的 ai_disclosure 为 both
        - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
        - THEN: 退出码为 0；导出文件为 .writing-anything/exports/post.paste.html；正文容器含一个 src 以 data:image/png;base64, 开头、alt 为「连接池示意」的 img 元素与图说「连接池」，不含「【配图 1】」，页面中没有封面图像；页面不含 AI 参与说明文字，export.disclosure 不为 null；changedPaths 含该文件、资产目录 .writing-anything/exports/post.paste.assets 中的封面与 fig-1 以及配图清单 .writing-anything/exports/post.paste.images.md
      paste-safe-page:
        - GIVEN: 作品 post 已验收，正文含 <script>alert(1)</script>、链接 [文档](https://example.com/doc) 与行内的外链图片 ![图标](https://example.com/icon.png)
        - WHEN: 分别对正文不同的两个作品运行 wa-cli export <作品> --format paste-html --dir D --json
        - THEN: '<script>alert(1)</script> 以转义后的文字出现；页面只有一个 script 元素，两次导出中该元素的内容相同；Content-Security-Policy 含 default-src ''none''、img-src data: 与 script-src ''sha256-；页面没有指向 example.com 的 img、link 或 script，外链图片显示为「【配图 1：图标】」，链接文字后有 [1] 且文末参考链接列出该地址'
      paste-front-matter:
        - GIVEN: 作品 post 已验收
        - WHEN: 运行 wa-cli export post --format paste-html --front-matter --dir D --json
        - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 front-matter 的诊断，不写文件，退出码为 1
      paste-nothing-accepted:
        - GIVEN: 作品 post 没有验收
        - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
        - THEN: diagnostics 中有一条错误码为 export.nothing-accepted 的诊断，没有写出页面、资产目录与配图清单，退出码为 1
      paste-other-formats-unchanged:
        - GIVEN: 作品 post 已验收，正文引用了已登记的配图，有 AI 参与段落
        - WHEN: 分别运行 wa-cli export post 的 markdown、wechat-html 与 text 格式导出
        - THEN: 三个导出文件、资产目录、配图清单与 --json 输出与本变更之前相同（wechat-html 仍为「【配图 n】」占位并含 AI 参与说明）
      paste-reencode-large:
        - GIVEN: 作品 post 已验收，正文有独占一段的已登记配图 big（2000×1500 的 PNG，约 3 MiB）与 small（约 200 KB 的 PNG）
        - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
        - THEN: 退出码为 0；big 以 data:image/jpeg 内嵌，解码后的字节不超过 1 MiB、宽 1600 像素；small 仍以 data:image/png 原样内嵌；资产目录中 big 的文件与登记的原图逐字节相同
      paste-pixel-limit:
        - GIVEN: 作品 post 已验收，正文有独占一段的已登记配图 huge（8000×6000 的 PNG，不超过 10 MiB）
        - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
        - THEN: 退出码为 0；huge 处为「【配图 1】」占位，配图清单与资产目录照常列出原图
      paste-segments:
        - GIVEN: 作品 post 已验收，正文有 9 张独占一段的已登记小配图，另一个作品 short 只有 7 张
        - WHEN: 分别运行 wa-cli export <作品> --format paste-html --dir D --json
        - THEN: post 的页面有两个段（第 1 段 7 张、第 2 段 2 张），工具栏有「复制第 1 段（图 1–7）」「复制第 2 段（图 8–9）」与「复制全文」按钮，参考链接在第 2 段；short 的页面只有一个段与一个「复制图文」按钮
      paste-embed-budget:
        - GIVEN: 作品 post 已验收，正文有 33 张独占一段、已登记且可用的配图 fig-1 至 fig-33，各略小于 1 MiB（不需要重新编码）
        - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
        - THEN: 退出码为 0；fig-1 至 fig-32（累计不超过 32 MiB）以 data URI 内嵌，fig-33 处为「【配图 33】」占位；配图清单列出全部 33 张配图及其资产路径
  paste-html-print:
    strength: MUST
    statement: wa-cli export <work> --format paste-html --print 必须是只读的：按 paste-html-export 的同样规则选出单元并渲染正文容器中的内容，不写导出文件、资产目录与配图清单，不创建目录；同时给出 --output 时报告 input.invalid-value（field 为 output）。--json 时 export.html 为全文 HTML 片段（各段依次拼接，与同一时刻写出的可粘贴页正文容器中各段的内容相同，不含页面外壳、按钮、script 与 AI 参与说明），export.segments 为各段片段的数组（至少一项，只有一段时与 export.html 相同），export.path 与 export.imageList 为 null，export.assets 为空数组，changedPaths 为空数组，export.images 与 export.disclosure 同 paste-html-export；不加 --json 时把片段写到标准输出。其他格式与不带 --print 的 paste-html 的 --json 输出不含 html 与 segments 字段。--json 时 export.headline 为根单元标题决策状态为 decided 时选定的标题文字（见 marketing 主规格的 marketing-show；决策队列无法加载、marketing.yaml 缺失或状态不是 decided 时为 null，不做一级标题、purpose 或作品 id 的回退），export.digest 为根单元 marketing.yaml 的 digest（没有时为 null）；这两个字段同样只在 paste-html --print 的 --json 输出中出现，其他格式与不带 --print 的 paste-html 不含 headline 与 digest 字段。没有可导出单元时报告 export.nothing-accepted、退出码为 1。--format 不是 paste-html 时给出 --print 报告 input.invalid-value（field 为 print），不写文件，退出码为 1。
    scenarios:
      print-headline-digest:
        - GIVEN: wechat-marketing 作品 post 已验收，正文没有一级标题，根单元 marketing.yaml 的标题决策状态为 decided（选定「三步搞定连接池」）且有非空 digest
        - WHEN: 运行 wa-cli export post --format paste-html --print --dir D --json
        - THEN: export.headline 为「三步搞定连接池」，export.digest 为 digest 的文字；export.html 与 export.segments 及其余字段与本变更之前同一正文的输出相同，changedPaths 为空数组，退出码为 0
      print-headline-digest-null:
        - GIVEN: tech-blog 作品 post 已验收（根单元没有 marketing.yaml）
        - WHEN: 运行 wa-cli export post --format paste-html --print --dir D --json
        - THEN: export.headline 与 export.digest 字段仍出现且都为 null，其余字段与本变更之前相同，退出码为 0
      print-readonly:
        - GIVEN: 作品 post 已验收，正文引用了已登记且可用的配图 fig-1，根单元登记了封面 cover
        - WHEN: 运行 wa-cli export post --format paste-html --print --dir D --json
        - THEN: 退出码为 0；changedPaths 为空数组，.writing-anything/exports/ 下没有新文件；export.html 含 src 以 data:image/ 开头的 img 元素，不含 <script、<html 与 AI 参与说明，不含封面图像；export.path 与 export.imageList 为 null，export.assets 为空数组
      print-wrong-format:
        - GIVEN: 作品 post 已验收
        - WHEN: 运行 wa-cli export post --format wechat-html --print --dir D --json
        - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 print 的诊断，不写文件，退出码为 1
      print-nothing-accepted:
        - GIVEN: 作品 post 没有验收
        - WHEN: 运行 wa-cli export post --format paste-html --print --dir D --json
        - THEN: diagnostics 中有一条错误码为 export.nothing-accepted 的诊断，export 为 null，changedPaths 为空数组，退出码为 1
      print-segments:
        - GIVEN: 作品 post 已验收，正文有 9 张独占一段的已登记小配图
        - WHEN: 运行 wa-cli export post --format paste-html --print --dir D --json
        - THEN: export.segments 有两项，各含 7 与 2 个 img 元素，export.html 等于两项依次拼接
