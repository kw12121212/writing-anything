schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: ../schemas/roadmap-milestone.yaml
milestone:
  mcp-integration:
    title: MCP 集成（MCP Integration）
order: 350
goal: 只支持 MCP（Model Context Protocol，模型上下文协议）的 Agent 能通过 wa-cli mcp 使用 wa-cli 的全部已有能力，结果与直接调用 CLI 一致，并能一条命令注册到常见客户端。
scope:
  in:
    - wa-cli mcp：stdio 方式的 MCP 服务（MCP Server），tools 由命令注册表生成，resources 暴露工作区产物与生效的规范包，prompts 对应各 Skill 的流程说明
    - wa-cli mcp install：注册到 claude-code、codex 与通用 JSON 配置
  out:
    - HTTP / SSE 等远程传输方式
    - 在 MCP 服务中实现 CLI 之外的业务逻辑
done_criteria:
  - 每个注册到命令注册表的 wa-cli 命令都有对应的 MCP tool，测试逐一校验
  - 同一操作经 MCP 与 CLI 调用，产物与 --json 输出一致
  - wa-cli mcp install 重复执行结果幂等，并保留客户端配置中已有的其他条目
intake_questions:
  - id: mcp-transport
    question: MCP 服务需要支持哪些传输方式？
    context: 本地 Agent 普遍使用 stdio，远程传输涉及鉴权与部署。
    impact: 影响服务启动方式与安全边界。
    recommendation: 只支持 stdio，并要求显式指定项目根目录；远程传输以后按需求评估。
planned_changes: {}
dependencies:
  - tech-blog-workflow
risks:
  - MCP 协议与各客户端的配置格式仍在变化，注册逻辑需要按客户端隔离，便于单独更新
status: proposed
notes: []
details: MCP 服务内置于 wa-cli 二进制，只做命令注册表到 MCP 的映射。放在营销文体之后，是因为 CLI 接口到这时已经过两个文体验证，比较稳定，映射的返工最少。后续里程碑新增的命令自动获得对应 tool，不需要单独修改 MCP 服务。
