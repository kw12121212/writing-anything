schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: release-plugin-tarball
approach:
  - '把插件打包作为第 7 步「本地构建发布产物」的组成部分：pnpm --dir plugins/dsh-writing-viewer run build 后 pnpm pack --pack-destination dist，tarball 文件名携带插件自身版本（package.json，独立于发布 tag，核对时以实际文件名为准）；第 9 步 dist/* 上传自动携带，第 10 步核对清单补 tarball；README 安装章节以 releases/latest/download URL 为主、link: 为开发模式。发布技能保持只执行不修改代码的边界：pack 失败按既有失败处理路径停止发布'
decisions:
  tarball-in-dist:
    decision: 插件 tarball 与 wa-cli 二进制同目录（dist/）产出，复用既有 dist/* 上传与失败回滚路径，不新增上传步骤
    rationale: 发布流程已有 dist/* 的构建-上传-核对-失败回退闭环，tarball 并入该闭环改动最小；插件版本独立于 tag，文件名自带版本可追溯
  technical-only-no-scene:
    decision: 本变更不携带 delta 场景：纯发布工具与文档变更，无用户可观察的产品行为流（唯一可观察物是安装 URL，属文档）
    rationale: scene-first 路由允许技术类变更记录缺席原因；当前可用的 strict-spec-cli 构建亦无 scene 命令，按协议不手写场景工件
  no-delta-spec:
    decision: 本变更为纯发布工具与文档变更：release 技能步骤调整与 README 安装章节改写，不改变任何产品可观察行为，无主规格需求变更
    rationale: 发布流程与安装文档属工程工具与文档范畴；dsh-plugin 主规格约束的插件行为（面板、setup、来源对照）全部不变
alternatives: []
risks: []
