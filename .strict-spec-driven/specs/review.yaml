schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: review
  title: 审稿与验收（Review and Acceptance）
requirements:
  review-record:
    strength: MUST
    statement: wa-cli review record <unit> 必须从 --file（相对 --dir 或为绝对路径）或标准输入读取审稿（Review）输入并整体替换单元目录下的 review.yaml。输入为 YAML：rubric 为评分结论数组，每项含 item（评分项 id）、verdict（pass 或 fail）、evidence（非空）与 paragraphs（至少一个段落编号）；findings 为发现项（Finding）数组，每项含 paragraph 与 message，可选 id、rubric、quote 与 suggestion。段落编号从 1 开始，与 wa-cli provenance 的段落一致。单元的评分标准（Rubric）为合并后的评分标准（见 wa-cli config resolved），加上单元选用的写作法附带的评分项（见 methods 主规格的 method-rubric）；其中每个评分项都必须恰有一个结论：缺少时报告 review.missing-verdict（field 为 rubric，message 含评分项 id 与标题），item 或 rubric 不是单元的评分项时报告 review.unknown-rubric-item，同一评分项有多个结论时报告 review.duplicate-verdict；段落编号大于正文段落数时报告 review.unknown-paragraph；quote 不出现在所引段落的原文中时报告 review.quote-not-found；发现项 id 重复时报告 artifact.duplicate-id；输入不符合审稿输入的 Schema 时报告 artifact.schema-violation 或 artifact.parse-error。这些诊断的 path 为空、field 为输入中的位置（如 findings[0].quote），next 包含 wa-cli help review record --json、wa-cli provenance <unit> --dir <dir> --json 、wa-cli config resolved --dir <dir> --json 与 wa-cli brief show <unit> --dir <dir> --json；单元没有正文时报告 draft.not-found；都不修改文件，退出码为 1。成功时写出的 review.yaml 含 schema_version 1、draft_sha256（当前 draft.md 原始字节的 SHA-256）、rubric 与 findings，省略的发现项 id 取 rf-<n>（n 从 1 递增，跳过输入中已用的 id），每个发现项的 status 为 open；changedPaths 为 [review.yaml]，--json 输出的 review 字段含 unit、path、stale、draftSha256、rubric（每项另含评分项的 title 与 blocking）与 findings，退出码为 0。
    scenarios:
      record-review:
        - GIVEN: 作品 my-post（minimal，评分标准为 clarity）处于审稿阶段，正文有两个段落，第二段含「可能」
        - WHEN: 运行 wa-cli review record my-post --dir D --json，标准输入为 clarity 的 fail 结论（paragraphs [2]）、一个 id 为 rf-1 的发现项与一个不带 id、quote 为「可能」的发现项
        - THEN: review.yaml 的 draft_sha256 为当前正文的 SHA-256，findings 依次为 rf-1 与 rf-2，status 都为 open；review.rubric[0].title 为 清晰；changedPaths 为 [.writing-anything/works/my-post/review.yaml]，退出码为 0
      missing-verdict:
        - GIVEN: 同上
        - WHEN: 标准输入的 rubric 为空数组
        - THEN: diagnostics 中有一条错误码为 review.missing-verdict、field 为 rubric 的诊断，其 next 包含 wa-cli help review record --json；没有写出 review.yaml，退出码为 1
      unknown-paragraph:
        - GIVEN: 同上，正文只有两个段落
        - WHEN: 标准输入的结论引用第 3 段
        - THEN: diagnostics 中有一条错误码为 review.unknown-paragraph、field 为 rubric[0].paragraphs[0] 的诊断，退出码为 1
      quote-not-found:
        - GIVEN: 同上，第一段不含「例子」
        - WHEN: 标准输入的发现项引用第 1 段、quote 为「例子」
        - THEN: diagnostics 中有一条错误码为 review.quote-not-found、field 为 findings[0].quote 的诊断，退出码为 1
  review-show:
    strength: MUST
    statement: wa-cli review show <unit> 必须只读地汇总单元的审稿与验收（Acceptance）情况，changedPaths 为空数组：review 为 review.yaml 的内容（字段同 review record 的输出，stale 为 draft_sha256 是否与当前正文不同；没有审稿或不通过校验时为 null，不通过校验时报告其诊断、退出码为 1）；lint 为本单元文本检查（Lint）的 ran、errors 与 warnings（未被豁免的 error 级与 warning 级发现项数）；revisions 为修订任务（Revision Task）数组：review.yaml 中 status 为 open 的发现项（source 为 review），以及该单元未处理（open 或 accepted）的作者反馈（source 为 feedback），每项含 source、id、status、paragraph 与 message；decisions 为关联该单元、status 为 open 的决策，每项含 id、question 与 blocking；gate 含 level（工作区配置的 gate_level）、blockers（按 accept-gate 在已给出作者确认时的阻塞项，每项含 code、path、ref 与 message）、ready（blockers 为空）与 confirmationRequired（level 为 strict 时为 true）；acceptance 为已有的 acceptance.yaml（gateLevel、draftSha256、confirmedByAuthor、confirmation、acceptedAt 与 stale），没有时为 null。
    scenarios:
      show-revisions:
        - GIVEN: 作品 my-post 的审稿有两个 open 的发现项，另有一条 open 的作者反馈 fb-1，工作区的 gate_level 为 standard
        - WHEN: 运行 wa-cli review show my-post --dir D --json
        - THEN: revisions 依次为两个 source 为 review 的发现项与 source 为 feedback 的 fb-1；gate.level 为 standard，gate.ready 为 false，gate.blockers 的 code 依次为 accept.open-finding、accept.open-finding 与 accept.open-feedback；changedPaths 为空数组，退出码为 0
      show-no-review:
        - GIVEN: 作品 my-post 处于审稿阶段、没有 review.yaml，gate_level 为 standard
        - WHEN: 运行 wa-cli review show my-post --dir D --json
        - THEN: review 为 null，gate.blockers 只有一项 code 为 accept.review-missing，退出码为 0
  review-resolve:
    strength: MUST
    statement: wa-cli review resolve <unit> <finding> 必须把 review.yaml 中发现项的 status 改为 --status（resolved、waived 或 open，省略时为 resolved），给出 --note 时把处理说明设为该值；只改动这两个字段，保留其他内容与 YAML 注释。status 为 waived 时必须有处理说明（本次给出或已有），否则报告 review.missing-note。成功时 --json 输出的 finding 字段含修改后的发现项，changedPaths 为 [review.yaml]，取值未变时不写文件、changedPaths 为空数组，退出码为 0。单元没有审稿或其中没有该发现项时报告 review.finding-not-found（next 包含 wa-cli review show <unit> --dir <dir> --json）；--status 不在取值范围内或 --note 为空白时报告 artifact.schema-violation；发现项经由 YAML 锚点、别名或合并键得到时报告 review.anchored-value；这些情况都不修改文件，退出码为 1。
    scenarios:
      waive-with-note:
        - GIVEN: 作品 my-post 的审稿有 open 的发现项 rf-2，review.yaml 中有作者的注释
        - WHEN: 运行 wa-cli review resolve my-post rf-2 --status waived --note 作者说保留 --dir D --json
        - THEN: finding.status 为 waived，finding.note 为 作者说保留；作者的注释保留；changedPaths 为 [.writing-anything/works/my-post/review.yaml]，退出码为 0
      waive-without-note:
        - GIVEN: 同上，rf-2 没有处理说明
        - WHEN: 运行 wa-cli review resolve my-post rf-2 --status waived --dir D --json
        - THEN: diagnostics 中有一条错误码为 review.missing-note 的诊断，review.yaml 不变，退出码为 1
  accept-gate:
    strength: MUST
    statement: 'wa-cli accept <unit> 必须按工作区配置的关卡强度（Gate Level）检查验收的阻塞项，有阻塞项时为每项给出一条 error 级诊断、不写任何文件、退出码为 1。所有关卡强度下的阻塞项：本单元文本检查未被豁免的 error 级发现项（accept.lint-errors，path 为 draft.md，next 包含 wa-cli lint <unit> --dir <dir> --json）、使文本检查无法完成的 error 级问题（保留其错误码）、关联该单元的 open 阻塞决策（decision.blocking，next 包含 wa-cli decisions --dir <dir> --json），以及决策队列无法加载（decision.invalid-queue，message 说明决策队列无法加载）。standard 与 strict 另有：没有 review.yaml（accept.review-missing）、review.yaml 不通过校验（保留其诊断）、审稿的 draft_sha256 与当前正文不同（accept.review-stale）、单元的评分项（见 review-record）没有结论（review.missing-verdict），每个 status 为 open 的审稿发现项（accept.open-finding，next 包含 wa-cli help review resolve --json）与每条未处理的作者反馈（accept.open-feedback，next 包含 wa-cli feedback list <unit> --dir <dir> --json）。strict 另有：单元的评分项（来自文体、规范包或选用的写作法）声明 blocking: true 且审稿结论为 fail（accept.blocking-rubric），以及没有给出 --confirmed-by-author 与 --confirmation（accept.unconfirmed，next 包含 wa-cli help accept --json）。审稿结论为 fail 在 fast、standard 下以及未声明 blocking 的评分项上都不阻塞。每条阻塞项诊断的 next 都包含能复查它的 wa-cli review show <unit> --dir <dir> --json。'
    scenarios:
      strict-unconfirmed:
        - GIVEN: 作品 my-post 处于审稿阶段，审稿基于当前正文且没有未处理的修订任务，gate_level 为 strict
        - WHEN: 运行 wa-cli accept my-post --dir D --json
        - THEN: diagnostics 中有一条错误码为 accept.unconfirmed、severity 为 error 的诊断，其 next 包含 wa-cli help accept --json；没有写出 acceptance.yaml，退出码为 1
      standard-open-revisions:
        - GIVEN: gate_level 为 standard，审稿有一个 open 的发现项，另有一条 open 的作者反馈
        - WHEN: 运行 wa-cli accept my-post --dir D --json
        - THEN: diagnostics 中有错误码为 accept.open-finding 与 accept.open-feedback 的诊断，其 next 包含 wa-cli review show my-post 命令；退出码为 1
      hard-rules-fast:
        - GIVEN: gate_level 为 fast，正文命中 error 级的 AI 腔词表，关联该单元有一个 open 的阻塞决策，没有审稿
        - WHEN: 运行 wa-cli accept my-post --dir D --json
        - THEN: diagnostics 中有错误码为 accept.lint-errors 与 decision.blocking 的诊断，没有 accept.review-missing，退出码为 1
      every-blocker-rechecks:
        - GIVEN: gate_level 为 strict，关联该单元有 open 的阻塞决策，review.yaml 不通过校验
        - WHEN: 运行 wa-cli accept my-post --dir D --json
        - THEN: 每条 error 级诊断的 next 都包含 wa-cli review show my-post 命令，退出码为 1
      blocking-rubric:
        - GIVEN: 'gate_level 为 strict，评分项 facts 声明 blocking: true，审稿对它的结论为 fail'
        - WHEN: 运行 wa-cli accept my-post --confirmed-by-author --confirmation 作者：好 --dir D --json
        - THEN: diagnostics 中有一条错误码为 accept.blocking-rubric 的诊断，退出码为 1
  accept-record:
    strength: MUST
    statement: wa-cli accept <unit> 只能在单元当前阶段的必需产物（Required Artifact）含 acceptance 时使用，否则报告 accept.wrong-stage（next 包含 wa-cli next <unit> --dir <dir> --json）。--confirmed-by-author 与 --confirmation <作者原话摘要> 必须同时给出且摘要不为空白，否则报告 accept.incomplete-confirmation（next 包含 wa-cli help accept --json）。没有阻塞项时必须整体替换单元目录下的 acceptance.yaml，记录 schema_version 1、gate_level、draft_sha256（当前正文的 SHA-256）、confirmed_by_author、confirmation（给出作者确认时）与 accepted_at（UTC 时间，格式 YYYY-MM-DDTHH:MM:SSZ），即确认记录（Confirmation Record）；changedPaths 为 [acceptance.yaml]，--json 输出的 acceptance 字段含 unit、path、gateLevel、draftSha256、confirmedByAuthor、confirmation 与 acceptedAt，退出码为 0。standard 与 fast 下没有给出作者确认时照常验收，confirmed_by_author 为 false，并给出一条 warning 级 accept.unconfirmed。accept 不改变单元的阶段；之后正文被修改、验收记录不通过校验或工作区的关卡强度变得比记录的 gate_level 更严时，advance 与 next 分别报告 acceptance.stale、acceptance.invalid 与 acceptance.weaker-gate（见 units-and-lifecycle 主规格的 advance-stage）。
    scenarios:
      accept-confirmed:
        - GIVEN: gate_level 为 strict，作品 my-post 没有验收阻塞项
        - WHEN: 运行 wa-cli accept my-post --confirmed-by-author --confirmation 作者：可以发了 --dir D --json
        - THEN: acceptance.yaml 的 confirmed_by_author 为 true、confirmation 为 作者：可以发了、gate_level 为 strict；diagnostics 为空，changedPaths 为 [.writing-anything/works/my-post/acceptance.yaml]，退出码为 0；work.yaml 的 stage 仍为 review
      accept-unconfirmed-standard:
        - GIVEN: gate_level 为 standard，作品 my-post 没有验收阻塞项
        - WHEN: 运行 wa-cli accept my-post --dir D --json
        - THEN: 退出码为 0，acceptance.confirmedByAuthor 为 false，diagnostics 中有一条 severity 为 warning、错误码为 accept.unconfirmed 的诊断
      wrong-stage:
        - GIVEN: 作品 my-post 处于草稿阶段
        - WHEN: 运行 wa-cli accept my-post --dir D --json
        - THEN: diagnostics 中有一条错误码为 accept.wrong-stage 的诊断，其 next 包含 wa-cli next my-post 命令，退出码为 1
      incomplete-confirmation:
        - GIVEN: 作品 my-post 处于审稿阶段
        - WHEN: 运行 wa-cli accept my-post --confirmed-by-author --dir D --json
        - THEN: diagnostics 中有一条错误码为 accept.incomplete-confirmation 的诊断，没有写出 acceptance.yaml，退出码为 1
  review-validation:
    strength: MUST
    statement: wa-cli validate 整体校验时，必须对每个可加载作品的每个单元目录中存在的 review.yaml 与 acceptance.yaml 做 Schema 校验并计入 checked（途经符号链接或不是普通文件时同样计入 checked，并报告 artifact.not-found；advance、next、review show、review resolve 与 accept 对它们报告同一问题，不当作不存在）；review.yaml 另须满足评分结论的 item 不重复（否则 review.duplicate-verdict）且发现项 id 不重复（否则 artifact.duplicate-id）。wa-cli validate <path> 按产物所在位置识别 review.yaml 与 acceptance.yaml 并执行相同的检查。评分项可以声明布尔字段 blocking，供 accept-gate 在 strict 下使用。
    scenarios:
      validate-review:
        - GIVEN: 作品 my-post 的 review.yaml 中两个发现项的 id 都为 rf-1
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有一条错误码为 artifact.duplicate-id、path 为 .writing-anything/works/my-post/review.yaml 的诊断，退出码为 1
      validate-symlink:
        - GIVEN: 作品 my-post 的 acceptance.yaml 是指向项目目录之外的符号链接
        - WHEN: 运行 wa-cli validate --dir D --json 与 wa-cli advance my-post --dir D --json
        - THEN: validate 的 checked 含该 acceptance.yaml，diagnostics 中有一条错误码为 artifact.not-found、path 为该文件的诊断；advance 报告 acceptance.invalid 并且不推进，两者退出码都为 1
      validate-acceptance:
        - GIVEN: 作品 my-post 的 acceptance.yaml 只有 schema_version
        - WHEN: 运行 wa-cli validate .writing-anything/works/my-post/acceptance.yaml --dir D --json
        - THEN: diagnostics 中有一条错误码为 artifact.schema-violation 的诊断，退出码为 1
