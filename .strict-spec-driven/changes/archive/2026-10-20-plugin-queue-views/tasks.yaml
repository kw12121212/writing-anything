      text: client.ts：PanelView 增加 decisions/reviews；「待决决策」「待复核」磁贴按素材磁贴模式包按钮导航；新增两个清单视图渲染（决策：id/status/question/options+recommendation 标记/rationale/blocking/units；复核：kind/work/ref/channel/confirmed_at/reviewed_at）与中英文案；返回总览按钮
      status: complete
    update-readme:
      text: README：client 侧行为与界面导览补充两个清单视图（含截图索引不变，纯文字描述）
      status: complete
  Testing:
    queueview-unit-tests:
      text: queueview.test.ts：正常解析（含 options/recommendation/blocking/units 全字段）、字段缺失容错、空文件、缺失文件（text 为 null）、解析失败 parseError、author-reviews 各字段
      status: complete
      command: pnpm --dir plugins/dsh-writing-viewer exec vitest run src/queueview.test.ts
