schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: dsh-plugin
operations:
  ADDED: {}
  MODIFIED:
    review-native-view:
      strength: MUST
      statement: 面板的单元详情必须提供「审阅」按钮；点击它或经 review-pending-discovery 的入口激活后，启动该单元的审阅会话（项目目录取面板当前显示的目录，含路径切换所选目录），成功后在详情区以 DSH 面板原生组件呈现审阅视图（Review View），不使用 iframe。视图内容取自同源代理的 page.json：按单元树先序列出单元引用与阶段，逐段显示正文与段落序号，按出处（human、agent、agent-draft-human-edited）区分标记并可切换着色，段落下列出文本检查与审稿发现项（标签、severity、说明与建议），全文级发现项、说明与最近失败的命令单列；单元有配图（Illustration，page.json 单元的 illustrations，见 preview 主规格的 preview-page-json）时，在引用配图的段落之后按该段 illustrations 的顺序以 img 节点显示图像：src 由面板以固定的同源代理路由 /dsh-writing-viewer/review/illustration 与 URL 编码的 unit、id 构造，不使用正文或 page.json 中的其他地址；alt 取替代文字，并以纯文本显示氛围图（Mood Image）或信息图（Infographic）、出处（agent 或 author）标记与信息图关联的论断和素材 id；作品根单元的封面图（Cover Image）显示在该单元开头并标「封面」；referenced 为 false 的正文配图在单元末尾列出并标「未引用」；available 为 false 的配图不加载图片，改为显示不可用说明；没有配图时视图与没有配图功能时相同。待作者确认区逐项显示说明、决策选项与推荐、原话摘要输入框与确认控件（可拒绝的事项另有拒绝控件，需要答复的决策提供答复输入）；strict 关卡下另显示待作者复核区（默认勾选的复选框与「复核所选」）；没有事项时显示与阅读页相同的空提示。作者在单个段落内选中文字后可提交反馈（文字与可选快捷标记 stuck、good、question），也可对整个单元提交反馈；选区为空、跨段落或在正文之外时不发出请求并提示。每次提交经代理 POST 到 wa-cli，成功后重新拉取 page.json 刷新视图；失败时显示 wa-cli 诊断的可读信息并保留作者已填写的内容。来自工作区的全部文字一律以纯文本显示，不解释其中的 HTML 或脚本。审阅视图随 DSH 明暗主题切换保持可读，并遵守 overview-theme-and-narrow 的窄屏布局。视图提供「刷新」与「结束审阅」按钮，结束后关闭视图并刷新快照。启动进行中显示可读提示；启动失败、审阅路由被请求来源校验拒绝（提示在插件配置 allowedHosts 中放行当前访问的权威，如 Tailscale MagicDNS 名与端口）或会话已结束时，显示可读原因与重新审阅入口，不显示空白视图。会话是否已结束由面板在每次拉取 page.json、窗口重新获得焦点或页面重新可见时查询会话状态路由判定（不调用 wa-cli），并比对会话摘要的 unit 与所审单元——会话不存在、属于其他单元或载荷缺失 unit 时按已结束处理。全部控件必须可经键盘激活。审阅视图头部另提供「放大」按钮：点击后同一审阅视图（内容与详情区完全一致）以铺满面板区域的覆盖层显示，盖住单元树与详情列，不使用 iframe、不新开浏览器窗口；正文段落与配图、封面图按放大后的宽度显示；覆盖层提供「还原」按钮，Esc 键同样退出放大，退出后回到详情区显示，审阅会话不结束、已填写的原话摘要与答复保留，数据不重新拉取；覆盖层随 DSH 明暗主题保持可读、窄屏下铺满可用区域，其中全部控件可经键盘激活。
      scenarios:
        native-render:
          - GIVEN: 作品 my-post 正文两段（第一段出处 human、第二段 agent），第二段有一条 warning 级文本检查发现项，决策队列中有关联 my-post 的 open 决策 dec-1（选项 a、b，推荐 a）
          - WHEN: 作者在单元详情点「审阅」
          - THEN: 详情区出现审阅视图且页面中没有 iframe 元素；两段正文带不同的出处标记，第二段下列出该发现项；待作者确认区列出 dec-1、两个选项（a 带推荐标记）与原话摘要输入框
        native-feedback:
          - GIVEN: 同上，第一段含「连接池很重要」一次
          - WHEN: 作者在第一段选中「连接池很重要」，填写「补一个例子」并提交
          - THEN: wa-cli feedback list my-post --json 列出 quote 为「连接池很重要」、text 为「补一个例子」的反馈；视图随后重新拉取了 page.json
        native-confirm-decision:
          - GIVEN: 同 native-render
          - WHEN: 作者为 dec-1 选 a、填写原话摘要「作者：用甲」并确认
          - THEN: 'decisions.yaml 中 dec-1 已决定且记录 channel: preview；刷新后的待作者确认区不再列出 dec-1'
        native-author-review:
          - GIVEN: gate_level 为 strict，my-post 有一条经 cli 渠道写入的验收待作者复核
          - WHEN: 作者在审阅视图的待作者复核区保持默认勾选并点「复核所选」
          - THEN: author-reviews.yaml 记录该项、渠道为 preview；刷新后待作者复核区显示「没有待作者复核的确认」
        native-text-safety:
          - GIVEN: my-post 的一段正文为 <script>alert(1)</script><b>粗</b>
          - WHEN: 打开 my-post 的审阅视图
          - THEN: 该段按原文字符显示，脚本不执行，页面中不生成来自正文的 script 或 b 元素
        native-selection-invalid:
          - GIVEN: my-post 的审阅视图已打开
          - WHEN: 作者选中跨越第一段与第二段的文字后提交反馈
          - THEN: 面板不发出反馈请求，提示只在一个段落内选中文字或改为对整个单元提交，feedback.yaml 不变
        native-submit-failed:
          - GIVEN: my-post 的审阅视图已打开，作者为需要答复的决策填写了答复
          - WHEN: 提交时 wa-cli 返回 400 诊断
          - THEN: 视图显示诊断的可读信息，作者填写的答复仍保留在输入框中
        native-session-replaced:
          - GIVEN: 本标签页正在审阅 my-post，另一浏览器标签页随后启动了 other-post 的审阅
          - WHEN: 本标签页窗口重新获得焦点
          - THEN: 本标签页显示审阅已结束与重新审阅入口，不显示 other-post 的内容
        native-origin-rejected:
          - GIVEN: 作者经未在 allowedHosts 放行的权威访问，快照路由已放行而审阅路由被拒
          - WHEN: 作者点「审阅」
          - THEN: 单元详情显示在 allowedHosts 中放行当前权威的提示，不显示空白审阅视图
        native-end:
          - GIVEN: my-post 的审阅视图已打开
          - WHEN: 作者用键盘激活「结束审阅」
          - THEN: 审阅视图关闭，GET /dsh-writing-viewer/review-session 报告没有会话，快照已刷新
        native-illustrations:
          - GIVEN: 作品 my-post 根单元登记了封面图 cover，正文第 2 段引用可用的信息图 fig-1（origin 为 agent，claims 为 [c1]），另有未被引用的正文配图 fig-2
          - WHEN: 作者在单元详情点「审阅」
          - THEN: 单元开头显示封面图像并标「封面」；第 2 段之后有 alt 为 fig-1 替代文字的 img 节点，其 src 以 /dsh-writing-viewer/review/illustration?unit=my-post&id=fig-1 为地址，旁边显示「信息图」、出处 agent 与 c1；fig-2 在单元末尾标「未引用」；页面中没有 iframe 元素
        native-illustration-unavailable:
          - GIVEN: 正文引用的配图 fig-1 在 page.json 中 available 为 false
          - WHEN: 打开 my-post 的审阅视图
          - THEN: fig-1 处显示不可用说明，面板没有请求 /dsh-writing-viewer/review/illustration
        native-no-illustrations:
          - GIVEN: 作品 my-post 没有配图，page.json 中 illustrations 都为空数组
          - WHEN: 打开 my-post 的审阅视图
          - THEN: 视图中没有 img 节点，其余内容与 native-render 相同
        native-enlarge:
          - GIVEN: 作品 my-post 的审阅视图已在单元详情中打开，正文与配图在窄的详情列里显示
          - WHEN: 作者点「放大」
          - THEN: 同一审阅视图铺满面板区域（单元树与详情列被盖住），正文段落与配图以更大宽度显示，头部出现「还原」按钮，页面中没有 iframe 元素
        native-enlarge-exit:
          - GIVEN: 作者处于放大模式，已在待作者确认区的原话摘要输入框填写了文字
          - WHEN: 按 Esc（或点「还原」）
          - THEN: 审阅视图回到单元详情区显示，输入框中的文字保留，审阅会话未结束（没有触发结束审阅的刷新），再点「放大」可重新铺满
  REMOVED: {}
