schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: genres-and-packs
operations:
  ADDED:
    wechat-marketing-genre:
      strength: MUST
      statement: 'wa-cli 必须随二进制提供内置的 wechat-marketing 文体（公众号营销文章）：单元类型 article（子单元类型 section，简报必填项为 audience、purpose 与 key_messages）与 section；阶段依次为 brief（必需产物 brief）、outline（outline）、draft（draft 与 marketing，见 marketing 主规格的 marketing-gate）与 review（review 与 acceptance）；默认写作法为 aida；规则 claims（claim-sources，error）、claim-candidates（warning）、ads（ad-compliance，error）、length（length-range，warning，1500 到 4000 字）与 paragraphs（paragraph-length，warning，每段不超过 150 字）；评分标准为 reader-benefit（读者收益）、hook（开头钩子）、cta（行动号召）、compliance（合规可信，blocking: true）与 4U 标题法的 headline-useful（有用）、headline-urgent（紧迫）、headline-unique（独特）、headline-specific（具体），标题类评分项针对作者选定的标题；上下文预算为 12000。它与其他内置文体一样通过文体的校验。'
      scenarios:
        new-wechat-marketing:
          - GIVEN: 用 wa-cli init --genre wechat-marketing --dir D 初始化的工作区
          - WHEN: 运行 wa-cli new wechat-marketing post --dir D --json，再运行 wa-cli config resolved --dir D --json
          - THEN: work.yaml 的 genre 为 wechat-marketing、type 为 article、stage 为 brief；resolved.rules.ads.type.value 为 ad-compliance、severity 为 error；resolved.rubric 含 headline-useful 与 blocking 为 true 的 compliance；退出码都为 0
        superlative-fails-lint:
          - GIVEN: wechat-marketing 作品 post 的 draft.md 含「全网最低价」
          - WHEN: 运行 wa-cli lint post --dir D --json
          - THEN: findings 含一项 rule 为 ads、type 为 ad-compliance、source 为 genre:wechat-marketing 的发现项，退出码为 1
        wechat-e2e:
          - GIVEN: 用 wa-cli init --genre wechat-marketing --gate-level strict 初始化的工作区
          - WHEN: 只用 wa-cli 命令完成：new、source add、brief set、advance、按 aida 的章节 outline set、advance、draft write、claim add、marketing set、marketing ask、decide、lint（没有 error 级发现项）、advance、review record（含 4U 评分项）、accept（给出作者确认）、advance 与 export
          - THEN: 作品 stage 为 done，导出文件含正文，validate 通过；缺少某个营销要素或标题未决定时 advance 被拒绝
  MODIFIED: {}
  REMOVED: {}
