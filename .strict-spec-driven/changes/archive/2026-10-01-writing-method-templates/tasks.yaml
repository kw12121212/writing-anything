schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: writing-method-templates
sections:
  Implementation:
    schemas:
      text: internal/schema：method Schema、common.schema.json 的 methodBody；pack 的 methods、genre 的 default_method、brief 的 method、outline 节的 role；method 夹具
      status: complete
    catalog:
      text: internal/catalog：Method 数据、内置七个文章类写作法、LoadMethod、Methods、FindMethod；规范包 methods 与文体 default_method 的检查
      status: complete
    brief:
      text: internal/brief：method 字段、brief.unknown-method、Edit.Method 与 LoadAllowUnknownMethod
      status: complete
    outline:
      text: internal/outline：role 字段与 Edit.Role、写作法缺口（missing-method-part、method-order、unknown-role）、LoadMessages 的默认写作法、BeatPositions；internal/work 与 validate 传入文体的默认写作法
      status: complete
    commands:
      text: internal/cli：method list、method show（登记与样例调用）；brief set --method、outline set --role 与输出字段；lint 的节拍位置 warning；审稿评分标准加入写作法的评分项
      status: complete
  Testing:
    lint:
      text: gofmt 检查本变更的 Go 文件
      status: complete
      command: test -z "$(gofmt -l internal/catalog internal/brief internal/outline internal/work internal/schema internal/cli/method.go internal/cli/method_test.go internal/cli/brief.go internal/cli/outline.go internal/cli/lint.go internal/cli/review.go internal/cli/workspace.go internal/cli/registry.go internal/cli/cli_test.go)"
    unit-tests:
      text: 单元测试：catalog（内置写作法、规范包写作法检查、文体默认写作法）；work（默认写作法阻塞 advance、none 不检查）；CLI 端到端（method list/show、brief set --method、outline set --role、写作法缺口、validate、悬空写作法、节拍位置、写作法评分项）
      status: complete
      command: go test ./internal/...
    full-regression:
      text: 运行完整回归命令，覆盖率不低于 80%
      status: complete
      command: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out
  Verification:
    spec-alignment:
      text: 对照 methods delta spec 的每个场景确认实现与测试覆盖，并按实际实现修正 delta spec
      status: complete
    strict-ready:
      text: 运行 strict-spec-cli ready 与 strict-spec-cli verify，确认变更产物有效
      status: complete
      command: strict-spec-cli ready writing-method-templates && strict-spec-cli verify writing-method-templates
    archive-readiness:
      text: 确认 delta spec 能合并进主规格（methods 为新主规格），归档后路线图中的 writing-method-templates 标记为完成
      status: complete
testing_gates:
  validation_task: full-regression
  unit_test_task: unit-tests
