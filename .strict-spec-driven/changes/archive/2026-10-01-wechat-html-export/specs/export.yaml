schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: export
operations:
  ADDED:
    wechat-html-export:
      strength: MUST
      statement: 'wa-cli export <work> --format wechat-html 必须按 export-markdown 选出验收记录有效的单元、去掉作者批注与单处豁免注释，把各单元正文（单元之间空一行）转成一个只含内联样式（Inline Style）的 HTML 片段：最外层为一个 section；识别围栏代码块（识别同文本检查）为 pre、ATX 标题（1 至 3 个 # 为 h1 至 h3，更多为 h4）、以 > 开头的引用块为 blockquote、以 - * + 或「数字.」开头的列表项为 ul 或 ol 中的 li（一层，缩进的后续行并入上一项）、由 3 个以上 - * 或 _ 组成的行为 hr、其余由空行分隔的行为 p（行尾两个空格或反斜杠为 br）；行内的行内代码为 code，**文字** 与 __文字__ 为 strong，*文字* 为 em。正文中的原始 HTML 与其他文字一律转义，不跨越空行的已闭合 HTML 注释去掉（跨越空行的按文字输出），不支持的写法（如表格）按段落文字输出；_ 在单词（含汉字）中间时不是强调。输入规模有界：引用块嵌套超过 8 层时更深的 > 按文字处理，强调嵌套超过 16 层时按文字处理，链接文字与图片的替代文字、标题各至多 1000 个字符、地址至多 1000 字节，超过时按文字输出；正文上限 2 MiB 内的输入在线性时间内完成。图片 ![替代文字](地址 "标题") 输出为第 n 个配图（Illustration）的占位：独占一段时为一个带「【配图 n】替代文字」与说明（标题，没有时为地址）的 section 块，否则为行内文字「【配图 n：替代文字】」；链接 [文字](地址) 输出为文字加 sup 脚注编号「[k]」，存在链接时文末追加一个参考链接段落，按编号列出地址文字。输出只能含 section、h1、h2、h3、h4、p、strong、em、code、pre、blockquote、ul、ol、li、hr、br 与 sup 标签，每个标签只能有 style 属性（br 与 sup 之外都带 style），不得含 script、style 或 link 元素、class、id、href、src 或事件属性；style 取自合并后的 htmlTheme（见 genres-and-packs 主规格的 pack-html-theme），渲染时再按同样的取值格式检查一次，不符合的取值输出为空的 style。存在配图时在导出文件同目录写出配图清单：文件名为导出文件去掉 .html 后缀（没有时为整个文件名）加 .images.md，内容为标题「配图清单」与按编号的列表（替代文字、地址与标题）。成功时 export.format 为 wechat-html，images 为配图数组（每项含 index、alt、src 与 title，没有时为 null），imageList 为配图清单的路径（没有配图时为 null，不写清单文件），changedPaths 为新建的目录、导出文件与配图清单；两个文件的路径都在创建任何目录或写入之前检查。没有配图时不写清单，已有的同名清单文件不删除。--front-matter 与 --format wechat-html 同时给出时报告 input.invalid-value（field 为 front-matter），不写文件，退出码为 1。'
      scenarios:
        only-inline-styles:
          - GIVEN: 作品 post 已验收，正文含标题、段落、加粗、行内代码、围栏代码块、引用、列表、链接与 <script>alert(1)</script>
          - WHEN: 运行 wa-cli export post --format wechat-html --dir D --json
          - THEN: 导出文件为 .writing-anything/exports/post.html；其中每个标签都属于允许列表、只有 style 属性；不含 <script、class=、href= 与 <style；<script>alert(1)</script> 以转义后的文字出现；链接文字后有 [1]，文末的参考链接列出该地址；退出码为 0
        image-placeholders:
          - GIVEN: 同上，正文有独占一段的 ![店内实拍](shop.jpg "周六的店") 与行内的 ![图标](icon.png)
          - WHEN: 运行 wa-cli export post --format wechat-html --dir D --json
          - THEN: 导出文件含「【配图 1】店内实拍」与说明「周六的店」的 section 块和行内的「【配图 2：图标】」；.writing-anything/exports/post.images.md 列出两张配图；export.images 有两项，imageList 为该路径，changedPaths 含两个文件
        wechat-front-matter:
          - GIVEN: 作品 post 已验收
          - WHEN: 运行 wa-cli export post --format wechat-html --front-matter --dir D --json
          - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 front-matter 的诊断，不写文件，退出码为 1
        changed-dirs:
          - GIVEN: 作品 post 已验收，正文有配图，dist/ 不存在
          - WHEN: 运行 wa-cli export post --format wechat-html --output dist/sub/post.html --dir D --json
          - THEN: changedPaths 依次为 dist、dist/sub、dist/sub/post.html 与 dist/sub/post.images.md，退出码为 0
        unsafe-theme-value-dropped:
          - GIVEN: 样式主题的取值含 onclick、url(、引号、$1 等不符合取值格式的内容
          - WHEN: 渲染公众号 HTML
          - THEN: 这些元素的 style 为空，输出只含允许的标签与 style 属性
  MODIFIED:
    export-markdown:
      strength: MUST
      statement: 'wa-cli export <work> [--format markdown] 必须把作品中验收记录有效的单元导出为一个 Markdown 文件：按单元树先序（根单元在前）拼接各单元的 draft.md，单元之间空一行，文件以换行结尾；去掉作者批注（<!-- 之后为 @me: 或 @me(kind): 且有非空文字的注释，可以跨行但不能跨空行、不能包含另一个 <!--，与作者反馈的批注一致）与单处豁免注释（与文本检查一致：内容为 lint-ignore <规则 id>: 理由，注释到其后第一个 -->，行首的注释可以跨空行，不在行首的不能）；没有对应 --> 或不满足这些条件的写法不是注释，原样保留；去掉后只剩空白的行整行去掉，不因此留下连续空行，注释一直延伸到行尾时去掉它之前留下的行尾空白，其余空白（如 Markdown 行尾两个空格的硬换行）原样保留；围栏代码块与行内代码（识别与文本检查、作者反馈一致：围栏的结束行为同一字符且长度不短于开头，行内代码为 n 个反引号到之后恰好 n 个反引号）及其他 HTML 注释原样保留；各单元正文开头的 BOM 去掉，CRLF 换成 LF。正文超过 2 MiB 的单元不导出（同 export.unaccepted）。验收记录有效指单元目录下有 acceptance.yaml、通过校验、draft_sha256 与当前正文一致且 gate_level 不比工作区当前的关卡强度宽松（见 units-and-lifecycle 主规格的 advance-stage）。没有正文或验收无效的单元不导出，各给出一条 warning 级 export.unaccepted（path 为单元目录，next 包含 wa-cli review show <unit> --dir <dir> --json）；没有任何可导出的单元时报告 export.nothing-accepted（next 包含 wa-cli next --dir <dir> --json），不写文件，退出码为 1。给出 --front-matter 时在开头附带 YAML 文件头元数据（Front Matter），依次含 title（第一个导出单元正文中围栏代码块之外的第一个一级标题，结尾的 # 只在与文字之间有空白时视为关闭序列；没有时为作品 id）、description（根单元写作简报的 purpose，没有时省略）、genre、units 与 accepted_at（导出单元中最晚的验收时间）。成功时 --json 输出的 export 含 work、format、path、units（导出的单元引用，按顺序）、skipped（每项含 unit 与 reason）、chars、images（Markdown 格式为空数组）与 imageList（Markdown 格式为 null），changedPaths 为新建的目录与导出文件，退出码为 0。--format 不是 markdown 或 wechat-html（见 wechat-html-export）时报告 input.invalid-value（field 为 format）；<work> 是子单元引用时报告 work.not-found（field 为 work）；这些情况不写文件，退出码为 1。'
      scenarios:
        export-accepted:
          - GIVEN: 作品 my-post 已验收，子单元 intro 没有验收
          - WHEN: 运行 wa-cli export my-post --output dist/post.md --dir D --json
          - THEN: dist/post.md 只含 my-post 的正文；diagnostics 中有一条 severity 为 warning、错误码为 export.unaccepted、path 为 .writing-anything/works/my-post/units/intro 的诊断；changedPaths 为 [dist, dist/post.md]，退出码为 0
        nothing-accepted:
          - GIVEN: 作品 my-post 没有验收
          - WHEN: 运行 wa-cli export my-post --dir D --json
          - THEN: diagnostics 中有一条错误码为 export.nothing-accepted 的诊断，没有写出文件，退出码为 1
        strip-process-comments:
          - GIVEN: '已验收单元的正文含独占一行的 <!-- lint-ignore ai-cliche: 引用原话 --> 与行尾的 <!-- @me: 太长 -->'
          - WHEN: 运行 wa-cli export my-post --dir D --json
          - THEN: 导出文件中没有这两处注释，独占一行的注释所在行被去掉
        unclosed-annotation:
          - GIVEN: '已验收单元的正文为「段落 A。<!-- @me: 这里太长」、空行、「段落 B。」'
          - WHEN: 运行 wa-cli export my-post --dir D --json
          - THEN: 导出文件含段落 A 与段落 B 的全部文字（漏写 --> 的不是批注）
    export-output:
      strength: MUST
      statement: wa-cli export 的 --output 必须是相对项目目录（--dir）的文件路径，省略时为 .writing-anything/exports/<work>.md（--format wechat-html 时为 .writing-anything/exports/<work>.html；配图清单的路径同样经过这些检查）；绝对路径、含反斜杠、规整后离开项目目录、以 / 结尾，或落在工作区 .writing-anything/ 之中但不在 .writing-anything/exports/ 之下（导出不能覆盖工作区产物；按不区分大小写比较，写入前再按文件身份确认途经的工作区目录之下只能是 exports）时报告 export.invalid-output（field 为 output，next 包含 wa-cli help export --json）；输出文件所在的每一级目录都必须是真实目录（不存在时逐级创建），已存在的输出文件必须是普通文件，途经或指向符号链接时报告 export.invalid-output，path 为出问题的路径。导出文件原子写入，已存在时覆盖。
      scenarios:
        output-outside:
          - GIVEN: 作品 my-post 已验收
          - WHEN: 运行 wa-cli export my-post --output ../x.md --dir D --json
          - THEN: diagnostics 中有一条错误码为 export.invalid-output 的诊断，项目目录之外没有新文件，退出码为 1
        output-workspace-artifact:
          - GIVEN: 作品 my-post 已验收
          - WHEN: 运行 wa-cli export my-post --output .writing-anything/config.yaml --dir D --json
          - THEN: diagnostics 中有一条错误码为 export.invalid-output 的诊断，config.yaml 不变，退出码为 1
        output-symlink:
          - GIVEN: 项目目录下的 link 是指向项目目录之外的符号链接
          - WHEN: 运行 wa-cli export my-post --output link/post.md --dir D --json
          - THEN: diagnostics 中有一条错误码为 export.invalid-output、path 为 link 的诊断，链接目标中没有新文件，退出码为 1
  REMOVED: {}
