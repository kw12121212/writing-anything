schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: corpus-design
  status: proposed
summary:
  what:
    - 设计并检入真实小说端到端（End-to-End，E2E）测试语料的设计文档与测试矩阵到 internal/cli/testdata/e2e/novel/：不超过 5 个人物的人物卡与关系、至少 1 条作者钦定世界规则、3 章 9 场景的时间线（含至少一处跨章倒叙）、两个秘密的知情边界（谁在哪场得知）、至少 2 条跨章伏笔链（埋设/强化/回收）与 1 条悬空伏笔（供负向断言）、至少 2 次可断言的状态快照（State Snapshot）变更、章内场景因果承接；测试矩阵每条带稳定编号，把长篇特性面（多层单元、场景契约与因果链、状态快照、知情表、伏笔台账、写后收口、分层摘要与上下文预算、长篇规划写作法（Long-form Planning Method）、recall 全文检索（Full-text Search）、连续性审查、审查任务包、影响传播、会话交接、卷末检查点、组稿与整书导出）逐条映射到所在场景、wa-cli 命令与期望结果（发现项或全绿）；并定义可重放命令脚本的文件格式（阶段、命令、输入文本引用、期望退出码与诊断码、可选 stdout 包含断言）
  why:
    - novel-e2e 里程碑需要一部按真实工作流创作的中文中篇小说作为 E2E 测试语料；设计文档与带稳定编号的测试矩阵是后续 corpus-authoring（真实创作与命令录制）与 replay-harness（重放测试）的共同前提，保证每条长篇特性在语料中都有一个可断言的事实，命令脚本格式让创作录制与重放解析共用同一契约
scope:
  in:
    - 新增 internal/cli/testdata/e2e/novel/DESIGN.md（小说设定设计文档）、matrix.yaml（测试矩阵，每条带稳定编号）、script-format.md（可重放命令脚本格式规范）；新增校验这些设计产物结构完整性的 Go 测试（矩阵编号唯一、字段齐备、特性面全覆盖、规划文件规定的最低数量约束满足）
  out:
    - 不创作小说正文语料（corpus-authoring 负责）；不实现重放测试、黄金文件与负向断言（replay-harness、golden-assertions 负责）；不改产品代码与任何主规格；不引入内容生成机制
unchanged_behavior:
  - wa-cli 产品行为完全不变；internal/cli 现有 E2E 测试与 testdata/e2e/ 既有文件不变；规范包、内置文体与写作法模板不变
roadmap:
  milestone: novel-e2e
  planned_change: corpus-design
