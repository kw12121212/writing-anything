schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: dsh-plugin-structure
  title: DSH 插件（DSH Plugin）包结构与隔离
  category: architecture
rules:
  plugin-package-isolation:
    strength: MUST
    statement: DSH 插件源码位于 plugins/<name>/ 独立 TypeScript 包：自带 package.json（声明 dsh.bundle.patch、dsh.client 与 engines.dsh）、构建与测试脚本；不得放入 cmd/ 或 internal/，不得加入 Go 模块
    rationale: 产品运行时是 Go 单文件 wa-cli 二进制，覆盖率与回归关卡都以 internal/** 为范围；插件是 DSH 宿主的扩展，混入 Go 树会污染统计并使「产品运行时不依赖插件」失去结构保证
    enforcement:
      method: review
    examples:
      good:
        - plugins/dsh-writing-viewer/package.json 声明 dsh.bundle.patch 指向 cordis.patch.yml，构建测试脚本都在包内
      bad:
        - 把插件 client 入口放进 internal/dshviewer/ 并由 internal 包引用
  runtime-plugin-independence:
    strength: MUST
    statement: wa-cli、内置技能与 MCP 服务不得依赖、引用或调用 DSH 插件包；完整 Go 回归命令保持不变并仍通过，插件包不改变其结果
    rationale: 与「产品运行时不得依赖 strict-spec-driven」同一隔离方向：插件属 DSH 宿主扩展而非产品运行时；两侧互不牵连让单文件二进制分发与 Go 回归语义保持不变
    enforcement:
      method: test
      detail: 完整回归命令（config.yaml 的 review_evidence.project_regression.command）原样通过即强制；评审核对 plugins/ 下无 .go 文件、无 Go import 指向插件目录
  plugin-toolchain-self-contained:
    strength: SHOULD
    statement: 插件包的构建、类型检查与单元测试在包内 package.json scripts 声明并可在包目录独立运行；不在仓库根新增共享 Node 工作区或根 package.json
    rationale: 仓库主体是 Go 工程；插件工具链自包含使 Go 回归与插件回归互不牵连，仓库根保持无 Node 清单，直到有变更显式定案共享工作区的需要
    enforcement:
      method: review
  plugin-cli-audit-exception:
    strength: MUST
    statement: DSH 插件以子进程调用 wa-cli 只读命令（status、validate 等带 --json 的查看命令）视为只读访问，但必须在自己的 delta 规格中显式写明审计日志（Audit Log）例外：wa-cli 每次调用（含只读命令）都会向 .writing-anything/audit.log 追加一行运维痕迹，插件不得宣称绝对零写入；插件在一次用户动作内对 wa-cli 的调用次数必须有界并可在规格中枚举，不得以轮询或监听名义反复调用（审计日志有轮转上限，轮询会灌满它）
    rationale: 实测（workspace-snapshot 变更，2026-10-20）：对无 audit.log 的工作区跑一次只读 status --json 即创建该文件；runQuiet 仅供进程内 MCP，外部子进程无抑制手段。不声明例外的「只读插件」宣称会被任何真实宿主实测推翻；调用无界则一次面板刷新即可写入大量审计行
    enforcement:
      method: test
      detail: 测试用写入型假二进制（模拟 wa-cli：输出罐装 --json 并向 audit.log 追加行）驱动一次完整快照，断言追加的审计行与规格枚举的有界命令集合一一对应，且除 audit.log 外工作区逐字节不变；评审核对 delta 规格确有审计例外陈述
    examples:
      good:
        - dsh-writing-viewer 的 snapshot-no-writes 需求：除 audit.log 外全部文件清单、内容与修改时间不变，audit.log 追加行与 status/validate/next/timeline×N 有界集合对应
      bad:
        - 插件每秒调用 wa-cli status 刷新面板并宣称「只读、零写入」：轮询式调用灌满审计日志，且宣称与实测不符
  plugin-cli-json-bridge:
    strength: SHOULD
    statement: DSH 插件消费 wa-cli 的 --json 输出时：输出映射单列为独立模块（不与聚合逻辑混写）；每个命令区域（status、validate、next、timeline 等）独立降级——二进制不可用、执行失败、超时、stdout 无法解析或缺少所需字段时，该区域按降级标注呈现（原因写入响应的 degraded 数组），文件可直接解析的数据照常返回，不得整体失败；子进程以参数列表直接 spawn（不经 shell、设超时、有界累积 stdout），文件读取器与执行器经参数注入以便单元测试用罐装输出驱动
    rationale: wa-cli 的 --json 字段在 0.x 仍会演进，且 DSH 宿主环境未必装有 wa-cli；区域级降级让面板在任何缺角下仍有内容可看，映射隔离让字段演进只改一处。注入式读取器/执行器沿用 root.ts 的可测性约定，测试不需要真实二进制
    enforcement:
      method: review
      detail: 评审核对：映射与聚合分离、每个 CLI 区域有降级路径与测试覆盖、spawn 无 shell 且有超时与 stdout 上限
    examples:
      good:
        - plugins/dsh-writing-viewer/src/wacli.ts：mapStatus/mapValidate/mapNext/mapTimeline 各自容错缺字段并给出降级原因；spawnCliRunner 无 shell、15 秒超时、8 MiB stdout 上限
      bad:
        - 在快照聚合函数里内联 execSync('wa-cli status --json')：wa-cli 缺失时整个面板 500，字段演进时聚合逻辑与映射一起改
  host-route-path-input:
    strength: MUST
    statement: DSH 插件 host 路由接受客户端提供的本机路径时，必须先经纯函数校验：非空、不含 NUL、有长度上限、为绝对路径，并拒绝以两个斜杠或反斜杠开头的网络与设备路径（UNC、\\?\ 等），通过后规范化；该路径只作用于单次请求、host 不保存状态——唯一例外是审阅会话（Review Session）：启动请求所选的项目目录在该会话生命周期内保存（作为 wa-cli preview --dir 的取值并在会话摘要中回显），会话结束即释放；路径无效或其下没有工作区时返回带可读原因的空态或拒绝，不得回退到默认定位；读取范围限于 <路径>/.writing-anything/ 且不跟随其下的符号链接，传给 wa-cli 时只作为 --dir 的取值
    rationale: 相对路径会随宿主工作目录漂移，绝对路径不会以 - 开头，传给 --dir 时不会被当作参数；UNC 与设备路径的一次 stat 就会触发网络访问；插件路由是简单 GET，任意网页可对本机端口发起跨站请求，读取范围与副作用必须先在校验处收口；静默回退会让作者误以为切换成功（overview-navigation 变更的面板路径切换确立此约定）；审阅会话是长驻子进程，其 --dir 必须在会话期间保持（dsh-review-proxy）
    enforcement:
      method: test
      detail: host 测试断言相对、NUL、超长、UNC 与设备路径被拒且返回空态与原因、不回退默认定位、不带参数时行为不变；用写入型假 wa-cli 断言 --dir 取值为所选路径且调用集合有界；评审核对校验函数为纯函数且路径 API 经注入；审阅根目录解析（reviewRootResolver）同样拒绝无效与无工作区的路径
    examples:
      good:
        - plugins/dsh-writing-viewer/src/root.ts 的 parsePanelRoot：注入 isAbsolute/resolve，拒绝相对、NUL、超长与 // 或 \\ 开头的路径；host.ts 的 fullSnapshot 对无效路径返回 rootError 空态
      bad:
        - 快照路由直接 join(process.cwd(), req.query.root) 后读取：相对路径漂移、UNC 路径触发网络访问，无工作区时静默回退显示另一个项目
  client-view-model-module:
    strength: SHOULD
    statement: DSH 插件 client 侧从快照等路由数据推导显示内容（计数、树、卡片、详情）的逻辑应单列为无 React、无 DOM、无 fetch 的纯函数模块，由 client 入口导入并经 tsdown 内联进同一 iife；client 入口只负责状态、事件绑定与以注入的 createElement 渲染，渲染函数对 createElement 保持纯，以便测试用记录型 createElement 断言渲染结构
    rationale: 手写 lazy-CJS 的 client 入口只能经假 react 观察插槽注册，计数、树构建与降级呈现这类逻辑若混在组件里就无法表驱动测试；纯模块可直接用 testdata 构建的真实快照驱动，后续产物视图（artifact-views）也能复用同一视图模型与选中接口（overview-navigation 变更确立）
    enforcement:
      method: review
      detail: 评审核对：推导逻辑位于独立模块（如 src/overview.ts）且不引用 react、window、document 或 fetch；渲染函数以参数接收 createElement；对应 vitest 以真实快照驱动视图模型并以记录型 createElement 断言渲染结构
    examples:
      good:
        - plugins/dsh-writing-viewer/src/overview.ts 的 overviewModel/unitTree/unitDetail 纯函数，client.ts 的 renderPanel(h, state, actions) 由 client.test.ts 以记录型 h 断言
      bad:
        - 在 ViewerPanel 组件体内直接遍历 snapshot 计算阻塞项去重与树缩进，测试只能确认组件被注册
  client-content-rendering-safety:
    strength: MUST
    statement: DSH 插件 client 侧渲染来自工作区（Workspace）的内容（Markdown 正文、YAML 源码、产物字段值）时，渲染器必须只产出结构化节点树（块类型与纯文本子节点）或带类别的 token 序列，经注入的 createElement 以纯文本子节点输出；不得拼接 HTML 字符串，不得使用 innerHTML 或 dangerouslySetInnerHTML，不得把产物内容交给 eval/new Function；高亮器与渲染器为零依赖纯模块，打包进 client bundle，渲染过程不得发起任何网络请求
    rationale: 插件只读面板渲染的是作者的产物原文，其中可以合法含有任意 HTML 与脚本字样；结构化节点 + createElement 纯文本子节点让每个字符保持转义文本，从根上排除执行面，这是 markdownview.ts 与 yamlhighlight.ts 已实现并被测试断言的形态。零依赖与离线约束来自里程碑定案（高亮打包进 bundle、不依赖网络与外部 CDN），把两者固化为标准避免后续视图功能重新引入字符串拼 HTML 或 CDN 依赖
    enforcement:
      method: test
      detail: vitest 断言渲染器输出仅为允许的块类型与纯文本（markdownview.test.ts 的 structured-blocks 与 text-intact 用例）、token 拼接逐字还原原文（yamlhighlight.test.ts 的 round-trip 用例），并核查构建产物 client.js 中除快照路由 fetch 外无任何网络请求与外部 URL
    examples:
      good:
        - plugins/dsh-writing-viewer/src/markdownview.ts 的 renderMarkdown 返回 MdBlock 节点树，client.ts 的 renderMarkdownBlocks 经 createElement 以文本子节点渲染，HTML 片段原样显示为文字
      bad:
        - 渲染器返回 HTML 字符串并经 innerHTML 注入，或从 CDN 加载 highlight.js/marked：产物中的脚本获得执行面，且断网时高亮失效
  plugin-perf-evidence:
    strength: SHOULD
    statement: DSH 插件包含规模敏感路径（快照聚合、大工作区的树与产物渲染）时，应以包内脚本生成合成夹具（经 wa-cli 真实命令创建、结构合法）并用计时探针实测关键阶段，把带日期与参数的记录追加到 docs/evidence/；性能检查是证据而非数值门槛——出现不可交互级卡顿才做渲染层优化，且不改快照响应结构；计时探针经环境变量门控，未提供夹具时默认测试套件跳过它
    rationale: polish-release 确立了完整可复用形态：scripts/gen-large-workspace.mjs（经 wa-cli 生成多卷多场景长篇）、scripts/perf-check.mjs（构建 wa-cli → 生成夹具 → 运行探针 → 追加证据）与 src/largeperf.test.ts（LARGE_WS_DIR 门控）。把「证据优先于门槛、探针不拖慢默认套件、夹具必须真实合法」固化为标准，后续规模敏感改动不再重新发明流程，也避免把探针塞进默认套件拖慢每次检查
    enforcement:
      method: review
      detail: 评审核对 docs/evidence/perf-check.txt 存在且带日期与规模参数、package.json 声明 perf:check 与 perf:workspace 脚本、探针测试在无环境变量时按设计跳过（默认套件不承担其耗时）
    examples:
      good:
        - pnpm run perf:check 在 220 单元夹具上把 host 聚合、首屏、单元切换与大产物渲染耗时记录进 docs/evidence/perf-check.txt；pnpm test 中探针因无 LARGE_WS_DIR 跳过
      bad:
        - 把性能断言写死为每次检查必须低于某个毫秒数，或用手写 YAML 文件冒充经 wa-cli 生成的夹具
  host-route-origin-guard:
    strength: MUST
    statement: 'DSH 插件经 webServer.register 注册的每条路由必须在 handler 内先做请求来源校验（Request Origin Guard），语义与宿主 /api 浏览器信任栅栏同构：Host 头绑定每个请求（回环字面量、监听绑定地址字面量、或插件配置的显式放行权威），sec-fetch-site: cross-site 拒绝，带 Origin 时须与 Host 同权威；拒绝时 403 + cache-control: no-store，不触达任何读取逻辑。宿主对具名路由不提供认证中间件，launch token 等身份凭据不在插件可注入面内——不得依赖宿主内部结构实现认证'
    rationale: 2026-10-20 实测插件路由在宿主认证栅栏外整库可读；宿主 webServer 对具名路由直接调用 handler，认证是 / 与 /api 私有实现。与宿主栅栏同构而非自创语义，评审与维护只需对照一处
    enforcement:
      method: test
      detail: routeguard 纯函数判定矩阵（Host/绑定字面量/allowedHosts 端口语义/cross-site/Origin 同源）+ host 路由 403/200 集成断言
    examples:
      good:
        - handler 首行 guardRequest(headers, {allowedHosts, bindHost})，拒绝即 403 return
      bad:
        - handler 直接读取请求参数并返回快照，不检查 Host 与浏览器标记
  opt-in-setup-actions:
    strength: MUST
    statement: DSH 插件的安装类能力（下载可执行文件、注册技能、修改宿主环境）必须整体置于默认关闭的配置开关之后：开关未开启时不得注册相应路由、不得注入相应宿主服务、不得修改 process.env、不得发起网络请求。下载只由面板显式动作触发，且只允许从本项目发布地址下载固定命名的发布产物（Release Asset，<name>-<os>-<arch> 与 SHA256SUMS），必须先按 SHA256SUMS 记录校验再原子落盘（临时文件加 rename、chmod 755），下载与校验失败不得留下部分文件；下载体积必须有界。spawn wa-cli skills install 物化技能时 cwd 必须是不含 .writing-anything 的目录（临时目录），使启用全程不向任何工作区写审计行；每次宿主启动至多物化一次、每次显式动作至多一次，不得轮询
    rationale: 下载可执行文件与修改宿主环境是插件最高风险的动作，必须默认关闭、显式触发、来源与校验固定；.writing-anything/ 的只读承诺（含 audit.log 例外边界）由 cwd 选择保证
    enforcement:
      method: test
      detail: 单测以注入式 fetch、文件与 spawn 适配器驱动：校验失败断言无落盘、开关关闭断言无路由注册与网络调用、物化断言 spawn 的 cwd 与 target 均在临时目录
  dsh-skill-provider-registration:
    strength: MUST
    statement: DSH 插件向宿主注册后备技能必须走宿主技能注册表的技能提供者（Skill Provider）接口（ctx.skills 的 registerProvider），并遵守其异步契约：list 与 get 必须返回 Promise——每个真实消费方都带 AbortSignal 调用，注册表会对返回值直接调 .then，同步返回会使整个 provider 被静默跳过；候选须含回传 get 的不透明 locator 字段，get 对不可用候选 resolve undefined。候选 rank 必须高于宿主全部技能层级（文件系统源 project 100/200、custom 300、user 400/500、bundled 600，运行时注册 250，取 >600），使任何同名外部技能优先、内置仅在无同名外部技能时提供；不得通过写入用户级或项目级技能目录实现注册或优先；注册的资源基址（resourceBase）省略时技能正文不得引用相对路径资源。假件测试必须按真实调用形态（带 AbortSignal、要求 thenable）驱动 provider，并以 rank 升序竞争断言与真实注册表取证双重钉住外部优先
    rationale: 作者要求外部同名技能优先、内置后备；rank 升序竞争中高于宿主全部技能层级（含 custom 300 与运行时 250）即让任何外部同名胜出，同时保留无外部时的内置供给。异步契约与 locator 是评审实证的硬要求：同步实现会被注册表整体跳过而插件自身状态毫无异常
    enforcement:
      method: test
      detail: 单测断言 rank 高于全部宿主层级（100/200/250/300/400/500/600 按升序竞争全部排在内置之前）；仍以带 AbortSignal 的 thenable 契约驱动并配真实注册表取证（docs/evidence/setup-check.txt 第 6 节）
  plugin-write-surface-declaration:
    strength: SHOULD
    statement: DSH 插件新增可选写入能力时，应把全部写入型 node:fs 调用收拢到该能力专用的独立模块（含其真实适配器），并在包内静态只读扫描测试中以显式名单声明这些模块：名单外模块出现任何写入型调用即测试失败，名单内文件名必须存在（防止改名后静默扩大豁免）。查看路径（快照、路由读取）保持零写入调用，不因新能力放宽
    rationale: plugin-builtin-setup 引入可选 setup 写入时采用的结构：写入面集中在一处并由静态测试钉住名单，viewer 路径的只读保证不被稀释，豁免也不会随改名漂移
    enforcement:
      method: test
      detail: 见 plugins/dsh-writing-viewer/src/readonly.test.ts 的 SETUP_WRITE_MODULES 与存在性检查；setupfs.ts 是唯一持有写入型 node:fs 调用的适配器模块
  host-env-cli-fallback:
    strength: SHOULD
    statement: DSH 插件需要让宿主 shell 以后备方式解析自带 CLI 时，应把二进制目录幂等追加到 process.env.PATH 末尾（目录已在 PATH 任意位置则不动，仅开关开启后），保持既有 PATH 顺序使外部版本优先、无外部版本时内置兜底，并在 README 写明该宿主全局副作用的生效边界：只影响本宿主进程后续派生的子进程，不改变用户 shell 配置
    rationale: 外部优先由既有 PATH 顺序天然保证；追加只在无任何外部命中时让内置目录兜底；幂等（任意位置存在即不动）与边界说明防止重复叠加与误解
    enforcement:
      method: review
  review-proxy-thin:
    strength: MUST
    statement: DSH 插件代理 wa-cli 阅读页（Reading View）时只做薄转发：只转发固定的精确路径集合（阅读页 GET / 与 POST /feedback、/confirm、/author-review），上游只连 127.0.0.1 上本插件启动的会话端口；不得改写上游响应正文（含 HTML 与内联脚本）；响应头只允许去掉 X-Frame-Options、把 CSP 的 frame-ancestors 'none' 换成 'self'，以及去掉描述传输本身而由宿主重新派生的头（content-length、content-encoding、transfer-encoding、connection、keep-alive），不得放宽上游 CSP 的其他指令（尤其 script-src 与 default-src）——内嵌后阅读页运行在 DSH 源下，其安全性依赖 wa-cli 的 CSP 与模板转义；会话令牌只存在于 host 进程内存，不得出现在任何插件响应、日志或 client 状态中，代理的错误回显不得包含上游 URL 或原始错误信息；审阅相关模块不得含写入型 node:fs 调用，也不得加入静态只读扫描测试的写入模块名单，工作区写入只能出自 wa-cli 子进程
    rationale: wa-cli 是唯一真相来源，插件只做薄封装；改写内联脚本会使 CSP 哈希失配，改写正文等于在插件里分叉阅读页逻辑；Node fetch 自动解压且宿主可能套 gzip，透传传输头会使正文与长度不符；内嵌页与 DSH 同源，放宽 script-src 即把 DSH 源暴露给阅读页内容；作者经纯 http 的 Tailscale tailnet 远程访问，令牌不出宿主机可缩小暴露面
    enforcement:
      method: test
      detail: 代理单测以假上游断言：未知路径不转发、浏览器 token 与 X-WA-Token 被丢弃并由会话令牌覆盖、正文逐字节回传、头只改 XFO、frame-ancestors 与传输头且 script-src 原样、全部插件响应与页面不含令牌与上游地址、上游不可达时不回显原始错误；readonly.test.ts 的静态扫描覆盖审阅模块且写入名单不变
    examples:
      good:
        - proxy 把上游 CSP 中 frame-ancestors 'none' 替换为 'self'，script-src 的 sha256 哈希原样回传
      bad:
        - proxy 用字符串替换把阅读页 HTML 里的 fetch('/feedback') 改成带前缀的地址
  review-child-lifecycle:
    strength: MUST
    statement: 插件启动的 wa-cli preview --serve 子进程必须有界：同一宿主至多一个；启动在固定时限内未读到首行信封即终止子进程并报告失败；会话结束（显式结束、空闲时限、启动另一会话、子进程退出、插件卸载与宿主停止）时必须终止子进程并释放会话状态；必须持续读空子进程 stdout 防止管道阻塞；一次作者动作只调用一次 wa-cli，不得以轮询或健康检查名义反复调用 wa-cli
    rationale: 长驻子进程是插件新引入的资源，泄漏会残留监听端口与进程；有界调用延续 plugin-cli-audit-exception 对审计日志的保护
    enforcement:
      method: test
      detail: 会话单测以注入式 spawn 假件驱动：启动超时、非零退出、替换与空闲到期都断言 kill 被调用且状态清空；dispose 断言子进程被终止；断言一次启动只 spawn 一次；宿主 SIGTERM 停止后的子进程清理另有实测记录
    examples:
      good:
        - 启动新会话前先 kill 旧子进程并清空会话状态（端口由系统分配，新旧进程不争用端口）
      bad:
        - 为探测阅读页是否存活每分钟 spawn 一次 wa-cli status
  host-resource-teardown-effect:
    strength: MUST
    statement: DSH 插件 host 持有的长驻资源（子进程、定时器、process 级监听）必须经 cordis 的 ctx.effect 返回的 disposer 释放，使插件 fiber 卸载（移除、重载、宿主经 SIGTERM/SIGINT 停止）时资源随之释放；不得依赖 ctx.on('dispose')——DSH 0.2.x 的 cordis 4 不发出 dispose 事件，该监听永不触发
    rationale: dsh-review-proxy 评审实证：cordis 4.0.5 的 Events 接口与实现都没有 dispose 事件，按 ctx.on('dispose') 写的清理在真实宿主中静默失效；DSH 的 profile-boot 在 SIGTERM/SIGINT 时 dispose 应用 fiber，effect disposer 因而覆盖常规停止路径
    enforcement:
      method: test
      detail: host 测试以假 ctx.effect 捕获 disposer 并断言其释放资源；readonly.test.ts 静态扫描禁止运行时源码出现 on('dispose' 或 on("dispose"
    examples:
      good:
        - ctx.effect(() => () => { process.removeListener('exit', onExit); sessions.dispose(); }, 'review sessions')
      bad:
        - ctx.on('dispose', () => sessions.dispose())
  host-cli-arg-guard:
    strength: MUST
    statement: DSH 插件把客户端提供的非路径值（如单元引用）作为 wa-cli 位置参数传入前，必须经纯函数校验：非空、有长度上限、不以 - 开头、不含控制字符，并且只经参数列表传递、从不经 shell
    rationale: 以 - 开头的值会被 wa-cli 当作参数解析，形成参数注入；路径类输入已由 host-route-path-input 约束，非路径输入需要同等的收口
    enforcement:
      method: test
      detail: 单测断言 validReviewUnit 拒绝 --output=x、-x、含换行与超长输入，路由在校验失败时返回 400 且不 spawn
