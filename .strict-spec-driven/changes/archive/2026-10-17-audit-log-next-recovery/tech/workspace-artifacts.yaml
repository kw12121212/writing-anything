schema: strict-spec-driven/delta-tech/v1
schema_version: 1
artifact_type: delta_tech
schema_file: templates/strict-spec-driven/schemas/delta-tech.yaml
target_standard: workspace-artifacts
operations:
  ADDED: {}
  MODIFIED:
    atomic-writes:
      strength: MUST
      statement: 写入工作区产物必须经过 internal/workspace 的统一写入函数：先写同目录的临时文件再重命名，覆盖已有文件时保留其权限；不得直接用 os.WriteFile 覆盖产物。唯一例外是审计日志（Audit Log，.writing-anything/audit.log）：追加式运维痕迹用单次 O_APPEND 写入保证行完整（临时文件加重命名无法表达多进程追加），不进 Schema 校验与 changedPaths（见 cli 主规格 audit-log）。
      rationale: 进程中断或磁盘写满时，直接覆盖会留下写了一半的产物，作者的内容随之损坏；统一入口也让权限处理保持一致。
      enforcement:
        method: review
        detail: 审计日志的直写路径（internal/cli/audit.go 的 appendAudit）评审时核对：单次 O_APPEND 写、1 MiB 轮转一份、写失败仅 stderr
  REMOVED: {}
