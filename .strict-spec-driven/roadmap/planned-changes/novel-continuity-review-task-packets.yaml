schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: review-task-packets
  milestone: novel-continuity
status: planned
summary: 审查任务包（Review Task Packet）：分治的语义审查
details: wa-cli review plan <work|unit> 按维度生成审查任务包：人物一致性（人物 × 章）、伏笔回收质量、因果与动机、视角与揭示边界、文风与情绪节奏（以文风漂移发现项和曲线偏离为线索）。每个任务包只含一段正文、相关台账切片和检查清单，并满足上下文预算；纵向任务（例如人物弧光、全书张力走势）使用状态历史、摘要和曲线数据，而不是全文。任务由接入的 Agent 调度执行，可以用全新的子 Agent（Subagent）会话并行；结果通过 wa-cli review submit <packet> 写回，wa-cli 校验每个清单项都有结论，再汇总为作品级审查报告。
depends_on:
  - continuity-review
  - layered-summaries-and-budget
  - emotion-pacing-curve
