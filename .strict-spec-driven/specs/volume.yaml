schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: volume
  title: 卷末检查点（Volume Checkpoint）
requirements:
  checkpoint-artifact:
    strength: MUST
    statement: 部单元（直接子层含章（chapter）的汇总单元，即卷；novel 文体为 part）目录下的 checkpoint.yaml 是卷末检查点（Volume Checkpoint）：含 schema_version（1）、part（部单元引用）、scene（本部子树按单元树先序最后一个场景的引用）、fingerprint（生成时子树全部场景正文 SHA-256 按先序拼接后的 SHA-256，64 位十六进制；与当前指纹一致且最后场景未变时重生成不写文件）、canon（本部各场景写后收口（Close-out）记录 canon 数组的并集，按首次出现顺序）、states（本部收口提交且当前 status 为 confirmed 的状态变化提议 id，按文件顺序）、threads（本部场景 planted_in 或 recovered_in 指向的伏笔 id，按文件顺序）、decisions（生成时决策队列中 status 为 open 的决策 id，按队列顺序）、sampled（确定性抽取的收口核对样本数组，每项含 scene（提交所在场景引用）、kind（state 或 knowledge）、id（台账条目 id）与 text（状态变化描述或被获知设定条目的 text），至多 3 项，不重复）、confirmed_by_author（布尔，缺省为 false）与取值化确认字段 confirmation（作者确认原话摘要，confirmed_by_author 为 true 时非空）与 confirmed_at（UTC，YYYY-MM-DDTHH:MM:SSZ，同上）。字段形态不符合要求时报告 artifact.schema-violation（field 为对应点分路径）。wa-cli validate 整体校验时必须对每个可加载作品每个部单元目录中存在的 checkpoint.yaml 做 Schema 与领域校验并计入 checked：part 与所在部一致、scene 是该部子树先序最后且类型为 scene 的单元、canon 与 states 的 id 分别在设定集与状态台账中、threads 的 id 在伏笔台账中、decisions 的 id 在决策队列中、sampled 每条的 scene 为本部场景且 id 在对应台账中，违反时报告 volume.unknown-entry（field 为对应位置，message 含该 id）；confirmed_by_author 为 true 而 confirmation 或 confirmed_at 缺失或为空时报告 volume.incomplete-confirmation（field 为空）。checkpoint.yaml 途经符号链接或不是普通文件时按 artifact.not-found 处理。没有 checkpoint.yaml 的部不做检查；wa-cli validate <path> 对该位置的 checkpoint.yaml 执行同样的检查。
    scenarios:
      validate-unknown-state:
        - GIVEN: novel 作品 my-novel 的 part-one 有 checkpoint.yaml，states 含 state-9 而 state.yaml 没有该条目
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: 报告 volume.unknown-entry（message 含 state-9），退出码为 1
      validate-incomplete-confirmation:
        - GIVEN: checkpoint.yaml 的 confirmed_by_author 为 true 而 confirmation 为空
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: 报告 volume.incomplete-confirmation，退出码为 1
  checkpoint-commands:
    strength: MUST
    statement: wa-cli volume checkpoint <part> 必须生成该部的卷末检查点：<part> 引用的单元必须是声明 stage_from_children 的汇总单元（否则报告 volume.not-volume，message 含实际类型）；其子树全部场景的 stage 为 done，否则报告 volume.scenes-open（path 为该 work.yaml，message 列出未完成场景的引用，至多 5 项后加省略说明，next 含 wa-cli status --dir <dir> --json）。通过后整体写出部单元目录下的 checkpoint.yaml：part、scene（先序最后一个场景）、canon、states、threads、decisions 与 sampled 按 checkpoint-artifact 的取值；sampled 从本部各场景 closeout.yaml 记录的 state 与 knowledge 提交中抽取——以部单元引用与子树全部场景正文串联指纹（SHA-256，同分层摘要的指纹）为种子做确定性洗牌后取前 3 条（不足取全部），同一工作区状态总是得到同一抽取结果；已有 checkpoint.yaml 且 scene 与指纹都与既有记录一致时不写文件（changedPaths 为空数组，--json 输出既有记录），否则整体替换。--confirmed-by-author 与 --confirmation 不被本命令接受（确认经 volume confirm）。成功时 changedPaths 为 [checkpoint.yaml]，--json 输出的 checkpoint 字段含 part、path、scene、canon、states、threads、decisions、sampled、confirmedByAuthor（false）、confirmation（null）、channel（null）与 confirmedAt（null），退出码为 0；这些失败情况不写文件，退出码为 1。wa-cli volume confirm <part> --confirmed-by-author --confirmation <原话摘要> 必须写入作者确认：--confirmed-by-author 与非空白 --confirmation 必须同时给出（否则报告 volume.incomplete-confirmation，next 含 wa-cli help volume confirm --json）；checkpoint.yaml 不存在时报告 volume.not-found（next 含 wa-cli help volume checkpoint --json）；已有 checkpoint.yaml 不通过校验时报告其诊断；确认把 confirmed_by_author 置为 true 并写入 confirmation、确认渠道（Confirmation Channel）channel（本命令为 cli，作者在本地阅读页确认时为 preview）与 confirmed_at（UTC，YYYY-MM-DDTHH:MM:SSZ），只改这四个字段并保留其他内容与 YAML 注释；再次确认报告 volume.already-confirmed。changedPaths 为 [checkpoint.yaml]，--json 输出确认后的记录，退出码为 0。 checkpoint.yaml 的 channel 只能为 cli、preview 或 null，否则报告 artifact.schema-violation；已确认而没有 channel 的检查点按 cli 解释，--json 输出的 channel 为 cli。
    scenarios:
      checkpoint-generate:
        - GIVEN: part-one 下全部场景 stage 为 done，各场景有 closeout.yaml（共提交 5 条状态变化与知情提议）
        - WHEN: 运行 wa-cli volume checkpoint my-novel/part-one --dir D --json
        - THEN: checkpoint.yaml 的 sampled 恰有 3 条（kind、scene、id 与 text 来自收口记录），changedPaths 含 checkpoint.yaml；再次运行时 changedPaths 为空数组且 sampled 与上次完全一致，退出码为 0
      checkpoint-scenes-open:
        - GIVEN: part-one 的 scene-2 还在 review 阶段
        - WHEN: 运行 wa-cli volume checkpoint my-novel/part-one --dir D --json
        - THEN: 报告 volume.scenes-open（message 含 my-novel/scene-2），没有写出 checkpoint.yaml，退出码为 1
      confirm-records:
        - GIVEN: part-one 有 checkpoint.yaml 且未确认，工作区 gate_level 为 strict
        - WHEN: 运行 wa-cli volume confirm my-novel/part-one --confirmed-by-author --confirmation 作者：本部核对无误 --dir D --json
        - THEN: confirmed_by_author 为 true、confirmation 为该摘要、channel 为 cli、confirmed_at 为 UTC 时间，changedPaths 为 checkpoint.yaml，退出码为 0
      confirm-missing:
        - GIVEN: part-two 没有 checkpoint.yaml
        - WHEN: 运行 wa-cli volume confirm my-novel/part-two --confirmed-by-author --confirmation ok --dir D --json
        - THEN: 报告 volume.not-found（next 含 wa-cli help volume checkpoint --json），退出码为 1
  volume-accept-gate:
    strength: MUST
    statement: wa-cli accept <unit> 对 scene 单元必须检查更早各部的卷末检查点：按单元树先序早于该单元的每个部单元（不含该单元所属的部）目录下存在 checkpoint.yaml 而 confirmed_by_author 不为 true 时——strict 关卡强度下报告 error 级 volume.unconfirmed（path 为该 checkpoint.yaml，message 含部单元引用，next 含 wa-cli volume confirm <part> --dir <dir> --json 与 wa-cli review show <unit> --dir <dir> --json），阻塞验收；fast 与 standard 关卡强度下以 warning 级同名诊断提示，不阻塞。checkpoint.yaml 不通过校验时报告 volume.invalid（保留其诊断，path 为该 checkpoint.yaml）；fast 与 standard 下同样只提示。该单元所属部的检查点不阻塞本部场景的验收；没有任何更早部的 checkpoint.yaml 时验收行为与引入本规格前完全一致。
    scenarios:
      strict-blocks-next-part:
        - GIVEN: gate_level 为 strict，part-one 已生成 checkpoint.yaml 但未经确认，part-two 的 scene-9 处于审稿阶段且其余验收条件满足
        - WHEN: 运行 wa-cli accept my-novel/scene-9 --confirmed-by-author --confirmation 作者：可以 --dir D --json
        - THEN: diagnostics 中有一条错误码为 volume.unconfirmed、path 为 part-one 的 checkpoint.yaml 的诊断，没有写出 acceptance.yaml，退出码为 1
      strict-passes-after-confirm:
        - GIVEN: 同上，但 part-one 的检查点已经 wa-cli volume confirm 确认
        - WHEN: 运行 wa-cli accept my-novel/scene-9 --confirmed-by-author --confirmation 作者：可以 --dir D --json
        - THEN: 没有 volume.unconfirmed 诊断，验收成功，退出码为 0
      fast-warns-only:
        - GIVEN: 同 strict-blocks-next-part，但 gate_level 为 fast
        - WHEN: 运行 wa-cli accept my-novel/scene-9 --dir D --json
        - THEN: diagnostics 中有一条 severity 为 warning、错误码为 volume.unconfirmed 的诊断，验收成功，退出码为 0
      same-part-not-blocked:
        - GIVEN: gate_level 为 strict，scene-2 与 scene-1 同属 part-one，part-one 已有未确认的 checkpoint.yaml
        - WHEN: 运行 wa-cli accept my-novel/scene-2 --confirmed-by-author --confirmation 作者：可以 --dir D --json
        - THEN: 没有 volume.unconfirmed 诊断（本部检查点不阻塞本部场景），退出码为 0
