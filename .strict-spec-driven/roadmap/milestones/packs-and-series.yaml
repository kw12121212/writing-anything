schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: ../schemas/roadmap-milestone.yaml
milestone:
  packs-and-series:
    title: 规范包、文风量化与系列文章（Packs, Style Metrics & Series）
order: 400
goal: 第三方可以通过 git 地址或本地路径安装并锁定规范包（Pack）；作者能从过往文章和自己的修改中得到文风画像（Style Profile）与作者偏好（Author Preference）提议；文风与节奏可以用确定性指标（Metric）和 AI 量化评分衡量，偏离作者基准时给出文风漂移（Style Drift）发现项；多篇文章组成系列（Series，文章领域也称专栏）时共享规范包、事实库（Fact Store）与已验收单元的摘要（Summary）。
scope:
  in:
    - wa-cli pack install / list / remove，支持 git 地址与本地路径，带版本锁定
    - pack learn：从作者样文生成文风画像提议，作者确认后写入
    - 从人工修改 diff 积累作者偏好提议
    - series：多作品共享 pack、事实库与已接受单元摘要
    - 本地 HTML 预览（作者可选择是否使用）与批注回写
    - 确定性文风与节奏指标，以及相对文风画像的文风漂移检测
    - AI 量化评分：锚定评分（Anchored Scale）、多次独立打分、分歧报告、作者校准（Calibration）
  out:
    - 中心化 pack registry 与托管服务
done_criteria:
  - 从 git 地址安装的 pack 被锁定到具体版本，并能校验通过
  - 文风画像与偏好只以提议形式出现，作者确认前不影响规则
  - 系列中第二篇文章的 context 输出包含第一篇的已接受摘要
  - 在 wa-cli preview 生成的预览中添加的批注，经 wa-cli comments import 回写后出现在 wa-cli comments 中
  - 单元在摘要生成后又被修改时，摘要被标为过期，context 输出中注明
  - 偏离文风画像超过阈值的单元输出漂移发现项，附带指标数值与段落位置
  - 分歧超过阈值的 AI 评分转为作者决策；与作者一致率低于阈值的评分维度被降级为仅供参考
intake_questions:
  - id: pack-registry
    question: 是否需要中心化的 pack registry？
    context: git 地址足以支撑早期分发，registry 涉及托管与审核。
    impact: 影响 pack 标识与版本解析方式。
    recommendation: 先只支持 git 地址与本地路径，pack 标识预留命名空间，registry 以后再评估。
  - id: metric-blocking
    question: 指标类发现项是否阻塞验收？
    context: AI 评分有波动，确定性指标也只能反映偏离而非好坏。
    impact: 决定指标在关卡中的作用与作者的工作量。
    recommendation: 默认不阻塞，只进入修订建议与决策队列；规范包在严格模式下可以显式把某些指标声明为阻塞。
planned_changes: {}
dependencies:
  - wechat-marketing-and-mcp
risks:
  - 文风学习的效果依赖 Agent 的分析质量，CLI 只负责提议的结构与确认流程
  - 指标一旦被当作目标，写作会变得套路化；指标只用于发现偏离作者基准或规划，不作为绝对的好坏分数
status: proposed
notes: []
details: 系列是后续系列小说共享设定集（Canon）的基础，数据模型按跨作品共享设计。摘要机制在本里程碑首次引入，长篇小说的分层摘要在其上扩展。
