schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: plugin-route-origin-guard
  status: proposed
summary:
  what:
    - '为 dsh-writing-viewer 插件的两条 host 路由（/dsh-writing-viewer/workspace 与 /dsh-writing-viewer/snapshot）加请求来源校验：照 DSH 自身 /api 浏览器信任栅栏（@deepseek-ai/dsh-client-connection 的 api-request-trust）同构的语义——Host 栅栏（回环字面量、监听绑定地址字面量、或插件配置 allowedHosts 中的权威）绑定每个请求，sec-fetch-site 为 cross-site 拒绝，带 Origin 头时必须与 Host 同权威；不满足返回 403 + cache-control: no-store 的 JSON 错误体。面板 client 的同源 fetch 不受影响'
  why:
    - 2026-10-20 review 实测：无 token GET / 返回 401 而插件路由返回 200 整库可读——路由不在宿主认证栅栏内，跨站页面与 DNS rebinding 可借浏览器读取写作工作区；宿主 webServer（@deepseek-ai/dsh-host-webserver）对具名路由直接调用 handler、无认证中间件，认证栅栏是 / 与 /api 各自 handler 私有实现，插件经文档化通道拿不到 launch token，因此插件须在自己的 handler 内做来源校验
scope:
  in:
    - plugins/dsh-writing-viewer/src/routeguard.ts（新纯函数模块）；plugins/dsh-writing-viewer/src/host.ts（路由 handler 接入校验与 allowedHosts 配置）；plugins/dsh-writing-viewer/src/routeguard.test.ts、host.test.ts（测试）；plugins/dsh-writing-viewer/dist/index.js（重建）；plugins/dsh-writing-viewer/README.md（约束 8、安全提示与 allowedHosts 配置说明）；docs/GLOSSARY.md（请求来源校验词条）；delta 规格 dsh-plugin 新增 route-origin-guard 需求；delta 技术 dsh-plugin-structure 新增对应规则
  out:
    - 不改 client 渲染与快照结构（client.ts、snapshot.ts、overview.ts 等不动）；不实现 token/cookie 认证体系（宿主无文档化通道，design 记录依据）；不改 DSH 宿主或其配置语义；allowedHosts 不默认放行任何远程权威（用户经 tailscale --trusted-host 访问面板时需显式配置）
unchanged_behavior:
  - 合法同源请求行为不变（面板加载、刷新、路径切换照常）；路由响应结构与快照聚合逻辑不变；只读约束不变（校验只读请求头，不新增任何文件访问）
