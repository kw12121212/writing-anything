# 完成标准对账表（Reconciliation Table）：.strict-spec-driven/roadmap/archive/milestones 下每个已归档里程碑的
# 每条完成标准（Done Criteria，原文逐字一致）映射到一个或多个测试函数（「包目录.测试函数名」）。
# 由 internal/tools/criteria 的 TestCriteriaReconciliation（go test ./... 中执行）强制：缺表项、原文变化、
# 测试函数不存在或首层无条件 t.Skip 时失败。hardened_by 登记 2026-10-07 里程碑审计发现缺口、
# 由已归档加固变更修复的完成标准，tests 中含该加固变更新增或修正的测试。
# 加固变更 closeout-body-scan（正文疑似专有名词扫描）与 genre-style-isolation（小说不继承文章文风）修复的
# 审计缺口没有对应的已归档完成标准原文，因此不出现在 hardened_by 中；其测试由加固里程碑归档时补表覆盖。
# 新里程碑归档（或修改已归档的完成标准）时，在同一变更中同步补表或重新确认映射。
schema_version: 1
entries:
- milestone: kernel-foundation
  criterion: wa-cli init 创建的工作区通过 wa-cli validate；损坏的产物返回带错误码、产物路径与修复命令的 --json 诊断
  tests:
  - internal/cli.TestInitFresh
  - internal/cli.TestValidateMissingParts
  - internal/cli.TestValidateSingleArtifact
  - internal/cli.TestValidateConfigDiagnostics
- milestone: kernel-foundation
  criterion: 能用 CLI 创建一篇文章单元、登记作者素材，并通过 status / next 看到当前阶段与下一步命令
  tests:
  - internal/cli.TestNew
  - internal/cli.TestSourceAdd
  - internal/cli.TestStatusUnits
  - internal/cli.TestNext
  - internal/cli.TestNextStageCommands
  hardened_by:
  - next-stage-commands
- milestone: kernel-foundation
  criterion: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out 在干净仓库通过
  tests:
  - internal/tools/covercheck.TestCoverage
  - cmd/wa-cli.TestNoDevToolDependency
- milestone: kernel-foundation
  criterion: wa-cli config resolved --json 输出 文体 → 规范包 → 项目配置 的合并结果与每项来源；含未知规则类型或可执行内容的规范包校验失败
  tests:
  - internal/cli.TestConfigResolvedLayers
  - internal/cli.TestConfigResolvedDefault
  - internal/cli.TestValidateConfigRuleTypes
  - internal/cli.TestValidatePacksAndReferences
  - internal/schema.TestExecutable
- milestone: kernel-foundation
  criterion: 存在未解决的阻塞决策时，wa-cli advance 拒绝推进关联单元
  tests:
  - internal/cli.TestDecisionBlocksAdvance
  - internal/work.TestDecisionBlockers
- milestone: kernel-foundation
  criterion: 反馈按文本锚点定位；正文修改后能重新定位，无法定位时标为失去锚点；wa-cli feedback watch 能输出新增的反馈
