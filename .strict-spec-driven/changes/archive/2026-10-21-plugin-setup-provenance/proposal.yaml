schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: plugin-setup-provenance
  status: proposed
summary:
  what:
    - 让面板在使用现场直接回答「内置还是外置」：(A) setup 状态新增技能来源对照——host 经已注入的宿主技能注册表 list()，对内置名单中的每个 wa-* 技能报告当前胜出来源（外部 project-dsh/project-agents/custom/user-dsh/user-agents/bundled 标签与 SKILL.md 路径，或内置 dsh-writing-viewer）与内置后备状态，面板设置区渲染对照表；(B) CLI 溯源标记——插件下载安装 wa-cli 时在同目录写 sidecar 标记 wa-cli.dsh-writing-viewer.json（managedBy、sha256、installedAt），状态按「有标记且 sha256 与磁盘二进制一致 → 插件安装；否则非插件安装（含操作者经 waCliPath 指定的路径）」如实分类显示
    - 让面板在使用现场直接回答「内置还是外置」：(A) setup 状态新增技能来源对照——对内置名单中的每个 wa-* 技能按文件系统技能源的优先级顺序探测标准技能目录（项目 .dsh/skills、项目 .agents/skills、用户 ~/.dsh/skills、~/.agents/skills，经 ?root= 与面板定位一致、走与快照路由相同的路径校验），存在外部副本即显示来源标签与 SKILL.md 路径并标明内置后备就绪，否则显示内置；(B) CLI 溯源标记——插件下载安装 wa-cli 时在同目录写 sidecar 标记 wa-cli.dsh-writing-viewer.json（managedBy、sha256、installedAt），状态按「有标记且 sha256 与磁盘二进制一致 → 插件安装；否则非插件安装（含操作者经 waCliPath 指定的路径）」如实分类显示
  why:
    - 作者要求在 DSH 内使用时能区分技能与 CLI 是内置还是外置：现有区分散落在加载包裹层与磁盘核查、面板不可见；且 install.sh 与插件默认同目录，无法区分二进制是谁装的——溯源标记消除该歧义
    - 作者要求在 DSH 内使用时能区分技能与 CLI 是内置还是外置：技能来源此前只在加载包裹层可见、面板不可见；install.sh 与插件默认同目录，无法区分二进制是谁装的。实施中推翻初版的注册表合并清单方案（web profile 的 dsh-skill-filesystem 挂在 agent preset 层，静态插件行查询只见全局层），定案为目录存在性比对
scope:
  in:
    - plugins/dsh-writing-viewer 的 setup 核心（标记写入/校验、来源对照聚合）、状态路由响应（additive 新字段）、client 设置区对照表视图、插件测试、README 与 docs/GLOSSARY.md、实测证据
  out:
    - 优先级语义（外部优先、内置后备）的任何改变；下载校验安装链路与开关语义的改变；技能正文内容的修改（保持 wa-cli 原文）；向 cliInstallDir 与临时目录之外的任何写入
unchanged_behavior:
  - enableSetup 关闭（默认）时行为不变；既有状态字段只增不改；对照表在宿主 skills 服务不可用或列举失败时按降级呈现（report 为 null）不影响其余状态；标记写入失败不阻塞安装（如实分类为非插件安装）；单飞行、来源校验、工作区零触碰承诺不变
  - enableSetup 关闭（默认）时行为不变；既有状态字段只增不改；对照表在未注册前为 null，不影响其余状态；标记写入失败不阻塞安装（如实分类为非插件安装）；单飞行、来源校验、工作区零触碰承诺不变
