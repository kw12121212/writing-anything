lesson:
  id: wa-cli-42ec4e
  title: 外部工具把调用 wa-cli 当只读访问前，先实测一次完整调用：审计日志每次都追加，假执行器测试会把它完全掩盖
category: coding
status: active
created_at: '2026-10-20T02:05:17.087Z'
updated_at: '2026-10-23T09:54:50.356Z'
context: workspace-snapshot 变更为 DSH 插件的快照服务以注入式 CliRunner 调用 wa-cli 只读命令（status/validate/next/timeline --json），并在 delta 规格中宣称快照前后工作区文件清单、内容与修改时间完全一致
observation: fresh-context 评审用真实构建的 wa-cli 二进制对夹具副本实测：一次只读 status --json 就新建了 .writing-anything/audit.log（265 B）；internal/cli 的审计契约对每次调用（含只读命令）都追加一行，子进程路径无抑制手段（runQuiet 仅进程内 MCP）。而全部插件单测都用假执行器（罐装 JSON、零副作用），只读约束测试因此全绿——假执行器恰好掩盖了真实二进制的唯一写入路径
takeaway: 凡以子进程消费 wa-cli（或任何带运维副作用的 CLI）并宣称只读的组件：先用真实二进制对干净副本实测一次完整调用序列，确认副作用清单；把不可避免的副作用（如 audit.log 追加）作为显式例外写进自己的规格与文档，并用写入型假二进制（模拟副作用 + 输出罐装数据）钉住「例外之外逐字节不变」，而不是用零副作用假执行器自证清白
applies_when: 编写以子进程调用 wa-cli 的外部工具、插件或脚本，尤其是要对其宣称只读性、或只用假执行器/罐装输出做测试时
