schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: skills
operations:
  ADDED: {}
  MODIFIED:
    builtin-skills:
      strength: MUST
      statement: wa-cli 必须随二进制提供十二个技能（Skill）：wa-init、wa-brief、wa-outline、wa-draft、wa-review、wa-revise、wa-publish、wa-plan、wa-scene、wa-continuity、wa-assemble 与 wa-auto，不需要网络访问或额外文件。每个技能是一个目录，含 SKILL.md：开头为 --- 包住的 YAML 文件头，只含 name（与目录名相同，小写字母、数字与连字符，不超过 64 个字符）与 description（非空，不超过 1024 个字符），之后为非空的正文；目录结构与通用的 Agent Skills 格式兼容。技能的正文只说明何时调用哪些 wa-cli 命令、何时必须停下来询问作者（含「必须停下来问作者」一节）与逐条检查退出码的会话协议（含「会话协议」一节：可执行的 wrapper 模板——set -euo pipefail、失败即停读诊断、不用 || true 或输出重定向吞错——以及「经 harness 提问工具得到的作者决定用 decision add / decide 回写决策队列」的映射指引；模板与指引不是业务逻辑），不实现业务逻辑；正文中 wa-cli 之后的命令名（一个或两个小写词）都必须是 wa-cli help --json 列出的命令，同一处写出的 --参数 都必须是该命令声明的参数。wa-cli skills list 必须只读地输出 skills 数组（按名称排序），每项含 name、description 与 commands（引用的 wa-cli 命令，按命令注册表规范化：两个词组成已登记的命令时取两个词，否则只取命令名；去重、按出现顺序），不需要工作区。
      scenarios:
        list-skills:
          - GIVEN: 任意目录
          - WHEN: 运行 wa-cli skills list --json
          - THEN: skills 依次为 wa-assemble、wa-auto、wa-brief、wa-continuity、wa-draft、wa-init、wa-outline、wa-plan、wa-publish、wa-review、wa-revise 与 wa-scene，每项的 commands 非空，退出码为 0
        commands-exist:
          - GIVEN: 内置的十二个技能
          - WHEN: 把每个技能引用的命令与 wa-cli help --json 的 commands 对照
          - THEN: 每个引用的命令都在其中
        session-protocol-present:
          - GIVEN: 内置的十二个技能
          - WHEN: 读取每个技能的 SKILL.md 正文
          - THEN: 每个技能都含「会话协议」一节，节内有 set -euo pipefail 的 wrapper 模板、吞错（|| true 或输出重定向）的禁止说明与经 harness 提问工具得到作者决定后用 decision add / decide 回写的映射指引
  REMOVED: {}
