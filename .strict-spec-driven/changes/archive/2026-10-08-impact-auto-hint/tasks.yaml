      status: complete
    cli-set-commands:
      text: internal/cli：canon set、state set、knowledge set、threads set、scene contract 写入成功且语义字段变化时调用自动传播，输出 impact 数组、追加 changedPaths、文本提示；失败时 warning
      status: complete
    cli-next:
      text: internal/cli next：open 复查标记场景的 commands 追加 impact clear 与 review plan 命令；done 场景有 open 标记时列出并提示
      status: complete
    docs-skills:
