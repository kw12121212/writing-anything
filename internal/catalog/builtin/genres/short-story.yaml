# 短篇小说（Short Story）：以场景（Scene）为单元推进 简报 → 大纲 → 草稿 → 审稿与验收。虚构内容不做论断出处检查：
# 前提与关键转折（写作简报中的核心观点）必须关联作者素材或确认记录。故事根单元的大纲节是情节节拍（Story Beat），
# 每个场景在自己的大纲里声明轻量场景契约（Scene Contract：出场人物、承担的节拍、揭示边界）。三条小说专用规则
# （小说 AI 腔词表、对话标点、视角与人称一致）都是启发式质量检查，severity 为 warning，不阻塞验收。默认写作法在
# 后续的结构类写作法变更中提供，作者可先通过写作简报选用已有的写作法。
schema_version: 1
id: short-story
title: 短篇小说
description: 以场景为单元的短篇小说：作者提供前提、人物与关键转折，Agent 按场景草拟、审稿并导出；虚构内容不做论断出处检查。
unit_types:
  - id: story
    title: 故事
    children: [scene]
    brief_required: [premise, pov, length, key_messages]
  - id: scene
    title: 场景
stages:
  - id: brief
    title: 写作简报
    required_artifacts: [brief]
  - id: outline
    title: 大纲
    required_artifacts: [outline]
  - id: draft
    title: 草稿
    required_artifacts: [draft]
  - id: review
    title: 审稿与验收
    required_artifacts: [review, acceptance]
rules:
  length:
    type: length-range
    severity: warning
    params: {min: 1000, max: 20000}
  fiction-cliches:
    type: ai-cliche
    severity: warning
    params:
      terms:
        - 眼底闪过一丝
        - 嘴角勾起一抹
        - 不易察觉的笑
        - 空气仿佛凝固
        - 时间仿佛静止
        - 心中五味杂陈
        - 命运的车轮
        - 岁月静好
        - 说不清道不明
        - 仿佛在诉说着什么
        - 内心深处
        - 无声地呐喊
  dialogue:
    type: dialogue-punctuation
    severity: warning
  pov:
    type: pov-consistency
    severity: warning
rubric:
  - id: conflict
    title: 冲突清晰
    description: 每个场景有明确的冲突或张力来源，读者知道人物在争什么。
  - id: pacing
    title: 节奏得当
    description: 情节节拍推进的快慢与内容匹配，没有拖沓或仓促收尾。
  - id: motivation
    title: 人物动机可信
    description: 人物的行动有可见的动机，关键选择不依赖巧合。
context_budget: 16000
