lesson:
  id: id-id-9e45ba
  title: 重建式生成命令的 id 分配要避开全部既有 id，保留项匹配要看文件自身
category: coding
status: active
created_at: '2026-10-04T02:14:54.424Z'
updated_at: '2026-10-04T02:14:54.424Z'
context: review plan 每次重建 open 任务包并按（维度, 范围）保留 done 包，包 id 形如 <dimension>-<n>
observation: fresh-context 审查发现两处保留逻辑缺陷：新包 id 计数器只数本次生成的包，重编号会把重建包写到已保留的 done 包文件上（结果被静默删除）；过期清理按本次输出反查 scope，把范围外的 done 包一并删除。两处都在多包夹具下才复现，单包测试全部通过
takeaway: 重建式命令里，可保留项（按内容键匹配）与新项共用 id 空间：id 分配要避开磁盘上的全部既有 id（含保留项），清理判断要读文件自身的（键, 状态）而不是从本次输出反推；测试夹具必须覆盖「保留项 + 重建项并存」与「范围收窄后保留项在范围外」两个形态
applies_when: 任何整体重建目录内容、按键保留部分文件的生成命令（任务包、索引、缓存）
occurrences:
  - origin: review-task-packets 变更的 fresh-context 独立审查
    date: '2026-10-04'
    evidence: internal/reviewpacket/reviewpacket.go 的 id 避让与按文件自身判断的清理循环，与 TestReplanKeepsDoneIds、TestNarrowScopeKeepsOutsideDone
