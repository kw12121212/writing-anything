schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: ripple-analysis
  milestone: novel-continuity
status: complete
summary: 影响传播（Ripple Analysis）
details: 修改已验收场景的正文、设定条目或事件后，wa-cli 根据场景契约、事件、知情表、伏笔台账和 recall 索引中的引用，找出所有受影响的后续场景，标记为需复查并阻塞组稿，同时生成对应的审查任务包。wa-cli impact <unit|entry> 可以在修改前预览影响范围。复查完成后（重新审查通过，或作者确认无影响）解除标记。
depends_on:
  - review-task-packets
