schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: ad-compliance-rules
sections:
  Implementation:
    rule-type:
      text: internal/lint：新增字符串参数类型；ad-compliance 规则类型、内置基础极限词表与依据、terms/builtin/basis 参数、发现项 message（依据与辅助检查说明）
      status: complete
    catalog:
      text: internal/catalog：RuleTypes 加入 ad-compliance（rule.unknown-type 的已知类型列表随之更新）
      status: complete
    docs:
      text: docs/GLOSSARY.md：确认极限词等术语已在术语表中，新增术语时同步加入
      status: complete
  Testing:
    lint:
      text: gofmt 检查本变更的 Go 文件
      status: complete
      command: test -z "$(gofmt -l internal/lint internal/catalog internal/cli/lint_test.go internal/cli/resolved_test.go)"
    unit-tests:
      text: 单元测试：内置词表命中与依据、terms 追加与 basis、builtin 为 false、内置词互不为子串、参数校验（basis 类型错误）、单处豁免；CLI 端到端：项目配置启用 ad-compliance 时 lint 以退出码 1 退出并标明来源，工作区规范包扩展行业词表的 source 为 pack:<id>，tech-blog 文体默认不报告
      status: complete
      command: go test ./internal/...
    full-regression:
      text: 运行完整回归命令，覆盖率不低于 80%
      status: complete
      command: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out
  Verification:
    spec-alignment:
      text: 对照 lint 与 genres-and-packs delta spec 的每个场景确认实现与测试覆盖，并按实际实现修正 delta spec
      status: complete
    strict-ready:
      text: 运行 strict-spec-cli ready 与 strict-spec-cli verify，确认变更产物有效
      status: complete
      command: strict-spec-cli ready ad-compliance-rules && strict-spec-cli verify ad-compliance-rules
    archive-readiness:
      text: 确认 delta spec 能合并进 lint 与 genres-and-packs 主规格，归档后路线图中的 ad-compliance-rules 标记为完成
      status: complete
testing_gates:
  validation_task: full-regression
  unit_test_task: unit-tests
