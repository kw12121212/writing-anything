lesson:
  id: exec-commandcontext-ad4f1b
  title: exec.CommandContext 的超时在子进程持有输出管道时失效
category: coding
status: active
created_at: '2026-10-01T16:41:54.035Z'
updated_at: '2026-10-01T16:41:54.035Z'
context: wa-cli 运行 git、MCP 客户端 CLI 等外部程序，用 exec.CommandContext 设 2 分钟上限，并把输出收集到 bytes.Buffer 写进诊断。
observation: 超时只杀掉主进程；输出不是 *os.File 时 Wait 会等所有持有管道的进程退出。git 派生的 ssh、git-remote-https 卡住时，实测 1 秒上限的调用 60 秒后才返回，MCP 会话随之卡住。mcpinstall 里早已是同样的写法，没有测试发现。
takeaway: 凡是 CommandContext 加内存缓冲收集输出，都同时设置 cmd.WaitDelay；测试用 sh -c 'sleep 30 & sleep 30' 并把超时注入为几百毫秒，断言在上限加 WaitDelay 内返回。
applies_when: 用 exec.CommandContext 运行可能派生子进程的外部程序（git、ssh、包管理器、官方 CLI），且把标准输出或标准错误接到 bytes.Buffer 等非文件的 Writer 时
occurrences:
  - origin: pack-install-distribution
    date: '2026-10-01'
    evidence: internal/packinstall/packinstall.go 与 internal/mcpinstall/mcpinstall.go 的 System 加 WaitDelay；两包的 TestSystemEnv 覆盖超时后子进程仍持有管道的情况
