- id: T-THREAD-03
  feature: threads
  scene: ch3-s3
  command: wa-cli threads --all
  expected: 发现项（TH-C 超期标记）
  assertion: 悬空伏笔 TH-C 超过计划回收位置被标出（overdue）；其收束经决策队列：threads set dropped 被 threads.author-confirmation 拒绝并生成阻塞决策，作者 decide
    允许后带 --decision 放弃，th-a/th-b 为 paid、th-c 为 dropped（语料内生负向路径）。
  evidence:
  - kind: script
    token: threads stopped-at-417 --all
    stdout_contains: th-c
  - kind: script
    token: threads set stopped-at-417 th-c --status dropped
    expect_code: threads.author-confirmation
  - kind: negative
    code: continuity.thread-anomaly
  - kind: golden
    file: threads.yaml
