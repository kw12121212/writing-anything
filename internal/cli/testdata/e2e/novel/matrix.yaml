# 测试矩阵（Test Matrix）：长篇特性面 → 语料可断言事实。每条带稳定编号（T-<特性>-<序号>）；
# scene 为单元 id（book / part-N / ch-N / chN-sM）；command 为 wa-cli 命令（示意，参数由 commands.yaml 录制）；
# expected 为期望结果（发现项诊断码或全绿）；assertion 为重放测试要断言的要点；
# evidence 为对账锚点（见 TestNovelCorpusMatrix）：script=commands.yaml 步骤（token 子串定位，
# 可选 stdout_contains/expect_code 断言值）、golden=golden/ 文件、negative=负向注入断言码、
# structure=结构校验测试。特性枚举与覆盖清单见 TestNovelCorpusDesign。
entries:
- id: T-UNITS-01
  feature: units
  scene: book
  command: wa-cli init --genre novel --gate-level strict + new novel stopped-at-417
  expected: 全绿（exit 0）
  assertion: 工作区初始化，根单元《停在四点十七分》创建，文体 novel、关卡 strict。
  evidence:
  - kind: script
    token: new novel stopped-at-417
  - kind: script
    token: init --genre novel
- id: T-UNITS-02
  feature: units
  scene: book
  command: wa-cli unit add part-1..3 / ch-1..3 / ch1-s1..ch3-s3
  expected: 全绿（exit 0）
  assertion: 四层单元树成型：小说→部→章→场景；3 部各 1 章 3 场景，部与章为汇总单元。
  evidence:
  - kind: script
    token: unit add stopped-at-417/part-1
  - kind: script
    token: unit add stopped-at-417/ch-1 scene ch1-s3
- id: T-UNITS-03
  feature: units
  scene: book
  command: wa-cli next / status
  expected: 全绿（exit 0）
  assertion: 汇总单元阶段与阻塞项由子场景汇总（最短板规则），场景未完成时部/章不显示完成。
  evidence:
  - kind: script
    token: next stopped-at-417/ch1-s1
    stdout_contains: ch1-s1
- id: T-CONTRACT-01
  feature: scene-contract
  scene: ch1-s1
  command: wa-cli scene contract ch1-s1 --pov .. --characters .. --beats .. --reveal-boundary ..
  expected: 全绿（exit 0）
  assertion: 九个场景逐一写入契约：视角、地点、出场人物、节拍（beats 为指向根大纲故事节拍的 id）、必须发生的状态变化、伏笔、揭示边界与起因，与 DESIGN.md 场景表逐列一致。
  evidence:
  - kind: script
    token: scene contract stopped-at-417/ch1-s1 sc
  - kind: structure
    test: TestNovelCorpusDesign
- id: T-CONTRACT-02
  feature: scene-contract
  scene: ch2-s1
  command: wa-cli scene contract ch2-s1 --cause <ch1-s3 的等配件事件>
  expected: 全绿（exit 0）
  assertion: 起因引用已发生的既有事件被接受；引用不存在的事件时被拒绝（章间与章内因果承接均落地）。
  evidence:
  - kind: script
    token: --cause ev-watch-accepted
- id: T-CONTRACT-03
  feature: scene-contract
  scene: ch2-s2
  command: wa-cli scene contract ch2-s2 --time 2006-06-20 09:00 --after ch2-s1
  expected: 全绿（exit 0）
  assertion: 倒叙场景声明故事时间标记与晚于关系，跨章倒叙进入大纲节。
  evidence:
  - kind: script
    token: --after stopped-at-417/ch2-s1
- id: T-CAUSAL-01
  feature: causality
  scene: ch2-s2
  command: wa-cli timeline stopped-at-417
  expected: 全绿（exit 0）
  assertion: 全序由 after 声明推导：ch1-s1→ch1-s2→ch1-s3→ch2-s1→ch2-s2→ch2-s3→ch3-s1→ch3-s2→ch3-s3，无 cycle / unknown-scene / order-conflict
    / same-time-presence。
  evidence:
  - kind: script
    token: timeline stopped-at-417
    stdout_contains: ch3-s3
- id: T-CAUSAL-02
