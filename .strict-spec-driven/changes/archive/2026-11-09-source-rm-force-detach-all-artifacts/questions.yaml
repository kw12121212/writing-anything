    question: 信息图失去唯一出处时怎么办？
    context: 推荐：整体拒绝 force，提示先调整配图，避免 validate 失败。
    answer: 信息图摘掉素材后如果没有任何论断或素材，force 整体拒绝并提示先调整该配图。
    status: resolved
    kind: requirement
    answered_by: human
