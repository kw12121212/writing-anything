  - id: audit-log-artifact-class
    question: 审计日志（Audit Log）是纳入 validate 的结构化产物，还是排除在校验外的 append-only 运维痕迹？
    context: 工作区现有产物均为 JSON Schema 约束的 YAML 与 Markdown（workspace-artifacts/embedded-schemas）；反馈提案建议纳入 validate。影响：validate 是否校验其格式、changedPaths 是否列出、作者手工编辑它是否算破坏。上游复审意见倾向运维痕迹（追加式日志与 Schema 校验契合度低、校验成本大于价值），但未与作者确认
    answer: append-only 运维痕迹：不进 JSON Schema 校验（validate 不检查）、不进 changedPaths（保持信封语义只指产物变更）；只读命令写审计属运维例外，经 delta-tech 修订既有「只读命令不写文件」规则豁免
    status: resolved
    answered_by: human
  - id: recovery-step-pairing
    question: 「关键命令失败后无成功重试」的回捞 step 如何配对与圈定？
    context: 候选：关键命令清单（draft write、review record、accept、export，反馈原文）是否扩展到全部写命令；配对键用命令×单元还是命令×单元×关键参数；成功重试的时间窗。影响 next 输出与 Work.Blockers 的实现复杂度与误报率
    answer: 配对键 = 命令×单元；关键命令清单 = 反馈原文四条（draft write、review record、accept、export），设计注明可按注册表扩展；「成功重试」= 同对之后存在退出码 0 的调用
    status: resolved
    answered_by: human
