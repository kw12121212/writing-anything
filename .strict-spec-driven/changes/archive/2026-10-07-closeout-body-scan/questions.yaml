    context: 证据：planned change details「读取场景 draft.md 去注释正文，用确定性规则找出未解析到设定集称谓或别名、且不在豁免名单中的疑似专有名词，与大纲来源合并去重」。影响 spec delta 与实现。
    answer: 扫描对象为去掉 HTML 注释后的 draft.md 正文；候选以确定性规则提取，按设定集 name 与别名解析，排除 waived，与大纲候选按取值去重（大纲来源优先），只报 warning
    status: resolved
