# 推送 v* 标签时构建发布产物（Release Asset）并上传到 GitHub Release。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: 完整回归
        run: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out
      - name: 构建发布产物
        run: go run ./internal/tools/release -version "$GITHUB_REF_NAME" -commit "$GITHUB_SHA" -out dist
      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # 带 - 的标签（如 v1.0.0-rc1）发布为预发布版，不会成为安装脚本默认下载的 latest。
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $prerelease
