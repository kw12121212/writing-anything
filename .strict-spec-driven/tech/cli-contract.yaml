schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: cli-contract
  title: wa-cli 命令契约
  category: architecture
rules:
  registry-declared:
    strength: MUST
    statement: 每条 wa-cli 命令必须在 internal/cli 的命令注册表（Command Registry）中声明 name、summary、位置参数、flags、outputKeys 与 exitCodes，参数解析与 help 输出都只从注册表派生；参数类型为 bool、string 或 list（可重复出现、按出现顺序收集的多个取值）；不得绕过注册表单独解析参数。
    rationale: 注册表是 help --json、后续 MCP tools 生成与 Skill 命令校验的唯一依据，绕过它会使帮助与实际行为漂移。
    enforcement:
      method: test
      detail: internal/cli 的 TestRegistryConsistency 遍历 help --json：断言每条命令 --json 输出的顶层字段恰好等于声明的 outputKeys，声明的每个 flag 都被解析器接受，且 exitCodes 非空；未声明的参数由解析器拒绝（usage.unknown-flag）。list 参数由 TestParseListFlag 覆盖重复出现与顺序。
    examples:
      good:
        - 新增命令时在注册表加一项并声明其 flags 与 outputKeys
      bad:
        - 在某个命令的 run 函数里手写 for 循环解析 os.Args
  shared-envelope:
    strength: MUST
    statement: 命令的 --json 输出必须通过共享的输出信封（Output Envelope）类型写出，顶层始终含 valid、diagnostics、changedPaths；任何层级的数组字段（包括嵌套在命令专属字段中的数组，如 resolved.unitTypes[].children）都不得为 null，没有元素时为空数组；命令专属字段与之并列，且必须在 outputKeys 中声明。
    rationale: Agent 与 MCP 按同一形状解析所有命令输出；逐命令自定义 JSON 会破坏契约，嵌套数组为 null 同样会让按数组遍历的调用方出错。
    enforcement:
      method: test
      detail: internal/cli 的测试递归遍历 config resolved 的 JSON 输出，断言除可为 null 的对象字段外没有 null；TestRegistryConsistency 另对每条命令登记的样例调用做递归扫描：任何为 null 的字段名都必须登记在测试内的 nullableFields 清单（合法可空的对象字段），数组字段一律不得为 null——逐命令手写断言漏检嵌套数组为 null 的缝隙由此获得统一防线（characters-and-light-canon 的 canon add members:null 即从该缝隙漏出）。
  stable-error-codes:
    strength: MUST
    statement: 诊断（Diagnostic）的错误码（Error Code）采用 <领域>.<kebab-case> 格式，以常量定义在产生它的包中；已发布的错误码不得改名、删除后复用或改变含义，新增错误码不得与已有错误码重名。
    rationale: Agent、MCP 与 Skill 依据错误码分支处理，改名或复用会让它们静默出错。
    enforcement:
      method: review
    examples:
      good:
        - usage.unknown-flag
      bad:
        - 把 usage.unknown-flag 改名为 usage.bad-flag
  exit-code-convention:
    strength: MUST
    statement: 命令只使用退出码（Exit Code）0（成功）、1（校验失败或执行失败）、2（用法错误），并在注册表的 exitCodes 中逐一声明含义。
    rationale: 统一退出码让脚本与 Agent 不解析输出也能判断结果类别。
    enforcement:
      method: test
  contract-literals-in-tests:
    strength: SHOULD
    statement: 测试断言错误码、JSON 输出键与退出码时使用规格中的字面量（如 "usage.unknown-flag"），不引用实现包中的常量。
    rationale: 以常量断言时，常量被改名或改值后测试会一并通过，stable-error-codes 就失去自动化防线。
    enforcement:
      method: review
    examples:
      good:
        - if d.Code != "usage.unknown-flag"
      bad:
        - if d.Code != codeUnknownFlag
  runnable-next:
    strength: MUST
    statement: 诊断的 next 中每一条都必须是可以直接粘贴到 shell 运行的完整命令：参数按 shell 规则加引号（internal/cli 的 shellCommand），不得包含 <value> 这类需要替换的占位符；需要作者给出取值时，在 message 中说明，next 给出 wa-cli help <command> --json 或列出每个允许取值的命令。
    rationale: Agent 会直接执行 next；占位符中的 < 与 > 会被 shell 当作重定向，可能截断或创建文件。
    enforcement:
      method: test
      detail: internal/cli 的 runWS 测试辅助函数断言每条工作区命令的诊断 next 都不含 < 或 >；TestShellCommandQuoting 覆盖带空格与单引号的参数。
    examples:
      good:
        - wa-cli config set gate_level strict --dir . --json
      bad:
        - wa-cli config set gate_level <value> --dir .
  sample-invocation:
    strength: MUST
    statement: 每条命令都必须在 internal/cli 的 sampleArgs 中登记一次成功的调用：只读命令，以及能以取值不变的方式成功的命令（如 config set 设为当前值、init 重复运行），登记不变更产物的调用；只能通过变更产物才能成功的命令（如 new、unit add、advance）登记一次在临时工作区中变更产物的调用，并在 mutatingSamples 中列出。工作区命令在临时工作区中通过 --dir 运行，测试不得在包目录中创建 .writing-anything/。
    rationale: TestRegistryConsistency 依靠这些调用检查 --json 输出键与声明一致；创建作品、追加单元与推进阶段的命令不存在不变更产物的成功调用，要求它们不变更产物会使这些命令无法登记；显式列出会变更产物的样例，测试才能对其 changedPaths 断言非空、对其他命令断言为空。不带 --dir 的工作区命令会在包目录中创建真实工作区。
    enforcement:
      method: test
      detail: TestRegistryConsistency 对 help --json 列出的每条命令调用 sampleArgs，缺少登记时测试失败；mutatingSamples 中的命令断言 changedPaths 为非空数组，其余命令断言为空数组。
    examples:
      good:
        - sampleArgs 为 advance 返回一个已有作品与 brief.yaml 的临时工作区中的 advance 调用，并把 advance 列入 mutatingSamples
      bad:
        - 为 new 登记一次会报告 work.exists 的失败调用，以满足不变更产物的要求
  workspace-dir-flag:
    strength: MUST
    statement: 读写工作区的命令都必须声明 internal/cli 共享的 --dir 参数（项目目录，默认当前目录），只在该目录下寻找 .writing-anything/，不向上查找父目录；找不到工作区时报告 workspace.not-found，next 为 wa-cli init --dir <dir> --json。
    rationale: 显式目录让命令行为确定、易于在进程内测试，也避免 Agent 在子目录中意外操作到上层的另一个工作区；统一的参数与诊断让 Agent 用同一套方式调用所有工作区命令。
    enforcement:
      method: review
    examples:
      good:
        - 'flags: []flagSpec{dirFlag}'
      bad:
        - 新命令用 os.Getwd() 向上逐级查找 .writing-anything/
  next-rechecks-problem:
    strength: SHOULD
    statement: 诊断 next 中给出的复查命令必须能重新检出该问题：涉及多个产物的问题（引用、合并、内置产物与工作区产物的冲突）给出整体校验 wa-cli validate --dir <dir> --json，不得给出只校验单个文件、会报告 valid 为 true 的命令；命令按自身改写 next（如指向 wa-cli help <command>）时，只改写由本次参数引起的问题，已有产物中存在的问题保留默认的复查命令。判断问题是否由本次参数引起时，按诊断字段是否为参数名（或其下标、子字段）的白名单判断，不以「字段不以产物内路径开头」推断：已有产物的根级问题（如 schema_version、未定义的字段）也属于已有产物。修改已有产物的命令在写前复查（修改后重新解析与校验）中发现、而修改前的产物本身合法的问题，同样由本次参数引起：诊断不填 path，字段换成对应的参数名，next 给出 wa-cli help <command> --json；能在修改前检查的参数取值（如只含空白的文本、重复的 id）应在修改前报告。
    rationale: Agent 按 next 复查；复查命令检不出问题时，Agent 会误以为问题已经解决；把已有产物的问题也改成查看用法，Agent 会反复调整参数而问题始终存在；以前缀排除会漏掉根级字段（fresh-context 审查在 decision add 与 claim add 中都复现）。写前复查的问题若带上产物路径，next 给出的单文件复查会报通过，因为文件并未写入（brief set 的审查复现）。
    enforcement:
      method: test
      detail: internal/cli 的测试对跨产物错误码断言 next 为整体校验并能重新检出；TestClaimAdd、TestFeedbackAdd 与 TestDecisionAdd 断言已有产物的问题（含根级字段）保留默认的复查命令。TestBriefSetRejects 断言空白文本、重复 id 等参数问题不填 path、next 为 wa-cli help brief set --json；internal/brief 的 TestSetRejects 断言写前复查问题的字段为参数名。
    examples:
      good:
        - paramField(d.Field, "question", "options", "id", "recommendation") 为真时才改写为 wa-cli help decision add --json
        - brief.Set 在写前复查失败时清空 path，把 key_messages[0].text 映射为 message-text
      bad:
        - '!strings.HasPrefix(d.Field, "decisions") 时改写 next，schema_version 的问题也被改成查看用法'
        - 写前复查失败时返回 path 为 brief.yaml 的诊断，next 为 wa-cli validate brief.yaml，复查报告 valid 为 true
  streaming-envelopes:
    strength: MUST
    statement: 持续输出事件的流式命令（如 feedback watch、preview --serve）在 --json 模式下每个事件输出一行完整的输出信封（valid、diagnostics、changedPaths 与声明的输出键），不得输出不带信封的裸对象；流式命令必须提供使其在输出指定条数后结束的参数（如 --max），按间隔轮询的流式命令另须提供轮询间隔参数（如 --interval），以便在进程内测试并登记样例调用；事件驱动、没有轮询的命令（如本地服务）不需要间隔参数。
    rationale: Agent 与 MCP 用同一方式解析所有命令的输出，逐行信封让流式事件也符合 shared-envelope；可结束的参数让 TestRegistryConsistency 与行为测试不必启动子进程或依赖超时；间隔参数只对轮询命令有意义，事件驱动的服务按请求即时响应。
    enforcement:
      method: test
      detail: internal/cli 的 TestRegistryConsistency 以 --all --max 1 调用 feedback watch 并断言输出为一行信封；TestFeedbackWatch 在并发追加反馈时断言每行都是信封；preview --serve --max 的测试断言首行与每条反馈行都是信封。
    examples:
      good:
        - feedback watch --max 1 --json 输出一行 {"valid":true,"diagnostics":[],"changedPaths":[],"feedback":{...}}
      bad:
        - feedback watch --json 每行只输出 {"id":"fb-2",...}
  invalid-value-code:
    strength: SHOULD
    statement: 参数取值不合法（如应为正整数、应为枚举取值）且不对应任何产物字段时，统一报告错误码 input.invalid-value，诊断不填 path，message 说明参数名、给出的取值与期望，next 含 wa-cli help <command> --json；生命周期主路径命令（见 cli 主规格 diagnostic-next-concrete）在其前先给出带单元引用的只读查看命令；取值写入产物字段时仍由 Schema 校验报告 artifact.schema-violation。
    rationale: Agent 依据错误码分支处理，同一类参数错误各命令各自造错误码会让分支逻辑膨胀；与写入产物的字段错误区分开，Agent 才知道该改参数还是改产物；主路径命令先给出该单元的查看命令，Agent 不必自行推断要看哪个产物。
    enforcement:
      method: review
    examples:
      good:
        - feedback watch --interval 0 报告 input.invalid-value，next 为 wa-cli help feedback watch --json
        - brief set my-post --length 3000-1500 报告 input.invalid-value，next 为 wa-cli brief show my-post --dir D --json 与 wa-cli help brief set --json
      bad:
        - feedback watch --interval 0 报告 feedback.bad-interval
  precheck-before-side-effects:
    strength: MUST
    statement: 一条命令会写入多个产物时，必须在第一次写入之前完成全部可能失败的检查（包括针对已有产物的检查，如段落上限、写入记录的校验），领域包提供的预检查函数（如 draft.Precheck）与实际写入共用同一套检查；任一检查失败时所有产物逐字节不变，changedPaths 为空。只读命令不得因读到推导出的数据（如正文批注）而写文件，推导出的记录只在显式的变更命令中记入，并出现在该命令的 changedPaths 中；唯一例外是审计日志（Audit Log，.writing-anything/audit.log）：每次调用（含只读命令）都追加运维痕迹，它不是产物，不进 changedPaths，也不受本条约束（见 cli 主规格 audit-log）。
    rationale: draft write 先记入批注再写正文，若只在写正文时才发现已有正文过大，feedback.yaml 已被修改而命令报告失败，Agent 看到的结果与工作区不一致（fresh-context 审查实测）；读取命令写文件会让 watch 轮询反复写入、changedPaths 失真。
    enforcement:
      method: test
      detail: internal/cli 的 TestRejectedWriteTouchesNothing 断言被拒绝与过大正文的 draft write 不创建 feedback.yaml；TestCommentFeedback 断言 feedback list 不创建 feedback.yaml。
  loopback-only-server:
    strength: MUST
    statement: 'wa-cli 中监听网络的命令（如 preview --serve）只能监听回环地址 127.0.0.1，不得监听 0.0.0.0 或其他网卡，也不得提供选择监听地址的参数，给出的访问地址必须取自实际监听的套接字；必须为每次运行生成至少 128 位的随机令牌，并对每个请求在读取或修改任何产物之前校验令牌（常量时间比较）与 Host 头（端口为 80 时同时接受不带端口的写法），不符合时返回 403；Host 校验默认只接受回环地址与 localhost，唯一放宽方式是作者显式给出的 Host 白名单参数（可重复、host 或 host:port（端口为 1 到 65535）的字面值、不支持通配与后缀匹配），白名单只放宽 Host 校验——令牌校验、监听地址与其余防护不因它放宽，也不校验可伪造的转发头（如 X-Forwarded-Host）；响应必须带 Cache-Control: no-store 与 Referrer-Policy: no-referrer，服务只在命令运行期间存在，不作为常驻服务；请求体必须限制大小，服务端日志写到命令的标准错误。测试必须断言访问地址是回环地址，并覆盖拒绝无令牌、令牌错误、Host 不符与白名单外 Host 的请求。'
    rationale: 本地阅读页是项目中唯一的网络监听，同一台机器上的其他网页或进程也能访问回环地址：令牌防止伪造提交，Host 校验防 DNS 重绑定，no-referrer 防止令牌随 Referer 外泄，限制请求体防止占满内存；地址取自实际套接字，测试才能发现误改为监听全部网卡。远程作者经反向代理（tailscale serve 等）访问时 Host 头不是回环地址，复盘 A2 采纳显式白名单作为唯一放宽方式：通配或后缀匹配会一次放开不可枚举的 Host 集合，校验转发头等于放开任意 Host；令牌与监听地址保持不变，防护面不随远程访问扩大。
    enforcement:
      method: test
      detail: internal/cli 的 TestPreviewServe 断言首行地址的主机为 127.0.0.1 且是回环地址，并对无令牌、令牌错误与错误 Host 的 GET 与 POST 断言 403 且 feedback.yaml 不变；TestPreviewServeAllowHost 断言白名单内 Host 携令牌 200、白名单外携令牌与白名单内缺令牌 403、非法取值（通配、带路径）与脱离 --serve 均拒绝、监听地址仍为回环。
    examples:
      good:
        - preview --serve --allow-host machine.tail123.ts.net：hosts 追加该字面值，authorized 仍逐字比较且令牌常量时间校验不变。
      bad:
        - 提供 --bind 0.0.0.0；或按 X-Forwarded-Host 校验；或 --allow-host *.example 通配。
  mcp-thin-wrapper:
    strength: MUST
    statement: MCP 服务只做命令注册表到 MCP 的映射：每个 tool 由注册表中的命令生成，tools/call 在进程内运行同一条 wa-cli 命令（命令接受 --dir 时加 --dir，并加 --json）并原样返回其输出信封，资源只读取产物或运行只读命令；internal/mcp 不 import internal/cli 与任何领域包，命令信息与执行函数由命令层传入。新增命令时不得为 MCP 单独编写逻辑。每次 tools/call 必须不等待作者或其他外部事件即结束（会一直等待的命令不对应 tool）；tool 的参数不得让客户端读写项目目录之外的文件（路径类参数只能经已有的输出路径检查，否则不作为 tool 参数）；协议错误码按所实现的协议版本的规范选用。测试逐一调用每个 tool（按命令登记的样例），断言成功，并断言同一操作经 MCP 与 CLI 调用的结果一致。wa-cli mcp 的标准输出只写 MCP 消息，不受输出信封规则约束。
    rationale: wa-cli 是唯一真相来源：MCP 与 CLI 共用一份实现，结果天然一致，后续命令自动获得 tool；依赖方向让协议层无法另写业务逻辑。只检查 tool 存在而不调用会漏掉参数映射错误（本变更的审查发现 version、help、skills list 的 tool 都会失败）；一直等待的调用会阻塞整个服务；只用 MCP 的 Agent 往往没有文件系统权限，路径参数会扩大它的能力。
    enforcement:
      method: test
      detail: internal/cli 的 TestMCPEveryTool 按样例调用每个 tool 并断言 isError 为 false，TestMCPToolPerCommand 断言 tool 与命令一一对应、隐藏的参数不出现，TestMCPSameAsCLI 比较 MCP 与 CLI 的输出与产物；internal/mcp 的 TestNoInternalImports 确认协议层不依赖 wa-cli 的其他包。
    examples:
      good:
        - tools/call feedback_add → Run([feedback add my-post --text=太长 --dir D --json])；version → Run([version --json])
      bad:
        - 在 internal/mcp 中直接调用 feedback.Add；或给每个 tool 都加 --dir，使不接受它的命令总是失败
  external-processes:
    strength: MUST
    statement: wa-cli 运行外部程序（MCP 客户端的官方 CLI、pack install 拉取 git 来源时的 git）时必须经可注入的环境接口（查找与执行分离，测试可以替换），用 exec 直接传参数列表、不经 shell，不连接 wa-cli 自己的标准输入与输出，设时长上限（超时视为失败），并设 cmd.WaitDelay，使超时杀掉主进程后即使它派生的子进程仍持有输出管道，调用也在上限加 WaitDelay 内返回；把合并后的标准输出与标准错误截断（不切断多字节字符）后写入诊断；命令层测试用写入 PATH 的假可执行文件断言实际的命令行与工作目录。外部程序只能是固定的客户端 CLI 与 git，参数列表只由固定的子命令与经过校验的参数组成，不得执行来自产物或规范包的命令。调用 git 时必须关闭钩子（-c core.hooksPath 指向空目录）、ext 传输协议（-c protocol.ext.allow=never）与交互提示（GIT_TERMINAL_PROMPT=0）、不递归子模块，在临时目录中操作，用 -- 把来源地址与选项分开，拒绝以 - 开头或含空白的 ref。
    rationale: stdio 上的 MCP 会话与 --json 输出不能被子进程的输出污染；官方 CLI 首次运行的引导或自动更新会卡住；不少 CLI 把错误写在标准输出；只断言命令行就能独立更新各客户端的参数。输出写到内存缓冲区时 Wait 要等所有持有管道的进程退出，只杀主进程会让超时失效（git 会派生 ssh 与 git-remote-https）。git 拉取的是第三方仓库：关闭钩子、ext 协议与子模块保证不执行仓库内容（规范包只能是数据），关闭交互提示避免等待凭据而卡住会话，-- 与 ref 检查防止参数注入。
    enforcement:
      method: test
      detail: internal/mcpinstall 与 internal/packinstall 的 TestSystemEnv 覆盖合并输出、截断、GIT_TERMINAL_PROMPT 与超时后子进程仍持有管道时按时返回；TestFetchGitCommandLine 断言 git 的参数列表；internal/cli 的 TestMCPInstall* 与 TestPackInstallFakeGit 用 PATH 中的假可执行文件断言命令行、工作目录与失败输出；TestInstallFromGit 与 TestPackInstallFromGit 用真实 git 与 file:// 仓库覆盖克隆与检出。
  third-party-config-merge:
    strength: MUST
    statement: wa-cli 写入第三方的配置文件（如 MCP 客户端的 mcpServers 文件）时必须只改自己负责的字段，保留其余的键、条目与自己条目中的其他字段；文件不存在、为空或为 null 时从空对象开始，结构不符时报告错误而不覆盖；取值未变时不写；写入时先写同目录的临时文件再重命名并保留原有权限，拒绝写入符号链接；JSON 编码不转义 HTML 字符。配置文件路径不得落在工作区之内（按文件身份逐级比较，不只比较文字），项目之外的路径不列在 changedPaths 与诊断的 path 中。
    rationale: 这些文件属于作者与其他工具，wa-cli 不知道其他字段的含义；本变更的审查发现整条覆盖会丢掉作者加的 env、JSON null 会让对 nil map 赋值崩溃、文字比较的路径检查可被指向工作区的符号链接绕过。
    enforcement:
      method: test
      detail: internal/mcpinstall 的 TestJSONConfig 与 internal/cli 的 TestMCPInstallJSON、TestMCPInstallGuards 覆盖合并、null、权限、符号链接与工作区检查。
  unit-aware-defaults:
    strength: SHOULD
    statement: 按单元消费的文体默认值（如 default_method）的应用点必须经过单元感知的统一入口（internal/cli 的 unitDefaultMethod 与 internal/work 的 Work.picker），不得在应用点直接读取 Work.Genre.DefaultMethod；新增应用点时先检查是否已有入口可复用。
    rationale: story-structure-templates 把 default_method 的语义改为只作用于作品的根单元时，需要同步修改六个分散的应用点（大纲关卡、整体校验、单产物校验、outline set/remove/show、审稿、lint）；直接读 Genre.DefaultMethod 的新增点会静默恢复「所有单元继承」的旧行为，使子单元被父级规则卡死（lesson-8f8885）。
    enforcement:
      method: review
      detail: 检查方式：在 internal/ 下搜索 Genre.DefaultMethod，只应命中单元感知的入口（unitDefaultMethod、Work.picker、defaultMethodOf）及其定义。
    examples:
      good:
        - 'outline.Picker{Methods: catalog.LoadMethods(dir), Default: unitDefaultMethod(w, u)}'
      bad:
        - 'outline.Picker{Methods: catalog.LoadMethods(dir), Default: w.Genre.DefaultMethod}'
  text-json-parity:
    strength: SHOULD
    statement: 命令不加 --json 时的人读文本输出不应给出 JSON 输出中没有的可执行信息（如待办、作者指示、阻塞项、下一步命令）：文本模式新增这类信息时，在同一变更中为 JSON 输出新增对应字段（向后兼容的增量）；只用于人读的展示元数据（如与 JSON 中 id 并列的写入时间）可以只出现在文本中，但须在变更的 design.yaml 写明理由。
    rationale: Agent 读取 JSON 输出、作者读取文本输出，两者承载的信息漂移会让一方看不到另一方据以行动的内容；next-text-handoff 为在文本中显示作者新指示而同步给 JSON handoff 增加 instructions，正是这一约定。
    enforcement:
      method: review
      detail: 审查新增或修改文本输出的变更时，核对文本中每一项可执行信息在 JSON 输出中都有对应字段
    examples:
      good:
        - next 文本顶部显示交接记录的 todo 与 instructions，JSON 的 handoff 字段同样含 todo 与 instructions
      bad:
        - 只在文本输出中列出作者指示，JSON 输出没有对应字段
  help-only-next-allowlist:
    strength: MUST
    statement: internal/**（不含 internal/tools）非测试源码中，元素全部是 wa-cli help 提示的 []string 字面量与不带 extra 的 helpNext 调用（诊断 next 只给查看用法）必须登记在 internal/cli 的 helpOnlyAllowed 白名单中，按「相对 internal 的文件路径:函数名」记录位置数并写明理由；新增此类位置时要么改为先给带单元引用或产物路径的具体命令（如 concreteHelpNext），要么同一变更中登记理由；改造后必须同步下调或删除白名单条目。
    rationale: 只给 help 的 next 让 Agent 自行推断该查看哪个单元与产物；白名单把这类位置显式化，避免新增诊断静默回退。按函数计数而非行号，避免无关编辑造成误报；helpNext 以 extra... 追加，字面量本身看不出是否只含 help，所以按调用处计数。
    enforcement:
      method: test
      detail: internal/cli 的 TestHelpOnlyNextAllowlist 用 go/ast 扫描并与白名单逐个函数比对（未登记、超出、少于登记值、过期条目、理由为空都失败）；TestHelpOnlyScannerDetects 覆盖字面量、拼接、局部变量、函数内 const/var、只追加 help 的 append、不带 extra 的 helpNext，以及 append 追加具体命令或 extra... 的豁免。
    examples:
      good:
        - res.Diagnostics[i].Next = []string{shellCommand("wa-cli", "brief", "show", ref, "--dir", dir, "--json"), "wa-cli help brief set --json"}
      bad:
        - res.Diagnostics[i].Next = []string{"wa-cli help brief set --json"} 或 helpNext(res.Diagnostics, "draft write", codes) 且未登记白名单
  enum-scoped-output-fields:
    strength: SHOULD
    statement: 命令输出或事件视图中只对部分枚举取值（如 confirmation 的 kind）有意义的字段（如 id 只属于 decision、plan、state、knowledge），注册表的输出键说明必须写明该字段适用与不适用的取值；对不适用的取值省略该键而不是输出空串、零值或 null，测试须断言不适用的取值不出现该键且适用的取值照常输出。
    rationale: 下游实测发现 confirmation 事件对 acceptance 与 volume 输出空串 id：规格与输出键说明把只对部分 kind 有意义的字段写成无条件字段，把结构性空值固化进契约，消费者无法区分「没有」与「为空」。分类描述加缺省断言使该缺陷在规格评审与测试两层都可检出。
    enforcement:
      method: review
      detail: 评审输出视图与事件视图的输出键说明时核对：字段若按枚举取值才有意义，说明是否分类描述；测试是否覆盖不适用取值键缺省（解析后断言键不存在，不是断言空串）与适用取值照常输出。
    examples:
      good:
        - 「id 只在 decision、plan、state 与 knowledge 出现（各自的条目 id），acceptance 与 volume 没有条目 id、不含 id 字段」+ 测试断言 acceptance 响应解析后无 id 键
      bad:
        - 「confirmation 含 kind、unit、id、action 与 channel」而 acceptance 的 id 恒为空串
  root-flag-alias:
    strength: SHOULD
    statement: 根参数（Root Flag，如 --help、--version）只作为第一个参数位置的别名实现：在查找命令之前改写为已注册的命令，之后走同一套参数解析与执行路径；不得在命令注册表中登记以 - 开头的命令，help、help --json 与 MCP tools 都不列出根参数。
    rationale: 别名改写发生在注册表查找之前，registry-declared、sampleArgs 与 MCP 薄封装都不受影响，也避免隐藏命令混入 help 与 MCP tools；等价表测试能逐字节锁定别名与目标命令的一致性。
    enforcement:
      method: test
      detail: internal/cli 的等价表测试（TestRootHelpFlag、TestRootVersionFlag）断言别名与目标命令的退出码、标准输出与标准错误相同，并断言别名不出现在 help --json 的 commands 中。
    examples:
      good:
        - dispatch 中把 args[0] == "--version" 改写为 version 后再 find
      bad:
        - 在注册表中登记 name 为 --version 的隐藏命令
  served-json-contract:
    strength: SHOULD
    statement: wa-cli 服务给其他界面消费的 JSON 接口（不是命令的输出信封，如阅读页服务的 GET /page.json）应当：字段名用 camelCase；任何层级的数组没有元素时为空数组而不是 null；正文等文字按原文输出（关闭 HTML 转义），由消费方负责安全显示；结构以随二进制嵌入的 JSON Schema 描述，Go 测试校验真实输出符合 Schema，消费方以真实 wa-cli 输出的夹具或端到端测试约束字段漂移。
    rationale: 这类接口没有输出信封与注册表 outputKeys 的约束，却成为跨包契约（DSH 插件按字段渲染）；字段改名或 null 化会静默破坏消费方，Schema 加真实输出测试让漂移在 wa-cli 一侧就失败。
    enforcement:
      method: test
      detail: internal/preview/json_test.go 与 internal/cli/preview_page_test.go 以 preview.ValidateJSON 校验输出；插件 testdata/cli/page-my-post.json 取自真实 wa-cli，reviewe2e.test.ts 对真实二进制断言字段
    examples:
      good:
        - preview.JSON 用 json.Encoder 且 SetEscapeHTML(false)，所有切片先初始化为空切片再编码
      bad:
        - 直接 json.Marshal 一个含 nil 切片的结构体，消费方收到 "paragraphs":null
  print-payload-size-budget:
    strength: SHOULD
    statement: 命令在 --json 中输出大体积内嵌载荷（如 base64 图片）时，注册表的输出说明与消费方（DSH 插件等）的输出上限应按实际 JSON 体积计算：计入同一载荷在信封中的每一份副本与转义膨胀（html/template 的 &#43;、encoding/json 的 \u0026 等），消费方的上限不得低于生产方允许的最大载荷。
    rationale: paste-ready-copy 的 export --print 在 export.html 与 export.segments 中各带一份 base64 正文，最初按单份估算的 64 MiB 插件上限装不下 wa-cli 允许的 32 MiB 内嵌量（评审黑盒实测 26 张约 1 MiB 的图输出 72.7 MB），面板只能报「输出无法解析」。
    enforcement:
      method: test
      detail: plugins/dsh-writing-viewer/src/copyroutes.test.ts 的 copy route output budget 用例按 32 MiB 内嵌预算、两份副本与转义膨胀计算最坏体积，断言 COPY_STDOUT_CAP 大于它。
  json-null-vs-absent:
    strength: SHOULD
    statement: 命令的 --json 输出视图需要同时表达「字段不出现」（不适用，见 enum-scoped-output-fields）与「字段出现但取值为 null」（适用而没有值，如 paste-html --print 的 headline 与 digest）时，用二级指针（如 **string）加 omitempty 实现：外层指针为 nil 时键省略，外层非 nil 而内层为 nil 时键出现且取值为 null；同一变更中把合法可空的字段名登记进 cli_test.go 的 nullableFields（以及用到该输出的 noNulls 类清单），并让测试覆盖两种形态：不适用输出的键缺省与适用而无值时键仍出现且为 null。
    rationale: encoding/json 对指针的 omitempty 只区分「指针是否为 nil」，单层指针表达不了「键出现且为 null」；二级指针把两种形态交给类型直接表达，避免为单个字段写自定义 MarshalJSON。两份 null 白名单与键缺省断言是配套义务：漏登记会让 TestRegistryConsistency 或 noNulls 断言失败，漏断言会让键缺省退化成 null 契约（或相反），消费方无法区分「不支持」与「没有值」。
    enforcement:
      method: test
      detail: internal/cli 的 TestExportPastePrintKeysAndReadOnly 断言 html、segments、headline 与 digest 只在 paste-html --print 的输出中出现，且 --print 没有作者选定值时 headline 与 digest 键仍出现、取值为 null；TestRegistryConsistency 按 nullableFields 白名单校验全部样例输出，internal-cli-null-1ddaed 的教训（两份清单都要登记）继续适用。
    examples:
      good:
        - 'exportView 的 Headline 用 **string 加 json:",omitempty"，printOnly 分支赋 &r.Headline：非 print 输出键省略，print 无值时输出 "headline": null'
      bad:
        - 用 *string 加 omitempty 表达「适用而无值」：字段无值时键被整个省略，消费方无法区分「该输出没有标题字段」与「没有作者选定的标题」
  counting-scope-stated-once:
    strength: SHOULD
    statement: 同一统计口径（如字数、汉字数）出现在命令 help 的输出键或参数说明、诊断 message、人读文本输出与 docs/GLOSSARY.md 时，必须使用同一句口径文字（如「非空白字符数，含标点」），并在同一变更中同步修改所有出现处；测试以同一字面量断言各处文案。
    rationale: 公众号流程复盘 R3 的根因正是口径句只写一半：help 写了「非空白字符数」没写「含标点」，作者按汉字估篇幅时理解分叉。length-counting-clarity 的做法是把同一句口径写进 lint help、length-range 诊断、brief set --length 的 help、文本摘要行与 GLOSSARY 五处，并用同一字面量在测试中锁定；text-json-parity 只约束文本与 JSON 的字段对应，不约束口径句跨命令、跨文档的逐字一致，此规则补上该缝隙。
    enforcement:
      method: test
      detail: internal/cli 的测试以规格中的口径字面量断言 help 输出键说明、flag 说明与文本输出中的同一句口径；代码审查时确认新增口径表述没有第五种写法。
    examples:
      good:
        - length-counting-clarity 在 lint help 的 chars 键、cjkChars 键、length-range 诊断 message、brief set --length help 与 GLOSSARY 用同一句「非空白字符数，含标点」，TestLintCountingClarity 用同一字面量断言。
      bad:
        - help 写「非空白字符数」而诊断 message 写「含标点的字符数」：两句各自正确但读者无法确认是同一口径。
  state-transition-both-sides:
    strength: SHOULD
    statement: delta spec 场景声明某状态翻转前后同一命令的输出时（如「写入正文后再运行，questions 含某项」），测试必须在翻转后复跑该命令并断言恢复项，不得只以另一命令（如 next）的恢复作为该命令（如 marketing show）的证据；两个命令共享同一判定函数的事实不能替代该断言——共享的判定恰恰会掩盖事实输入（如存在性探测）的分叉。
    rationale: next-draft-first 的 show-unasked-waits-for-draft 场景要求写入正文后 marketing show 恢复报告，初版测试只复跑了 next；评审发现的 next/show 探测分叉正落在 show 路径上，补上 show 的复跑断言才把两个入口的一致性锁进测试。
    enforcement:
      method: review
      detail: 评审 delta spec 场景与对应测试时逐一核对：场景里的每个 THEN 在测试中有直接断言，状态翻转后的复跑覆盖场景点名的每个命令。
    examples:
      good:
        - 写入正文后先断言 next 报 headline-unasked，再复跑 marketing show 断言 questions 同样含 headline-unasked。
      bad:
        - 场景写「写入后再运行 show 应含某项」，测试只在写入后断言了 next，show 的恢复从未被执行。
  documented-command-roundtrip:
    strength: SHOULD
    statement: 面向 Agent 的文档（技能正文、help 示例）中写出的命令组合必须按字面可用：把命令输出重定向到文件再交给后续命令消费时（如「wa-cli review record <单元> --init > skeleton.yaml」后经 --file 回录），落盘格式必须是后续命令期望的领域格式——不得把 --json 的输出信封（Output Envelope）重定向成领域 YAML 使用；需要信封中的某个字段时，文档要写明提取该字段，或改用文本模式。发布前按文档字面执行一遍命令组合核实。
    rationale: wa-review 技能第 2 步初版写「review record --init --json > skeleton.yaml」：--json 模式的标准输出是含 valid、diagnostics 与 skeleton 字段的信封，落盘后直接回录得到成串 artifact.schema-violation——text-json-parity 只约束文本与 JSON 的字段对应，不约束文档中命令组合的可用性；Agent 会逐字执行技能里的命令，写错形态的命令组合在真跑时才暴露。
    enforcement:
      method: review
      detail: 评审技能与 help 中新增的命令组合时按字面执行一遍（或在测试中执行同一序列），确认重定向产物能被后续命令接受。
    examples:
      good:
        - 「wa-cli review record <单元> --init > skeleton.yaml」（文本模式输出骨架 YAML），填写后「wa-cli review record <单元> --file skeleton.yaml」回录。
      bad:
        - 「wa-cli review record <单元> --init --json > skeleton.yaml」：落盘的是 JSON 信封而非骨架，回录报 artifact.schema-violation。
  skill-command-paths-reachable:
    strength: SHOULD
    statement: 内置技能正文写出的命令序列（操作路径）必须在单元的每个相关阶段下实际可行：评审技能改动时沿命令层的阶段检查（如 accept 的 wrongStage）、验收与审稿的过期判定（review.Stale、AcceptanceBlockers 各自比较哪个哈希）与 wa-cli next 给出的 commands 推演一遍，确认按技能文字逐步执行不会撞状态机拒绝；守护测试的字面量断言拦不住「文字与命令行为差一步」的问题。
    rationale: skill-confirmation-guard 评审发现 wa-revise 的小改路径写「reaffirm 后重新确认验收」，但 --reaffirm 只更新 review.yaml 的 draft_sha256、验收记录仍按自己的哈希判过期，且 done 单元不能直接 accept（wrongStage）——照文字走会撞诊断，正确序列是 reaffirm → reopen → 重新 accept → advance。技能里的命令序列 Agent 会逐字执行，与状态机差一步就在真实会话里暴露。
    enforcement:
      method: review
      detail: 评审技能中新增或改动的命令序列时，对照 internal/cli 的阶段检查与过期判定推演每个阶段下的可达性；必要时在测试里按技能文字执行同一命令序列。
    examples:
      good:
        - wa-revise 的小改路径写明：重申只解除审稿过期，done 单元先经作者同意 reopen 退回再重新确认验收并推进。
      bad:
        - 技能写「reaffirm 后直接重新确认验收」而单元在 done 阶段：直接 accept 被 wrongStage 拒绝。
