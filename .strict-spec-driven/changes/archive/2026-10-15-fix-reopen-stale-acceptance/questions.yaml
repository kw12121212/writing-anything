resolved:
  - id: reproduction
    question: 缺陷能否在本地确定性复现？
    context: 影响 Reproduction 任务与回归测试。证据：docs/dogfood/runs.yaml 的 claude-code-tech-blog 记录了 export.unaccepted、accept.wrong-stage、lifecycle.already-done 的真实诊断；规格 units-and-lifecycle 的 advance-stage 与 next-steps、review 的 accept-stage 共同导致没有退回路径。
    answer: 能：在测试中把 minimal 作品走到 done 后用 draft write 改正文，断言 export、accept、advance 都拒绝且 next 没有步骤；新增的 reopen 回归测试在修复前因命令不存在而失败
    status: resolved
    kind: technical
