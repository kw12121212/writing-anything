schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: sources-and-provenance
  title: 素材与出处（Sources and Provenance）
requirements:
  content-input:
    strength: MUST
    statement: 从作者或 Agent 读取内容的命令（wa-cli source add、wa-cli draft write）必须接受 --file <path>：path 相对 --dir 解析，也可以是绝对路径；省略 --file 时从标准输入读取全部内容。文件无法读取时报告错误码 input.read-failed（不填 path，message 含给出的路径与原因，next 包含该命令的 wa-cli help <command> --json），退出码为 1，且不修改任何文件。
    scenarios:
      file-relative-to-dir:
        - GIVEN: 工作区 D 下有文件 D/notes/idea.md
        - WHEN: 运行 wa-cli source add --type author-note --file notes/idea.md --dir D --json
        - THEN: 素材登记成功，存档内容与 D/notes/idea.md 逐字节相同，退出码为 0
      read-stdin:
        - GIVEN: 刚初始化的工作区 D
        - WHEN: 通过标准输入传入「第一段」运行 wa-cli source add --type author-note --dir D --json
        - THEN: 素材的存档文件为 original.txt，内容为「第一段」，退出码为 0
      missing-file:
        - GIVEN: 刚初始化的工作区 D，D/nope.md 不存在
        - WHEN: 运行 wa-cli draft write my-post --file nope.md --dir D --json
        - THEN: diagnostics 中有一条错误码为 input.read-failed 的诊断，message 含 nope.md；工作区内没有新建或修改的文件，退出码为 1
  source-add:
    strength: MUST
    statement: wa-cli source add --type <type> 必须把读取到的内容登记为素材（Source）：type 取值为 author-note、interview、transcript、reference、past-article 之一；内容逐字节存档到 .writing-anything/sources/<id>/，文件名为 original 加 --file 的扩展名（没有扩展名时为 original，来自标准输入时为 original.txt），并写出 .writing-anything/sources/<id>/source.yaml，含 schema_version（1）、id、type、file（存档文件名）、sha256（内容的 SHA-256 十六进制）、bytes（字节数），给出 --title 时含 title，来自文件时含 original_name（输入文件的文件名）。id 由 --id 指定，省略时为 src- 加 sha256 的前 12 个字符。成功时退出码为 0，changedPaths 为素材目录、存档文件与 source.yaml，--json 输出的 source 字段含 id、type、title（未给出时为 null）、path（存档文件路径）与 sha256。type 不在取值范围内或 --id 不符合 id 格式时报告 artifact.schema-violation（field 为 type 或 id）；内容为空时报告 source.empty；素材目录已存在时报告 source.exists（path 为该素材目录）；这些情况都不创建或修改任何文件，退出码为 1。未找到工作区时报告 workspace.not-found。
    scenarios:
      add-note:
        - GIVEN: 刚初始化的工作区 D，D/idea.md 的内容为「我在 2023 年迁移过一次数据库」
        - WHEN: 运行 wa-cli source add --type author-note --file idea.md --title 迁移笔记 --dir D --json
        - THEN: source.id 为 src- 加该内容 SHA-256 的前 12 个字符，source.type 为 author-note，source.title 为 迁移笔记；D/.writing-anything/sources/<id>/original.md 与 idea.md 逐字节相同，source.yaml 中 original_name 为 idea.md；changedPaths 含素材目录、original.md 与 source.yaml，退出码为 0
      explicit-id:
        - GIVEN: 刚初始化的工作区 D
        - WHEN: 通过标准输入传入访谈稿运行 wa-cli source add --type interview --id interview-ceo --dir D --json
        - THEN: 素材目录为 .writing-anything/sources/interview-ceo，source.id 为 interview-ceo，退出码为 0
      duplicate-content:
        - GIVEN: 已用 wa-cli source add --type author-note --file idea.md --dir D 登记过素材
        - WHEN: 再次运行同一命令
        - THEN: diagnostics 中有一条错误码为 source.exists、path 为该素材目录的诊断；存档与 source.yaml 与运行前逐字节相同，退出码为 1
      unknown-type:
        - GIVEN: 刚初始化的工作区 D
        - WHEN: 运行 wa-cli source add --type diary --file idea.md --dir D --json
        - THEN: diagnostics 中有一条错误码为 artifact.schema-violation、field 为 type 的诊断，sources/ 下没有新建目录，退出码为 1
      empty-content:
        - GIVEN: 刚初始化的工作区 D，D/empty.md 为空文件
        - WHEN: 运行 wa-cli source add --type author-note --file empty.md --dir D --json
        - THEN: diagnostics 中有一条错误码为 source.empty 的诊断，sources/ 下没有新建目录，退出码为 1
  source-list:
    strength: MUST
    statement: wa-cli source list 必须只读地列出工作区中已登记的素材：--json 输出 sources 数组，按 id 排序，每项含 id、type、title（未设置时为 null）、path（存档文件路径）与 sha256；只列出 sources/ 下不以 . 开头、通过素材校验（见 archive-integrity）的子目录。changedPaths 为空数组；有素材目录不通过素材校验时报告其诊断、valid 为 false、退出码为 1，其他素材照常列出；否则退出码为 0。
    scenarios:
      list-sources:
        - GIVEN: 已登记素材 interview-ceo 与 src-0123456789ab
        - WHEN: 运行 wa-cli source list --dir D --json
        - THEN: sources 依次为 interview-ceo 与 src-0123456789ab，changedPaths 为空数组，退出码为 0
      list-empty:
        - GIVEN: 刚初始化的工作区 D
        - WHEN: 运行 wa-cli source list --dir D --json
        - THEN: sources 为空数组，valid 为 true，退出码为 0
      list-skips-tampered:
        - GIVEN: 已登记素材 interview-ceo 与 tampered，tampered 的存档文件被改动
        - WHEN: 运行 wa-cli source list --dir D --json
        - THEN: sources 只含 interview-ceo；diagnostics 中有一条错误码为 source.modified 的诊断，valid 为 false，退出码为 1
  archive-integrity:
    strength: MUST
    statement: 素材原文不得被改写：对 sources/ 下每个不以 . 开头的子目录，wa-cli validate 必须检查 source.yaml 存在（否则 artifact.not-found）且符合素材的 JSON Schema、id 等于目录名（否则 source.id-mismatch，field 为 id）、file 指向的存档文件存在（否则 artifact.not-found，path 为该文件）且其 SHA-256 等于 sha256（否则 source.modified，path 为存档文件）。sources/ 下的普通文件不属于素材库，不检查。每个检查过的 source.yaml 计入 checked。
    scenarios:
      tampered-archive:
        - GIVEN: 已登记素材 interview-ceo，之后有人修改了其存档文件 original.txt
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有一条错误码为 source.modified、path 为 .writing-anything/sources/interview-ceo/original.txt 的诊断，valid 为 false，退出码为 1
      intact-archive:
        - GIVEN: 已登记素材 interview-ceo，存档未被改动
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: valid 为 true，checked 包含 .writing-anything/sources/interview-ceo/source.yaml，退出码为 0
      missing-metadata:
        - GIVEN: sources/ 下有一个没有 source.yaml 的子目录 loose
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有一条错误码为 artifact.not-found、path 为 .writing-anything/sources/loose/source.yaml 的诊断，退出码为 1
  paragraph-model:
    strength: MUST
    statement: 正文按段落（Paragraph）计算出处：段落是由空行（只含空白字符的行）分隔的连续非空行；去掉行首空白后以 ``` 或 ~~~ 开头的行开启围栏代码块，直到去掉行首空白后以同样字符开头的行结束，整个代码块（含其中的空行）与紧邻的非空行同属一个段落，未闭合的围栏延续到正文末尾。段落哈希为把 CRLF 换成 LF、去掉每行行尾空白后的段落文本的 SHA-256 十六进制；只在行尾空白或换行符上不同的两个段落哈希相同。一个单元的正文最多 10000 个段落。
    scenarios:
      fenced-code:
        - GIVEN: 正文为一段说明、一个内部含空行的 ``` 代码块、再一段说明，三者之间以空行分隔
        - WHEN: 通过 wa-cli draft write 写入后运行 wa-cli provenance my-post --dir D --json
        - THEN: provenance.paragraphs 共 3 项，第 2 项为整个代码块
      trailing-whitespace:
        - GIVEN: Agent 写入的某段行尾没有空格，作者之后只在该段行尾加了空格
        - WHEN: 运行 wa-cli provenance my-post --dir D --json
        - THEN: 该段的 origin 仍为 agent
  draft-write:
    strength: MUST
    statement: wa-cli draft write <unit> 必须把读取到的内容逐字节写入单元目录（见 units-and-lifecycle 主规格的 advance-stage）下的 draft.md，子单元的单元目录不存在时先创建；同时写出同目录的写入记录（Draft Record）provenance.yaml，含 schema_version（1）、sha256（整篇正文原始字节的 SHA-256）与 paragraphs（按顺序排列的每个段落的 hash 与 origin；origin 为 agent 且为 UTF-8 文本的段落另含 text，即该段落的原文；正文仍逐字节写入，不是 UTF-8 的段落不记原文）。新正文中与写入前 draft.md 里出处为 human 或 agent-draft-human-edited 的某个段落哈希相同的段落保留该出处，其余段落的 origin 为 agent。成功时退出码为 0，覆盖写入记录之前，必须把作者对 Agent 段落的修改追加到同目录的修改记录 edits.yaml（见 preferences 主规格的 edit-record）；changedPaths 列出新建的单元目录与内容发生变化的 draft.md、provenance.yaml 与 edits.yaml（正文与写入记录都不变时为空数组），--json 输出的 draft 字段含 unit（单元引用）、path（draft.md 路径）、paragraphs（段落数）与 sha256。内容为空或只含空白时报告 draft.empty；新正文或现有 draft.md 超过 10000 个段落时报告 draft.too-large；现有 provenance.yaml 不通过 Schema 校验时报告其诊断；单元目录途经的 units/ 或单元目录本身不是真实目录（如符号链接）时报告 workspace.write-failed；单元引用无法解析时按 units-and-lifecycle 主规格的 unit-reference 处理；这些情况都不修改文件，退出码为 1。作者改过正文时的写入条件见 human-edit-protection；通过检查、写入正文之前，把当前 draft.md 中尚未记入的批注记入 feedback.yaml（见 feedback 主规格的 comment-feedback），此时 changedPaths 也列出 feedback.yaml。
    scenarios:
      write-root:
        - GIVEN: 已用 wa-cli new minimal my-post --dir D 创建作品
        - WHEN: 通过标准输入传入三段正文运行 wa-cli draft write my-post --dir D --json
        - THEN: D/.writing-anything/works/my-post/draft.md 与输入逐字节相同，provenance.yaml 的 paragraphs 为 3 项且 origin 均为 agent 且 text 为各段原文；draft.paragraphs 为 3；changedPaths 为 [.writing-anything/works/my-post/draft.md, .writing-anything/works/my-post/provenance.yaml]，退出码为 0；此后 wa-cli next my-post 不再报告缺少 draft 产物（阶段为 draft 时）
      write-child:
        - GIVEN: 作品 my-post 有子单元 intro，D/.writing-anything/works/my-post/units/intro/ 不存在
        - WHEN: 运行 wa-cli draft write my-post/intro --file intro.md --dir D --json
        - THEN: changedPaths 为 [.writing-anything/works/my-post/units/intro, .writing-anything/works/my-post/units/intro/draft.md, .writing-anything/works/my-post/units/intro/provenance.yaml]，退出码为 0
      rewrite-keeps-human:
        - GIVEN: Agent 写入两段后，作者在 draft.md 末尾加了第三段
        - WHEN: Agent 用 wa-cli diff my-post 取得 base 后，保留作者的第三段、改写第一段，运行 wa-cli draft write my-post --base <base> --dir D --json
        - THEN: provenance.yaml 中第一段与第二段的 origin 为 agent，第三段为 human，退出码为 0
      same-content:
        - GIVEN: 刚用 wa-cli draft write my-post 写入正文，之后没有任何改动
        - WHEN: 用相同内容再次运行 wa-cli draft write my-post --dir D --json
        - THEN: changedPaths 为空数组，draft.md 与 provenance.yaml 的修改时间不变，退出码为 0
      empty-draft:
        - GIVEN: 已创建作品 my-post
        - WHEN: 通过标准输入传入空内容运行 wa-cli draft write my-post --dir D --json
        - THEN: diagnostics 中有一条错误码为 draft.empty 的诊断，单元目录下没有 draft.md，退出码为 1
      too-large:
        - GIVEN: 已创建作品 my-post
        - WHEN: 通过标准输入传入 10001 个段落运行 wa-cli draft write my-post --dir D --json
        - THEN: diagnostics 中有一条错误码为 draft.too-large 的诊断，单元目录下没有 draft.md，退出码为 1
      edit-logged:
        - GIVEN: Agent 写入两段后，作者把第一段「首先，我们需要赋能团队。」改为「先让团队上手。」
        - WHEN: Agent 用 wa-cli diff 取得 base 后，保留作者改过的第一段、改写第二段，运行 wa-cli draft write my-post --base <base> --dir D --json
        - THEN: edits.yaml 的 edits 含一项 before 为「首先，我们需要赋能团队。」、after 为「先让团队上手。」的修改对，changedPaths 含 edits.yaml；新的写入记录中第一段的 origin 为 agent-draft-human-edited、没有 text，第二段为 agent 且含 text
  provenance-derivation:
    strength: MUST
    statement: 段落出处必须由写入记录与当前 draft.md 推导，取值为 human、agent、agent-draft-human-edited：把当前段落的哈希序列与写入记录 paragraphs 的哈希序列按最长公共子序列对齐，对齐上的段落沿用记录中的 origin；在相邻两个对齐点之间（含开头与结尾），未对齐的当前段落按顺序与同一区间内未对齐的记录段落一一配对，配对上的段落在记录 origin 为 human 时为 human、否则为 agent-draft-human-edited，没有配对的当前段落为 human。单元目录下没有 provenance.yaml 时，全部段落为 human。
    scenarios:
      edit-one:
        - GIVEN: Agent 用 draft write 写入三段，作者直接修改了 draft.md 的第二段
        - WHEN: 运行 wa-cli provenance my-post --dir D --json
        - THEN: 三段的 origin 依次为 agent、agent-draft-human-edited、agent
      insert-one:
        - GIVEN: Agent 写入三段，作者在第一段与第二段之间插入了一段
        - WHEN: 运行 wa-cli provenance my-post --dir D --json
        - THEN: 四段的 origin 依次为 agent、human、agent、agent
      delete-one:
        - GIVEN: Agent 写入三段，作者删除了第二段
        - WHEN: 运行 wa-cli provenance my-post --dir D --json
        - THEN: 两段的 origin 均为 agent
      no-record:
        - GIVEN: 作者直接创建了 D/.writing-anything/works/my-post/draft.md，含两段，没有运行过 draft write
        - WHEN: 运行 wa-cli provenance my-post --dir D --json
        - THEN: 两段的 origin 均为 human，退出码为 0
  provenance-report:
    strength: MUST
    statement: wa-cli provenance <unit> 必须只读地输出单元正文的出处：--json 输出的 provenance 字段含 unit、path（draft.md 路径）、paragraphs（按顺序的数组，每项含 index（从 1 开始）、line（段落首行的行号）、origin 与 chars）与 summary（按 human、agent、agent-draft-human-edited 固定顺序的三项，每项含 origin、paragraphs、chars 与 ratio），以及 totalParagraphs 与 totalChars。chars 为段落中非空白 Unicode 字符的个数；ratio 为该类 chars 占 totalChars 的比例，保留 4 位小数，totalChars 为 0 时为 0。changedPaths 为空数组。单元目录下没有 draft.md（包括单元目录途经符号链接、draft.md 不是普通文件）时报告 draft.not-found（path 为 draft.md 的路径，next 包含 wa-cli help draft write --json），provenance 为 null，退出码为 1；draft.md 超过 10000 个段落时报告 draft.too-large；provenance.yaml 不通过 Schema 校验时报告其诊断，退出码为 1。不加 --json 时以人读文本输出汇总与逐段出处。
    scenarios:
      summary-ratio:
        - GIVEN: Agent 写入两段各 30 个非空白字符的正文，作者之后追加了一段 40 个非空白字符的段落
        - WHEN: 运行 wa-cli provenance my-post --dir D --json
        - THEN: totalParagraphs 为 3，totalChars 为 100；summary 依次为 {human, 1, 40, 0.4}、{agent, 2, 60, 0.6}、{agent-draft-human-edited, 0, 0, 0}，changedPaths 为空数组，退出码为 0
      no-draft:
        - GIVEN: 已创建作品 my-post，单元目录下没有 draft.md
        - WHEN: 运行 wa-cli provenance my-post --dir D --json
        - THEN: diagnostics 中有一条错误码为 draft.not-found、path 为 .writing-anything/works/my-post/draft.md 的诊断，provenance 为 null，退出码为 1
  claim-add:
    strength: MUST
    statement: wa-cli claim add <unit> --kind <kind> --text <text> 必须在单元目录下的 claims.yaml 的 claims 末尾追加一个论断（Claim）：kind 取值为 experience、opinion、case、data、fact 之一；--sources 为逗号分隔的素材 id（省略时为空数组，表示尚未关联素材）；id 由 --id 指定，省略时为 claim-<n>，n 从已有论断数加一开始递增到不与已有论断重复。claims.yaml 不存在时创建（含 schema_version 1），子单元目录不存在时先创建；已有 claims.yaml 时只追加该项，保留其他内容与 YAML 注释。成功时退出码为 0，changedPaths 列出新建的单元目录与 claims.yaml，--json 输出的 claim 字段含 unit、id、kind、text 与 sources。sources 中的素材 id 未登记时报告 claim.unknown-source（field 为 sources[i]）；kind 不在取值范围内、--id 不符合 id 格式或 text 为空时报告 artifact.schema-violation（field 为 kind、id 或 text）；id 与该单元已有论断相同时报告 artifact.duplicate-id（field 为 id）；这些由参数引起的诊断的 next 包含 wa-cli help claim add --json 与 wa-cli source list。已有 claims.yaml 不通过校验时报告其诊断（field 以 claims 开头，next 保留能复查它的校验命令）；claims 经由 YAML 锚点、别名或合并键得到时报告 claim.anchored-value；这些情况都不修改文件，退出码为 1。
    scenarios:
      add-claim:
        - GIVEN: 已创建作品 my-post，已登记素材 interview-ceo
        - WHEN: 运行 wa-cli claim add my-post --kind experience --text 我们在一周内完成了迁移 --sources interview-ceo --dir D --json
        - THEN: D/.writing-anything/works/my-post/claims.yaml 的 claims 为一项：id 为 claim-1、kind 为 experience、sources 为 [interview-ceo]；claim.id 为 claim-1；changedPaths 为 [.writing-anything/works/my-post/claims.yaml]，退出码为 0
      unknown-source:
        - GIVEN: 已创建作品 my-post，没有登记素材 nope
        - WHEN: 运行 wa-cli claim add my-post --kind data --text 性能提升了 30% --sources nope --dir D --json
        - THEN: diagnostics 中有一条错误码为 claim.unknown-source、field 为 sources[0] 的诊断，单元目录下没有 claims.yaml，退出码为 1
      claim-without-source:
        - GIVEN: 已创建作品 my-post
        - WHEN: 运行 wa-cli claim add my-post --kind opinion --text 微服务不适合小团队 --dir D --json
        - THEN: claims.yaml 中该论断的 sources 为空数组，退出码为 0
      existing-problem-kept:
        - GIVEN: 作品 my-post 的 claims.yaml 中 claim-1 引用的素材 interview-ceo 已被删除
        - WHEN: 运行 wa-cli claim add my-post --kind fact --text 无关 --dir D --json
        - THEN: diagnostics 中有一条错误码为 claim.unknown-source、field 为 claims[0].sources[0] 的诊断，其 next 包含 wa-cli validate --dir D --json；claims.yaml 不变，退出码为 1
  unit-artifact-validation:
    strength: MUST
    statement: wa-cli validate 整体校验时，必须对每个可加载作品的每个单元目录中存在的 provenance.yaml 与 claims.yaml 做 Schema 校验并计入 checked；claims.yaml 另须满足论断 id 在文件内唯一（否则 artifact.duplicate-id）且 sources 中的每个素材 id 都已登记（否则 claim.unknown-source，field 为 claims[i].sources[j]），这两类诊断的 next 包含 wa-cli validate --dir <dir> --json。wa-cli validate <path> 按产物所在位置识别 source.yaml、provenance.yaml 与 claims.yaml，并执行与整体校验相同的检查。
    scenarios:
      claim-source-removed:
        - GIVEN: 作品 my-post 的 claims.yaml 引用素材 interview-ceo，之后 sources/interview-ceo/ 被删除
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有一条错误码为 claim.unknown-source、path 为 .writing-anything/works/my-post/claims.yaml、field 为 claims[0].sources[0] 的诊断，退出码为 1
      single-claims-file:
        - GIVEN: 作品 my-post 的 claims.yaml 合法
        - WHEN: 运行 wa-cli validate .writing-anything/works/my-post/claims.yaml --dir D --json
        - THEN: valid 为 true，checked 只含该文件，退出码为 0
  human-edit-protection:
    strength: MUST
    statement: 单元目录下已有 draft.md，且没有写入记录或 draft.md 原始字节的 SHA-256 不等于写入记录的 sha256 时，视为作者改过正文（人工编辑保护（Human Edit Protection））：wa-cli draft write 的新内容与当前 draft.md 逐字节相同时照常成功；否则只有 --base 等于当前 draft.md 的 SHA-256 才写入。未给出 --base 时报告 draft.human-edited，--base 与当前 SHA-256 不同时报告 draft.base-mismatch；两者的 path 为 draft.md，message 说明作者改过正文，next 包含 wa-cli diff <unit> --dir <dir> --json；都不修改任何文件（包括 feedback.yaml），退出码为 1。作者没有改过正文时 --base 可以省略，给出时同样必须等于当前 SHA-256。draft write 在写入任何文件（包括记入批注）之前完成全部检查：内容、段落上限、上述人工编辑检查，以及现有 draft.md 的段落上限与写入记录的校验；任何一项失败都不修改文件。
    scenarios:
      refuse-overwrite:
        - GIVEN: Agent 用 wa-cli draft write my-post 写入正文后，作者直接修改了 draft.md
        - WHEN: 运行 wa-cli draft write my-post --file new.md --dir D --json
        - THEN: diagnostics 中有一条错误码为 draft.human-edited、path 为 .writing-anything/works/my-post/draft.md 的诊断，其 next 包含 wa-cli diff my-post 命令；draft.md 与 provenance.yaml 与运行前逐字节相同，退出码为 1
      write-with-base:
        - GIVEN: 同上，wa-cli diff my-post --dir D --json 输出的 diff.base 为 B
        - WHEN: 运行 wa-cli draft write my-post --file new.md --base B --dir D --json
        - THEN: draft.md 与 new.md 逐字节相同，退出码为 0
      stale-base:
        - GIVEN: 同上，取得 B 之后作者再次修改了 draft.md
        - WHEN: 运行 wa-cli draft write my-post --file new.md --base B --dir D --json
        - THEN: diagnostics 中有一条错误码为 draft.base-mismatch 的诊断，draft.md 不变，退出码为 1
      author-only-draft:
        - GIVEN: 作者直接创建了 draft.md，没有运行过 draft write
        - WHEN: 运行 wa-cli draft write my-post --file new.md --dir D --json
        - THEN: diagnostics 中有一条错误码为 draft.human-edited 的诊断，退出码为 1
      identical-rewrite:
        - GIVEN: 作者改过 draft.md
        - WHEN: 以与当前 draft.md 逐字节相同的内容运行 wa-cli draft write my-post --dir D --json
        - THEN: 退出码为 0，此后写入记录的 sha256 等于 draft.md 的 SHA-256
  draft-diff:
    strength: MUST
    statement: wa-cli diff <unit> 必须只读地列出作者自最近一次 draft write 以来对正文的改动：--json 输出的 diff 字段含 unit、path（draft.md 路径）、edited（作者是否改过正文，判断同 human-edit-protection）、base（当前 draft.md 的 SHA-256，可直接用作 draft write 的 --base）、recorded（写入记录的 sha256，没有写入记录时为 null）与 changes。changes 按正文顺序列出改动：把当前段落与写入记录的段落按最长公共子序列对齐，相邻对齐点之间未对齐的当前段落与记录段落按顺序配对，配对上的当前段落为 edited，多出的当前段落为 added，多出的记录段落为 removed；没有写入记录时每个段落都是 added。每项含 kind、at（added 与 edited 为该段落的序号，removed 为其后第一个当前段落的序号，位于末尾时为段落数加一）、line（段落首行的行号，removed 为 null）与 text（段落当前的文字，removed 为 null）。changedPaths 为空数组；单元没有 draft.md 时报告 draft.not-found，diff 为 null，退出码为 1。不加 --json 时以人读文本列出改动与 base。
    scenarios:
      diff-clean:
        - GIVEN: Agent 写入正文后作者没有修改
        - WHEN: 运行 wa-cli diff my-post --dir D --json
        - THEN: diff.edited 为 false，changes 为空数组，退出码为 0
      diff-edits:
        - GIVEN: Agent 写入三段 A、B、C 后，作者把 B 改成 B2 并删除了 C
        - WHEN: 运行 wa-cli diff my-post --dir D --json
        - THEN: diff.edited 为 true，changes 依次为 {edited, at 2, text B2} 与 {removed, at 3, line null, text null}，diff.base 等于 draft.md 的 SHA-256，changedPaths 为空数组，退出码为 0
      diff-insert:
        - GIVEN: Agent 写入三段 A、B、C 后，作者在 A 与 B 之间插入了 X
        - WHEN: 运行 wa-cli diff my-post --dir D --json
        - THEN: changes 只含 {added, at 2, text X}，退出码为 0
  claim-edit:
    strength: MUST
    statement: wa-cli claim set <unit> <claim> 必须修改单元 claims.yaml 中 id 为 <claim> 的论断（Claim）：--kind 与 --text 替换对应字段，--sources（逗号分隔的素材 id，给出空值时为空数组）整体替换所关联的素材，省略的参数不修改；只改动这些字段，保留其他内容与 YAML 注释。成功时退出码为 0，--json 输出的 claim 字段含修改后论断的 unit、id、kind、text 与 sources，changedPaths 为 [claims.yaml]；取值与原有取值相同时不写文件，changedPaths 为空数组。wa-cli claim remove <unit> <claim> 必须删除该论断并保留其他内容与注释，成功时 removed 为论断 id，changedPaths 为 [claims.yaml]。两个命令在单元没有 claims.yaml 或其中没有该 id 时报告 claim.not-found（next 包含 wa-cli claim list <unit> --dir <dir> --json）；sources 中的素材未登记时报告 claim.unknown-source（field 为 sources[i]），kind 不在取值范围内或 text 为空时报告 artifact.schema-violation（field 为 kind 或 text），这些由参数引起的诊断的 next 包含 wa-cli help claim set --json 与 wa-cli source list；已有 claims.yaml 不通过 Schema 校验或论断 id 重复时报告其诊断；修改或删除后仍有其他论断引用未登记的素材时照常写入，这些引用以 warning 级 claim.unknown-source 报告（field 为 claims[i].sources[j]，message 提示用 wa-cli claim set 修复）；要修改或删除的论断经由 YAML 锚点、别名或合并键得到时报告 claim.anchored-value（next 包含对应命令的 help）；这些情况都不修改文件，退出码为 1。
    scenarios:
      set-sources:
        - GIVEN: 作品 my-post 的 claims.yaml 有论断 claim-1（experience，只关联 reference 素材 doc），claims 上方有作者的注释；已登记 interview 素材 talk
        - WHEN: 运行 wa-cli claim set my-post claim-1 --sources talk,doc --dir D --json
        - THEN: claim.sources 为 [talk, doc]，kind 与 text 不变；changedPaths 为 [.writing-anything/works/my-post/claims.yaml]，作者的注释保留，退出码为 0
      set-unchanged:
        - GIVEN: 同上
        - WHEN: 再次运行 wa-cli claim set my-post claim-1 --sources talk,doc --dir D --json
        - THEN: changedPaths 为空数组，退出码为 0
      claim-not-found:
        - GIVEN: 作品 my-post 的 claims.yaml 中没有 claim-9
        - WHEN: 运行 wa-cli claim set my-post claim-9 --kind data --dir D --json 或 wa-cli claim remove my-post claim-9 --dir D --json
        - THEN: diagnostics 中有一条错误码为 claim.not-found 的诊断，其 next 为 wa-cli claim list my-post --dir D --json；claims.yaml 不变，退出码为 1
      set-unknown-source:
        - GIVEN: 没有登记素材 nope
        - WHEN: 运行 wa-cli claim set my-post claim-1 --sources nope --dir D --json
        - THEN: diagnostics 中有一条错误码为 claim.unknown-source、field 为 sources[0] 的诊断，其 next 包含 wa-cli help claim set --json；claims.yaml 不变，退出码为 1
      remove-claim:
        - GIVEN: 作品 my-post 的 claims.yaml 有 claim-1 与 claim-2，claims 上方有作者的注释
        - WHEN: 运行 wa-cli claim remove my-post claim-1 --dir D --json
        - THEN: removed 为 claim-1，claims.yaml 只剩 claim-2 且注释保留，changedPaths 为 [.writing-anything/works/my-post/claims.yaml]，退出码为 0
  claim-list:
    strength: MUST
    statement: wa-cli claim list <unit> 必须按 claims.yaml 中的顺序输出单元的论断（Claim）：--json 输出的 claims 为数组，每项含 unit、id、kind、text 与 sources；单元没有 claims.yaml 时为空数组；claims.yaml 不通过 Schema 校验或论断 id 重复时报告其诊断，claims 为空数组，退出码为 1；论断引用未登记的素材时照常列出全部论断，这些引用以 warning 级 claim.unknown-source 报告。该命令只读，changedPaths 为空数组。
    scenarios:
      list-claims:
        - GIVEN: 作品 my-post 的 claims.yaml 有 claim-1（case）与 claim-2（opinion）
        - WHEN: 运行 wa-cli claim list my-post --dir D --json
        - THEN: claims 依次为 claim-1 与 claim-2，每项的 unit 为 my-post，changedPaths 为空数组，退出码为 0
      dangling-source:
        - GIVEN: 作品 my-post 的 claims.yaml 中 claim-2 引用的素材 src-b 已被删除，已登记素材 src-a
        - WHEN: 运行 wa-cli claim set my-post claim-1 --sources src-a --dir D --json 与 wa-cli claim list my-post --dir D --json
        - THEN: 两者退出码都为 0：claim set 写入 claims.yaml，claim list 列出全部论断；diagnostics 中各有一条 severity 为 warning、错误码为 claim.unknown-source、field 为 claims[1].sources[0] 的诊断
      list-empty:
        - GIVEN: 作品 my-post 没有 claims.yaml
        - WHEN: 运行 wa-cli claim list my-post --dir D --json
        - THEN: claims 为空数组，退出码为 0
  canon-add:
    strength: MUST
    statement: wa-cli canon add <work> --type <type> --text <text> 必须在作品根单元目录下的设定集 canon.yaml 的 entries 末尾追加一个设定条目（Canon Entry）：work 为作品根单元引用；type 取值为 character（人物，该类条目即人物卡（Character Sheet））、location（地点）、item（物品）、world-rule（世界规则）与 relationship（人物关系）之一；character、location 与 item 条目必须给出非空的 --name，world-rule 与 relationship 条目不得给出 --name 与 --aliases；--sources 为逗号分隔的素材 id（省略时为空数组，表示尚未关联素材）；--aliases 为逗号分隔的别名（Alias）（省略时为空数组）；--pin 时 protection 为 author-pinned，否则为 normal；relationship 条目必须给出 --members（逗号分隔的条目 id），成员为 2 个以上不重复的 id 且每个都是同一 canon.yaml 中的 character 条目。id 由 --id 指定，省略时为 canon-<n>，n 从已有条目数加一开始递增到不重复。canon.yaml 不存在时创建（含 schema_version 1 与 entries），已存在时只追加该项，保留其他内容与 YAML 注释。成功时退出码为 0，changedPaths 为 canon.yaml，--json 输出的 canon 字段含 work、id、type、name（未设置时为 null）、text、sources、protection、aliases（无别名时为空数组）、members（非 relationship 条目为空数组）。--name 与 --text 不是 UTF-8 文本时报告 input.invalid-value（field 为 name 或 text）；sources 中的素材 id 未登记时报告 canon.unknown-source（field 为 sources[i]）；members 引用的不是同文件 character 条目时报告 canon.unknown-character（field 为 members[i]）；type 不在取值范围内、text 为空、--name 只含空白、--aliases 元素只含空白或彼此重复、--id 不符合 id 格式、members 少于 2 个或有重复时报告 artifact.schema-violation（field 为 type、text、name、aliases、id 或 members）；--aliases 的取值与任何条目的 name、其他条目的别名或本条目 name 重复时报告 canon.duplicate-alias（field 为 aliases[i]；name 之间可以重复，场景级上下文包按 name 匹配同名条目）；id 与已有条目相同时报告 artifact.duplicate-id（field 为 id）；这些由参数引起的诊断的 next 包含 wa-cli help canon add --json 与 wa-cli source list。已有 canon.yaml 不通过 Schema 校验，或其中已有条目存在 id 重复、别名重复、sources 或 members 引用失效时报告其诊断（field 以 entries 开头）；要追加之处经由 YAML 锚点、别名或合并键得到时报告 canon.anchored-value；canon.yaml 途经符号链接或不是普通文件时按 artifact.not-found 处理；这些情况都不修改文件，退出码为 1。未找到工作区时报告 workspace.not-found；作品不存在或给出子单元引用时报告 work.not-found（message 说明 canon 是作品级产物）。 另外，canon add 支持 --scope series（缺省 work）：series 时条目写入作品所属系列的共享设定集 .writing-anything/series/<series>/canon.yaml（同一 Schema 与领域校验；作品不属于任何系列时报告 canon.not-in-series，field 为 scope，next 含 wa-cli series show --json），条目含 scope 为 series；--override-reason 与 --confirmed-by-author、--confirmation 只用于作品级条目覆盖系列级同 id 条目的场合：覆盖时三者必须同时给出（--override-reason 为非空文本、--confirmed-by-author 与非空白 --confirmation 同给，否则报告 canon.override-unconfirmed，field 为 override-reason），写入条目的 override 字段（reason、confirmation 与 confirmed_at）；非覆盖条目给出这些参数时报告 input.invalid-value（field 为 override-reason）。
    scenarios: {}
  canon-edit:
    strength: MUST
    statement: wa-cli canon set <work> <entry> 必须修改 canon.yaml 中 id 为 <entry> 的设定条目：--type 与 --text 替换对应字段；--name（空字符串删除该字段）与 --sources（逗号分隔的素材 id，空字符串表示清空）整体替换；--aliases（逗号分隔的别名（Alias），空字符串删除该字段）整体替换；--members（逗号分隔的条目 id，空字符串删除该字段）整体替换人物关系的成员；--pin 把 protection 升为 author-pinned，--unpin 把 protection 降为 normal（两者不得同时给出，否则报告 input.invalid-value，field 为 pin）；省略的参数不修改；只改动这些字段，保留其他条目、其他内容与 YAML 注释。--name 与 --text 不是 UTF-8 文本时报告 input.invalid-value（field 为 name 或 text）。成功时退出码为 0，--json 输出的 canon 字段为修改后的条目（同 canon-add 的字段，含 aliases，无别名时为空数组），changedPaths 为 [canon.yaml]；取值与原有取值相同时不写文件，changedPaths 为空数组。修改或删除后仍有条目的 sources、members 或 decision 引用失效时照常写入，这些引用以 warning 级诊断报告（canon.unknown-source、canon.unknown-character 或 canon.unknown-decision，message 提示修复命令）；修改后的 aliases 与任何条目的 name、其他条目的别名或本条目 name 重复时报告 canon.duplicate-alias（field 为 aliases[i]），不修改文件（name 之间可以重复）。对 protection 为 normal 的条目给出 --decision 时报告 input.invalid-value（field 为 decision，message 说明该参数只用于作者钦定条目的授权），不修改文件。wa-cli canon remove <work> <entry> 必须删除该条目并保留其他内容与注释：成功时 removed 为条目 id，changedPaths 为 [canon.yaml]；删除 character 条目后仍有 relationship 条目引用它时照常删除，以 warning 级 canon.unknown-character 报告剩余引用；对 normal 条目给出 --decision 同样报告 input.invalid-value。两个命令在作品没有 canon.yaml 或其中没有该 id 时报告 canon.not-found（next 包含 wa-cli canon list <work> --dir <dir> --json）；--type 不在取值范围内、--text 为空、--name 只含空白、--aliases 元素只含空白或彼此重复、--members 少于 2 个或有重复、--sources 中有素材未登记时报告对应诊断（同 canon-add 的错误码与 field）；由参数引起的诊断的 next 包含 wa-cli help canon set --json 与 wa-cli source list；已有 canon.yaml 不通过 Schema 校验或条目 id 重复时报告其诊断；要修改或删除的条目经由 YAML 锚点、别名或合并键得到时报告 canon.anchored-value；作者钦定条目的写保护见 canon-protection；这些情况都不修改文件，退出码为 1。 canon set 修改的作品级条目覆盖系列级同 id 条目（条目含 override 或本次修改使其构成覆盖）时，同样必须给出 --override-reason 与 --confirmed-by-author、--confirmation，并把 override 更新为本次取值（reason 与 confirmation 更新、confirmed_at 为本次时间）；缺失报告 canon.override-unconfirmed 且不修改文件。
    scenarios: {}
  canon-protection:
    strength: MUST
    statement: 'protection 为 author-pinned 的条目受最高级别保护：wa-cli canon set 与 wa-cli canon remove 修改或删除这类条目（包括把 protection 改为 normal，即 --unpin）时，未给出 --decision 或给出的决策不满足授权条件时必须拒绝：报告错误码 canon.author-pinned（path 为 canon.yaml，message 说明条目 id、操作与拒绝原因，next 包含 wa-cli decisions --dir <dir> --json 与 wa-cli help canon set --json），退出码为 1，canon.yaml 不变。拒绝的同时必须在决策队列追加一条阻塞决策（按 decisions 主规格 decision-add 的形态，写入 .writing-anything/decisions.yaml）：question 为固定格式「是否允许修改作者钦定的设定条目 <entry>（<name>）？」或「是否允许删除作者钦定的设定条目 <entry>（<name>）？」（entry 为条目 id，name 为条目的 name，没有 name 时省略括号部分），options 为 [{id: a, text: 允许}, {id: b, text: 保持不变}]，recommendation 为 b，rationale 说明作者钦定的设定默认保持不变，blocking 为 true，units 为该作品根单元，id 为 dec-<n>；同一作品、同一条目与同一操作已有 status 为 open 的此类决策时不重复追加；该操作已有一条作者选择为保持不变（选项 b）的已决定决策时也不重复追加，message 说明作者已决定保持不变；追加决策时 changedPaths 为 [.writing-anything/decisions.yaml]，未追加（已存在）时为空数组；给出 --decision 时不追加新的决策；decisions.yaml 已有解析或校验问题时报告其诊断且不追加，canon.yaml 与 decisions.yaml 都不变。给出的 --decision <id> 指向的决策存在、为上述格式生成、status 为 decided 且 choice 为 a 时必须照常执行修改或删除（其余检查同 canon-edit），修改后条目的 decision 字段记录该决策 id；--decision 指向的决策不存在、不是为该条目与该操作生成的、尚未决定或 choice 不为 a 时报告 canon.author-pinned（message 说明具体原因），不执行修改。protection 为 normal 的条目不受此限制；--pin 把 normal 升为 author-pinned、canon add --pin 新增钦定条目，以及取值与原有取值相同的不写入调用，都不需要决策。由此生成的决策按 decisions 主规格 decision-blocking 阻塞关联单元的推进。'
    scenarios:
      refuse-modify-pinned:
        - GIVEN: 作品 my-story 的 canon.yaml 有 author-pinned 条目 canon-1（name 为 守灯人）
        - WHEN: 运行 wa-cli canon set my-story canon-1 --text 新描述 --dir D --json
        - THEN: 'diagnostics 中有一条错误码为 canon.author-pinned、path 为 .writing-anything/works/my-story/canon.yaml 的诊断，其 next 包含 wa-cli decisions 命令；decisions.yaml 新增一条决策：question 为「是否允许修改作者钦定的设定条目 canon-1（守灯人）？」，options 为 [{id: a, text: 允许}, {id: b, text: 保持不变}]，recommendation 为 b，blocking 为 true，units 为 [my-story]，status 为 open；changedPaths 为 [.writing-anything/decisions.yaml]；canon.yaml 不变，退出码为 1'
      retry-after-decide:
        - GIVEN: 同上生成的决策 dec-1，作者已运行 wa-cli decide dec-1 --option a --confirmation 作者同意这次修改 --dir D
        - WHEN: 运行 wa-cli canon set my-story canon-1 --text 新描述 --decision dec-1 --dir D --json
        - THEN: canon-1 的 text 为 新描述、protection 仍为 author-pinned 且 decision 为 dec-1，changedPaths 为 [.writing-anything/works/my-story/canon.yaml]，退出码为 0
      idempotent-decision:
        - GIVEN: 修改 canon-1 的拒绝已生成 open 决策 dec-1
        - WHEN: 再次运行同一不带 --decision 的 canon set 命令
        - THEN: diagnostics 中仍有一条错误码为 canon.author-pinned 的诊断；decisions.yaml 不新增决策，changedPaths 为空数组，canon.yaml 不变，退出码为 1
      keep-choice-refuses:
        - GIVEN: 同上生成的决策 dec-1，作者已运行 wa-cli decide dec-1 --option b --confirmation 作者决定不改 --dir D
        - WHEN: 运行 wa-cli canon set my-story canon-1 --text 新描述 --decision dec-1 --dir D --json
        - THEN: diagnostics 中有一条错误码为 canon.author-pinned 的诊断（message 说明作者选择保持不变），canon.yaml 不变，退出码为 1
      refuse-remove-pinned:
        - GIVEN: 作品 my-story 的 canon.yaml 有 author-pinned 条目 canon-2（world-rule，没有 name）
        - WHEN: 运行 wa-cli canon remove my-story canon-2 --dir D --json
        - THEN: diagnostics 中有一条错误码为 canon.author-pinned 的诊断；生成的阻塞决策 question 为「是否允许删除作者钦定的设定条目 canon-2？」，canon.yaml 不变，退出码为 1
      blocks-advance:
        - GIVEN: 拒绝修改 canon-1 已生成 open 的阻塞决策 dec-1，作品 my-story 的 brief.yaml 存在且含必需字段
        - WHEN: 运行 wa-cli advance my-story --dir D --json
        - THEN: diagnostics 中有一条错误码为 decision.blocking、path 为 .writing-anything/decisions.yaml 的诊断，work.yaml 不变，退出码为 1
  canon-list:
    strength: MUST
    statement: wa-cli canon list <work> 必须按 canon.yaml 中的顺序输出作品的设定条目：--json 输出的 entries 为数组，每项含 work、id、type、name（未设置时为 null）、text、sources、protection、aliases（无该字段时为空数组）、members（非 relationship 条目为空数组）与 decision（未设置时为 null）。作品没有 canon.yaml 时 entries 为空数组；canon.yaml 不通过 Schema 校验或条目 id、别名重复时报告其诊断，entries 为空数组，退出码为 1；条目的 sources、members 或 decision 引用失效时照常列出全部条目，这些引用以 warning 级诊断报告。该命令只读，changedPaths 为空数组；作品不存在或给出子单元引用时报告 work.not-found。不加 --json 时以人读文本列出条目（含类型、名称、别名、保护级别与内容，作者钦定条目标注［作者钦定］）。 默认输出按作用域解析的视图：作品级条目全部保留（scope 为 work），作品所属系列的系列级条目并入（scope 为 series:<id>），系列级条目与作品级同 id 时被覆盖不出现；每项含 scope 字段，人读输出对非 work 来源加［series:<id>］标注。系列 canon.yaml 不通过校验时报告其诊断（path 为该文件）。
    scenarios: {}
  canon-validation:
    strength: MUST
    statement: wa-cli validate 整体校验时，必须对每个可加载作品目录中存在的 canon.yaml 做 Schema 校验并计入 checked，且满足：条目 id 在文件内唯一（否则 artifact.duplicate-id，field 为 entries[i].id）；每个别名（Alias）不得与任何条目的 name、其他条目的别名或本条目 name 重复（name 之间可以重复，场景级上下文包按 name 匹配同名条目），违反时报告 canon.duplicate-alias，field 为 entries[i].aliases[j]；world-rule 与 relationship 条目不得含 name 与 aliases，character、location 与 item 条目必须含非空 name（否则 artifact.schema-violation，field 为 entries[i].name 或 entries[i].aliases）；sources 中的每个素材 id 都已登记（否则 canon.unknown-source，field 为 entries[i].sources[j]）；relationship 条目的 members 为 2 个以上不重复的 id 且每个都是同文件 character 条目（否则 artifact.schema-violation 或 canon.unknown-character，field 为 entries[i].members[j]）；decision 引用的决策存在于决策队列（否则 canon.unknown-decision，field 为 entries[i].decision）；这些诊断的 next 包含 wa-cli validate --dir <dir> --json。wa-cli validate <path> 按位置识别可加载作品目录下的 canon.yaml 并执行同样的检查。canon.yaml 途经符号链接或不是普通文件时按不存在处理，整体校验报告 artifact.not-found（path 为该 canon.yaml），各 canon 命令同此处理；子单元目录下的 canon.yaml 不属于任何产物类型（artifact.unknown-kind）。 对 .writing-anything/series/*/canon.yaml（系列级设定集）执行同样的 Schema 与领域校验并计入 checked（条目级检查在该文件内进行）；作品级条目的 override 记录不完整（缺非空 reason、confirmation 或 confirmed_at，或 scope 不为 work）时报告 canon.override-unconfirmed（field 为 entries[i].override）。
    scenarios: {}
