    verify-change:
      text: strict-spec-cli verify impact-auto-hint 通过，任务全部完成
      status: complete
      command: strict-spec-cli verify impact-auto-hint
    archive-ready:
      text: 审查通过后归档，规格增量合并入 impact 主规格，路线图计划变更标记完成
      status: complete
