schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: review-reaffirm
approach:
  - probe
  - review.yaml 增加可选 reaffirms 数组（每项含 at、summary、draft_sha256 与本次标记 resolved/waived 的发现项 id 数组）。--reaffirm 时不读取审稿输入：必须已有通过校验的 review.yaml（否则 review.reaffirm-no-review，next 引导整份录入）；既有 rubric 结论与 findings 原样沿用（不重校验 quote——措辞修改后引文移位是重申的常态，引文定位属修订环节）；--resolve/--waive 的 id 必须存在且为 open（错误码复用 review resolve 的判定）；--summary 必填非空白（橡皮图章防线）；draft_sha256 更新为当前正文哈希并追加一条重申记录。验收关卡读 draft_sha256 判 stale，重申后自然解除。
decisions:
  carry-without-requote:
    decision: 重申沿用既有结论与发现项，不重校验 quote 是否仍在正文
    rationale: quote-not-found 正是小改后无法整份重录的直接原因；重申的语义是「结论仍成立、正文已知变化」，强制重校验使重申路径与整份重录同样昂贵
  summary-required:
    decision: 重申必须带非空白的变化摘要并写入重申记录
    rationale: 没有变化摘要的重申会退化为无条件橡皮图章，与 P0-1 要防的吞错同源；摘要是「这次为什么不用重新审」的审计留痕
alternatives:
  - option: 复用 review resolve 逐项处理，不引入 reaffirm
    reason: resolve 只改发现项状态、不更新 draft_sha256：审稿仍过期、验收仍被 stale 阻塞，下游仍被迫整份重录
risks:
  - 重申被滥用于大改：摘要要求加 draft_sha256 留痕使滥用在审计可见；后续审计日志（设计批）让它完全可追
