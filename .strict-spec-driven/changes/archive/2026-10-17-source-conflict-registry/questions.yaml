  - id: conflict-vs-decision
    question: 素材矛盾登记采用方案 A（新冲突产物与命令族）还是方案 B（决策队列子类型 + lint 引用规则）？
    context: 路线图入口问题 conflict-vs-decision。A：一等公民、可统计，但与决策队列平行生长两套作者确认机制；B：零新机制、复用 strict 复核与审计链，但决策结构要承载结构化 payload（两说与素材引文），且 lint 规则需要「正文引用了未决矛盾任一方」的定位手段。上游倾向 B，下游提案原文为 A
    answer: 方案 B：决策队列子类型——decision add 增加结构化冲突（Conflict）载荷（about 与两说各带素材 id 与引文），复用 decide/waiver/blocking/strict 复核与 preview 待确认区全套既有机制；不新建 conflicts.yaml 与独立阻塞器
    status: resolved
    answered_by: human
  - id: conflict-lint-granularity
    question: 「正文引用未决矛盾任一方」的 lint 检测用什么粒度？
    context: 候选：按素材引文的逐字/规范化匹配（与 claim 覆盖同机制）；按数字/关键参数的模式匹配（矛盾多为数字口径）；只登记不检查（依赖 advance 阻塞与作者复核）。影响误报率与实现复杂度
    answer: 按素材引文的逐字/规范化匹配（与 claim 覆盖同机制，复用 lint 的论断匹配器）：open 冲突的任一方引文（规范化后）出现在正文即 error；decided/waived 后不再报（作者知情已记录于决策）；「引用被否定一方」的进一步检查留待后续
    status: resolved
    answered_by: human
