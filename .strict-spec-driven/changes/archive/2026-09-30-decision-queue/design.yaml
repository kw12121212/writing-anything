schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: decision-queue
approach:
  - 数据模型：工作区级的 .writing-anything/decisions.yaml 含 schema_version（1）与 decisions 数组，每项含 id（默认 dec-<n>）、question、options（数组，每项含 id 与 text，id 按顺序为 a、b、c…，可以为空表示自由答复）、可选的 recommendation（推荐的选项 id）与 rationale（推荐理由）、blocking（布尔）、units（关联的单元引用数组，可为空）、status（open 或 decided），decided 时另含 choice（选项 id，没有选项时省略）、answer（答复，可选）、confirmation（作者确认原话的摘要）与 decided_at（RFC 3339 格式的 UTC 确认时间）。
  - 命令：decision add --question <q> [--option <文本>]... [--recommend <选项 id>] [--rationale <文本>] [--blocking] [--unit <单元引用>]... [--id <id>]，关联单元在写入前经 work.Resolve 检查；decisions [--all] 以 blocking 与 nonBlocking 两个数组输出 open 的待决事项（--all 时含已决定的）；decide <id> [--option <选项 id>] [--answer <文本>] --confirmation <原话摘要>，有选项时必须给出 --option，没有选项时必须给出 --answer。
  - 阻塞：Work.Blockers 在缺失必需产物之后追加阻塞来源——读取 decisions.yaml，对 status 为 open、blocking 为 true 且 units 含该单元引用的每个决策给出 code 为 decision.blocking 的阻塞项（artifact 为 decisions，path 为 .writing-anything/decisions.yaml，decision 为决策 id）；decisions.yaml 存在但无法加载时给出一条 decision.invalid-queue 阻塞项。advance、next、status 无需另写判断；被决策阻塞时 next 与 status 的 commands 给出 wa-cli decisions --dir <dir> --json。
  - 参数：命令注册表新增 list 类型参数，可重复出现，按出现顺序收集；help --json 的 type 为 list。decision add 的 --option 与 --unit 使用它。
  - 分层：internal/decision 不 import internal/work，关联单元的存在性由调用方传入的检查函数判断（命令层与 validate 用 work.Resolve）；internal/work 读取决策队列计算阻塞项。写入经 internal/workspace 的原子写入，在节点树上追加或修改，写前重新解析并校验，保留注释。
  - 审查后补充：Work 首次计算阻塞项时加载并缓存决策队列（Work.queue），逐单元只做过滤；validate 的关联单元检查按作品缓存解析结果；决策队列是符号链接时各入口一律报告 artifact.not-found；命令只对字段为参数名的问题改写 next；decision.invalid-queue 的 next 为 wa-cli decisions 与整体校验。
decisions:
  workspace-level-queue:
    decision: 决策队列放在工作区级的一个 decisions.yaml 中，决策通过 units 关联任意作品的单元。
    rationale: 规划变更要求 decisions 一次性列出待决项、方便集中询问作者；单个文件让列出与分组不必遍历所有单元目录，也允许不关联任何单元的项目级决策（如规范包取舍）。
  fail-safe-invalid-queue:
    decision: decisions.yaml 存在但无法加载时，每个单元都得到 decision.invalid-queue 阻塞项。
    rationale: 无法读取时如果当作没有阻塞决策，损坏的文件会静默放行本应被阻塞的推进；里程碑接受偏安全的误判方向，修好文件（validate 给出具体诊断）即可恢复。
  decision-blocker-field:
    decision: 阻塞项新增 decision 字段：决策阻塞项为决策 id，缺失产物的阻塞项为 null；artifact 为 decisions。
    rationale: Agent 需要按决策 id 调用 decide，只写在 message 中无法可靠解析；保留 artifact 字段的含义（持有阻塞来源的产物）并新增一个可空字段，不破坏已有调用方。
  confirmation-required:
    decision: decide 必须给出 --confirmation（作者确认原话的摘要），并由 wa-cli 记录确认时间 decided_at。
    rationale: 术语表把确认记录定义为作者确认的时间与原话摘要，项目约定验收需记录作者确认；没有原话就无法事后核对决定确实来自作者，而不是 Agent 替作者做的选择。
  letter-option-ids:
    decision: 选项 id 按顺序自动编号为 a、b、c…（最多 26 个），--option 只给出选项文本。
    rationale: Agent 向作者提问时常写作「A. … B. …」，字母编号与之对应；自动编号避免 Agent 为每个选项再造 id，也保证 id 符合 id 格式。
  list-flag-type:
    decision: 命令注册表新增可重复的 list 参数类型，修改 cli-contract/registry-declared（delta tech）。
    rationale: 选项与关联单元天然是多个取值；逗号分隔会与选项文本中的逗号冲突，而注册表是参数解析的唯一依据，新增类型比在命令中另行拆分更符合 registry-declared。
alternatives:
  - option: 每个作品一个 decisions.yaml。
    reason: 项目级决策没有归属的作品，decisions 汇总时也要遍历所有作品目录。
  - option: 决策阻塞放在命令层单独检查。
    reason: 违反 workspace-artifacts/single-blocker-source，advance、next 与 status 会给出不同的阻塞结论。
risks:
  - decided_at 依赖本机时钟；测试只断言其格式。
  - 单个 decisions.yaml 在多个 Agent 同时追加时可能发生后写覆盖；原子写入保证文件不损坏，但不做并发合并。
