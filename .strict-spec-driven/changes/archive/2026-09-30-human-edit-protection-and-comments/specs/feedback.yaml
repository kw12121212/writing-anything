schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: feedback
operations:
  ADDED:
    comment-feedback:
      strength: MUST
      statement: 'draft.md 中的每个批注（Comment）<!-- @me: 文本 --> 或 <!-- @me(kind): 文本 -->（kind 为 must-fix、suggestion、question、praise 之一）都必须被解析为该单元的一条作者反馈。批注可以跨行，但不能跨越空行、不能包含另一个 <!--，开头与结尾都不能位于围栏代码块内，开头不能位于行内代码中（同一行中其前的反引号为奇数个）；不满足这些条件的（如漏写 --> 的）不是批注，也不会被移除。id 为 cm- 加「kind、换行、去掉首尾空白的文本」的 SHA-256 前 8 个十六进制字符，同一正文中 kind 与文本都相同的批注依次加 -2、-3，编号时跳过 feedback.yaml 中已关闭（resolved 或 rejected）的记录的 id，使已关闭的记录不再占用正文中仍然存在的批注；kind 省略时为 suggestion；status 为 open；text 为去掉首尾空白的批注文本；source 为 comment；锚点的 quote 为整个批注，定位结果为批注开始的行与所在段落。尚未记入 feedback.yaml 的批注反馈由 feedback list、feedback watch 与 wa-cli next 按 feedback-list 的顺序与已记入的反馈一起列出；feedback.yaml 中已有同 id 记录时只列出该记录。wa-cli draft write 写入正文之前把当前正文中尚未记入的批注反馈记入 feedback.yaml，feedback resolve 处理批注反馈时先记入（见 feedback-resolve）；读取命令不写文件。一个单元的正文最多解析 1000 个批注：超过时 feedback list 与 wa-cli next 只列出前 1000 个并报告 feedback.too-many-comments，draft write 报告 feedback.too-many-comments 并不修改任何文件。'
      scenarios:
        parse-comment:
          - GIVEN: '作品 my-post 的 draft.md 第 3 行为「第二段。<!-- @me(must-fix): 这里要给数据 -->」'
          - WHEN: 运行 wa-cli feedback list my-post --dir D --json
          - THEN: feedback 含一项 source 为 comment、kind 为 must-fix、text 为「这里要给数据」、status 为 open 的反馈，id 以 cm- 开头，anchor.state 为 located、line 为 3；feedback.yaml 没有被创建或修改
        ignore-fenced:
          - GIVEN: 'draft.md 中的 ``` 代码块内含「<!-- @me: 示例 -->」'
          - WHEN: 运行 wa-cli feedback list my-post --dir D --json
          - THEN: feedback 中没有 text 为「示例」的反馈
        import-before-write:
          - GIVEN: 作者在 draft.md 中写了批注，Agent 用 wa-cli diff 取得 base
          - WHEN: Agent 以不含该批注的新正文运行 wa-cli draft write my-post --base <base> --dir D --json
          - THEN: feedback.yaml 中有该批注的记录（source 为 comment、status 为 open），changedPaths 含 feedback.yaml，退出码为 0
        next-lists-comment:
          - GIVEN: draft.md 中有一个批注，feedback.yaml 不存在
          - WHEN: 运行 wa-cli next my-post --dir D --json
          - THEN: steps[0].feedback 含该批注反馈，退出码为 0
        unclosed-comment:
          - GIVEN: 'draft.md 为「A。<!-- @me: 忘了闭合\n\n作者的重要段落。\n\nB。<!-- @me: 真批注 -->」'
          - WHEN: 运行 wa-cli feedback list my-post --dir D --json
          - THEN: feedback 只含 text 为「真批注」的批注反馈；解决它之后，「作者的重要段落。」仍在正文中
        duplicate-comments:
          - GIVEN: draft.md 中有两个内容相同的批注，feedback list 列出 id 为 C 与 C-2 的两条批注反馈
          - WHEN: 运行 wa-cli feedback resolve my-post C --dir D 后再运行 wa-cli feedback list my-post --dir D --json
          - THEN: 第一个批注已从正文移除；feedback 含 id 为 C、status 为 resolved 的记录，以及 id 为 C-2、status 为 open 的批注反馈，后者仍可被 feedback resolve 处理
        inline-code:
          - GIVEN: 'draft.md 为「在正文里写 `<!-- @me: 文本 -->` 即可。」'
          - WHEN: 运行 wa-cli feedback list my-post --dir D --json
          - THEN: feedback 为空数组
  MODIFIED:
    feedback-list:
      strength: MUST
      statement: wa-cli feedback list [<unit>] 必须只读地列出反馈：--json 输出 feedback 数组，未给出 unit 时包含工作区中所有可加载作品的每个单元的反馈（按作品 id 排序、单元树先序、文件内顺序），给出 unit 时只含该单元；--status 只列出该状态（open、accepted、resolved、rejected）的反馈，取值不合法时报告 input.invalid-value，退出码为 1。尚未记入 feedback.yaml 的批注反馈（见 comment-feedback）排在该单元已记入的反馈之后、按正文顺序出现。每项含 unit（单元引用）、id、kind、status、text、note（没有时为 null）、source（conversation 或 comment）与 anchor（state 为 located、orphaned 或 none，quote、line、paragraph 在不适用时为 null）。changedPaths 为空数组；有 feedback.yaml 不通过校验（含反馈 id 重复，见 feedback-validation）时报告其诊断、valid 为 false、退出码为 1，其他反馈照常列出；否则退出码为 0。不加 --json 时以人读文本输出同样的信息。
      scenarios:
        list-all:
          - GIVEN: 作品 my-post 的根单元有 fb-1，子单元 intro 有 fb-1
          - WHEN: 运行 wa-cli feedback list --dir D --json
          - THEN: feedback 依次为 unit 为 my-post 与 my-post/intro 的两项，changedPaths 为空数组，退出码为 0
        list-by-status:
          - GIVEN: 作品 my-post 有 fb-1（open）与 fb-2（resolved）
          - WHEN: 运行 wa-cli feedback list my-post --status open --dir D --json
          - THEN: feedback 只含 fb-1，退出码为 0
    feedback-resolve:
      strength: MUST
      statement: wa-cli feedback resolve <unit> <id> 必须把该单元中 id 为 id 的反馈的 status 改为 --status 给出的取值（open、accepted、resolved、rejected，省略时为 resolved），给出 --note 时把 note 设为该取值；只修改 feedback.yaml 中的这些节点，保留其他内容与 YAML 注释。id 为尚未记入的批注反馈时，先把它记入 feedback.yaml（source 为 comment）再修改。source 为 comment 的反馈状态改为 resolved 或 rejected 时，若 draft.md 中仍有该批注，必须把它从正文移除（批注独占的行整行删除，其余文字不变）；移除前 draft.md 的 SHA-256 等于写入记录的 sha256 时，按移除前各段的出处重建写入记录，使移除不被当作人工编辑。成功时退出码为 0，changedPaths 为该 feedback.yaml 以及被修改的 draft.md 与 provenance.yaml，--json 输出的 feedback 字段为修改后的反馈；status 与 note 都未变化时不写文件，changedPaths 为空数组。单元中没有该反馈时报告 feedback.not-found（next 包含 wa-cli feedback list <unit> 命令）；--status 取值不合法时报告 artifact.schema-violation（field 为 status）；目标反馈或其字段经由 YAML 锚点、别名或合并键得到时报告 feedback.anchored-value；这些情况都不修改文件，退出码为 1。
      scenarios:
        resolve-with-note:
          - GIVEN: 作品 my-post 有 open 状态的 fb-1，作者在 feedback.yaml 中写了一行注释
          - WHEN: 运行 wa-cli feedback resolve my-post fb-1 --note 已在第二段补充数据 --dir D --json
          - THEN: fb-1 的 status 为 resolved、note 为「已在第二段补充数据」，注释保留；changedPaths 为 [.writing-anything/works/my-post/feedback.yaml]，退出码为 0
        resolve-same:
          - GIVEN: fb-1 的 status 已是 resolved
          - WHEN: 运行 wa-cli feedback resolve my-post fb-1 --dir D --json
          - THEN: changedPaths 为空数组，feedback.yaml 不变，退出码为 0
        resolve-missing:
          - GIVEN: 作品 my-post 没有 fb-9
          - WHEN: 运行 wa-cli feedback resolve my-post fb-9 --dir D --json
          - THEN: diagnostics 中有一条错误码为 feedback.not-found 的诊断，退出码为 1
        resolve-comment:
          - GIVEN: 'Agent 写入正文后作者在第二段末尾写了「<!-- @me: 这里要给数据 -->」，wa-cli feedback list my-post 列出其 id 为 C'
          - WHEN: 运行 wa-cli feedback resolve my-post C --note 已补充 --dir D --json
          - THEN: feedback.yaml 中有 id 为 C、source 为 comment、status 为 resolved 的记录；draft.md 中不再含该批注，其余文字不变；changedPaths 含 feedback.yaml 与 draft.md，退出码为 0
  REMOVED: {}
