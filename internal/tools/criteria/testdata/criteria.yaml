  - internal/cli.TestFeedbackWatch
  - internal/feedback.TestRelocation
- milestone: kernel-foundation
  criterion: Agent 通过 wa-cli draft write 写入正文；作者直接修改 draft.md 后，draft write 拒绝覆盖并提示用 wa-cli diff 查看人工改动；正文批注被解析为作者反馈
