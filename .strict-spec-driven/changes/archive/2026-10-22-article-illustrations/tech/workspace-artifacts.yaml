schema: strict-spec-driven/delta-tech/v1
schema_version: 1
artifact_type: delta_tech
schema_file: templates/strict-spec-driven/schemas/delta-tech.yaml
target_standard: workspace-artifacts
operations:
  ADDED:
    trusted-data-uri:
      strength: SHOULD
      statement: '在 html/template 输出中构造 data: URL 必须显式使用 template.URL，且只允许对已通过内容校验（文件头识别、与登记哈希一致等）的字节与固定的 MIME 白名单（data:image/png、data:image/jpeg）构造；不得对未经校验的字节、来自产物的任意字符串或白名单之外的 MIME 使用 template.URL 这类转义豁免。'
      rationale: 'html/template 默认把 data: URL 过滤为 #ZgotmplZ 是防止内联任意内容的安全特性；绕过它必须以内容校验与固定 MIME 为前提，否则等于向页面打开内联任意内容的通道。article-illustrations 的静态阅读页内嵌配图即按此构造（internal/preview 只对经文件头与 SHA-256 校验的 PNG/JPEG 字节构造受信 data URI）。'
      enforcement:
        method: test
        detail: '渲染测试断言输出不含 #ZgotmplZ，且全部 data URI 的前缀属于固定白名单；以对抗性取值（伪装扩展名、非图片字节）覆盖校验失败的路径不产生 data URI。'
      examples:
        good:
          - 对已通过文件头识别且 SHA-256 与登记一致的 PNG 字节，以 template.URL 构造 data:image/png;base64,… 内嵌进阅读页。
        bad:
          - '把产物或规范包中未经校验的字符串直接包成 template.URL 输出，或对白名单之外的 MIME 构造 data: URL。'
  MODIFIED: {}
  REMOVED: {}
