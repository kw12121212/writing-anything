schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: export
operations:
  ADDED: {}
  MODIFIED:
    export-markdown:
      strength: MUST
      statement: 'wa-cli export <work> [--format markdown] 必须把作品中验收记录有效的单元导出为一个 Markdown 文件：按单元树先序（根单元在前）拼接各单元的 draft.md，单元之间空一行，文件以换行结尾；去掉作者批注（<!-- 之后为 @me: 或 @me(kind): 且有非空文字的注释，可以跨行但不能跨空行、不能包含另一个 <!--，与作者反馈的批注一致）与单处豁免注释（与文本检查一致：内容为 lint-ignore <规则 id>: 理由，注释到其后第一个 -->，行首的注释可以跨空行，不在行首的不能）；没有对应 --> 或不满足这些条件的写法不是注释，原样保留；去掉后只剩空白的行整行去掉，不因此留下连续空行，注释一直延伸到行尾时去掉它之前留下的行尾空白，其余空白（如 Markdown 行尾两个空格的硬换行）原样保留；围栏代码块与行内代码（识别与文本检查、作者反馈一致：围栏的结束行为同一字符且长度不短于开头，行内代码为 n 个反引号到之后恰好 n 个反引号）及其他 HTML 注释原样保留；各单元正文开头的 BOM 去掉，CRLF 换成 LF。正文超过 2 MiB 的单元不导出（同 export.unaccepted）。验收记录有效指单元目录下有 acceptance.yaml、通过校验、draft_sha256 与当前正文一致、gate_level 不比工作区当前的关卡强度宽松（见 units-and-lifecycle 主规格的 advance-stage），且单元有配图（Illustration，含封面图（Cover Image），见 illustrations 主规格的 illustration-add 与 illustration-cover）时 illustrations_sha256 等于当前的配图摘要、没有配图时 illustrations_sha256 为 null 或缺省（见 illustrations 主规格的 illustration-digest）。没有正文或验收无效的单元不导出，各给出一条 warning 级 export.unaccepted（path 为单元目录，next 包含 wa-cli review show <unit> --dir <dir> --json）；没有任何可导出的单元时报告 export.nothing-accepted（next 包含 wa-cli next --dir <dir> --json），不写文件，退出码为 1。给出 --front-matter 时在开头附带 YAML 文件头元数据（Front Matter），依次含 title（依次取根单元 marketing.yaml 中标题决策状态为 decided 时选定的标题（见 marketing 主规格的 marketing-show；决策队列无法加载、marketing.yaml 缺失或状态不是 decided 时视为没有选定标题）、第一个导出单元正文中围栏代码块之外的第一个一级标题，结尾的 # 只在与文字之间有空白时视为关闭序列；都没有时为作品 id）、description（依次取根单元 marketing.yaml 的 digest 与根单元写作简报的 purpose，都没有时省略）、genre、units 与 accepted_at（导出单元中最晚的验收时间），导出的配图中有封面时再含 cover（封面在资产目录中的路径，相对导出文件），有 AI 参与说明且放置位置含 metadata 时再含 ai_disclosure（见 ai-disclosure）。有 AI 参与说明且放置位置含 footer 时，在正文末尾追加一个空行、一行 ---、一个空行与说明文字。导出单元正文中的本地配图引用（Local Illustration Reference，识别见 illustrations 主规格的 illustration-references）所指的已登记配图，以及根单元被导出时作品根单元登记的封面，必须复制到导出文件同目录的资产目录（Asset Directory）：目录名为导出文件名去掉最后一个扩展名（没有扩展名时为整个文件名）加 .assets（如 .writing-anything/exports/post.assets/）；资产文件名在根单元的配图为 <work>.<配图 id>.<扩展名>，在子单元的配图为 <work>.<单元 id>.<配图 id>.<扩展名>（扩展名为登记的 png 或 jpg；id 不含点号，因此不同单元的同名配图不会冲突），内容与工作区中的图片字节相同；同一配图被引用多次时只复制一次。正文中这些引用的地址改写为 <资产目录名>/<资产文件名>（相对导出文件），替代文字、标题与其余字节不变；围栏代码块、行内代码与 HTML 注释中的写法、外部地址（如 http 与 https）的图片以及没有对应登记项的本地配图引用原样保留，不复制。资产目录与图片文件的路径检查与写入见 export-output。成功时 --json 输出的 export 含 work、format、path、units（导出的单元引用，按顺序）、skipped（每项含 unit 与 reason）、chars、images（Markdown 格式为空数组）、imageList（Markdown 格式为 null）与 assets（复制到资产目录的配图，封面在前、其余按在导出正文中首次被引用的顺序；每项含 unit（单元引用）、id、role（body 或 cover）、origin（agent 或 author）、source（工作区中的图片路径）与 path（资产文件路径），都为相对项目目录的路径；没有时为空数组），changedPaths 依次为新建的目录、导出文件、新建的资产目录与写入的资产文件（按 assets 的顺序），退出码为 0。没有本地配图引用且没有导出封面时不创建资产目录，导出文件与 changedPaths 与没有配图登记时相同。--format 不是 markdown、wechat-html（见 wechat-html-export）或 text（见 plain-text-export）时报告 input.invalid-value（field 为 format）；<work> 是子单元引用时报告 work.not-found（field 为 work）；这些情况不写文件，退出码为 1。'
      scenarios:
        front-matter-decided-headline:
          - GIVEN: wechat-marketing 作品 post 已验收，正文没有一级标题，根单元 marketing.yaml 的标题决策状态为 decided（选定候选的文字「三步搞定连接池」），digest 为「一篇讲连接池的短文」
          - WHEN: 运行 wa-cli export post --front-matter --dir D --json
          - THEN: front matter 的 title 为「三步搞定连接池」、description 为「一篇讲连接池的短文」，退出码为 0
        front-matter-stale-fallback:
          - GIVEN: 同 front-matter-decided-headline，但标题候选的文字在决策之后被改过（标题决策状态为 stale），正文首个一级标题为「连接池实战」
          - WHEN: 运行 wa-cli export post --front-matter --dir D --json
          - THEN: front matter 的 title 为「连接池实战」，description 仍为 digest「一篇讲连接池的短文」，退出码为 0
        export-accepted:
          - GIVEN: 作品 my-post 已验收，子单元 intro 没有验收
          - WHEN: 运行 wa-cli export my-post --output dist/post.md --dir D --json
          - THEN: dist/post.md 只含 my-post 的正文；diagnostics 中有一条 severity 为 warning、错误码为 export.unaccepted、path 为 .writing-anything/works/my-post/units/intro 的诊断；changedPaths 为 [dist, dist/post.md]，退出码为 0
        nothing-accepted:
          - GIVEN: 作品 my-post 没有验收
          - WHEN: 运行 wa-cli export my-post --dir D --json
          - THEN: diagnostics 中有一条错误码为 export.nothing-accepted 的诊断，没有写出文件，退出码为 1
        strip-process-comments:
          - GIVEN: '已验收单元的正文含独占一行的 <!-- lint-ignore ai-cliche: 引用原话 --> 与行尾的 <!-- @me: 太长 -->'
          - WHEN: 运行 wa-cli export my-post --dir D --json
          - THEN: 导出文件中没有这两处注释，独占一行的注释所在行被去掉
        unclosed-annotation:
          - GIVEN: '已验收单元的正文为「段落 A。<!-- @me: 这里太长」、空行、「段落 B。」'
          - WHEN: 运行 wa-cli export my-post --dir D --json
          - THEN: 导出文件含段落 A 与段落 B 的全部文字（漏写 --> 的不是批注）
        copy-illustrations:
          - GIVEN: 作品 post 的根单元登记了正文配图 shop（jpg，origin 为 agent）与封面 cover（jpg，origin 为 agent），正文含 ![店门口](illustrations/shop.jpg "周六的店")，已验收
          - WHEN: 运行 wa-cli export post --front-matter --dir D --json
          - THEN: '导出文件中该引用为 ![店门口](post.assets/post.shop.jpg "周六的店")，front matter 含 cover: post.assets/post.cover.jpg；.writing-anything/exports/post.assets/ 下的 post.cover.jpg 与 post.shop.jpg 与工作区中的图片字节相同；export.assets 依次为 cover 与 shop，images 为空数组、imageList 为 null；changedPaths 在导出文件之后依次含 .writing-anything/exports/post.assets、post.cover.jpg 与 post.shop.jpg 的路径，退出码为 0'
        child-unit-asset-name:
          - GIVEN: 作品 post 的根单元与子单元 intro 都已验收，两者各登记了 id 为 fig 的正文配图并在正文中引用
          - WHEN: 运行 wa-cli export post --dir D --json
          - THEN: 资产目录中有 post.fig.jpg 与 post.intro.fig.jpg 两个文件，两处引用分别改写为对应路径，export.assets 有两项，退出码为 0
        illustration-replaced-after-accept:
          - GIVEN: 作品 post 只有根单元，已验收，之后用 wa-cli illustration add post --id shop --replace 换了一张图
          - WHEN: 运行 wa-cli export post --dir D --json
          - THEN: diagnostics 中有一条 warning 级 export.unaccepted（path 为 .writing-anything/works/post）与 export.nothing-accepted，不写导出文件与资产目录，退出码为 1
        no-illustrations-unchanged:
          - GIVEN: 作品 post 已验收，没有配图登记，正文含外部图片 ![图](https://example.com/a.png) 与写在行内代码中的 `![x](illustrations/x.jpg)`
          - WHEN: 运行 wa-cli export post --dir D --json
          - THEN: 两处写法原样保留，没有创建 .writing-anything/exports/post.assets，export.assets 为空数组，changedPaths 只含新建的目录与导出文件，退出码为 0
    paste-html-export:
      strength: MUST
      statement: 'wa-cli export <work> --format paste-html 必须按 export-markdown 选出验收记录有效的单元（跳过单元的诊断同 export-markdown 与 export-reopen-next，没有可导出单元时报告 export.nothing-accepted、不写任何文件、退出码为 1），去掉作者批注与单处豁免注释，写出一个可粘贴页（Paste-ready Page）：一个完整的 HTML 文档，--output 的规则同 export-output，省略时为 .writing-anything/exports/<work>.paste.html，文件原子写入。页面的正文容器按 wechat-html-export 的规则渲染（同样的标签、样式主题与取值检查、转义、输入上限，链接转为脚注编号与文末参考链接），只有以下不同：独占一段、地址为可用本地配图（已登记、文件存在、SHA-256 与登记一致、格式为 PNG 或 JPEG，见 illustrations 主规格）的图片输出为 img 元素——src 为 data:image/png 或 data:image/jpeg 的 data URI，alt 为替代文字，只带 src、alt 与 style 属性——其后为一个图说段落（标题，没有时为替代文字）。原始字节超过 1 MiB 的配图为粘贴重新编码：宽高之积超过 4000 万像素时不内嵌；否则缩到最长边不超过 1600 像素、在白底上合成后编码为 JPEG，依次尝试质量 85、75、65、55，仍超过 1 MiB 时最长边降到 1200、再到 900 重试，取第一个不超过 1 MiB 的结果以 data:image/jpeg 内嵌，都超过时不内嵌；资产目录与配图清单中仍为原图。内嵌按内嵌后的字节累计（同一张图只计一次），总量不超过 32 MiB，超出后的配图、不能内嵌的配图与其余图片（行内图片、外链地址）按 wechat-html-export 输出「【配图 n】」占位，编号只计正文中的图片、规则不变；根单元的封面图（Cover Image）不出现在页面中；页面始终不含 AI 参与说明（AI-generated Content Label），不受 ai_disclosure 设置影响，--json 的 export.disclosure 仍按 ai-disclosure 计算并报告。正文按内嵌图像分段：顶层块依次归入当前段，加入某块会使当前段的内嵌图像超过 7 张时从该块开始新段（单个块超过 7 张时独占一段），每段是一个独立的根 section，参考链接段落在最后一段。只有一段时，正文容器之外只有一个「复制图文」按钮与一行操作说明；有多段时，按段给出「复制第 n 段（图 a–b）」按钮，另有一个「复制全文」按钮，操作说明提示公众号每次粘贴最多 7 张图、需要分段粘贴。页面的 title 按统一的标题解析取值：依次取根单元 marketing.yaml 中标题决策状态为 decided 时选定的标题（见 marketing 主规格的 marketing-show；决策队列无法加载、marketing.yaml 缺失或状态不是 decided 时视为没有选定标题）、第一个导出单元正文的首个一级标题（同 export-markdown 的 front matter title）、作品 id。根单元有选定标题时，工具栏另有一个「复制标题」按钮，标题文字放在正文容器之外的单独标题容器中；根单元 marketing.yaml 有非空 digest 时，工具栏另有一个「复制摘要」按钮，摘要文字放在正文容器之外的单独摘要容器中；这两个按钮复用同一 data-copy 复制机制与脚本（把对应容器以 text/html 与 text/plain 两种格式写入剪贴板，失败时退回为选中后复制）。没有选定标题或没有 digest 时不显示对应按钮与容器。正文 HTML 不插入一级标题：公众号编辑器的标题与摘要输入框在正文之外，标题与摘要经上述按钮复制。点击按钮把对应段（或全文）的内容以 text/html 与 text/plain 两种格式写入剪贴板，剪贴板接口不可用或被拒绝时退回为选中对应内容后复制，并在页面上显示是否成功；页面只含一个内容固定、不随导出内容变化的 script 元素，带 Content-Security-Policy（default-src ''none''，只放行内联样式、data: 图片与按 SHA-256 哈希放行的该脚本），不引用任何外部资源，可以离线打开。正文中的本地配图与根单元封面按 export-markdown 复制到资产目录（导出文件去掉扩展名加 .assets），并按 wechat-html-export 的规则在导出文件同目录写出配图清单（导出文件去掉 .html 后缀加 .images.md），作为目标编辑器不接受内嵌图片时的兜底；--json 输出与 wechat-html 相同的 export 字段（含 path、images、assets、imageList 与 disclosure）。--front-matter 时报告 input.invalid-value（field 为 front-matter），不写文件，退出码为 1。不加 --json 时与其他格式一样输出说明行（导出路径、AI 参与说明统计、配图清单与资产目录）。'
      scenarios:
        paste-title-copy-buttons:
          - GIVEN: wechat-marketing 作品 post 已验收，正文没有一级标题，根单元 marketing.yaml 的标题决策状态为 decided（选定「三步搞定连接池」）且有非空 digest
          - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
          - THEN: 页面的 title 为「三步搞定连接池」；工具栏有「复制标题」与「复制摘要」按钮，标题与摘要文字各在正文容器 wa-article 之外的容器中；正文 HTML 不含因标题解析而插入的一级标题；页面其余结构、分段按钮与 CSP 不变，退出码为 0
        paste-no-headline-no-buttons:
          - GIVEN: tech-blog 作品 post 已验收（根单元没有 marketing.yaml），正文首个一级标题为「连接池实战」
          - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
          - THEN: 页面没有「复制标题」「复制摘要」按钮与对应容器，title 为「连接池实战」，页面其余内容与本变更之前相同，退出码为 0
        paste-embedded:
          - GIVEN: 作品 post 已验收，正文由 wa-cli draft write 写入（有 AI 参与段落），第 2 段为独占一段的 ![连接池示意](illustrations/fig-1.png "连接池")，fig-1 已登记且可用，根单元另登记了封面 cover，config.yaml 的 ai_disclosure 为 both
          - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
          - THEN: 退出码为 0；导出文件为 .writing-anything/exports/post.paste.html；正文容器含一个 src 以 data:image/png;base64, 开头、alt 为「连接池示意」的 img 元素与图说「连接池」，不含「【配图 1】」，页面中没有封面图像；页面不含 AI 参与说明文字，export.disclosure 不为 null；changedPaths 含该文件、资产目录 .writing-anything/exports/post.paste.assets 中的封面与 fig-1 以及配图清单 .writing-anything/exports/post.paste.images.md
        paste-safe-page:
          - GIVEN: 作品 post 已验收，正文含 <script>alert(1)</script>、链接 [文档](https://example.com/doc) 与行内的外链图片 ![图标](https://example.com/icon.png)
          - WHEN: 分别对正文不同的两个作品运行 wa-cli export <作品> --format paste-html --dir D --json
          - THEN: '<script>alert(1)</script> 以转义后的文字出现；页面只有一个 script 元素，两次导出中该元素的内容相同；Content-Security-Policy 含 default-src ''none''、img-src data: 与 script-src ''sha256-；页面没有指向 example.com 的 img、link 或 script，外链图片显示为「【配图 1：图标】」，链接文字后有 [1] 且文末参考链接列出该地址'
        paste-front-matter:
          - GIVEN: 作品 post 已验收
          - WHEN: 运行 wa-cli export post --format paste-html --front-matter --dir D --json
          - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 front-matter 的诊断，不写文件，退出码为 1
        paste-nothing-accepted:
          - GIVEN: 作品 post 没有验收
          - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
          - THEN: diagnostics 中有一条错误码为 export.nothing-accepted 的诊断，没有写出页面、资产目录与配图清单，退出码为 1
        paste-other-formats-unchanged:
          - GIVEN: 作品 post 已验收，正文引用了已登记的配图，有 AI 参与段落
          - WHEN: 分别运行 wa-cli export post 的 markdown、wechat-html 与 text 格式导出
          - THEN: 三个导出文件、资产目录、配图清单与 --json 输出与本变更之前相同（wechat-html 仍为「【配图 n】」占位并含 AI 参与说明）
        paste-reencode-large:
          - GIVEN: 作品 post 已验收，正文有独占一段的已登记配图 big（2000×1500 的 PNG，约 3 MiB）与 small（约 200 KB 的 PNG）
          - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
          - THEN: 退出码为 0；big 以 data:image/jpeg 内嵌，解码后的字节不超过 1 MiB、宽 1600 像素；small 仍以 data:image/png 原样内嵌；资产目录中 big 的文件与登记的原图逐字节相同
        paste-pixel-limit:
          - GIVEN: 作品 post 已验收，正文有独占一段的已登记配图 huge（8000×6000 的 PNG，不超过 10 MiB）
          - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
          - THEN: 退出码为 0；huge 处为「【配图 1】」占位，配图清单与资产目录照常列出原图
        paste-segments:
          - GIVEN: 作品 post 已验收，正文有 9 张独占一段的已登记小配图，另一个作品 short 只有 7 张
          - WHEN: 分别运行 wa-cli export <作品> --format paste-html --dir D --json
          - THEN: post 的页面有两个段（第 1 段 7 张、第 2 段 2 张），工具栏有「复制第 1 段（图 1–7）」「复制第 2 段（图 8–9）」与「复制全文」按钮，参考链接在第 2 段；short 的页面只有一个段与一个「复制图文」按钮
        paste-embed-budget:
          - GIVEN: 作品 post 已验收，正文有 33 张独占一段、已登记且可用的配图 fig-1 至 fig-33，各略小于 1 MiB（不需要重新编码）
          - WHEN: 运行 wa-cli export post --format paste-html --dir D --json
          - THEN: 退出码为 0；fig-1 至 fig-32（累计不超过 32 MiB）以 data URI 内嵌，fig-33 处为「【配图 33】」占位；配图清单列出全部 33 张配图及其资产路径
    paste-html-print:
      strength: MUST
      statement: wa-cli export <work> --format paste-html --print 必须是只读的：按 paste-html-export 的同样规则选出单元并渲染正文容器中的内容，不写导出文件、资产目录与配图清单，不创建目录；同时给出 --output 时报告 input.invalid-value（field 为 output）。--json 时 export.html 为全文 HTML 片段（各段依次拼接，与同一时刻写出的可粘贴页正文容器中各段的内容相同，不含页面外壳、按钮、script 与 AI 参与说明），export.segments 为各段片段的数组（至少一项，只有一段时与 export.html 相同），export.path 与 export.imageList 为 null，export.assets 为空数组，changedPaths 为空数组，export.images 与 export.disclosure 同 paste-html-export；不加 --json 时把片段写到标准输出。其他格式与不带 --print 的 paste-html 的 --json 输出不含 html 与 segments 字段。--json 时 export.headline 为根单元标题决策状态为 decided 时选定的标题文字（见 marketing 主规格的 marketing-show；决策队列无法加载、marketing.yaml 缺失或状态不是 decided 时为 null，不做一级标题、purpose 或作品 id 的回退），export.digest 为根单元 marketing.yaml 的 digest（没有时为 null）；这两个字段同样只在 paste-html --print 的 --json 输出中出现，其他格式与不带 --print 的 paste-html 不含 headline 与 digest 字段。没有可导出单元时报告 export.nothing-accepted、退出码为 1。--format 不是 paste-html 时给出 --print 报告 input.invalid-value（field 为 print），不写文件，退出码为 1。
      scenarios:
        print-headline-digest:
          - GIVEN: wechat-marketing 作品 post 已验收，正文没有一级标题，根单元 marketing.yaml 的标题决策状态为 decided（选定「三步搞定连接池」）且有非空 digest
          - WHEN: 运行 wa-cli export post --format paste-html --print --dir D --json
          - THEN: export.headline 为「三步搞定连接池」，export.digest 为 digest 的文字；export.html 与 export.segments 及其余字段与本变更之前同一正文的输出相同，changedPaths 为空数组，退出码为 0
        print-headline-digest-null:
          - GIVEN: tech-blog 作品 post 已验收（根单元没有 marketing.yaml）
          - WHEN: 运行 wa-cli export post --format paste-html --print --dir D --json
          - THEN: export.headline 与 export.digest 字段仍出现且都为 null，其余字段与本变更之前相同，退出码为 0
        print-readonly:
          - GIVEN: 作品 post 已验收，正文引用了已登记且可用的配图 fig-1，根单元登记了封面 cover
          - WHEN: 运行 wa-cli export post --format paste-html --print --dir D --json
          - THEN: 退出码为 0；changedPaths 为空数组，.writing-anything/exports/ 下没有新文件；export.html 含 src 以 data:image/ 开头的 img 元素，不含 <script、<html 与 AI 参与说明，不含封面图像；export.path 与 export.imageList 为 null，export.assets 为空数组
        print-wrong-format:
          - GIVEN: 作品 post 已验收
          - WHEN: 运行 wa-cli export post --format wechat-html --print --dir D --json
          - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 print 的诊断，不写文件，退出码为 1
        print-nothing-accepted:
          - GIVEN: 作品 post 没有验收
          - WHEN: 运行 wa-cli export post --format paste-html --print --dir D --json
          - THEN: diagnostics 中有一条错误码为 export.nothing-accepted 的诊断，export 为 null，changedPaths 为空数组，退出码为 1
        print-segments:
          - GIVEN: 作品 post 已验收，正文有 9 张独占一段的已登记小配图
          - WHEN: 运行 wa-cli export post --format paste-html --print --dir D --json
          - THEN: export.segments 有两项，各含 7 与 2 个 img 元素，export.html 等于两项依次拼接
  REMOVED: {}
