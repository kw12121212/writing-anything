schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: sources-and-provenance
operations:
  ADDED: {}
  MODIFIED:
    source-remove:
      strength: MUST
      statement: wa-cli source rm <id> 必须硬删素材：删除 .writing-anything/sources/<id>/ 整个目录（source.yaml、原文与目录本身）。删除前必须遍历 .writing-anything/works/ 下每个作品的每个单元里的 claims.yaml，找出 sources 含该 id 的论断（Claim）：有引用且未给 --force 时报告 source.referenced（severity 为 error，诊断不填 path，message 列出引用它的作品、单元与论断 id 及论断文字），不删除任何文件，退出码为 1，next 含 wa-cli source retire <id> --dir <dir> --json 与 wa-cli claim list <作品> --dir <dir> --json；无法确认引用（某个作品或 claims.yaml 加载失败）时，未给 --force 就原样报告该诊断并拒绝删除。给出 --force 时必须同时给出非空 --reason，否则报告 input.invalid-value（field 为 reason，message 说明强制删除需要原因），不删除任何文件、退出码为 1；给出 --force 与非空 --reason 时，删除前必须先遍历 works 下所有单元的 claims.yaml，从每个 sources 含该 id 的论断中移除该 id（保留论断的其他字段、顺序与其余引用，其他论断与其他文件不改动），全部文档写前重新解析并校验 Schema，任一文档无法读取或校验失败时不删除素材、不写任何 claims.yaml；摘引用完成后删除素材目录，删除原因随命令参数记入 .writing-anything/audit.log，完成后 wa-cli validate 必须保持 valid。成功时退出码为 0，changedPaths 为 [素材目录, 存档文件, source.yaml] 加上每个被改写的 claims.yaml（素材路径删除后不再存在），--json 输出的 removed 字段为该素材 id。只给 --reason 而不给 --force 时报告 input.invalid-value（field 为 reason，说明原因只用于强制删除）。素材 id 不符合 id 格式或不存在时报告 source.not-found（诊断不填 path，next 含 wa-cli help source rm --json 与 wa-cli source list --dir <dir> --json），不访问该路径、不删除任何文件，退出码为 1。所有可能失败的检查必须在删除前完成。
      scenarios:
        remove-unreferenced:
          - GIVEN: 已登记素材 src-old，没有任何论断引用它
          - WHEN: 运行 wa-cli source rm src-old --dir D --json
          - THEN: 素材目录、原文与 source.yaml 都不存在；changedPaths 为 [.writing-anything/sources/src-old, .writing-anything/sources/src-old/original.txt, .writing-anything/sources/src-old/source.yaml]；removed 为 src-old，退出码为 0
        remove-referenced-rejects:
          - GIVEN: 已登记素材 src-old，作品 my-post 的论断 claim-1 关联它
          - WHEN: 运行 wa-cli source rm src-old --dir D --json
          - THEN: diagnostics 中有一条错误码为 source.referenced 的诊断，message 含 my-post、claim-1 与论断文字；素材目录与 source.yaml 逐字节不变，changedPaths 为空数组，退出码为 1
        force-requires-reason:
          - GIVEN: 已登记素材 src-old，作品 my-post 的论断 claim-1 关联它
          - WHEN: 运行 wa-cli source rm src-old --force --dir D --json
          - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 reason 的诊断；素材目录与 claims.yaml 不变，退出码为 1
        reason-requires-force:
          - GIVEN: 已登记素材 src-old，没有论断引用它
          - WHEN: 运行 wa-cli source rm src-old --reason 重复登记 --dir D --json
          - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 reason 的诊断；素材目录不变，退出码为 1
        force-removes-referenced:
          - GIVEN: 已登记素材 src-old，作品 my-post 的论断 claim-1 关联它
          - WHEN: 运行 wa-cli source rm src-old --force --reason 旧版已被 v3 取代 --dir D --json
          - THEN: 素材目录被删除，removed 为 src-old，changedPaths 含 .writing-anything/works/my-post/claims.yaml，退出码为 0；claims.yaml 的 claim-1 不再含 src-old 且其他字段不变；audit.log 最后一行的 args 含 src-old 与 旧版已被 v3 取代；wa-cli validate --dir D --json 的 valid 为 true、退出码为 0
        force-detaches-multiple-works:
          - GIVEN: 已登记素材 src-old，作品 my-post 与 other-post 的论断都关联它
          - WHEN: 运行 wa-cli source rm src-old --force --reason 旧版已被 v3 取代 --dir D --json
          - THEN: 两个作品的 claims.yaml 都不再含 src-old，changedPaths 同时列出两份 claims.yaml；wa-cli validate --dir D --json 的 valid 为 true，退出码为 0
        remove-not-found:
          - GIVEN: 工作区 D 中没有素材 nope
          - WHEN: 运行 wa-cli source rm nope --dir D --json
          - THEN: diagnostics 中有一条错误码为 source.not-found 的诊断，不填 path，next 含 wa-cli help source rm --json 与 wa-cli source list --dir D --json；sources/ 不变，退出码为 1
  REMOVED: {}
