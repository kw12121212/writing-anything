lesson:
  id: lesson-b1071b
  title: 先插入带第三方样式的标签再对整串做正则替换，第三方取值能改写标签结构
category: coding
status: active
created_at: '2026-10-01T13:14:03.665Z'
updated_at: '2026-10-01T13:14:03.665Z'
context: wechat-html-export 第一版渲染器先插入 <strong style="主题取值">，再对整串做 *斜体* 的正则替换，并用私用区字符在文字中标记换行。
observation: '独立审查复现：样式取值 width: calc(1em*2) 与 color: red onclick=alert(1) 通过了黑名单校验，斜体替换跨进 style 属性，输出出现 onclick；$1 被当作替换模板展开；私用区标记泄漏到输出；逐行拼接字符串使 2 MiB 段落耗时 90 秒以上。'
takeaway: 生成标记一律先解析成节点树再由 html/template 输出；第三方取值用字符白名单并在渲染时再检查；不在内容中插入标记字符；渲染器加上对抗性取值的允许列表测试与上限输入的耗时测试。
applies_when: 编写把 Markdown 或其他文本转换为 HTML（或其他标记）的渲染器，尤其是会把规范包等第三方取值写进属性时
occurrences:
