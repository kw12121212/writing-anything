schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: lint
operations:
  ADDED: {}
  MODIFIED:
    lint-command:
      strength: MUST
      statement: wa-cli lint <unit> 必须只读地对单元目录下的 draft.md 执行按作品文体合并（文体 → 规范包 → 项目配置）的全部生效规则（Rule）：被规则级 waivers 豁免（enabled 为 false）的规则不执行。--json 输出 findings、waived、chars 与 cjkChars：findings 为未被豁免的发现项（Finding），waived 为被单处豁免的发现项（另含 reason），两者按行、列、规则 id 排序（全文级发现项排在最前）；每项含 rule（规则 id）、type（规则类型）、severity、source（定义该规则类型的配置层：genre:<id>、pack:<id> 或 project）、line 与 column（从 1 开始，列按 Unicode 字符计；全文级发现项为 null）、text（命中的原文；全文级为 null）、message 与 suggestion（建议的写法，没有时为 null）；chars 为正文字数、cjkChars 为正文汉字数（口径见 lint-text-model，帮助说明写明字数为非空白字符数，含标点）。changedPaths 为空数组，不创建或修改任何文件，不发起网络请求。findings 中有 severity 为 error 的发现项时，必须给出一条错误码为 lint.findings、severity 为 error 的诊断（path 为 draft.md，message 含 error 级发现项的条数，next 为 wa-cli help draft write --json 与 wa-cli lint <unit> --dir <dir> --json），valid 为 false，退出码为 1；否则 valid 为 true、退出码为 0。单元没有可读取的 draft.md（不存在、途经符号链接或不是普通文件）时报告 draft.not-found；draft.md 超过 2 MiB（2097152 字节）时报告 lint.too-large（输入规模上限）；一条规则的词表命中超过 1000 处时只列出前 1000 处，并给出一条 severity 为 warning、错误码为 lint.truncated 的诊断；合并配置有 error 级问题时报告其诊断；两种情况 findings 与 waived 为空数组，退出码为 1。合并后有禁用词或术语表中要避免的写法、却没有生效的 banned-terms 或 term-consistency 规则时，给出一条 severity 为 warning、错误码为 lint.inactive-terms 的诊断。不加 --json 时以人读文本逐条列出发现项（位置、规则、说明与建议），摘要行同时显示字数（非空白字符数，含标点）与汉字数。
      scenarios:
        lint-error:
          - GIVEN: draft.md 含「值得注意的是，连接池很重要。」，default 规范包生效
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 含一项 rule 为 ai-cliche、severity 为 error、source 为 pack:default、line 为 1、column 为 1、text 为「值得注意的是」的发现项；diagnostics 中有一条错误码为 lint.findings 的诊断，next 含 wa-cli help draft write --json；valid 为 false，退出码为 1
        lint-warning-only:
          - GIVEN: draft.md 为「使用Go语言。」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 含 rule 为 cjk-typography、severity 为 warning 的发现项，valid 为 true，退出码为 0
        lint-no-draft:
          - GIVEN: 作品 my-post 没有 draft.md
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: diagnostics 中有一条错误码为 draft.not-found 的诊断，退出码为 1
        lint-waived-rule:
          - GIVEN: config.yaml 用 waivers 豁免了 ai-cliche，draft.md 含「值得注意的是」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 中没有 rule 为 ai-cliche 的发现项，退出码为 0
        lint-clean:
          - GIVEN: 作品 my-post（minimal）的 draft.md 为「连接池可以降低延迟。」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 只有一项 rule 为 length、severity 为 warning、line 为 null 的字数不足发现项，waived 为空数组，chars 为 10，cjkChars 为 9，valid 为 true，changedPaths 为空数组，退出码为 0
        chars-with-mixed-text:
          - GIVEN: draft.md 为「连接池，Go 的 10 个要点。」（汉字 7 个、标点 2 个、英文字母与数字 4 个、空白 3 处）
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: chars 为 13（非空白字符数，含标点），cjkChars 为 7（Go、10 与标点不计），length 发现项的 message 写明口径，退出码为 0
        inactive-terms:
          - GIVEN: config.yaml 的 packs 为 [house]（不含 default），house 的 banned_terms 含「赋能」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 中没有 banned-terms 发现项，diagnostics 中有一条错误码为 lint.inactive-terms、severity 为 warning 的诊断
    lint-text-model:
      strength: MUST
      statement: '文本检查（Lint）必须去掉开头的 BOM、把 CRLF 与单独的 CR 规范为 LF 后按行检查，并跳过屏蔽区域（Masked Region）：围栏代码块（行首至多 3 个空格后为至少 3 个反引号或 ~，反引号围栏其后不含反引号；到同一字符、长度不短于开头、其后只有空白的结束行，未闭合时到正文末尾）、行内代码（n 个反引号到其后第一个恰好 n 个反引号，没有结束时不是行内代码）、已闭合的 HTML 注释（<!-- 到其后第一个 -->，包括作者批注：行首的 <!-- 可以跨越空行，不在行首的 <!-- 不能跨越空行；没有对应 --> 的 <!-- 按普通文字检查）、URL（http:// 或 https:// 开始，到空白或全角标点（，。；：、！？）」』】》“”‘’…—）为止，路径中的汉字属于 URL）与 Markdown 链接地址（](...) 中的地址）。散文段落（Prose Paragraph）为由空行或围栏代码块分隔、含屏蔽区域之外文字的连续行；首尾只含屏蔽区域的行不属于散文段落，只含屏蔽区域（如单独一行的注释）的块不成段。字数为屏蔽区域之外、去掉行首 Markdown 标题标记（1 至 6 个 # 与其后的空白）后的非空白 Unicode 字符个数（含标点，wa-cli lint --json 的 chars）；段落字数同理按段落计。汉字数为同一口径下 Unicode Han 汉字的个数（全角标点、假名等不计入，wa-cli lint --json 的 cjkChars）。length-range 的计数口径不变，不提供口径参数。'
      scenarios:
        skip-code:
          - GIVEN: draft.md 的围栏代码块中与行内代码中都含「值得注意的是」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 中没有 rule 为 ai-cliche 的发现项
        skip-url:
          - GIVEN: draft.md 含「见 https://example.com/值得注意的是」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 中没有 ai-cliche 发现项，也没有与该 URL 有关的 cjk-typography 发现项
        url-before-punctuation:
          - GIVEN: draft.md 含「见 https://example.com，值得注意的是」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 含一项 ai-cliche 发现项，没有与该 URL 有关的 cjk-typography 发现项
        inline-comment-bound:
          - GIVEN: draft.md 为「正文 <!-- 未闭合」、空行、「值得注意的是」、空行、「<!-- 注释 -->」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 含一项 ai-cliche 发现项（不在行首的 <!-- 不跨越空行）
        cjk-chars-scope:
          - GIVEN: draft.md 为「连接池，Go 的 10 个要点。」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: chars 为 13（非空白字符数，含标点：汉字 7、标点 2、英文字母与数字 4），cjkChars 为 7（只数汉字），退出码为 0
    rule-types:
      strength: MUST
      statement: '规则引擎（Rule Engine）必须按规则的 type 执行以下检查，参数取自合并后的 params：cjk-typography（参数 spacing 与 punctuation，布尔，默认 true）：spacing 为 true 时，汉字与 ASCII 字母或数字直接相邻处各报告一项，text 为相邻的两个字符，suggestion 为中间加一个空格；punctuation 为 true 时，汉字之后紧跟的半角 , . : ; ! ? 各报告一项（其后紧跟 ASCII 字母、数字或同一标点时不报告，如 .env、...），suggestion 为对应的全角标点（，。：；！？）。ai-cliche（参数 terms，字符串数组，默认为空；max_dashes_per_1000，正数，可选）：terms 中每个词的每处出现报告一项；给出 max_dashes_per_1000 且每千字的破折号数（连续的 — 记为一个）超过它时报告一项全文级发现项。banned-terms（参数 terms，字符串数组，可选）：terms 与合并后的 bannedTerms 中每个词的每处出现报告一项，bannedTerms 给出 replacement 时 suggestion 为它，message 含 reason。term-consistency（无参数）：合并后 glossary 中每个词条 avoid 里的写法每处出现报告一项，suggestion 为该词条的 term；落在标准写法某处出现范围内的命中（如「大语言模型」中的「语言模型」）不报告。同一个词在词表中出现多次时只报告一次。length-range（参数 min 与 max，正整数，至少给出一个）：字数小于 min 或大于 max 时报告一项全文级发现项，message 写明字数为非空白字符数，含标点。paragraph-length（参数 max，正整数，必需）：字数超过 max 的散文段落各报告一项，位置为段落首行首列。required-sections（参数 sections，非空字符串数组，必需）：正文中（屏蔽区域之外）没有文字等于该项的 Markdown 标题（1 至 6 个 # 开头的行）时，每项报告一项全文级发现项。词的匹配区分大小写；只由 ASCII 字母、数字与连字符组成的词要求前后都不是 ASCII 字母、数字或连字符，其他词按子串匹配。'
      scenarios:
        cjk-spacing:
          - GIVEN: draft.md 为「使用Go语言」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 依次为 column 为 2、text 为「用G」与 column 为 4、text 为「o语」的两项 cjk-typography 发现项，suggestion 分别为「用 G」与「o 语」
        cjk-punctuation:
          - GIVEN: draft.md 为「你好,世界」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 含一项 cjk-typography 发现项，text 为「,」，suggestion 为「，」
        banned-term:
          - GIVEN: '工作区规范包的 banned_terms 含 {term: 赋能, replacement: 帮助, reason: 空泛}，config.yaml 的 packs 为 [house, default]，draft.md 含「赋能团队」'
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 含一项 rule 为 banned-terms、severity 为 error、text 为「赋能」、suggestion 为「帮助」的发现项，message 含「空泛」，退出码为 1
        term-consistency:
          - GIVEN: '规范包的 glossary 含 {term: 规范包, avoid: [配置包]}，draft.md 含「配置包」'
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 含一项 rule 为 term-consistency、suggestion 为「规范包」的发现项
        length-range:
          - GIVEN: 'minimal 文体的 length 规则为 {min: 300, max: 5000}，draft.md 只有 10 个字'
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 含一项 rule 为 length、line 为 null 的全文级发现项，message 含 10 与 300，且写明字数为非空白字符数，含标点
        paragraph-length:
          - GIVEN: '项目配置定义 rules.para {type: paragraph-length, params: {max: 5}}，draft.md 的第二段有 8 个字'
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 含一项 rule 为 para、line 为第二段首行、column 为 1 的发现项
        required-sections:
          - GIVEN: '项目配置定义 rules.sections {type: required-sections, params: {sections: [背景, 结论]}}，draft.md 只有标题「## 背景」'
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 含一项 rule 为 sections、line 为 null、message 含「结论」的全文级发现项
        dash-density:
          - GIVEN: 项目配置把 ai-cliche 的 max_dashes_per_1000 设为 1，draft.md 的 100 个字中有两处破折号
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: findings 含一项 rule 为 ai-cliche、line 为 null、message 含破折号密度的全文级发现项
        word-boundary:
          - GIVEN: 规范包的 banned_terms 含 Go，draft.md 为「Google 与 Go 语言」
          - WHEN: 运行 wa-cli lint my-post --dir D --json
          - THEN: banned-terms 只报告 Go 一处，column 为 10
  REMOVED: {}
