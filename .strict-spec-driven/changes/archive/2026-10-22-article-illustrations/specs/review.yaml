schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: review
operations:
  ADDED: {}
  MODIFIED:
    accept-gate:
      strength: MUST
      statement: 'wa-cli accept <unit> 必须按工作区配置的关卡强度（Gate Level）检查验收的阻塞项，有阻塞项时为每项给出一条 error 级诊断、不写任何文件、退出码为 1。所有关卡强度下的阻塞项：本单元文本检查未被豁免的 error 级发现项（accept.lint-errors，path 为 draft.md，next 包含 wa-cli lint <unit> --dir <dir> --json）、使文本检查无法完成的 error 级问题（保留其错误码）、关联该单元的 open 阻塞决策（decision.blocking，next 包含 wa-cli decisions --dir <dir> --json），决策队列无法加载（decision.invalid-queue，message 说明决策队列无法加载），以及写后收口（Close-out）阻塞项——单元为场景且其大纲任一节声明了非空的 state_changes、plants、recovers 或 events（契约要求收口的场景）时：单元目录下没有 closeout.yaml 报告 closeout.missing（path 为单元目录，next 包含 wa-cli scene close-out <unit> --dir <dir> --json 与 wa-cli help scene close-out --json）；closeout.yaml 不通过校验或途经符号链接时报告 closeout.invalid（保留其诊断，next 同上）；closeout.yaml 的 draft_sha256 与当前正文 draft.md 不同报告 closeout.stale（path 为 closeout.yaml，next 同上）；closeout.yaml 记录的 state 与 knowledge 提议仍有 status 为 proposed 的条目报告 closeout.pending-proposals（next 另含 wa-cli state list <work> --dir <dir> --json 与 wa-cli knowledge list <work> --dir <dir> --json）；按当前契约与台账复查收口的契约对照失败时报告 closeout.missing-state-change、closeout.missing-recovery、closeout.missing-plant 或 closeout.missing-event（path 为 closeout.yaml，next 同上）。场景大纲没有声明上述契约字段且单元目录下没有 closeout.yaml 时不做任何收口检查。以及连续性审查（Continuity Review，见 continuity 主规格）阻塞项——单元为场景时，wa-cli continuity 的 error 级发现项（未建卡出场人物、保留词终态人物出场、同场景多名一卡、按场景过滤的悬空引用与伏笔超期）每项一条诊断（错误码同发现项，path 为该场景大纲所在单元目录，next 包含 wa-cli continuity <unit> --dir <dir> --json 与 wa-cli decisions --dir <dir> --json）；已被作者决策豁免的（场景、错误码）不再阻塞，未豁免而阻塞时按 continuity 主规格幂等地生成阻塞决策（changedPaths 如实列出决策队列路径）；没有 error 级发现项的场景与未声明场景契约扩展字体的单元不做连续性检查。以及配图（Illustration）阻塞项——单元的 illustrations.yaml 与正文中的本地配图引用按 illustrations 主规格的 illustration-validation 检查出的每个 error 级问题（含 illustrations.yaml 不通过校验、未登记引用、图片缺失或哈希不符、信息图出处悬空与封面位置问题）一条诊断（错误码、path 与 field 同该问题，next 包含 wa-cli illustration list <unit> --dir <dir> --json）；warning 级的未引用配图与多余文件不阻塞；单元没有 illustrations.yaml 且正文没有本地配图引用时不做配图检查。standard 与 strict 另有：没有 review.yaml（accept.review-missing）、review.yaml 不通过校验（保留其诊断）、审稿的 draft_sha256 与当前正文不同（accept.review-stale）、单元的评分项（见 review-record）没有结论（review.missing-verdict），每个 status 为 open 的审稿发现项（accept.open-finding，next 包含 wa-cli help review resolve --json）与每条未处理的作者反馈（accept.open-feedback，next 包含 wa-cli feedback list <unit> --dir <dir> --json）。strict 另有：单元的评分项（来自文体、规范包或选用的写作法）声明 blocking: true 且审稿结论为 fail（accept.blocking-rubric），以及没有给出 --confirmed-by-author 与 --confirmation（accept.unconfirmed，next 包含 wa-cli help accept --json）。审稿结论为 fail 在 fast、standard 下以及未声明 blocking 的评分项上都不阻塞。每条阻塞项诊断的 next 都包含能复查它的 wa-cli review show <unit> --dir <dir> --json。'
      scenarios:
        continuity-blocks-accept:
          - GIVEN: novel 作品 my-novel 的场景 s1 处于审稿阶段，其余验收条件满足，出场人物之一在设定集中没有同名 character 条目（continuity.unknown-character），尚无相关决策
          - WHEN: 运行 wa-cli accept my-novel/s1 --confirmed-by-author --confirmation 作者：可以 --dir D --json
          - THEN: diagnostics 中有一条错误码为 continuity.unknown-character 的诊断（next 含 wa-cli continuity my-novel/s1 与 wa-cli decisions），决策队列幂等新增一条阻塞决策，没有写出 acceptance.yaml，退出码为 1
        continuity-waived-passes:
          - GIVEN: 同上，作者已对豁免场景 s1 的 continuity.unknown-character 的阻塞决策选择允许
          - WHEN: 运行 wa-cli accept my-novel/s1 --confirmed-by-author --confirmation 作者：可以 --dir D --json
          - THEN: 没有 continuity 诊断，验收成功，退出码为 0
        no-contract-scene-unchanged:
          - GIVEN: short-story 场景的大纲只声明 characters 与 reveal（无场景契约扩展字段），出场人物没有设定卡
          - WHEN: 运行 wa-cli accept <该场景> --confirmed-by-author --confirmation 作者：可以 --dir D --json
          - THEN: 没有 continuity 诊断，验收行为与引入连续性审查前一致，退出码为 0
        illustration-blocks-accept:
          - GIVEN: wechat-marketing 作品 post 处于审稿阶段，其余验收条件满足，正文引用 illustrations/fig-1.jpg，但 fig-1.jpg 在登记后被覆盖
          - WHEN: 运行 wa-cli accept post --confirmed-by-author --confirmation 作者：图文都可以 --dir D --json
          - THEN: diagnostics 中有一条错误码为 illustration.hash-mismatch 的诊断，其 next 含 wa-cli illustration list post 与 wa-cli review show post，没有写出 acceptance.yaml，退出码为 1
        no-illustrations-unchanged:
          - GIVEN: 作品 my-post 没有 illustrations.yaml，正文只引用 https 地址的图片，其余验收条件满足
          - WHEN: 运行 wa-cli accept my-post --confirmed-by-author --confirmation 作者：可以 --dir D --json
          - THEN: 没有 illustration.* 诊断，验收成功，退出码为 0
    accept-record:
      strength: MUST
      statement: wa-cli accept <unit> 只能在单元当前阶段的必需产物（Required Artifact）含 acceptance 时使用，否则报告 accept.wrong-stage（next 包含 wa-cli next <unit> --dir <dir> --json）。--confirmed-by-author 与 --confirmation <作者原话摘要> 必须同时给出且摘要不为空白，否则报告 accept.incomplete-confirmation（next 包含 wa-cli help accept --json）。没有阻塞项时必须整体替换单元目录下的 acceptance.yaml，记录 schema_version 1、gate_level、draft_sha256（当前正文的 SHA-256）、illustrations_sha256（单元有配图时为当前配图摘要，见 illustrations 主规格的 illustration-digest；单元没有配图时不写该字段）、confirmed_by_author、confirmation（给出作者确认时）与 accepted_at（UTC 时间，格式 YYYY-MM-DDTHH:MM:SSZ），即确认记录（Confirmation Record）；changedPaths 为 [acceptance.yaml]，--json 输出的 acceptance 字段含 unit、path、gateLevel、draftSha256、illustrationsSha256（没有配图时为 null）、confirmedByAuthor、confirmation 与 acceptedAt，退出码为 0。standard 与 fast 下没有给出作者确认时照常验收，confirmed_by_author 为 false，并给出一条 warning 级 accept.unconfirmed。accept 不改变单元的阶段；之后正文被修改、配图摘要与记录的 illustrations_sha256 不同（含验收时没有配图、之后登记了配图，以及验收时有配图、之后全部删除）、验收记录不通过校验或工作区的关卡强度变得比记录的 gate_level 更严时，advance 与 next 分别报告 acceptance.stale、acceptance.stale、acceptance.invalid 与 acceptance.weaker-gate（见 units-and-lifecycle 主规格的 advance-stage）。没有 illustrations_sha256 字段的已有验收记录在单元没有配图时照常有效。
      scenarios:
        accept-confirmed:
          - GIVEN: gate_level 为 strict，作品 my-post 没有验收阻塞项
          - WHEN: 运行 wa-cli accept my-post --confirmed-by-author --confirmation 作者：可以发了 --dir D --json
          - THEN: acceptance.yaml 的 confirmed_by_author 为 true、confirmation 为 作者：可以发了、gate_level 为 strict；diagnostics 为空，changedPaths 为 [.writing-anything/works/my-post/acceptance.yaml]，退出码为 0；work.yaml 的 stage 仍为 review
        accept-unconfirmed-standard:
          - GIVEN: gate_level 为 standard，作品 my-post 没有验收阻塞项
          - WHEN: 运行 wa-cli accept my-post --dir D --json
          - THEN: 退出码为 0，acceptance.confirmedByAuthor 为 false，diagnostics 中有一条 severity 为 warning、错误码为 accept.unconfirmed 的诊断
        incomplete-confirmation:
          - GIVEN: 作品 my-post 处于审稿阶段
          - WHEN: 运行 wa-cli accept my-post --confirmed-by-author --dir D --json
          - THEN: diagnostics 中有一条错误码为 accept.incomplete-confirmation 的诊断，没有写出 acceptance.yaml，退出码为 1
        wrong-stage:
          - GIVEN: 作品 my-post 处于草稿阶段
          - WHEN: 运行 wa-cli accept my-post --dir D --json
          - THEN: diagnostics 中有一条错误码为 accept.wrong-stage 的诊断，其 next 包含 wa-cli next my-post 命令，退出码为 1
        accept-records-illustrations:
          - GIVEN: 作品 post 登记了封面 cover 与正文配图 fig-1，没有验收阻塞项
          - WHEN: 运行 wa-cli accept post --confirmed-by-author --confirmation 作者：图文都可以 --dir D --json
          - THEN: acceptance.yaml 的 illustrations_sha256 等于 wa-cli review show post --json 的 gate.illustrationsSha256，acceptance.illustrationsSha256 为同一值，退出码为 0
        accept-without-illustrations:
          - GIVEN: 作品 my-post 没有 illustrations.yaml，没有验收阻塞项
          - WHEN: 运行 wa-cli accept my-post --confirmed-by-author --confirmation 作者：可以 --dir D --json
          - THEN: acceptance.yaml 不含 illustrations_sha256，acceptance.illustrationsSha256 为 null，退出码为 0
    review-show:
      strength: MUST
      statement: wa-cli review show <unit> 必须只读地汇总单元的审稿与验收（Acceptance）情况，changedPaths 为空数组：review 为 review.yaml 的内容（字段同 review record 的输出，stale 为 draft_sha256 是否与当前正文不同；没有审稿或不通过校验时为 null，不通过校验时报告其诊断、退出码为 1）；lint 为本单元文本检查（Lint）的 ran、errors 与 warnings（未被豁免的 error 级与 warning 级发现项数）；revisions 为修订任务（Revision Task）数组：review.yaml 中 status 为 open 的发现项（source 为 review），以及该单元未处理（open 或 accepted）的作者反馈（source 为 feedback），每项含 source、id、status、paragraph 与 message；decisions 为关联该单元、status 为 open 的决策，每项含 id、question 与 blocking；gate 含 level（工作区配置的 gate_level）、blockers（按 accept-gate 在已给出作者确认时的阻塞项，每项含 code、path、ref 与 message）、ready（blockers 为空）、confirmationRequired（level 为 strict 时为 true）与 illustrationsSha256（当前配图摘要，见 illustrations 主规格的 illustration-digest，单元没有配图时为 null）；acceptance 为已有的 acceptance.yaml（gateLevel、draftSha256、illustrationsSha256（记录中没有该字段时为 null）、confirmedByAuthor、confirmation、acceptedAt 与 stale；stale 为正文的 SHA-256 与 draftSha256 不同，或当前配图摘要与 illustrationsSha256 不同），没有时为 null；rubric 为该单元审稿必须逐项给出结论的评分项数组，与 review record 校验 review.missing-verdict 使用的评分标准相同（合并后的评分标准加上单元选用的写作法附带的评分项），每项含 id、title、description（没有时为空字符串）与 blocking，单元没有可读取的正文或配置合并失败时为空数组。
      scenarios:
        show-no-review:
          - GIVEN: 作品 my-post 处于审稿阶段、没有 review.yaml，gate_level 为 standard
          - WHEN: 运行 wa-cli review show my-post --dir D --json
          - THEN: review 为 null，gate.blockers 只有一项 code 为 accept.review-missing，退出码为 0
        show-revisions:
          - GIVEN: 作品 my-post 的审稿有两个 open 的发现项，另有一条 open 的作者反馈 fb-1，工作区的 gate_level 为 standard
          - WHEN: 运行 wa-cli review show my-post --dir D --json
          - THEN: revisions 依次为两个 source 为 review 的发现项与 source 为 feedback 的 fb-1；gate.level 为 standard，gate.ready 为 false，gate.blockers 的 code 依次为 accept.open-finding、accept.open-finding 与 accept.open-feedback；changedPaths 为空数组，退出码为 0
        show-rubric:
          - GIVEN: tech-blog 作品 my-post 选用写作法 pyramid-scqa，处于 review 阶段，还没有审稿
          - WHEN: 运行 wa-cli review show my-post --dir D --json
          - THEN: rubric 依次列出 tech-blog 合并后的全部评分项与 pyramid-scqa 附带的评分项，每项含 id、title、description 与 blocking；按这些 id 各给一个结论运行 wa-cli review record 不报告 review.missing-verdict
        show-stale-after-image-change:
          - GIVEN: 作品 post 带配图验收后，用 --replace 换了 fig-1 的图片
          - WHEN: 运行 wa-cli review show post --dir D --json
          - THEN: acceptance.stale 为 true，acceptance.illustrationsSha256 与 gate.illustrationsSha256 不同，changedPaths 为空数组，退出码为 0
  REMOVED: {}
