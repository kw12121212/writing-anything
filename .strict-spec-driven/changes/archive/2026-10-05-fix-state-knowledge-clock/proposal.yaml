  - 除时间戳取时钟来源外，全部产品行为不变：命令参数、输出信封、退出码、错误码、产物 Schema 与目录结构都不变
  - 除时间戳取时钟来源与任务包生成的确定序外，全部产品行为不变：命令参数、输出信封、退出码、错误码、产物 Schema 与目录结构都不变
