      text: 最小修复：reviewview.ts 的 reviewAfterStatus 把「会话存在但 unit 与面板所审单元不一致（含缺 unit 的畸形载荷）」并入 ended；client.test.ts 既有会话状态桩补齐 unit 字段镜像真实载荷
      status: complete
    clarify-comments:
      text: 两处注释澄清（不改行为）：reviewproxy.ts 注明上游头透传对假想 3xx Location 的现状与边界，reviewroutes.ts 注明 405 请求也会刷新空闲计时而 404/308 不会的读法
