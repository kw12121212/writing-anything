# 公众号营销文章：写作简报 → 大纲 → 草稿与营销要素 → 审稿与验收。默认写作法为 AIDA，作者可以在写作简报中改选 PAS 等。
# 草稿阶段除正文外还要写齐营销要素（标题候选、文章摘要、开头钩子与行动号召），标题由作者在决策中选定。
schema_version: 1
id: wechat-marketing
title: 公众号营销文章
description: 面向公众号读者的营销文章：标题由作者从候选中选定，开头抓人、结尾有明确的行动号召，避免广告法极限词，亲历与数据出自作者素材。
category: article
default_method: aida
unit_types:
  - id: article
    title: 文章
    children: [section]
    brief_required: [audience, purpose, key_messages]
  - id: section
    title: 节
stages:
  - id: brief
    title: 写作简报
    required_artifacts: [brief]
  - id: outline
    title: 大纲
    required_artifacts: [outline]
  - id: draft
    title: 草稿与营销要素
    required_artifacts: [draft, marketing]
  - id: review
    title: 审稿与验收
    required_artifacts: [review, acceptance]
rules:
  claims:
    type: claim-sources
    severity: error
  claim-candidates:
    type: claim-candidates
    severity: warning
    params: {counters: true}
  conflicts:
    type: conflict-sources
    severity: error
  ads:
    type: ad-compliance
    severity: error
  length:
    type: length-range
    severity: warning
    params: {min: 1500, max: 4000}
  paragraphs:
    type: paragraph-length
    severity: warning
    params: {max: 150}
rubric:
  - id: reader-benefit
    title: 读者收益
    description: 读者读完能说出自己得到了什么，收益与写作简报中的受众和目的一致。
  - id: hook
    title: 开头钩子
    description: 开头几段就让目标读者想读下去，且与正文内容相符，不是标题党。
  - id: cta
    title: 行动号召
    description: 结尾的行动号召明确、门槛低，与正文推介的内容一致。
  - id: compliance
    title: 合规可信
    description: 没有夸大与广告法限制的用语，数据、案例与用户评价都有出处。
    blocking: true
  - id: headline-useful
    title: 标题有用（4U）
    description: 作者选定的标题让读者看出读完能得到的好处。
  - id: headline-urgent
    title: 标题紧迫（4U）
    description: 作者选定的标题给出现在就读的理由，且不制造虚假的紧迫感。
  - id: headline-unique
    title: 标题独特（4U）
    description: 作者选定的标题与同类文章有区别，读者不会以为读过。
  - id: headline-specific
    title: 标题具体（4U）
    description: 作者选定的标题有具体的对象、数字或场景，而不是空泛的形容词。
context_budget: 12000
