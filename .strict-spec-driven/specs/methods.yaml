schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: methods
  title: 写作法模板（Method Template）
requirements:
  method-data:
    strength: MUST
    statement: 写作法模板（Method Template）必须是纯数据，含 id、title、可选的 description、kind 与可选的 rubric（评分标准（Rubric）条目，字段同文体的 rubric）：kind 为 article（文章类，必须有 sections：按顺序排列的必需章节，每项含 id、title 与可选的 description）、structure（结构类，必须有 beats：节拍，每项另含 position.min 与 position.max，取值 0 到 1，表示按字数比例在全文中的位置范围，以及可选的 tension：目标张力（Target Tension），0 到 10 的整数，作为情绪曲线（Emotion Curve）与张力曲线（Tension Curve）的目标走势）或 planning（规划类，必须有 steps：规划步骤（Planning Step），每项含 id、title、可选的 description 与可选的 product：规划产物（Planning Product），取值 characters（设定集人物条目）、scenes（单元树场景单元）或 scene-contracts（场景契约（Scene Contract）），声明该步骤的产物链接（Plan Link）类型，供 plan 命令按 plan 主规格校验）；三种列表只能出现与 kind 对应的一种，不得有其他字段；product 取值不在枚举内时报告 artifact.schema-violation（field 为 methods[i].steps[j].product）。wa-cli 必须随二进制提供内置文章类写作法：pyramid-scqa（金字塔原理与 SCQA）、general-specific-general（总分总）、inverted-pyramid（倒金字塔）、diataxis-tutorial、diataxis-how-to、diataxis-reference 与 diataxis-explanation（Diátaxis 的教程、操作指南、参考与解释），营销写作法 aida（AIDA：注意、兴趣、欲望、行动）与 pas（PAS：问题、放大、解决），内置结构类写作法：three-act（三幕结构（Three-Act Structure）：setup、confrontation、climax 与 resolution 四个节拍）、save-the-cat（救猫咪节拍表（Save the Cat! Beat Sheet），15 个节拍）、seven-point（七点结构（Seven-Point Story Structure）：hook、plot-turn-1、pinch-1、midpoint、pinch-2、plot-turn-2 与 resolution 七个节拍）、qichengzhuanhe（起承转合：qi、cheng、zhuan 与 he 四个节拍）、hero-journey（英雄之旅（Hero's Journey），12 个阶段）、golden-three（黄金三章（Golden Three Chapters）：hook（钩子）、protagonist（主角亮相）与 core-conflict（核心冲突与金手指）三个节拍，供覆盖开头三章的根单元或部单元选用）与 volume-structure（卷结构（Volume Structure）：goal（目标）、climax（高潮）与 cliffhanger（断章）三个节拍，供部（卷）单元选用），以及内置规划类写作法 snowflake（雪花写作法（Snowflake Method）十步：one-sentence（一句话概括）、one-paragraph（一段话概括）、character-sketch（人物概要）、one-page-synopsis（一页纲要）、character-details（人物详述）、four-page-synopsis（四页纲要）、character-bible（人物宝典）、scene-list（场景列表）、scene-details（场景详述）与 start-writing（开始写作）；character-sketch、character-details 与 character-bible 的 product 为 characters，scene-list 为 scenes，scene-details 为 scene-contracts，其余不声明 product）；内置结构类的每个节拍都声明 position 与 tension。规范包（Pack）可以在 methods 中定义写作法；文体（Genre）可以在 default_method 中声明默认写作法，取值必须是内置写作法（否则报告 genre.unknown-method）。同一个规范包中写作法 id 重复，或同一个写作法中章节、节拍、步骤或评分项的 id 重复时报告 artifact.duplicate-id；节拍的 position.min 大于 max 时报告 method.invalid-position；节拍的 tension 不是 0 到 10 的整数时报告 method.invalid-tension；写作法 id 为 none（写作简报中表示不用写作法）时报告 method.reserved-id；这些问题由 wa-cli validate 报告，field 指向出错的位置（如 methods[0].beats[1].position 或 methods[0].steps[0].product）。
    scenarios:
      pack-method-problem:
        - GIVEN: '工作区规范包 house 的 methods[0] 是结构类写作法，第二个节拍的 position 为 {min: 0.9, max: 0.1}，config.yaml 的 packs 为 [house]'
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有一条错误码为 method.invalid-position、field 为 methods[0].beats[1].position 的诊断，退出码为 1
      builtin-marketing-methods:
        - GIVEN: 已初始化的工作区
        - WHEN: 运行 wa-cli method show aida --dir D --json 与 wa-cli method show pas --dir D --json
        - THEN: aida 为文章类，sections 依次为 attention、interest、desire、action；pas 为文章类，sections 依次为 problem、agitate、solution；source 都为 builtin，退出码为 0
      structure-builtin-methods:
        - GIVEN: 已初始化的工作区
        - WHEN: 运行 wa-cli method show three-act --dir D --json 与 wa-cli method show save-the-cat --dir D --json
        - THEN: three-act 为结构类，beats 依次为 setup（position 为 0 到 0.3）、confrontation、climax（position 为 0.7 到 1）与 resolution，每个节拍含 0 到 10 整数的 tension；save-the-cat 为结构类，beats 恰好 15 项；source 都为 builtin，退出码为 0
      pack-tension-out-of-range:
        - GIVEN: 工作区规范包 house 的 methods[0] 是结构类写作法，第一个节拍的 tension 为 12，config.yaml 的 packs 为 [house]
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有一条错误码为 method.invalid-tension、field 为 methods[0].beats[0].tension 的诊断，退出码为 1
      builtin-planning-method:
        - GIVEN: 已初始化的工作区
        - WHEN: 运行 wa-cli method show snowflake --dir D --json
        - THEN: snowflake 为规划类，steps 依次为 one-sentence、one-paragraph、character-sketch、one-page-synopsis、character-details、four-page-synopsis、character-bible、scene-list、scene-details 与 start-writing，其中 character-sketch、character-details 与 character-bible 的 product 为 characters，scene-list 为 scenes，scene-details 为 scene-contracts，其余步骤没有 product；source 为 builtin，退出码为 0
      builtin-web-structure:
        - GIVEN: 已初始化的工作区
        - WHEN: 运行 wa-cli method show golden-three --dir D --json 与 wa-cli method show volume-structure --dir D --json
        - THEN: golden-three 为结构类，beats 依次为 hook、protagonist 与 core-conflict；volume-structure 为结构类，beats 依次为 goal、climax 与 cliffhanger；两者的每个节拍都含 position 的 min 与 max 及 0 到 10 整数的 tension；source 都为 builtin，退出码为 0
      pack-product-invalid:
        - GIVEN: 工作区规范包 house 的 methods[0] 是规划类写作法，第一个步骤的 product 为 robots，config.yaml 的 packs 为 [house]
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有一条错误码为 artifact.schema-violation、field 为 methods[0].steps[0].product 的诊断，退出码为 1
  method-list-show:
    strength: MUST
    statement: wa-cli method list 必须只读地列出工作区可用的写作法：内置写作法，以及 config.yaml 的 packs（为空时为内置 default 规范包）按顺序定义的写作法，同一 id 由后出现的来源覆盖；--json 输出的 methods 按 id 排序，每项含 id、title、description（没有时为空字符串）、kind、source（builtin 或 pack:<id>）、sections、beats、steps 与 rubric（没有时为空数组），beats 每项另含 position 的 min 与 max，以及节拍声明了目标张力（Target Tension）时的 tension，steps 每项另含声明了规划产物（Planning Product）时的 product。wa-cli method show <method> 必须只读地输出该写作法（字段同 method list 的每项）；不存在时报告 method.not-found（next 包含 wa-cli method list --dir <dir> --json），method 为 null，退出码为 1。
    scenarios:
      list-builtin:
        - GIVEN: 刚初始化的工作区 D
        - WHEN: 运行 wa-cli method list --dir D --json
        - THEN: methods 依次为 aida、diataxis-explanation、diataxis-how-to、diataxis-reference、diataxis-tutorial、general-specific-general、golden-three、hero-journey、inverted-pyramid、pas、pyramid-scqa、qichengzhuanhe、save-the-cat、seven-point、snowflake、three-act 与 volume-structure，其中 hero-journey、golden-three、qichengzhuanhe、save-the-cat、seven-point、three-act 与 volume-structure 为结构类且 beats 每项含 tension，snowflake 为规划类，其余为文章类，source 都为 builtin，退出码为 0
      pack-overrides:
        - GIVEN: 工作区规范包 house 定义了 id 为 general-specific-general 的写作法，config.yaml 的 packs 为 [house]
        - WHEN: 运行 wa-cli method list --dir D --json
        - THEN: general-specific-general 的 source 为 pack:house，退出码为 0
      show-unknown:
        - GIVEN: 刚初始化的工作区 D
        - WHEN: 运行 wa-cli method show nope --dir D --json
        - THEN: diagnostics 中有一条错误码为 method.not-found 的诊断，其 next 包含 wa-cli method list 命令；method 为 null，退出码为 1
      show-planning-product:
        - GIVEN: 刚初始化的工作区 D
        - WHEN: 运行 wa-cli method show snowflake --dir D --json
        - THEN: steps 中 character-sketch、character-details 与 character-bible 的 product 为 characters，scene-list 的 product 为 scenes，scene-details 的 product 为 scene-contracts，其余步骤不输出 product，退出码为 0
  method-selection:
    strength: MUST
    statement: 写作简报（Brief）可以含 method：写作法 id 或 none；wa-cli brief set <unit> --method <id> 设置它（none 表示不用写作法，空字符串时删除），wa-cli brief show 的 brief 含 method（未设置时为 null）。单元选用的写作法为写作简报的 method；未设置（或没有写作简报）时，只有作品的根单元选用文体的 default_method，子单元不用写作法；为 none 时不用写作法（根单元的写作简报与文体 default_method 都没有取值时也不用）。method 不是可用的写作法时，wa-cli validate 报告 brief.unknown-method（path 为 brief.yaml，field 为 method，message 列出可用的写作法，next 包含 wa-cli method list --dir <dir> --json），大纲关卡把它作为 outline.invalid 阻塞项；brief set --method 给出不可用的写作法时报告 brief.unknown-method（field 为 method、path 为空）且不修改文件。method 是对写作法的引用：brief show、brief set、outline show、outline set、review show 与 accept 不因它不可用而拒绝执行，并以 warning 报告 brief.unknown-method（outline 命令不检查写作法缺口，审稿的评分标准不包含写作法的评分项），context 不报告它（workspace-artifacts/cross-artifact-references）。审稿与大纲关卡按 brief.yaml 中 method 字段的原始取值选出同一个写作法，写作简报的其他问题不影响选择。
    scenarios:
      select-method:
        - GIVEN: 作品 my-post 的写作简报含 audience 与 purpose
        - WHEN: 运行 wa-cli brief set my-post --method general-specific-general --dir D --json
        - THEN: brief.yaml 的 method 为 general-specific-general，brief.method 为 general-specific-general，退出码为 0
      unknown-method-param:
        - GIVEN: 同上
        - WHEN: 运行 wa-cli brief set my-post --method nope --dir D --json
        - THEN: diagnostics 中有一条错误码为 brief.unknown-method、field 为 method 的诊断，brief.yaml 不变，退出码为 1
      reserved-none:
        - GIVEN: 工作区规范包 house 定义了 id 为 none 的写作法，config.yaml 的 packs 为 [house]
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有一条错误码为 method.reserved-id、field 为 methods[0].id 的诊断，退出码为 1
      dangling-method:
        - GIVEN: 作品 my-post 的 brief.yaml 的 method 为不存在的 gone
        - WHEN: 运行 wa-cli validate --dir D --json，再运行 wa-cli brief set my-post --method "" --dir D --json
        - THEN: validate 报告一条错误码为 brief.unknown-method、path 为 .writing-anything/works/my-post/brief.yaml 的诊断，退出码为 1；brief set 成功删除 method，退出码为 0
      dangling-commands:
        - GIVEN: 作品 my-post 选用规范包 house 定义的写作法，之后 config.yaml 的 packs 改为 [default]
        - WHEN: 运行 wa-cli brief show my-post、wa-cli brief set my-post --audience 运维、wa-cli context my-post 与 wa-cli outline show my-post
        - THEN: 四个命令的退出码都为 0；brief show、brief set 与 outline show 的 diagnostics 中各有一条 severity 为 warning、错误码为 brief.unknown-method 的诊断
      child-unit-no-method:
        - GIVEN: short-story 作品 my-story 的场景 s1 已登记，有自己的 outline.yaml（一节，无 role），场景的写作简报没有 method
        - WHEN: 运行 wa-cli outline show my-story/s1 --dir D --json，再运行 wa-cli brief set my-story/s1 --method three-act --dir D --json 与 wa-cli outline show my-story/s1 --dir D --json
        - THEN: 第一次 gaps 不含 outline.missing-method-part（子单元不继承文体的 default_method）；第二次含四项 outline.missing-method-part（setup、confrontation、climax 与 resolution）；退出码都为 0
  method-outline-check:
    strength: MUST
    statement: 大纲节（Outline Section）可以含 role：它承担的写作法章节或节拍 id；wa-cli outline set <unit> <section> --role <id> 设置它（空字符串时删除），outline show 的 sections 每项含 role（未设置时为 null）。单元选用了文章类或结构类写作法时，wa-cli outline show 的 gaps 必须另含写作法缺口，validate 与大纲关卡（见 outline 主规格的 outline-gate）同样报告：role 不是该写作法的章节或节拍 id 的节（outline.unknown-role，field 为 sections[i].role）；没有任何节承担的章节或节拍，每个一项（outline.missing-method-part，message 含章节或节拍 id 与标题）；文章类写作法中，按每个章节第一次被承担的位置，排在模板中前一章节之前的章节（outline.method-order，field 为承担它的第一个节的 sections[i].role）。outline set --role 给出不属于所选写作法的 id 时报告 outline.unknown-role（field 为 role）且不修改文件。这些诊断的 next 包含 wa-cli outline show <unit> --dir <dir> --json、wa-cli help outline set --json 与 wa-cli method list --dir <dir> --json。规划类写作法的步骤不由大纲承担，不检查 role；不用写作法时不做这些检查，role 不受限制。
    scenarios:
      missing-parts:
        - GIVEN: 作品 my-post 的写作简报选用 general-specific-general（总述 overview、分述 details、总结 summary），大纲只有一节 role 为 details
        - WHEN: 运行 wa-cli validate --dir D --json
        - THEN: diagnostics 中有两条错误码为 outline.missing-method-part 的诊断（overview 与 summary），退出码为 1
      wrong-order:
        - GIVEN: 同上，大纲依次为 role 为 summary、details、overview 的三节
        - WHEN: 运行 wa-cli outline show my-post --dir D --json
        - THEN: gaps 中有两项 code 为 outline.method-order，分别指向 role 为 details 与 summary 的节；退出码为 0
      advance-blocked:
        - GIVEN: 作品 post 的当前阶段要求 outline，文体的 default_method 为 general-specific-general，写作简报没有 method，大纲的节都没有 role
        - WHEN: 运行 wa-cli advance post --dir D --json
        - THEN: diagnostics 中有三条错误码为 outline.missing-method-part 的诊断，work.yaml 不变，退出码为 1
      method-none:
        - GIVEN: 同上，写作简报的 method 为 none
        - WHEN: 运行 wa-cli advance post --dir D --json
        - THEN: 没有写作法缺口，覆盖完整时推进成功，退出码为 0
  beat-positions:
    strength: MUST
    statement: 单元选用结构类写作法时，wa-cli lint 必须按字数比例核对成稿中节拍的位置：每个节拍取承担它的第一个大纲节，在 draft.md 中找标题文字与该节标题相同的第一个 Markdown 标题行，以该行之前的字符数占全文字符数的比例作为位置；超出节拍的 position 范围时给出一条 warning 级诊断 outline.beat-position（path 为 draft.md，line 为标题行，message 含节拍、实际位置与建议范围，next 包含 wa-cli lint <unit> --dir <dir> --json），不影响退出码；正文先把 CRLF 换成 LF，围栏代码块中的行不算标题行；找不到标题行的节拍不核对。此外，对有正文的场景单元（type 为 scene），wa-cli lint 必须按场景的单元树先序位置核对它承担的情节节拍（Story Beat）：场景大纲节的 beats 引用根单元大纲的节，该节的 role 是根单元选用的结构类写作法（写作简报的 method，为空时为文体的 default_method）的节拍时，作品共有 n 个场景单元、本场景按单元树先序为第 k 个（从 1 起）时，以 (k − 0.5) ÷ n 作为该节拍的相对位置；超出节拍的 position 范围时给出一条 warning 级诊断 outline.beat-position（path 为场景的 outline.yaml，field 为第一次引用该节拍的 sections[i].beats[j]，message 含场景、节拍、根单元大纲节、场景序号、相对位置与建议范围，next 包含 wa-cli lint <场景> --dir <dir> --json），同一场景的同一节拍至多一条，不要求正文存在同名标题，不影响退出码；根单元没有选用结构类写作法（含 none）、根单元的写作简报不能读取（没有写作简报时按文体的 default_method）、根单元大纲缺失或不能读取、或场景没有可读取的大纲时不做这项核对；场景自身写作简报的问题不影响这项核对。wa-cli review show 与 accept 同样展示这些 warning，它们不是验收的阻塞项。
    scenarios:
      beat-out-of-range:
        - GIVEN: 作品 my-post 选用结构类写作法 three-act（setup 位置 0–30%，climax 位置 70–100%），大纲节「开端」role 为 setup、「高潮」role 为 climax，正文先写「## 高潮」再写「## 开端」
        - WHEN: 运行 wa-cli lint my-post --dir D --json
        - THEN: diagnostics 中有两条 severity 为 warning、错误码为 outline.beat-position 的诊断，退出码为 0
      scene-beat-out-of-range:
        - GIVEN: short-story 作品 lamp 使用默认写作法 three-act，根单元大纲节 peak 的 role 为 climax（位置 70–100%），作品有 s1 到 s4 四个场景，s1 的大纲节 beats 为 [peak]，s1 有正文且正文中没有任何标题
        - WHEN: 运行 wa-cli lint lamp/s1 --dir D --json
        - THEN: diagnostics 中有一条 severity 为 warning、错误码为 outline.beat-position 的诊断，path 为 s1 的 outline.yaml，field 为 sections[0].beats[0]，message 含 climax、peak 与「第 1 个」，next 包含 wa-cli lint lamp/s1 --dir D --json，退出码为 0
      scene-beat-in-range:
        - GIVEN: 同 scene-beat-out-of-range，另有 s4 的大纲节 beats 为 [peak, end]，根单元大纲节 end 的 role 为 resolution（位置 85–100%）
        - WHEN: 运行 wa-cli lint lamp/s4 --dir D --json
        - THEN: diagnostics 中没有 outline.beat-position（s4 的相对位置约 88%），退出码为 0
      scene-beat-not-blocking:
        - GIVEN: 同 scene-beat-out-of-range
        - WHEN: 运行 wa-cli review show lamp/s1 --dir D --json
        - THEN: diagnostics 中有 outline.beat-position 的 warning，验收阻塞项中不含 outline.beat-position
  method-rubric:
    strength: MUST
    statement: 单元选用的写作法附带的评分项必须加入该单元审稿的评分标准（与合并结果中已有 id 相同的不重复加入）：wa-cli review record 要求为它们给出结论，验收关卡（见 review 主规格的 accept-gate）按它们检查。
    scenarios:
      method-rubric-required:
        - GIVEN: 作品 my-post 选用 pyramid-scqa（附带评分项 conclusion-first），处于审稿阶段
        - WHEN: 运行 wa-cli review record my-post --dir D --json，输入只给出 clarity 的结论
        - THEN: diagnostics 中有一条错误码为 review.missing-verdict 的诊断，message 含 conclusion-first，退出码为 1
