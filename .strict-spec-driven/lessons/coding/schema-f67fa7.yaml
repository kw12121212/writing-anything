context: ripple-analysis 新增复查标记产物 rechecks，schema 注册了 .writing-thing/rechecks/*.yaml 模式，实现写的是 rechecks/<work>/rechecks.yaml 子目录
observation: fresh-context 审查发现 path.Match 的 * 不跨目录分隔符：wa-cli 自己写出的文件 validate <path> 报 artifact.unknown-kind，而整体校验经包内 CheckWorks 照常检查，套件全绿掩盖了模式失配；相关诊断的 next 也因此指向检不出问题的复查命令
takeaway: 新增产物类型时当场用真实路径跑一次 wa-cli validate <写出的文件>：它同时验证 Schema 注册、路径模式与领域校验三件事；单元测试只走 CheckWorks 时，路径模式失配不可见
