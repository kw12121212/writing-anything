      text: 完整回归（review_evidence.project_regression）：构建、全部测试与 80% 覆盖率门槛
      status: complete
      command: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out
  Verification:
    ready-check:
      text: ready 检查变更构件齐备
      status: complete
      command: strict-spec-cli ready skill-confirmation-guard
    verify-check:
      text: verify 校验变更构件与引用一致性
      status: complete
      command: strict-spec-cli verify skill-confirmation-guard
    archive-consistency:
      text: 归档前检查：delta-spec 的字面量与三个技能正文逐字对照；ZCode 副本逐字一致；既有技能约束（preview-serve-guidance、illustrate-skill-prompt 等）未回归
      status: complete
testing_gates:
  validation_task: project-regression
  unit_test_task: unit-tests
