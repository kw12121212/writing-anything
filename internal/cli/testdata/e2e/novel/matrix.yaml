- id: T-THREAD-01
  feature: threads
  scene: ch1-s1
  command: wa-cli threads add TH-A（planted ch1-s1, 回收 ch3-s3）/ threads add TH-B（planted ch1-s2）/ threads add TH-C（planted
    ch2-s1, 计划回收 ch3-s3）
  expected: 全绿（exit 0）
  assertion: 三条伏笔按埋设场景登记，计划回收位置与 DESIGN.md 伏笔链一致。
  evidence:
  - kind: script
    token: threads add stopped-at-417 --id th-a
  - kind: script
    token: threads add stopped-at-417 --id th-c
- id: T-THREAD-02
  feature: threads
