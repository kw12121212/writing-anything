change: fix-cli-install-hints
sections:
  Implementation:
    reproduce:
      text: 【复现】新增 TestSkillsInstallLaunchDir、TestUnknownSubcommandRelated（internal/cli）与 TestInstallLaunchHints（internal/mcpinstall）；修复前分别因缺少 launchDir 与提示、decision show 的诊断不含 decisions、首次注册误报「同名条目重新创建」而失败，记录失败输出
      status: complete
