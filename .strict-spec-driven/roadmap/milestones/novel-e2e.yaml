schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: ../schemas/roadmap-milestone.yaml
milestone:
  novel-e2e:
    title: 真实小说端到端测试（Real-novel E2E）
order: 100
goal: 用一部按真实工作流创作的中文中篇小说作为端到端（End-to-End，E2E）测试语料：语料一次性创作定稿并检入仓库，测试以固定命令序列在临时目录重放完整长篇写作生命周期（写作简报 → 大纲与场景契约 → 逐场景草稿与写后收口 → 审稿与验收 → 组稿导出），以测试矩阵保证准确性、以真实可读的正文保证可读性、以黄金文件与负向断言保证可验证性、以冻结时间源与固定语料保证可重复性。
scope:
  in:
    - 真实中文小说语料：以 wa-cli 完整生命周期真实创作，正文为完整叙事的创作文本而非占位文本；作者意图以作者素材（Source）提供，前提与关键转折链接出处
    - 可重放命令脚本：创作过程记录为分阶段、带注释的命令序列，与语料一起检入 internal/cli/testdata/e2e/ 下的小说语料目录
    - 重放测试：Go 测试读取命令脚本与语料在临时目录按序重放，逐步断言退出码、诊断码与产物路径，冻结时间源
    - 黄金文件与负向断言：结构化产物与整书导出与黄金文件比对，支持 UPDATE_GOLDEN 一键更新；临时注入设定冲突、知情违例、伏笔悬空、时间线倒置四类违例并断言对应审查以 error 发现
    - 语料 README：目录结构、运行方式、更新语料与黄金文件的维护流程、矩阵维护约定
    - 测试矩阵：将长篇特性面（多层单元、场景契约与因果链、状态快照、知情表、伏笔台账、写后收口、分层摘要与上下文预算、长篇规划写作法（Long-form Planning Method）、recall 全文检索（Full-text Search）、连续性审查、审查任务包、影响传播、会话交接、卷末检查点、组稿与整书导出）逐条映射到语料中的可断言事实、命令与期望结果
  out:
    - 系列小说（Novel Series）跨作品特性：跨作品设定集、全局时间线、跨作品连续性审查——留待后续独立 E2E 里程碑复用本次框架
    - 产品功能变更：只新增测试与夹具，不改产品代码；测试暴露的缺陷走独立缺陷变更处理
    - 自动生成小说内容：语料由一次性真实创作定稿，不引入内容生成机制
    - MCP 服务与 Skill 的端到端覆盖：它们是 wa-cli 的薄封装，由各自单元测试覆盖
done_criteria:
  - 测试矩阵覆盖已交付 novel 与 novel-continuity 里程碑的全部特性面，每条特性都有断言编号，且对应断言在测试中实际执行
  - 完整回归命令 go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out 通过，新 E2E 纳入 go test 默认执行且无跳过
  - 四类注入违例（设定冲突、知情违例、伏笔悬空、时间线倒置）都被对应审查命令以 error 级发现项报告，修回合规文本后恢复全绿
  - 组稿整书导出产物与黄金文件逐字节一致，UPDATE_GOLDEN=1 可一键再生成
  - 重放测试在同一环境连续执行两次结果完全一致
  - 语料正文人工可读：整部小说叙事完整、无占位文本，README 描述目录结构与维护方式；以 lint 零 error、审稿流程完整走通与作者确认记录齐备为可验证代理
intake_questions:
  - id: scale
    question: 小说语料的规模定多大？
    context: 分层摘要、跨章伏笔、影响传播等长篇特性需要多章多场景才能真实触发，但规模直接增加回归耗时与维护成本
    impact: 决定 E2E 覆盖深度与回归成本
    recommendation: 建议 1 部 3 章、每章 3–4 个场景、正文约 1.5–2 万字：足以触发全部长篇特性且重放耗时可控
  - id: theme
    question: 小说题材与基本设定由谁确定？
    context: 题材决定可断言冲突的设计空间（知情边界、伏笔链、时间线）；按项目约定作者（Author）是意图与素材的来源
    impact: 影响语料设计文档与后续创作
    recommendation: 请作者给出题材意向；若暂无建议，默认采用封闭场景的中文悬疑或温情故事（小镇、家族旧事一类），便于植入可断言的设定冲突
  - id: series-scope
    question: 是否在本里程碑叠加系列（跨作品）E2E？
    context: novel-series 的跨作品设定集、全局时间线、跨作品连续性审查需要第二部作品才能触发
    impact: 决定本里程碑规模是否约翻倍
    recommendation: 建议本里程碑聚焦单部作品，系列 E2E 作为后续独立里程碑，复用本次建立的重放与断言框架
planned_changes: {}
dependencies:
  - 依赖的 novel 与 novel-continuity 里程碑均已交付并归档，无未满足依赖
risks:
  - 语料维护成本：修订设定或正文需同步更新结构化产物与黄金文件——以 UPDATE_GOLDEN 机制与一次性重放全部命令的脚本缓解
  - 易变字段误报：产物中的时间戳等字段导致黄金比对不稳定——以冻结时间源与比对前规范化缓解
  - 回归耗时：语料过大会拖慢完整回归——以规模上限（约 3 章、9–12 个场景）与进程内重放约定缓解
  - 断言与矩阵脱节：矩阵条目没有对应执行的断言——以清单式对账校验缓解
  - 「真实可读」缺少客观判据——以 lint 零 error、审稿流程完整走通、作者确认记录齐备作为可验证代理
status: proposed
notes:
  - wa-cli 不调用大语言模型（LLM）：正文定稿即固定，测试重放的是命令与文本而非重新生成内容，这是可重复性的根基
  - 作者参与以数据形式固定：作者素材、决策队列确认、验收确认记录、作者直接编辑正文的片段均检入语料
details: 四个质量属性的落地方式：准确性——语料设计阶段产出测试矩阵，每条长篇特性都对应语料中一个可断言的事实（谁在哪场得知秘密、哪章埋设与回收伏笔、哪次状态变更），断言逐条引用矩阵编号；可读性——正文为真实中文创作、整部叙事完整，命令脚本按生命周期阶段分段注释，语料目录有 README；可验证性——完成标准全部可独立执行（回归命令、负向断言、黄金比对、两次重放一致），矩阵与断言的对账由测试强制；可重复性——语料与命令序列检入仓库，时间源冻结，比对前规范化易变字段，无任何运行时生成内容。
