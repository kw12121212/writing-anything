    question: default 规范包第二条「用具体的事实、数据和例子代替空泛的形容词」是否也属文章类？
    context: 完成标准要求 novel 输出不含技术博客文风条目；该条面向事实、数据，属于非虚构写作要求。影响内置数据与黄金文件。
    answer: '属于文章类，与「结论先行」一起声明 applies_to: [article]；default.yaml 注释已写明只放通用规范，文章专用条目以 applies_to 限定'
    status: resolved
    answered_by: roadmap
