schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: ../schemas/roadmap-milestone.yaml
milestone:
  novel-series:
    title: 系列小说（Novel Series）
order: 700
goal: 多部作品组成系列时，设定集（Canon）与时间线（Timeline）跨作品共享，连续性审查（Continuity Review）能发现作品内与跨作品的冲突。
scope:
  in:
    - 全局时间线与事件顺序检查
    - 跨作品连续性审查
    - 跨作品共享设定集与作用域（系列级 / 作品级）
  out:
    - 多作者协作与权限管理
done_criteria:
  - 系列中第二部作品的场景若与第一部的设定集或时间线冲突，连续性审查报告阻塞
  - 作品级设定可以覆盖系列级设定，并记录覆盖原因与作者确认
  - 人物在同一时间出现在两地等时间矛盾，在作品内与跨作品范围都能被 wa-cli continuity 报告
intake_questions:
  - id: canon-scope
    question: 系列级与作品级 canon 冲突时以谁为准？
    context: 前传、平行线等情况会合理地改写设定。
    impact: 决定 canon 的作用域解析规则。
    recommendation: 默认以作品级为准，但必须显式记录覆盖原因并经作者确认。
planned_changes: {}
dependencies:
  - novel-continuity
risks:
  - 跨作品数据量大，context 裁剪与检索性能需要控制
status: proposed
notes: []
details: 建立在「规范包分发与系列文章」里程碑的系列共享模型，以及「长篇结构与记忆」「长篇连续性与组稿」两个里程碑的设定集、台账与连续性能力之上。时间线同时服务单部作品内与跨作品的时间检查。
