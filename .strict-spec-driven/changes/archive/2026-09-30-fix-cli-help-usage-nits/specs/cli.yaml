schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli
operations:
  ADDED: {}
  MODIFIED:
    help-command:
      strength: MUST
      statement: wa-cli help 与 wa-cli --help 必须列出所有命令及其摘要；wa-cli help <command>、wa-cli help <command> --help 与 wa-cli <command> --help 必须输出该命令的用法并以退出码（Exit Code）0 退出；加 --json 时信封必须包含 commands 数组，每项列出 name、summary、usage、args、flags、outputKeys 与 exitCodes，指定命令时数组只含该命令；help 指定的命令不存在时为用法错误。用法说明中的占位符必须使用英文标识符（如 <command>、<value>），与 help --json 中的参数名一致。
      scenarios:
        help-text:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli help
          - THEN: 标准输出列出 help 与 version 等全部命令及其摘要，退出码为 0
        root-help-flag:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli --help
          - THEN: 标准输出与 wa-cli help 相同，标准错误为空，退出码为 0
        help-json:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli help --json
          - THEN: commands 数组包含每条已注册命令，每项有 name、summary、usage、args、flags、outputKeys、exitCodes，flags 中包含 --json 与 --help
        help-one-command:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli help version --json
          - THEN: commands 数组只含 version，其 outputKeys 包含 version
        command-help-flag:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli version --help
          - THEN: 标准输出为 version 的用法说明，退出码为 0
        help-command-help-flag:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli help version --help
          - THEN: 标准输出与 wa-cli help version 相同，为 version 的用法说明，退出码为 0
        help-unknown-command:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli help nope --json
          - THEN: valid 为 false，诊断错误码为 usage.unknown-command，退出码为 2
        english-placeholders:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli help 与 wa-cli help help
          - THEN: 用法说明中的占位符为 <command> 等英文标识符，不出现 <命令> 等中文占位符
        help-unknown-command-help-flag:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli help nope --help --json
          - THEN: valid 为 false，诊断错误码为 usage.unknown-command，退出码为 2
    exit-codes:
      strength: MUST
      statement: wa-cli 必须以退出码（Exit Code）0 表示成功，1 表示校验失败或执行失败，2 表示用法错误；输出写入失败属于执行失败，即使发生在写出用法错误时也必须以退出码 1 退出；help 中列出的每条命令的退出码只能取这三个值。
      scenarios:
        success-exit:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli help
          - THEN: 退出码为 0
        declared-exit-codes:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli help --json
          - THEN: 每条命令的 exitCodes 都带含义说明，code 只取 0、1、2
        usage-error-write-failure:
          - GIVEN: 已构建的 wa-cli 二进制，标准输出不可写（重定向到 /dev/full）
          - WHEN: 运行 wa-cli nope --json
          - THEN: 标准错误报告写入输出失败，退出码为 1
    usage-error:
      strength: MUST
      statement: 未提供命令、命令未知、参数未知、参数缺少取值、不接受取值的参数带了取值或位置参数多余时，wa-cli 必须以退出码 2 退出；未加 --json 时必须把用法说明写到标准错误；加 --json 时必须在标准输出写出 valid 为 false、含 usage 领域错误码诊断的 JSON 输出信封。写出用法错误本身失败时按 exit-codes 以退出码 1 退出。
      scenarios:
        no-command:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 不带任何参数运行 wa-cli
          - THEN: 标准错误包含用法说明，退出码为 2
        unknown-command:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli 一个不存在的命令
          - THEN: 标准错误指出未知命令并包含用法说明，退出码为 2
        unknown-flag:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli version --unknown
          - THEN: 标准错误指出未知参数，退出码为 2
        json-unknown-command:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli nope --json
          - THEN: 标准输出是 valid 为 false 的 JSON 输出信封，diagnostics 中有一条错误码为 usage.unknown-command 的诊断，标准错误为空，退出码为 2
        flag-takes-no-value:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli version --help=yes --json
          - THEN: 标准输出的诊断错误码为 usage.flag-takes-no-value，message 指出 --help=yes，退出码为 2
        unexpected-argument:
          - GIVEN: 已构建的 wa-cli 二进制
          - WHEN: 运行 wa-cli version extra
          - THEN: 标准错误指出多余的参数 extra 并包含 version 的用法说明，退出码为 2
  REMOVED: {}
