# 内置默认规范包：config.yaml 的 packs 为空时生效。放通用的中文写作规范；只适用于文章类文体的文风条目用
# applies_to: [article] 限定，小说类文体（short-story、novel）不继承。
schema_version: 1
id: default
title: 默认规范包
description: 通用的中文写作规范：中文排版、常见 AI 腔、禁用词与术语一致。
style:
  - text: 结论先行，先说结果再说过程。
    applies_to: [article]
  - text: 用具体的事实、数据和例子代替空泛的形容词。
    applies_to: [article]
rules:
  cjk-typography:
    type: cjk-typography
    severity: warning
  ai-cliche:
    type: ai-cliche
    severity: error
    params:
      terms: [值得注意的是, 不难看出, 总而言之, 综上所述, 在当今时代]
  banned-terms:
    type: banned-terms
    severity: error
  term-consistency:
    type: term-consistency
    severity: warning
