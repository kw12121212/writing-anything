    unit-tests:
      text: impact 与 cli 测试：已验收触发落盘、未验收只提示、只改注释或排版不触发、非语义字段不触发、重复修改去重且不重复生成任务包、清除后可再次触发、state/knowledge/threads/scene contract 触发、next 命令与 done 场景列出
      status: complete
      command: go test ./internal/impact/ ./internal/cli/
