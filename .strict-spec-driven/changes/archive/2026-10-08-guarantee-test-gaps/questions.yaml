  - id: requirement-interpretation
    question: 「MCP 与 CLI 一致性测试遍历命令注册表中的只读命令」应如何理解？
    context: 证据：planned change details「遍历命令注册表中的只读命令逐字节比对（覆盖新版与旧版会话）」；注册表没有只读标记。影响测试设计。
    answer: 对注册表中每条有 tool 的命令取其登记样例，样例调用前后工作区不变者视为只读命令；在同一工作区以新版请求与旧版会话调用 tool，content 文本逐字节等于 CLI --json 标准输出（见 design 决策 readonly-by-snapshot）
    status: resolved
    kind: requirement
    answered_by: roadmap
