schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: mcp
  title: MCP 服务（MCP Server）
requirements:
  mcp-serve:
    strength: MUST
    statement: 'wa-cli mcp --dir <dir> 必须以 stdio 方式运行 MCP 服务：从标准输入逐行读取 JSON-RPC 2.0 消息（每条一行，至多 8 MiB），把响应与通知逐行写到标准输出，标准输出不写其他内容；标准输入结束时以退出码 0 结束。没有给出 --dir 时报告 mcp.missing-dir（next 为 wa-cli help mcp --json），未找到工作区时报告 workspace.not-found，都以退出码 1 退出、不读取标准输入。服务是双代服务端（Dual-era Server），支持协议版本 2026-07-28、2025-11-25 与 2025-06-18：params._meta 含 io.modelcontextprotocol/protocolVersion 的请求按 2026-07-28 无状态语义处理，此时 params._meta 还必须含 io.modelcontextprotocol/clientCapabilities，缺少时返回错误 -32602；版本不是 2026-07-28 时返回错误 -32022（message 为 Unsupported protocol version，data 含 supported 为 [2026-07-28, 2025-11-25, 2025-06-18] 与 requested）。method 为 initialize 的请求与旧版会话中的请求按 mcp-legacy-session 处理；没有建立旧版会话时，params._meta 不含 io.modelcontextprotocol/protocolVersion 的其他请求返回错误 -32602。每个 2026-07-28 成功结果含 resultType: complete 与 _meta.io.modelcontextprotocol/serverInfo（name 为 wa-cli，version 为 wa-cli 的版本）。server/discover 返回 supportedVersions [2026-07-28, 2025-11-25, 2025-06-18]、capabilities（tools、resources.subscribe 为 true、prompts）与 instructions。无法解析的行返回 -32700（id 为 null）；不是 JSON-RPC 2.0 对象的消息（如批量数组、数字、缺少 method 或 jsonrpc 不是 2.0）与 id 不是字符串或数字的请求返回 -32600；2026-07-28 请求的未知方法（包括已移除的 ping）返回 -32601；客户端发来的响应与未知的通知忽略。加 --json 时，在标准输入结束、退出之前多写一行输出信封，mcp 字段含 requests（处理的请求数）；--interval（毫秒，不超过 86400000 的正整数，默认 1000）为订阅轮询间隔，不合法时报告 input.invalid-value。'
    scenarios:
      discover:
        - GIVEN: 已初始化的工作区 D
        - WHEN: 向 wa-cli mcp --dir D 发送带 _meta（protocolVersion 2026-07-28 与 clientCapabilities）的 server/discover 请求
        - THEN: 响应的 result.resultType 为 complete，supportedVersions 为 [2026-07-28, 2025-11-25, 2025-06-18]，capabilities.resources.subscribe 为 true，_meta 中 serverInfo.name 为 wa-cli
      version-errors:
        - GIVEN: wa-cli mcp --dir D 正在运行，尚未收到 initialize
        - WHEN: 发送 _meta 中 protocolVersion 为 2025-11-25 的 tools/list 请求，以及没有 _meta 的 tools/list 请求
        - THEN: 前者返回错误 -32022，data.supported 为 [2026-07-28, 2025-11-25, 2025-06-18]、requested 为 2025-11-25；后者返回错误 -32602
      missing-dir:
        - GIVEN: 当前目录有工作区
        - WHEN: 运行 wa-cli mcp --json
        - THEN: diagnostics 中有一条错误码为 mcp.missing-dir 的诊断，退出码为 1
  mcp-tools:
    strength: MUST
    statement: tools/list 必须为命令注册表中除 mcp、mcp install、pack install 与 feedback watch 外的每条命令返回一个 tool（mcp install 会写项目目录之外的客户端配置，pack install 的来源可以是项目目录之外的本地路径或 file:// 仓库，请在命令行中运行；feedback watch 会一直等待作者操作，以订阅 wa://feedback 代替）：name 为命令名中的空格换成下划线（如 feedback_add），description 为命令摘要，inputSchema 为对象：每个位置参数为同名字符串属性（必需的位置参数列入 required），每个命名参数按类型为布尔、字符串或字符串数组属性，但不含 --dir、--json、--help、--file（可以指向项目之外；读取 --file 或标准输入的命令改为字符串属性 input，作为标准输入的内容）、skills install 的 --target（可以写到项目之外）与 preview 的 --serve、--port、--max（需要常驻的本地服务）；additionalProperties 为 false。tools/call 必须在进程内运行同一条 wa-cli 命令：位置参数按顺序、命名参数写作 --name=value（布尔为 --name，数组的每一项一个），命令接受 --dir 时加上 --dir <dir>，并加上 --json；每次调用都不等待作者或其他外部事件即结束；结果的 structuredContent 为命令的输出信封，content 为一项 type 为 text、内容为标准输出的文字，命令的退出码不为 0 时 isError 为 true。tool 不存在、参数不是 inputSchema 允许的类型、出现未声明的参数或位置参数以 - 开头时返回错误 -32602，不运行命令。同一操作经 MCP 与 CLI（同样的参数加 --dir 与 --json）调用，产物与输出信封相同。测试按每条命令登记的样例调用（cli-contract/sample-invocation）逐一调用对应的 tool，结果的 isError 都为 false。
    scenarios:
      same-as-cli:
        - GIVEN: 两个相同的工作区 D1 与 D2，各有作品 my-post
        - WHEN: '经 MCP 在 D1 调用 feedback_add {unit: my-post, text: 太长}，在 D2 运行 wa-cli feedback add my-post --text 太长 --dir D2 --json'
        - THEN: 两者的输出信封相同（路径不含 --dir），两个工作区的 feedback.yaml 内容相同
      tool-errors:
        - GIVEN: wa-cli mcp --dir D 正在运行
        - WHEN: 调用不存在的 tool、给 feedback_add 传入未声明的参数 color，或调用 unit_add 时命令以退出码 1 结束
        - THEN: 前两者返回错误 -32602；后者返回结果且 isError 为 true
      every-tool:
        - GIVEN: 每条命令在注册表测试中登记的样例调用
        - WHEN: 把样例的参数转换为 tool 参数（--file 的内容作为 input），在样例的工作区中调用对应的 tool
        - THEN: 每个 tool 的结果 isError 都为 false；version、help 与 skills_list 不带 --dir 调用
      tool-per-command:
        - GIVEN: wa-cli mcp --dir D 正在运行
        - WHEN: 发送 tools/list
        - THEN: 命令注册表中除 mcp、mcp install、pack install 与 feedback watch 外的每条命令都有一个对应的 tool，名称为命令名的空格换成下划线；有 pack_list 与 pack_remove，没有 pack_install
  mcp-resources:
    strength: MUST
    statement: resources/list 必须列出工作区中可读取的产物：.writing-anything/ 下由 Schema 登记了产物类型的 YAML 文件与各单元目录下的 draft.md（不跟随符号链接，按路径排序），URI 为 wa://file/<相对项目目录的路径>，mimeType 为 application/yaml 或 text/markdown；另有 wa://resolved（生效配置，即 wa-cli config resolved --json 的输出，含生效的规范包）与 wa://feedback（作者反馈，即 wa-cli feedback list --json 的输出），mimeType 为 application/json。resources/read 返回 contents 数组中的一项（uri、mimeType 与 text）；URI 不是上述资源、文件不存在或途经符号链接（包括 .writing-anything 本身是符号链接）时返回错误 -32602（message 为 Resource not found，data.uri 为该 URI）。资源只读，读取不修改任何文件。
    scenarios:
      read-draft:
        - GIVEN: 作品 my-post 有正文
        - WHEN: resources/read wa://file/.writing-anything/works/my-post/draft.md
        - THEN: contents[0].text 为正文，mimeType 为 text/markdown；读取 wa://file/../etc/passwd 返回 -32602
  mcp-subscriptions:
    strength: MUST
    statement: subscriptions/listen 的 params.notifications.resourceSubscriptions 列出要订阅的资源 URI；服务必须先发送 notifications/subscriptions/acknowledged（_meta.io.modelcontextprotocol/subscriptionId 为该请求的 id，notifications.resourceSubscriptions 为其中存在的资源），之后每隔 --interval 毫秒读取这些资源，内容与上次不同时发送 notifications/resources/updated（_meta.io.modelcontextprotocol/subscriptionId 与 uri）；该请求在被取消前不返回结果。收到 params.requestId 为该请求 id（数字按数值比较）的 notifications/cancelled 时停止订阅，按取消的规则不再回复该请求。订阅期间其他请求照常处理。订阅的请求 id 已在使用、同时进行的订阅超过 32 个或一个订阅的资源超过 64 个时返回错误 -32602。
    scenarios:
      feedback-notification:
        - GIVEN: 客户端用 subscriptions/listen 订阅了 wa://feedback
        - WHEN: 作者在阅读页或用 wa-cli feedback add 提交一条新反馈，之后客户端发送指向该订阅的 notifications/cancelled
        - THEN: 客户端收到 uri 为 wa://feedback、subscriptionId 为该订阅请求 id 的 notifications/resources/updated；取消后服务不再回复该订阅请求，其他请求照常处理
  mcp-prompts:
    strength: MUST
    statement: prompts/list 必须为每个内置技能（Skill）返回一个 prompt：name 为技能名，description 为技能的说明；prompts/get 返回 description 与 messages（一项 role 为 user、content 为 type text 的技能正文）；prompt 不存在时返回错误 -32602。
    scenarios:
      get-prompt:
        - GIVEN: wa-cli mcp --dir D 正在运行
        - WHEN: 'prompts/get {name: wa-draft}'
        - THEN: messages[0].content.text 为 wa-draft 技能的正文
  mcp-install:
    strength: MUST
    statement: wa-cli mcp install 必须把 MCP 服务注册到 --client 给出的每个客户端（可重复，取 claude-code、codex 或 json；至少一个，重复的只注册一次）：注册的命令为 wa-cli 可执行文件的绝对路径（PATH 中的 wa-cli 与当前可执行文件是同一个文件时用 PATH 中的路径，否则用当前可执行文件），参数为 mcp --dir <项目目录（--dir，必须是已存在的目录）的绝对路径>；名称为 --name（id 格式，默认 writing-anything）；--scope 为 project（默认）或 user。claude-code：在项目目录中依次运行 claude mcp remove --scope <scope> <name>（失败忽略）与 claude mcp add --scope <scope> <name> -- <命令> mcp --dir <路径>；project 作用域的 installs path 为 .mcp.json。codex：只支持 user，依次运行 codex mcp remove <name>（失败忽略）与 codex mcp add <name> -- <命令> mcp --dir <路径>；--scope 为 project 时报告 mcp.unsupported-scope，next 为改用 --scope user 的同一命令。外部命令不经 shell 运行，不连接 wa-cli 的标准输入输出，超过 2 分钟未结束视为失败。json：把 --config（相对 --dir 或绝对路径，json 必需）指向的 JSON 文件中 mcpServers.<name> 的 command 与 args 设为注册的命令与参数，保留该条目的其他字段（如 env）、文件中其他的键与 mcpServers 的其他条目，不转义 HTML 字符；文件不存在、为空或为 null 时从空对象开始，取值未变时不写文件，写入时先写同目录的临时文件再重命名并保留原文件的权限；文件不是 JSON 对象、mcpServers 或该条目不是对象、文件是符号链接时报告 mcp.invalid-config。找不到 claude 或 codex 可执行文件时跳过该客户端，给出 warning 级 mcp.client-not-found；官方 CLI 以非 0 退出或超时时报告 mcp.client-failed（message 含其输出，移除已成功时说明已有的同名条目已被移除）；这两者的 next 含 wa-cli help mcp install --json 与同一客户端、作用域、名称的重试命令，claude-code 的 project 作用域另含改用 --client json --config .mcp.json 的命令。--json 输出的 installs 按 --client 顺序列出每个客户端的 client、scope、name、command、args、status（registered、updated、unchanged 或 skipped；失败时为 failed）、path（json 的配置文件或 claude-code 项目级的 .mcp.json，在项目目录之内时为相对路径，否则为绝对路径；其他为 null）与 message；changedPaths 为写入的、在项目目录之内的 json 配置文件（相对 --dir 的路径）；项目目录之外的配置文件（如用户级配置）只在 installs 的 path 与 message 中给出，其诊断不填 path。--config 不能在工作区 .writing-anything/ 中（按文件身份比较途经的每一级目录，符号链接与大小写不同的写法都不能绕过；报告 input.invalid-value）。mcp install 不是 MCP tool（见 mcp-tools）。有 error 级诊断时退出码为 1，其他客户端照常处理。重复执行结果相同。没有 --client、--client 或 --scope 取值不合法、--name 不是 id 格式、json 缺少 --config、--dir 不存在时报告 input.invalid-value（next 为 wa-cli help mcp install --json），不注册任何客户端。不需要工作区。
    scenarios:
      claude-project:
        - GIVEN: PATH 中有 claude
        - WHEN: 运行 wa-cli mcp install --client claude-code --dir D --json
        - THEN: 在 D 中依次运行 claude mcp remove --scope project writing-anything 与 claude mcp add --scope project writing-anything -- <wa-cli> mcp --dir <D 的绝对路径>；installs[0].status 为 registered，退出码为 0
      codex-user:
        - GIVEN: PATH 中有 codex
        - WHEN: 运行 wa-cli mcp install --client codex --scope user --dir D --json，再以 --scope project 运行
        - THEN: 第一次运行 codex mcp add writing-anything -- <wa-cli> mcp --dir <路径>，status 为 registered；第二次报告 mcp.unsupported-scope，退出码为 1
      json-idempotent:
        - GIVEN: 'D/mcp.json 已有 {"mcpServers": {"other": {"command": "x"}}, "theme": "dark"}'
        - WHEN: 运行两次 wa-cli mcp install --client json --config mcp.json --dir D --json
        - THEN: '第一次 status 为 updated，文件中 other 与 theme 保留，mcpServers.writing-anything 为 {command: <wa-cli>, args: [mcp, --dir, <D 的绝对路径>]}，changedPaths 为 [mcp.json]；第二次 status 为 unchanged，changedPaths 为空数组，文件不变'
      client-not-found:
        - GIVEN: PATH 中没有 claude
        - WHEN: 运行 wa-cli mcp install --client claude-code --client json --config mcp.json --dir D --json
        - THEN: installs[0].status 为 skipped，diagnostics 中有一条 warning 级 mcp.client-not-found；json 照常写入，退出码为 0
      client-failed:
        - GIVEN: PATH 中的 claude 在 mcp add 时以退出码 1 结束并在标准输出中输出错误
        - WHEN: 运行 wa-cli mcp install --client claude-code --name my-wa --dir D --json
        - THEN: diagnostics 中有一条错误码为 mcp.client-failed、message 含该错误并说明已有的同名条目已被移除的诊断，next 含 --client claude-code --scope project --name my-wa 的重试命令与 --client json --config .mcp.json 的命令，status 为 failed，退出码为 1
      json-merge-entry:
        - GIVEN: 'D/env.json 中 mcpServers.writing-anything 已有 {"command": "old", "env": {"A": "1"}}，另一个键的取值含 & < >'
        - WHEN: 运行 wa-cli mcp install --client json --config env.json --dir D --json
        - THEN: command 与 args 改为注册的命令与参数，env 保留，& < > 原样保留；内容为 null 的配置文件从空对象开始，mcpServers 为 null 时报告 mcp.invalid-config
      install-guards:
        - GIVEN: D 中的 ws 是指向 .writing-anything 的符号链接
        - WHEN: 运行 wa-cli mcp install --client json --config ws/evil.json --dir D --json，或以不存在的目录作为 --dir 运行
        - THEN: 都报告 input.invalid-value 且不写入任何文件、不创建目录
  mcp-legacy-session:
    strength: MUST
    statement: wa-cli mcp 必须为只发送 initialize 的旧版客户端提供旧版会话（Legacy Session），作用域为该 stdio 进程：initialize 的 params.protocolVersion 为 2025-11-25 或 2025-06-18 时结果的 protocolVersion 为所请求的版本，为其他字符串时为 2025-11-25；结果含 capabilities（tools、resources.subscribe 为 true、prompts）、serverInfo（name 为 wa-cli，version 为 wa-cli 的版本）与 instructions，不含 resultType。params.protocolVersion 缺失或不是字符串时返回错误 -32602，该进程已有旧版会话时再次 initialize 返回错误 -32600；两者的 message 列出支持的协议版本，data.supported 为 [2026-07-28, 2025-11-25, 2025-06-18]。收到 notifications/initialized 之前，旧版会话中除 ping 外的请求返回错误 -32600；之后接受 tools/list、tools/call、resources/list、resources/read、prompts/list、prompts/get、ping、resources/subscribe 与 resources/unsubscribe，不要求 params._meta，tool、资源与 prompt 的结果与错误与 2026-07-28 相同（mcp-tools、mcp-resources、mcp-prompts），但成功结果不含 resultType 与 _meta.io.modelcontextprotocol/serverInfo；其他方法返回 -32601。ping 返回空结果。resources/subscribe 的 params.uri 必须是 resources/read 能读取的资源，否则返回 -32602（message 为 Resource not found）；订阅后每隔 --interval 毫秒读取，内容与上次不同时发送 params 为 {uri} 的 notifications/resources/updated；重复订阅同一 URI 不重复通知，至多订阅 64 个 URI，超过时返回 -32602；resources/unsubscribe 后不再通知该 URI。旧版会话中 params._meta 含 io.modelcontextprotocol/protocolVersion 的请求仍按 2026-07-28 处理（mcp-serve）。不支持 2025-03-26 及更早版本的语义。
    scenarios:
      legacy-handshake:
        - GIVEN: 已初始化的工作区 D 中有作品 my-post，wa-cli mcp --dir D 正在运行
        - WHEN: 分别在两个进程中发送 protocolVersion 为 2025-11-25 与 2025-06-18 的 initialize，再发送 notifications/initialized、tools/list 与 tools/call feedback_list（都不带 _meta）
        - THEN: initialize 结果的 protocolVersion 分别为所请求的版本，serverInfo.name 为 wa-cli，capabilities.resources.subscribe 为 true；tools/list 含 feedback_add，tools/call 结果的 isError 为 false、structuredContent 为命令的输出信封
      legacy-subscribe:
        - GIVEN: 旧版会话已完成 initialized，客户端用 resources/subscribe 订阅了 wa://feedback
        - WHEN: 作者用 wa-cli feedback add 提交一条新反馈
        - THEN: 客户端收到 params.uri 为 wa://feedback 的 notifications/resources/updated
      legacy-negotiate-latest:
        - GIVEN: wa-cli mcp --dir D 正在运行
        - WHEN: 发送 protocolVersion 为 2024-11-05 的 initialize
        - THEN: 结果的 protocolVersion 为 2025-11-25
      legacy-gate:
        - GIVEN: wa-cli mcp --dir D 正在运行
        - WHEN: 未 initialize 时发送不带 _meta 的 tools/list；initialize 之后、notifications/initialized 之前发送 tools/list 与 ping；再发送一次 initialize
        - THEN: 第一个返回错误 -32602；initialized 之前的 tools/list 返回错误 -32600、ping 返回空结果；第二次 initialize 返回错误 -32600，data.supported 为 [2026-07-28, 2025-11-25, 2025-06-18]
      legacy-keeps-modern:
        - GIVEN: 旧版会话已完成 initialized
        - WHEN: 发送带 _meta（protocolVersion 2026-07-28 与 clientCapabilities）的 tools/list 与 ping
        - THEN: 'tools/list 的结果含 resultType: complete 与 _meta 中的 serverInfo；ping 返回错误 -32601'
