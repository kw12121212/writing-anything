schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: mcp
spec:
  title: MCP 服务（MCP Server）
  path: .strict-spec-driven/specs/mcp.yaml
operations:
  ADDED:
    mcp-serve:
      strength: MUST
      statement: 'wa-cli mcp --dir <dir> 必须以 stdio 方式运行 MCP 服务：从标准输入逐行读取 JSON-RPC 2.0 消息（每条一行，至多 8 MiB），把响应与通知逐行写到标准输出，标准输出不写其他内容；标准输入结束时以退出码 0 结束。没有给出 --dir 时报告 mcp.missing-dir（next 为 wa-cli help mcp --json），未找到工作区时报告 workspace.not-found，都以退出码 1 退出、不读取标准输入。服务只支持协议版本 2026-07-28：每个请求的 params._meta 必须含 io.modelcontextprotocol/protocolVersion 与 io.modelcontextprotocol/clientCapabilities，缺少时返回错误 -32602；版本不是 2026-07-28 时返回错误 -32022（message 为 Unsupported protocol version，data 含 supported 为 [2026-07-28] 与 requested）。每个成功结果含 resultType: complete 与 _meta.io.modelcontextprotocol/serverInfo（name 为 wa-cli，version 为 wa-cli 的版本）。server/discover 返回 supportedVersions [2026-07-28]、capabilities（tools、resources.subscribe 为 true、prompts）与 instructions。无法解析的行返回 -32700（id 为 null）；不是 JSON-RPC 2.0 对象的消息（如批量数组、数字、缺少 method 或 jsonrpc 不是 2.0）与 id 不是字符串或数字的请求返回 -32600；未知方法（包括 2026-07-28 已移除的 ping 与 initialize）返回 -32601；客户端发来的响应与未知的通知忽略。加 --json 时，在标准输入结束、退出之前多写一行输出信封，mcp 字段含 requests（处理的请求数）；--interval（毫秒，不超过 86400000 的正整数，默认 1000）为订阅轮询间隔，不合法时报告 input.invalid-value。'
      scenarios:
        discover:
          - GIVEN: 已初始化的工作区 D
          - WHEN: 向 wa-cli mcp --dir D 发送带 _meta（protocolVersion 2026-07-28 与 clientCapabilities）的 server/discover 请求
          - THEN: 响应的 result.resultType 为 complete，supportedVersions 为 [2026-07-28]，capabilities.resources.subscribe 为 true，_meta 中 serverInfo.name 为 wa-cli
        version-errors:
          - GIVEN: wa-cli mcp --dir D 正在运行
          - WHEN: 发送 protocolVersion 为 2025-11-25 的 tools/list 请求，以及没有 _meta 的 tools/list 请求
          - THEN: 前者返回错误 -32022，data.supported 为 [2026-07-28]、requested 为 2025-11-25；后者返回错误 -32602
        missing-dir:
          - GIVEN: 当前目录有工作区
          - WHEN: 运行 wa-cli mcp --json
          - THEN: diagnostics 中有一条错误码为 mcp.missing-dir 的诊断，退出码为 1
    mcp-tools:
      strength: MUST
      statement: tools/list 必须为命令注册表中除 mcp 与 feedback watch 外的每条命令返回一个 tool（feedback watch 会一直等待作者操作，以订阅 wa://feedback 代替）：name 为命令名中的空格换成下划线（如 feedback_add），description 为命令摘要，inputSchema 为对象：每个位置参数为同名字符串属性（必需的位置参数列入 required），每个命名参数按类型为布尔、字符串或字符串数组属性，但不含 --dir、--json、--help、--file（可以指向项目之外；读取 --file 或标准输入的命令改为字符串属性 input，作为标准输入的内容）、skills install 的 --target（可以写到项目之外）与 preview 的 --serve、--port、--max（需要常驻的本地服务）；additionalProperties 为 false。tools/call 必须在进程内运行同一条 wa-cli 命令：位置参数按顺序、命名参数写作 --name=value（布尔为 --name，数组的每一项一个），命令接受 --dir 时加上 --dir <dir>，并加上 --json；每次调用都不等待作者或其他外部事件即结束；结果的 structuredContent 为命令的输出信封，content 为一项 type 为 text、内容为标准输出的文字，命令的退出码不为 0 时 isError 为 true。tool 不存在、参数不是 inputSchema 允许的类型、出现未声明的参数或位置参数以 - 开头时返回错误 -32602，不运行命令。同一操作经 MCP 与 CLI（同样的参数加 --dir 与 --json）调用，产物与输出信封相同。测试按每条命令登记的样例调用（cli-contract/sample-invocation）逐一调用对应的 tool，结果的 isError 都为 false。
      scenarios:
        tool-per-command:
          - GIVEN: wa-cli mcp --dir D 正在运行
          - WHEN: 发送 tools/list
          - THEN: 命令注册表中除 mcp 外的每条命令都有一个对应的 tool，名称为命令名的空格换成下划线
        same-as-cli:
          - GIVEN: 两个相同的工作区 D1 与 D2，各有作品 my-post
          - WHEN: '经 MCP 在 D1 调用 feedback_add {unit: my-post, text: 太长}，在 D2 运行 wa-cli feedback add my-post --text 太长 --dir D2 --json'
          - THEN: 两者的输出信封相同（路径不含 --dir），两个工作区的 feedback.yaml 内容相同
        tool-errors:
          - GIVEN: wa-cli mcp --dir D 正在运行
          - WHEN: 调用不存在的 tool、给 feedback_add 传入未声明的参数 color，或调用 unit_add 时命令以退出码 1 结束
          - THEN: 前两者返回错误 -32602；后者返回结果且 isError 为 true
        every-tool:
          - GIVEN: 每条命令在注册表测试中登记的样例调用
          - WHEN: 把样例的参数转换为 tool 参数（--file 的内容作为 input），在样例的工作区中调用对应的 tool
          - THEN: 每个 tool 的结果 isError 都为 false；version、help 与 skills_list 不带 --dir 调用
    mcp-resources:
      strength: MUST
      statement: resources/list 必须列出工作区中可读取的产物：.writing-anything/ 下由 Schema 登记了产物类型的 YAML 文件与各单元目录下的 draft.md（不跟随符号链接，按路径排序），URI 为 wa://file/<相对项目目录的路径>，mimeType 为 application/yaml 或 text/markdown；另有 wa://resolved（生效配置，即 wa-cli config resolved --json 的输出，含生效的规范包）与 wa://feedback（作者反馈，即 wa-cli feedback list --json 的输出），mimeType 为 application/json。resources/read 返回 contents 数组中的一项（uri、mimeType 与 text）；URI 不是上述资源、文件不存在或途经符号链接（包括 .writing-anything 本身是符号链接）时返回错误 -32602（message 为 Resource not found，data.uri 为该 URI）。资源只读，读取不修改任何文件。
      scenarios:
        read-draft:
          - GIVEN: 作品 my-post 有正文
          - WHEN: resources/read wa://file/.writing-anything/works/my-post/draft.md
          - THEN: contents[0].text 为正文，mimeType 为 text/markdown；读取 wa://file/../etc/passwd 返回 -32602
    mcp-subscriptions:
      strength: MUST
      statement: subscriptions/listen 的 params.notifications.resourceSubscriptions 列出要订阅的资源 URI；服务必须先发送 notifications/subscriptions/acknowledged（_meta.io.modelcontextprotocol/subscriptionId 为该请求的 id，notifications.resourceSubscriptions 为其中存在的资源），之后每隔 --interval 毫秒读取这些资源，内容与上次不同时发送 notifications/resources/updated（_meta.io.modelcontextprotocol/subscriptionId 与 uri）；该请求在被取消前不返回结果。收到 params.requestId 为该请求 id（数字按数值比较）的 notifications/cancelled 时停止订阅，按取消的规则不再回复该请求。订阅期间其他请求照常处理。订阅的请求 id 已在使用、同时进行的订阅超过 32 个或一个订阅的资源超过 64 个时返回错误 -32602。
      scenarios:
        feedback-notification:
          - GIVEN: 客户端用 subscriptions/listen 订阅了 wa://feedback
          - WHEN: 作者在阅读页或用 wa-cli feedback add 提交一条新反馈，之后客户端发送指向该订阅的 notifications/cancelled
          - THEN: 客户端收到 uri 为 wa://feedback、subscriptionId 为该订阅请求 id 的 notifications/resources/updated；取消后服务不再回复该订阅请求，其他请求照常处理
    mcp-prompts:
      strength: MUST
      statement: prompts/list 必须为每个内置技能（Skill）返回一个 prompt：name 为技能名，description 为技能的说明；prompts/get 返回 description 与 messages（一项 role 为 user、content 为 type text 的技能正文）；prompt 不存在时返回错误 -32602。
      scenarios:
        get-prompt:
          - GIVEN: wa-cli mcp --dir D 正在运行
          - WHEN: 'prompts/get {name: wa-draft}'
          - THEN: messages[0].content.text 为 wa-draft 技能的正文
  MODIFIED: {}
  REMOVED: {}
