schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: continuity
  title: 连续性审查（Continuity Review）
requirements:
  continuity-command:
    strength: MUST
    statement: wa-cli continuity <unit|work> 必须只读地执行确定性连续性检查，不调用大语言模型（LLM）、不修改任何产物（幂等生成的决策除外）。给出 scene 单元时检查该场景；给出其他单元或作品时检查其子树全部场景。连续性检查只对声明了长篇场景契约扩展字段（pov、location、state_changes、plants、recovers、causes、events 任一）的场景启用：只有轻量契约（characters、beats、reveal）的场景跳过（既有文体验收行为不变），跳过的场景不出现在输出中。--json 输出 findings 数组，每项含 scene（场景单元引用）、code、severity（error 或 warning）、waived（该（场景， 错误码）是否已被作者决策豁免）与 message，按场景的单元树先序排列，同场景按检查顺序；changedPaths 为空数组（本命令不生成决策；豁免决策由 accept 的阻塞路径生成）。检查集：(1) continuity.unknown-character：场景大纲各节 characters 的取值与首个非空 pov，在与设定集条目 name、别名（Alias）完全相等的匹配下没有任何命中条目（同名多条目命中时不判，与 recall 的多义不解析一致；作品没有 canon.yaml 时每个称谓都未命中），每个未命中称谓一条 error；(2) continuity.dead-acting：出场称谓唯一命中 character 条目时，取状态台账（state.yaml）中该条目在按先序严格早于本场景的已确认（confirmed）状态里最后生效的完整描述，其值精确等于保留词（死亡、已死亡、已亡故、失踪、已退场）之一时报 error（message 含称谓、条目与状态）；状态描述非保留词（如 殒命）或只有 proposed 状态时不判；(3) continuity.alias-mismatch：同一场景的多个不同出场称谓唯一命中同一 character 条目时报 error（message 含两个称谓与条目 id）；(4) continuity.dangling-reference：绑定该场景的状态与知情台账条目的失效引用（warning，不阻塞验收）、该场景 closeout.yaml 的领域问题（error）、伏笔交叉检查中 path 为该场景大纲的问题（error）与因果链检查中 path 为该场景大纲的问题（error）；状态或知情台账整体无法加载（error 级）时该场景的检查以原问题作为 error findings 返回；(5) continuity.thread-anomaly：伏笔台账中 planted_in 或 planned_recover 为本场景、或本场景大纲节 recovers 引用、status 为 open 且超过计划回收位置（overdue，语义同 threads 主规格）的条目，每条一条 error。没有大纲的场景跳过全部检查。检查项之间的 message 使用中文并含可操作的修复指引。不加 --json 时以人读文本按场景分组输出，被豁免的条目标注［已豁免］。 (6) 时间线（Timeline）检查：作品任一场景声明了 time 或 after 时启用——timeline.unknown-scene（after 引用不存在）、timeline.cycle（after 成环）、timeline.order-conflict（after 声明与推导全序矛盾）与 timeline.same-time-presence（同一出场人物在两个相同 time 的场景出场且两场景间无 after 链分隔），发现为 error 级并进入既有的（场景， 错误码）豁免通道（见 timeline 主规格）；没有任何 time/after 声明的作品不输出时间线发现。 给出系列 id（.writing-anything/series/<id>.yaml 存在）时，continuity 执行系列范围的跨作品检查（见 timeline 与本规格的系列段）：合并成员作品的场景集合（works 顺序）后检查跨作品时间线（timeline 主规格语义，发现 message 标明涉及的作品）、系列级设定引用（canon.Resolve 的解析视图，系列级来源标明 series:<id>）与跨作品状态矛盾——同一设定条目在多部作品的最后生效 confirmed 状态不同时报告 continuity.conflicting-state（error，归先序更早作品的相关场景，message 含两部作品的场景与两个状态描述）；发现进入既有豁免通道。
    scenarios:
      series-cross-work-blocks:
        - GIVEN: 系列 guide 的 book-1/s1 与 book-2/s1 声明相同 time 第一日夜 且都出场守灯人，两场景间无 after
        - WHEN: 运行 wa-cli continuity guide --dir D --json
        - THEN: findings 含一条 timeline.same-time-presence（Scene 为 book-1/s1，message 含 book-2/s1 与守灯人），退出码为 0
      series-conflicting-state:
        - GIVEN: book-1 把 canon-1 确认为 受伤、book-2 把 canon-1 确认为 痊愈（均为 confirmed）
        - WHEN: 运行 wa-cli continuity guide --dir D --json
        - THEN: findings 含一条 continuity.conflicting-state（Scene 为 book-1/s1，message 含两部作品的场景与两个状态描述），退出码为 0
      series-consistent-state-ok:
        - GIVEN: 同上，但 book-2 的确认也为 受伤（一致）
        - WHEN: 运行 wa-cli continuity guide --dir D --json
        - THEN: 没有 continuity.conflicting-state 发现，退出码为 0
      single-work-cross-after-skipped:
        - GIVEN: 作品 book-2 的场景声明 after [book-1/s1]（引用系列内另一作品的场景）
        - WHEN: 运行 wa-cli continuity book-2/s1 --dir D --json
        - THEN: 单作品检查不报告该跨作品引用的 timeline.unknown-scene（由系列范围检查负责），退出码为 0
  continuity-accept-gate:
    strength: MUST
    statement: wa-cli continuity 必须为验收提供连续性阻塞项计算：AcceptanceBlockers(root, w, unit) 对 scene 单元返回该场景 error 级且未被豁免的 findings（每项一条 workspace.Problem，错误码同 finding，path 为该场景的 outline.yaml，next 由命令层填充）；（场景， 错误码）的豁免判定查询决策队列：存在为该场景与错误码生成（问题文本为固定格式「是否豁免场景 <场景> 的连续性检查 <错误码>？」，同场景同错误码的多条发现共用一个豁免决策）、status 为 decided 且作者选择允许（选项 a）的决策时豁免生效；连续性阻塞在所有关卡强度（Gate Level）下都是 error，发现即阻塞。accept 因连续性阻塞被拒时，必须按（场景， 错误码）幂等地向决策队列追加阻塞决策（decision 包的追加语义：blocking 为 true，options 为 允许/保持不变，推荐保持不变，units 含该作品根单元）：同一（场景， 错误码）已有 open 的此类决策、或作者已选择保持不变时不重复追加；追加时 changedPaths 如实列出决策队列路径，未追加时为空数组；决策队列无法加载时不追加并原样报告其诊断（目标产物逐字节不变）；wa-cli next 因这些决策按 decision-blocking 阻塞推进。作者对豁免决策选择允许后，对应（场景， 错误码）不再阻塞该场景的验收；finding 因正文或台账修改而消失后，不再生成新的豁免决策。只读命令（如 wa-cli review show）复用同一阻塞计算但不生成豁免决策：豁免决策只在 accept 的阻塞路径上生成。
    scenarios:
      blockers-waive-flow:
        - GIVEN: 场景 s1 有 error 级 unknown-character finding，决策队列为空
        - WHEN: accept 被连续性阻塞拒绝后再次运行 accept
        - THEN: 第一次生成一条豁免决策（changedPaths 含决策队列），第二次不再追加（幂等）；作者 decide 选择允许后 accept 不再被该 finding 阻塞
      keep-choice-suppresses:
        - GIVEN: 作者对豁免 s1 的 dead-acting 决策选择了保持不变
        - WHEN: accept 再次被连续性阻塞拒绝
        - THEN: 不追加新的豁免决策（changedPaths 为空数组），finding 仍然阻塞，message 提示作者已决定保持不变
      non-scene-no-check:
        - GIVEN: 单元是章（chapter）或作品根
        - WHEN: 调用 AcceptanceBlockers
        - THEN: 返回空（连续性阻塞只挂在场景验收上）
      read-only-no-decisions:
        - GIVEN: 场景 s1 有未豁免的 error 级 finding
        - WHEN: 运行 wa-cli review show s1 --dir D --json
        - THEN: gate.blockers 呈现该 finding，changedPaths 为空数组，没有创建或修改 decisions.yaml
  continuity-knowledge-early:
    strength: MUST
    statement: wa-cli continuity 的 Run 必须增加知情揭示词检查：对每个存在非空 terms 的设定条目 E（词表为该条目全部已确认事件揭示词的并集），取每个获知者（出场人物或读者（reader））对 E 的已确认获知点——按时间线（Timeline）全序最早的该获知者 confirmed 事件所在场景，无论该事件是否携带揭示词；获知者没有已确认事件时不做该获知者的检查。任一场景 X（带长篇场景契约且有正文）的正文命中 E 的任一揭示词（多词匹配与 internal/lint 同口径）时：若 X 按全序严格早于读者对 E 的获知点，报告 error 级 continuity.knowledge-early（归属场景 X，message 含 E 的条目 id、获知者 reader 与命中的揭示词）；若 X 的契约出场人物中存在人物 C 使 X 严格早于 C 对 E 的获知点，报告 error 级 continuity.knowledge-early（message 含 C 与其条目 id）。发现进入既有的验收（Acceptance）阻塞与决策豁免通道（（场景，错误码）粒度，同其他连续性发现）；没有任何非空 terms 时本检查完全不产生发现，连续性、accept 与 validate 的输出与错误码与引入本规格前完全一致。所有诊断的 next 含 wa-cli knowledge list <work> --all --dir <dir> --json 与 wa-cli continuity <work> --dir <dir> --json。
    scenarios:
      early-reveal-error:
        - GIVEN: 条目 E 的揭示词为「为了救人」，读者与人物 C 对 E 的已确认获知点都在场景 S2，场景 S1 按全序早于 S2 且 S1 的契约出场人物含 C
        - WHEN: S1 的正文包含「他是为了救人才走的」，运行 wa-cli continuity <work>
        - THEN: 报告 error 级 continuity.knowledge-early（归属 S1，message 含 reader 与 C），验收被阻塞，退出码语义与其他 error 级连续性发现一致
      reveal-at-point-clean:
        - GIVEN: 同上，但揭示词只出现在 S2 的正文
        - WHEN: 运行 wa-cli continuity <work>
        - THEN: 没有 knowledge-early 发现，退出码 0
      no-terms-unchanged:
        - GIVEN: 作品的全部知情事件 terms 为空
        - WHEN: 运行 wa-cli continuity <work> 与 wa-cli accept <场景>
        - THEN: 输出与错误码和没有本检查时完全一致
  continuity-series-dead-acting:
    strength: MUST
    statement: wa-cli continuity <series> 的系列范围检查必须报告跨作品终态人物出场：对系列 works 中排在第二部及以后的作品里带长篇场景契约的场景，出场称谓（characters 与首个非空 pov）在本作品设定集唯一命中 character 条目、且本作品在该场景之前（单元树先序）没有该条目的已确认（confirmed）状态时，按 works 逆序在排在本作品之前的成员作品中，用同一称谓在该作品设定集唯一命中的条目，取其按单元树先序最后生效的已确认状态，首个找到的即为最新状态；其完整描述精确等于保留词（死亡、已死亡、已亡故、失踪、已退场）之一时报告 error 级 continuity.dead-acting，归属出场场景，message 以 [系列] 开头并含称谓、更早作品、其场景与状态。只有 proposed 状态、非保留词状态或称谓在更早作品中未命中或命中多条时不报告；本作品已有更早的已确认状态时由单作品检查负责。
    scenarios:
      series-dead-acting-reported:
        - GIVEN: 系列 guide 的 book-1 把守灯人（canon-1）在 book-1/s1 确认为 死亡，book-2/s1 的场景契约 characters 含守灯人，book-2 在 s1 之前没有该人物的已确认状态
        - WHEN: 运行 wa-cli continuity guide --dir D --json
        - THEN: findings 含一条 continuity.dead-acting（scene 为 book-2/s1，severity 为 error，message 含守灯人、book-1 与 死亡），退出码为 0
      series-dead-acting-proposed-ignored:
        - GIVEN: 同上，但 book-1 的死亡状态为 proposed
        - WHEN: 运行 wa-cli continuity guide --dir D --json
        - THEN: 没有 continuity.dead-acting 发现
  continuity-series-accept-gate:
    strength: MUST
    statement: 作品属于系列（.writing-anything/series/<id>.yaml 的 works 含该作品，系列文件须通过校验）且系列至少有两部可加载的成员作品时，场景的连续性阻塞项计算（accept、review show 的 gate.blockers 与 assemble 共用）必须在单作品检查之外追加系列范围检查中涉及该场景、且涉及系列内另一作品的 error 级发现：错误码为 timeline.same-time-presence、continuity.conflicting-state 或 continuity.dead-acting；涉及指发现归属该场景或 message 以完整场景引用提及该场景（dead-acting 只按归属场景，不阻塞更早作品中确认终态的场景）。纳入的发现归属改为该场景，按（场景， 错误码）进入既有豁免通道：accept 被拒时对 continuity.* 与 timeline.* 阻塞项一样幂等生成豁免决策（changedPaths 列出决策队列路径），诊断 next 含 wa-cli continuity <unit> 与 wa-cli decisions；作者选择允许后不再阻塞，只读命令不生成决策；豁免键不区分单作品与跨作品来源，同一场景同一错误码的已有豁免同样覆盖跨作品发现。跨作品同一时间两地的 message 以 [系列] 开头且修复提示不重复。不属于系列的作品与只含一部作品的系列，连续性阻塞项与引入本要求前完全一致；组稿关卡的系列范围发现不再重复列出已由本作品场景阻塞项覆盖的发现（作者已豁免的此类发现不阻塞该作品组稿），未被本作品场景阻塞项覆盖的系列发现（如后续作品的 dead-acting 之于更早作品）照常列出。
    scenarios:
      series-same-time-blocks-accept:
        - GIVEN: 系列 guide 的 book-1/s1 已验收并推进到 done，book-2/s1 与 book-1/s1 声明相同 time 且都出场守灯人、两场景间没有 after，book-2/s1 已审稿
        - WHEN: 运行 wa-cli accept book-2/s1 --confirmed-by-author --confirmation 作者：可以 --dir D --json
        - THEN: 退出码为 1，诊断含 timeline.same-time-presence（message 含 book-1/s1 与 book-2/s1），changedPaths 含决策队列路径
      series-fix-unblocks-accept:
        - GIVEN: 同上，之后把 book-2/s1 的大纲改为 after [book-1/s1] 并重新审稿
        - WHEN: 再次运行 wa-cli accept book-2/s1 --confirmed-by-author --confirmation 作者：可以 --dir D --json
        - THEN: 验收成功，退出码为 0
      series-dead-acting-blocks-accept:
        - GIVEN: book-1 已确认守灯人 死亡，book-2/s1 的场景契约出场守灯人且已审稿
        - WHEN: 运行 wa-cli accept book-2/s1 --confirmed-by-author --confirmation 作者：可以 --dir D --json
        - THEN: 退出码为 1，诊断含 continuity.dead-acting；作者经决策队列选择允许后再次 accept 成功
      non-series-unchanged:
        - GIVEN: 作品不属于任何系列
        - WHEN: 运行 wa-cli review show 与 wa-cli accept
        - THEN: 连续性阻塞项与引入本要求前一致
      assemble-respects-waiver:
        - GIVEN: book-2/s1 的跨作品 dead-acting 已由作者豁免并验收、推进到 done
        - WHEN: 运行 wa-cli assemble book-2 --dir D --json
        - THEN: 该发现不再阻塞组稿，退出码为 0
      earlier-work-assemble-lists:
        - GIVEN: book-1 已确认守灯人 死亡，book-2/s1 仍出场守灯人，book-1 全部场景 done
        - WHEN: 运行 wa-cli assemble book-1 --dir D --json
        - THEN: 退出码为 1，诊断列出该 continuity.dead-acting 系列发现
