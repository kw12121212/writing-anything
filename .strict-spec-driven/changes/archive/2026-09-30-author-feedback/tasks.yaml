schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: author-feedback
sections:
  Implementation:
    schema-kind:
      text: internal/schema：新增 feedback.schema.json 并登记 feedback 产物类型（works/*/feedback.yaml 与 works/*/units/*/feedback.yaml），在 testdata/ 下准备合法与不合法夹具
      status: complete
    draft-read:
      text: internal/draft 导出 Read：按单元安全读取 draft.md（逐级 Lstat），供反馈定位复用
      status: complete
    feedback-package:
      text: 新增 internal/feedback：追加反馈（默认 id、kind 与 status 取值、原文唯一定位与锚点记录，feedback.quote-not-found、feedback.ambiguous-quote、draft.not-found）、重新定位（located、orphaned、none 与打分择优）、修改状态（feedback.not-found、feedback.anchored-value、取值未变不写）、列出工作区反馈、校验 feedback.yaml（artifact.duplicate-id）
      status: complete
    cli-commands:
      text: 在 internal/cli 注册表新增 feedback add、feedback list、feedback resolve、feedback watch：声明参数与输出键，登记 sampleArgs/mutatingSamples；watch 每行输出一个完整信封，支持 --all、--max、--interval（非法取值报告 input.invalid-value）；不加 --json 时输出人读文本
      status: complete
    next-validate-integration:
      text: 扩展 wa-cli next：steps 每项新增 feedback（未处理完的反馈），action 提示先处理反馈；扩展 wa-cli validate：整体校验与 validate <path> 检查 feedback.yaml
      status: complete
  Testing:
    unit-tests:
      text: 为 schema、draft、feedback 与 cli 编写单元测试：追加与各错误码、正文修改后的重新定位（移动、改写、多处匹配择优、无锚点）、状态修改与取值未变、watch 的新增检测与 --all/--max、next 的 feedback 字段、validate 对 feedback.yaml 的检查；断言使用规格中的字面量
      status: complete
      command: go test ./internal/...
    full-regression:
      text: 运行完整回归命令，覆盖率不低于 80%
      status: complete
      command: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out
  Verification:
    spec-alignment:
      text: 对照 feedback、units-and-lifecycle 与 workspace delta spec 的每个场景确认实现与测试覆盖，并按实际实现修正 delta spec 与 delta tech
      status: complete
    strict-ready:
      text: 运行 strict-spec-cli ready 与 strict-spec-cli verify，确认变更产物有效
      status: complete
      command: strict-spec-cli ready author-feedback && strict-spec-cli verify author-feedback
    archive-readiness:
      text: 确认 delta spec 能合并进 units-and-lifecycle、workspace 主规格与新建的 feedback 主规格，delta tech 能合并进 cli-contract，归档后路线图中的 author-feedback 标记为完成
      status: complete
testing_gates:
  validation_task: full-regression
  unit_test_task: unit-tests
