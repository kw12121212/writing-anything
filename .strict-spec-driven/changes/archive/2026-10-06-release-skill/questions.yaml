    answer: 扩入当前变更（用户确认）：internal/skills.Install 路径归一化修复 + TestInstall 断言拼写调整，作为本变更的一部分实现、测试与审查
    status: resolved
    answered_by: human
  - id: env-regressions
    question: 完整回归暴露的另外三个既有失败（install.sh 全角解析、export 大小写、pack 测试拼写）如何处置？
    context: 干净 HEAD 复现确认均为 dev 既有失败，与发布技能无关，但同样阻塞完整回归关卡。修复形态：install.sh 花括号（真实产品缺陷，macOS 安装必坏）、export isExports 段名严格化（对齐 export-output 规格的「只能是 exports」）、pack 测试拼写归一（纯测试）。影响：前两项触及产品文件，超出「只交付技能」原始范围。曾向用户确认，未获回复；按用户此前对同类问题「扩入当前变更」的决定继续，归档前可再调整
    answer: 扩入当前变更（延续用户先例）：三项修复作为本变更的一部分实现、测试与审查
    status: resolved
