schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: fix-review-session-unit-mismatch
  status: proposed
summary:
  what:
    - 面板在会话状态轮询时按单元判定会话归属：reviewAfterStatus 目前只判 session 是否为 null，另一浏览器标签页为别的单元启动审阅（单会话被替换）后，本面板仍把 iframe 视为活跃，内嵌渲染的是另一个单元的阅读页；改为会话摘要的 unit 与面板所审单元不一致时同样进入「审阅已结束」状态并给出重新审阅入口
    - 附带两处评审核对的注释澄清：代理对上游 3xx Location 头的现状与边界（当前阅读页无重定向）、prefix 路由下 405 请求也会刷新空闲计时的读法
  why:
    - dsh-review-proxy 的 strict-spec-review 发现（SHOULD FIX S1）：会话状态路由的响应已携带 unit 而面板不比对，跨标签页替换会话后旧面板把别的单元的正文当成当前单元展示，作者可能对着错误的单元提交反馈；README 已登记替换行为，但面板侧收口成本极低
scope:
  in:
    - plugins/dsh-writing-viewer/src/reviewview.ts：reviewAfterStatus 把 unit 不一致的非空会话并入 ended
    - plugins/dsh-writing-viewer/src/reviewview.test.ts 与 src/client.test.ts：新增 unit 不一致返回 ended 的回归用例，既有会话状态测试桩补齐 unit 字段以镜像真实路由载荷
    - plugins/dsh-writing-viewer/src/reviewproxy.ts 与 src/reviewroutes.ts：两处注释澄清，不改行为
    - delta tech：dsh-plugin-structure 新增 SHOULD 规则 host-route-dispatch-harness（评审沉淀的插件路由集成测试约定）
  out:
    - 不改 host 侧会话管理、代理与来源校验行为；不改 wa-cli；不加新的面板轮询触发时机；不改 README 已登记的跨标签页替换语义（旧标签页提交被 wa-cli 可读拒绝仍属实）
unchanged_behavior:
  - wa-cli、MCP 与内置技能不依赖插件包；完整 Go 回归命令与 internal/** 覆盖率范围不变
  - 插件 host 的会话路由、代理路由与请求来源校验行为不变；快照与其余面板视图行为不变
  - 阅读页脚本与 preview 主规格行为不变
