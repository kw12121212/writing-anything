schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: plan
operations:
  ADDED:
    plan-confirm-channel:
      strength: MUST
      statement: 确认规划步骤时必须在步骤记录上写入确认渠道（Confirmation Channel）channel：wa-cli plan confirm 写入 cli，作者在本地阅读页确认写入 preview；步骤回到未确认（改写草稿或 --redo 重置）时删除 channel。channel 只能为 cli、preview 或 null，否则报告 artifact.schema-violation。plan show、plan step 与 plan confirm 的 --json 输出的每个步骤含 channel：已确认时为记录的渠道（缺失时为 cli），未确认为 null。
      scenarios:
        confirm-records-cli:
          - GIVEN: 作品 my-novel 的 one-sentence 步已起草
          - WHEN: 运行 wa-cli plan confirm my-novel one-sentence --confirmed-by-author --confirmation 作者：就这句 --dir D --json
          - THEN: 'plan.yaml 的该步骤含 channel: cli，输出中该步骤 channel 为 cli、其他未确认步骤 channel 为 null，退出码为 0'
  MODIFIED: {}
  REMOVED: {}
