name: Publish npm

# 仓库里唯一的持续集成工作流：把 DSH 插件（DSH Plugin）`plugins/dsh-writing-viewer` 发布到 npm。
#
# 触发：任何进入 main 的提交，外加 GitHub Release 发布与手动重试。合并进 main 即发布，
# 不必等 Release 建好；同一 workflow 的全部触发共用一个并发组串行执行。已发布或已在 npm
# 暂存区的版本跳过发布；发布时撞上“暂存区已有同版本”（E409）按已发布处理，不重发。
#
# 认证走 npm Trusted Publishing（OIDC）：工作流向 GitHub 换取短期令牌，npm 侧按
# 「发布者 = GitHub Actions、用户 kw12121212、仓库 writing-anything、工作流文件名
# publish-npm.yml」校验来源。仓库里不存放任何 npm token，也没有需要轮换的长期凭据。
# Trusted Publishing 下 npm 自动生成溯源（Provenance）声明，不需要 --provenance。
#
# npm 侧配置（一次性，不在此仓库）：npmjs.com → dsh-writing-viewer → Settings →
# Trusted publishing → GitHub Actions，workflow filename 填 publish-npm.yml，并允许
# 直接 `npm publish`（默认只允许 `npm stage publish`）。新建的配置必须在 2 天内完成
# 首次成功发布才算验证通过，否则过期作废，需要删掉重建。

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC，Trusted Publishing 必需

concurrency:
  # 固定分组而不带 github.ref：push: main 与 release: published 的 ref 不同，带 ref 会分成
  # 两个并发队列，main 触发还在暂存时 release 触发会误判“未发布”并重复 publish（E409）。
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release 触发时签出标签指向的提交，push 与手动触发时签出触发的那次提交。
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0 # 需要历史与标签，用来校验发布提交来自 main 且已打对应标签

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 读取版本并判断是否需要发布
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./plugins/dsh-writing-viewer/package.json').version")
          echo "插件版本 ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # 已发布（npm view 能查到版本）或已在暂存区等待转正的版本都不再发布。
          # 暂存条目先于 dist-tags 出现，只查 npm view 会在并发窗口里误判“没发过”。
          published=false
          if npm view "dsh-writing-viewer@${version}" version >/dev/null 2>&1; then
            published=true
          fi
          staged=false
          if ! $published && npm stage list "dsh-writing-viewer@${version}" --json >/tmp/npm-staged.json 2>/dev/null; then
            if node -e '
              const fs = require("fs");
              const want = process.argv[1];
              let data;
              try { data = JSON.parse(fs.readFileSync("/tmp/npm-staged.json", "utf8")); } catch { process.exit(1); }
              process.exit(JSON.stringify(data).includes(want) ? 0 : 1);
            ' "$version"; then
              staged=true
            fi
          fi
          if $published || $staged; then
            echo "::notice::npm 上已存在或已暂存 ${version}，本次跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # 预发布版（版本号带连字符）发到 next 标签，稳定版的 latest 不被覆盖。
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 校验发布提交来自 main 且已打对应标签
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch -q origin main --tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::发布提交 $GITHUB_SHA 不在 main 上，拒绝发布"
            exit 1
          fi
          tag="v${VERSION}"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::找不到标签 ${tag}：版本号变了却没有打标签，拒绝发布"
            exit 1
          fi
          if [ "$(git rev-list -n 1 "refs/tags/${tag}")" != "$GITHUB_SHA" ]; then
            echo "::error::标签 ${tag} 不指向当前提交 $GITHUB_SHA，拒绝发布"
            exit 1
          fi
          echo "提交 $GITHUB_SHA 在 main 上，且标签 ${tag} 指向它"

      - name: 安装依赖
        if: steps.version.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile
        working-directory: plugins/dsh-writing-viewer

      - name: 回归测试
        if: steps.version.outputs.skip == 'false'
        run: pnpm test
        working-directory: plugins/dsh-writing-viewer

      - name: 发布到 npm
        id: publish
        if: steps.version.outputs.skip == 'false'
        # prepublishOnly 会先重新构建（npm run build），发布的产物由该提交的源码构建。
        # 并发窗口内另一条触发可能已经暂存同版本；E409 说明无需再发，按已发布处理而不是失败。
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          if npm publish --access public --tag "${{ steps.version.outputs.dist_tag }}" 2>&1 | tee /tmp/npm-publish.log; then
            exit 0
          fi
          if grep -q 'previously staged version' /tmp/npm-publish.log; then
            echo "::notice::${VERSION} 已在 npm 暂存区等待转正，本次按已发布处理（不重发）"
            exit 0
          fi
          exit 1
        working-directory: plugins/dsh-writing-viewer

      - name: 核对发布结果
        if: steps.version.outputs.skip == 'false'
        run: |
          set -euo pipefail
          echo "latest 版本：$(npm view dsh-writing-viewer version)"
          npm view dsh-writing-viewer dist-tags --json
          npm view dsh-writing-viewer repository.url
