schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: dsh-plugin
  title: DSH 插件（DSH Plugin）
requirements:
  panel-visible:
    strength: MUST
    statement: 插件装入 DSH web profile 后，Web GUI 必须提供该插件的面板入口，选中后加载出最小只读查看面板
    scenarios:
      gui-entry-load:
        - GIVEN: '插件已通过 link: 依赖装入本机 DSH 的 web profile'
        - WHEN: 打开 Web GUI 并从面板入口选中该插件的面板
        - THEN: 侧栏出现插件面板入口，面板完成加载并显示内容，不报错、不空白崩溃
  workspace-root-status:
    strength: MUST
    statement: 面板必须默认按 DSH 工作区根定位项目目录并显示 .writing-anything/ 工作区的存在状态；定位不到时给出空态指引而不是报错
    scenarios:
      workspace-found:
        - GIVEN: DSH 工作区根下存在 .writing-anything/ 工作区
        - WHEN: 打开插件面板
        - THEN: 面板显示定位到的项目目录与工作区存在状态
      workspace-missing:
        - GIVEN: 定位不到 .writing-anything/ 工作区
        - WHEN: 打开插件面板
        - THEN: 面板显示空态指引，提示可用 wa-cli init 创建工作区，插件不报错崩溃
  read-only-workspace:
    strength: MUST
    statement: 插件在加载、定位与展示工作区的全过程中不得创建、修改或删除 .writing-anything/ 工作区内的任何产物
    scenarios:
      no-workspace-writes:
        - GIVEN: 插件已装入 web profile，面板尚未打开，.writing-anything/ 内文件清单、内容与修改时间已记录
        - WHEN: 在 Web GUI 中打开插件面板并完成工作区定位与展示
        - THEN: .writing-anything/ 内文件的清单、内容与修改时间与打开面板前一致
  snapshot-aggregation:
    strength: MUST
    statement: 插件的 host 侧必须提供只读的工作区快照（Workspace Snapshot）服务：按定位到的项目目录聚合 .writing-anything/ 的配置、素材（Source）清单、规范包（Pack）清单、决策（含待决）与待复核摘要，以及每个作品（Work）的 work.yaml、单元（Unit）树（阶段、进度、阻塞项）与各单元目录产物全文——写作简报（Brief）、大纲（Outline）、出处（Provenance）、论断（Claim）、作者反馈（Feedback）、草稿（Draft）正文（Markdown 全文）、审稿与验收证据；长篇（novel）文体按文体存在的产物（如场景契约、伏笔台账（Foreshadowing Ledger）、时间线（Timeline）、知情表（Knowledge State））同样纳入；快照必须内嵌 wa-cli validate 的诊断作为错误态数据
    scenarios:
      multi-work-snapshot:
        - GIVEN: 一个工作区含 tech-blog 文章与 novel 作品（含卷、章、场景层级，场景带场景契约与伏笔台账条目）
        - WHEN: 通过插件的只读快照路由请求快照
        - THEN: 响应为结构化 JSON，包含两个作品各自的单元树（阶段、进度、阻塞项）、各类产物全文、素材与决策（含待决）及待复核摘要，并内嵌 validate 诊断
      novel-genre-artifacts:
        - GIVEN: novel 作品某场景单元目录下存在场景契约与伏笔台账产物
        - WHEN: 请求快照
        - THEN: 快照包含这些按文体存在的产物全文
  snapshot-fresh-read:
    strength: MUST
    statement: 每次快照请求必须重新读取工作区当前内容，不得返回跨请求的缓存数据；首版不得引入文件监听，数据刷新由 client 的手动刷新（面板刷新按钮或重新打开面板）触发
    scenarios:
      fresh-reread:
        - GIVEN: 已获得一次快照响应
        - WHEN: 修改工作区内某单元的草稿正文后再次请求快照
        - THEN: 新响应包含修改后的正文而非旧内容
  snapshot-missing-workspace:
    strength: MUST
    statement: 定位不到 .writing-anything/ 工作区时，快照路由必须返回可读的缺失状态与空态指引（提示可用 wa-cli init 创建工作区），不得以未处理错误或空白响应失败
    scenarios:
      missing-workspace-readable:
        - GIVEN: 插件定位不到任何含 .writing-anything/ 的项目目录
        - WHEN: 请求快照路由
        - THEN: 响应为正常 JSON，含可读的缺失状态与空态指引，而非服务器错误或崩溃
  snapshot-cli-degradation:
    strength: MUST
    statement: wa-cli 只读命令不可用或其 --json 输出缺少快照所需字段时，快照必须降级：返回文件可直接解析的部分数据，并在快照中明确标注降级状态与原因，不得整体失败
    scenarios:
      cli-unavailable:
        - GIVEN: 主机环境找不到可执行的 wa-cli
        - WHEN: 请求快照
        - THEN: 响应仍包含按 JSON Schema 只读解析的产物全文数据，并标注降级（degraded）与原因，不整体失败
      missing-field:
        - GIVEN: wa-cli status --json 输出缺少快照所需的部分字段
        - WHEN: 请求快照
        - THEN: 缺失部分按降级标注呈现，其余数据照常返回
  snapshot-no-writes:
    strength: MUST
    statement: 快照的生成与提供过程不得创建、修改或删除 .writing-anything/ 工作区内的任何产物（Artifact），插件自身代码不得向项目目录写入任何文件；唯一例外是快照经子进程调用的 wa-cli 只读命令按其审计日志（Audit Log）契约向 .writing-anything/audit.log 追加运维痕迹——审计日志不是产物、追加出自 wa-cli，且每次快照请求的 wa-cli 调用必须限定在有界命令集合内（status、validate、next 各一次，每个长篇（novel）作品 timeline 一次），不得轮询式反复调用
    scenarios:
      snapshot-no-writes:
        - GIVEN: 已记录 .writing-anything/ 内除 audit.log 外全部文件的清单、内容与修改时间
        - WHEN: 请求一次完整快照
        - THEN: 这些文件的清单、内容与修改时间与请求前一致；新增或发生变化的文件至多为 wa-cli 追加的 audit.log
      audit-log-bounded:
        - GIVEN: 主机环境可执行 wa-cli 且快照完整可用（未降级）
        - WHEN: 请求一次快照后读取 audit.log
        - THEN: 本次快照追加的审计行与有界命令集合一一对应（status、validate、next 各一条，每个长篇作品 timeline 一条），无多余调用
  unit-tree-navigation:
    strength: MUST
    statement: 面板必须为选中的作品提供单元（Unit）树导航：按层级缩进展示单元，汇总单元带进度标记；选中某个单元后详情区显示该单元的阶段、进度、阻塞项、下一步命令与产物清单，且不提供任何编辑、写入或确认控件
    scenarios:
      tree-hierarchy:
        - GIVEN: novel 作品含卷、章、场景三级单元
        - WHEN: 在总览中选中该作品
        - THEN: 单元树按卷、章、场景的层级缩进展示全部单元，卷与章节点显示 done/total 进度标记
      unit-detail:
        - GIVEN: 单元树已展示
        - WHEN: 选中某个场景单元
        - THEN: 详情区显示该单元的阶段、进度、阻塞项列表、下一步命令与产物清单，界面中没有编辑、写入或确认控件
  overview-empty-and-error:
    strength: MUST
    statement: 面板在空态与错误态下必须可读：定位不到 .writing-anything/ 时显示 wa-cli init 指引；工作区内没有作品时显示创建作品的指引；validate 诊断与快照降级（degraded）原因必须以列表透出；取数失败时显示原因与重试，不得空白或崩溃；面板必须提供手动刷新入口
    scenarios:
      empty-workspace:
        - GIVEN: 工作区已初始化但没有任何作品
        - WHEN: 打开插件面板
        - THEN: 面板显示没有作品的空态与创建作品的指引，不报错
      diagnostics-and-degraded:
        - GIVEN: validate 报告诊断，且快照的某个 wa-cli 区域（如 next）降级并在 degraded 中给出原因
        - WHEN: 打开插件面板
        - THEN: 面板列出诊断（严重级别、消息、路径）与降级原因，其余可用数据照常显示
      manual-refresh:
        - GIVEN: 面板已显示总览
        - WHEN: 修改工作区内某单元阶段后点击刷新
        - THEN: 总览与单元树显示修改后的阶段
  overview-dashboard:
    strength: MUST
    statement: 定位到工作区时，面板必须以总览仪表盘（Overview Dashboard）呈现：每个作品（Work）一张卡片，显示作品 id、文体（Genre）、当前生命周期（Lifecycle）阶段、汇总单元进度（done/total）、阻塞项（Blocker）数量与摘要；阻塞项数量按作品内各单元阻塞项去重计数（汇总单元重复列出的子孙阻塞项只计一次）；工作区级汇总显示素材（Source）数、待决决策数、待复核数与 validate 诊断数，提供该数的 wa-cli 区域降级时显示为不可用而不是 0；信息按写作概念组织，不平铺目录文件
    scenarios:
      work-cards:
        - GIVEN: 工作区含 tech-blog 文章 my-post 与 novel 作品 my-novel，my-novel 有阻塞项与多层级单元
        - WHEN: 打开插件面板
        - THEN: 面板为两个作品各显示一张卡片：文体与 work.yaml 一致，阶段与进度与 wa-cli status --json 对同一作品的结果一致，阻塞项数量等于该作品各单元阻塞项去重后的数量并附前两条摘要
      workspace-summary:
        - GIVEN: 工作区登记了素材、存在 status 为 open 的决策与待作者复核条目，validate 报告诊断
        - WHEN: 打开插件面板
        - THEN: 总览汇总区显示的素材数、待决决策数、待复核数与诊断数分别与素材目录、decisions.yaml、wa-cli next、wa-cli validate 的结果一致
  overview-theme-and-narrow:
    strength: MUST
    statement: 总览与单元树必须随 DSH 明暗主题切换保持可读，并在 DSH 主面板常见宽度区间内可读可操作：视口宽度低于 1024px（侧栏收为 56px 导轨）或面板宽度低于 640px 时单元树与详情改为上下堆叠
    scenarios:
      theme-switch:
        - GIVEN: 面板显示总览与单元树
        - WHEN: 在 DSH 中切换明暗主题
        - THEN: 文字、卡片边框与状态色随主题切换，文字与背景保持可读对比
      narrow-stack:
        - GIVEN: 浏览器窗口宽度低于 1024px，DSH 侧栏收为导轨
        - WHEN: 在面板中选中作品查看单元树
        - THEN: 单元树与详情上下堆叠展示，内容不被截断且可点击选中单元
  panel-path-switch:
    strength: MUST
    statement: 面板必须允许作者切换到显式输入的项目目录绝对路径查看其工作区，并可恢复默认定位；所选路径只作用于面板本次查看，优先于插件配置的固定目录；路径不是绝对路径、是网络或设备路径，或其下没有 .writing-anything/ 时，面板必须显示空态与可读原因，不得静默改显示其他项目；切换或刷新进行中面板必须给出可见提示，较早请求的响应不得覆盖较新的选择；切换后插件仍只读取所选目录的 .writing-anything/，且除 wa-cli 追加的 audit.log 外不改变其中任何文件
    scenarios:
      switch-to-path:
        - GIVEN: DSH 默认定位到项目 A，本机另有含 .writing-anything/ 的项目 B
        - WHEN: 在面板输入项目 B 的绝对路径并切换
        - THEN: 面板显示项目 B 的总览，工具栏标明当前路径为项目 B、来源为面板输入；项目 B 的 .writing-anything/ 除 audit.log 外文件清单、内容与修改时间不变
      restore-default:
        - GIVEN: 面板正在查看手动切换的项目 B
        - WHEN: 选择恢复默认
        - THEN: 面板回到按默认定位顺序找到的项目 A
      invalid-path:
        - GIVEN: 作者输入相对路径、网络路径（如 //server/share），或一个没有 .writing-anything/ 的目录绝对路径
        - WHEN: 切换
        - THEN: 面板显示空态与说明原因（路径须为绝对路径 / 不能是网络或设备路径 / 该目录下没有工作区，可用 wa-cli init 创建），不显示其他项目的数据
      default-unchanged:
        - GIVEN: 作者没有在面板中切换路径
        - WHEN: 打开插件面板
        - THEN: 面板按配置固定、DSH 工作区注册表、宿主进程目录的既有顺序定位工作区
      superseded-request:
        - GIVEN: 作者切换到项目 B 后、B 的快照返回之前又选择恢复默认
        - WHEN: B 的快照晚于默认项目的快照返回
        - THEN: 面板保持显示默认项目，迟到的 B 响应被丢弃
  artifact-semantic-view:
    strength: MUST
    statement: 面板必须为选中单元（Unit）产物清单中的每个 YAML 产物（Artifact）提供语义卡片视图（Semantic Card View）：按产物的 Schema 字段组织成卡片而非平铺文件——写作简报（Brief）展示受众、目的、前提、核心观点等字段，大纲（Outline）展示层级结构与核心观点覆盖，论断（Claim）展示论断与素材（Source）关联；其余产物（出处（Provenance）、作者反馈（Feedback）、审稿、验收、规划（Plan）等）按字段通用卡片化；整个产物视图不得出现任何编辑、写入或确认控件
    scenarios:
      brief-cards:
        - GIVEN: 某单元目录存在内容完整的 brief.yaml
        - WHEN: 在该单元详情中打开 brief 产物视图
        - THEN: 语义卡片视图按受众、目的、核心观点等 Schema 字段组织展示，字段值与产物原文一致，视图中没有任何编辑、写入或确认控件
      outline-cards:
        - GIVEN: 某单元目录存在多层级 outline.yaml
        - WHEN: 打开 outline 产物视图
        - THEN: 语义卡片视图按层级结构展示大纲与核心观点覆盖，内容与产物原文一致
      claims-cards:
        - GIVEN: 某单元目录存在关联素材引用的 claims.yaml
        - WHEN: 打开 claims 产物视图
        - THEN: 语义卡片视图逐条展示论断及其关联的素材引用，内容与产物原文一致
      generic-artifact-cards:
        - GIVEN: 某单元目录存在无定制布局的产物（如 review.yaml 或 acceptance.yaml）
        - WHEN: 打开该产物视图
        - THEN: 语义卡片视图按该产物的 Schema 字段通用卡片化展示，不因缺少定制布局而空白或报错
  yaml-source-highlight-view:
    strength: MUST
    statement: 每个 YAML 产物必须可在语义卡片视图（Semantic Card View）与源码高亮视图（Source Highlight View）之间一键切换，切换后保持滚动位置；源码高亮视图必须对键、标量、数组/映射结构、注释、锚点与别名着色；高亮实现打包进客户端 bundle、渲染过程不得发起网络请求；大型 YAML（长篇产物）源码必须按顶层键折叠渲染；产物 YAML 解析失败时必须降级为源码高亮视图并显示解析错误提示，不得空白或崩溃
    scenarios:
      toggle-preserves-scroll:
        - GIVEN: 已打开一个较长 YAML 产物的语义卡片视图并滚动到中部
        - WHEN: 一键切换到源码高亮视图再切换回来
        - THEN: 两种视图分别按语义与源码呈现同一产物，切换前后滚动位置保持，不重新跳回顶部
      highlight-coverage:
        - GIVEN: 某产物 YAML 含键、字符串与数字标量、数组与映射结构、注释、锚点与别名
        - WHEN: 打开其源码高亮视图
        - THEN: 键、标量、结构、注释、锚点与别名分别着色，文本内容与产物原文逐字一致不丢失
      offline-highlight:
        - GIVEN: 浏览器断开网络（或屏蔽所有外部请求）
        - WHEN: 打开产物视图并切换源码高亮
        - THEN: 高亮与渲染正常完成，没有任何对外网络请求
      large-yaml-fold:
        - GIVEN: 长篇（novel）作品某产物 YAML 顶层键数量多、总体积大
        - WHEN: 打开其源码高亮视图
        - THEN: 源码按顶层键折叠呈现，展开后内容完整，面板不因一次性渲染全部行而卡死
      malformed-yaml-fallback:
        - GIVEN: 某单元目录的产物 YAML 语法损坏无法解析
        - WHEN: 打开该产物视图
        - THEN: 面板显示源码高亮视图与可读的解析错误提示，不空白、不崩溃
  draft-markdown-views:
    strength: MUST
    statement: 草稿（Draft）正文（Markdown）必须提供两种可一键切换的视图：渲染阅读视图（标题、列表、代码块、引用、表格）与源码高亮视图（Source Highlight View），切换保持滚动位置；渲染与高亮打包进客户端 bundle、渲染过程不得发起网络请求，渲染结果不得执行正文中的任何 HTML 或脚本
    scenarios:
      rendered-reading:
        - GIVEN: 某单元 draft 正文 Markdown 含标题、列表、代码块、引用与表格
        - WHEN: 打开该正文视图
        - THEN: 渲染阅读视图按对应元素呈现，正文中的 HTML 片段被转义显示而不是执行
      draft-toggle:
        - GIVEN: 已打开正文渲染阅读视图并滚动到中部
        - WHEN: 切换到源码高亮视图再切换回来
        - THEN: Markdown 源码着色呈现，切换前后滚动位置保持
  sources-view-claims-navigation:
    strength: MUST
    statement: 面板必须提供素材（Source）清单视图：列出工作区全部素材，每个素材条目展示其 source.yaml 语义卡片与原文 Markdown 的阅读视图（可切换源码高亮视图（Source Highlight View））；论断（Claim）语义卡片中的素材引用必须可点击并跳转到对应素材条目；素材视图同样不得出现任何编辑、写入或确认控件
    scenarios:
      claims-source-jump:
        - GIVEN: claims 语义卡片中某论断关联素材引用 s-01，工作区存在素材 s-01
        - WHEN: 点击该素材引用
        - THEN: 面板跳转到素材清单中 s-01 的条目并展示其 source.yaml 卡片与原文，视图中没有任何编辑、写入或确认控件
      sources-list:
        - GIVEN: 工作区登记了多个素材（各含 source.yaml 与 original.md）
        - WHEN: 打开素材清单视图
        - THEN: 全部素材逐条列出，每条可查看 source.yaml 语义卡片与原文阅读视图
