schema: strict-spec-driven/delta-tech/v1
schema_version: 1
artifact_type: delta_tech
schema_file: templates/strict-spec-driven/schemas/delta-tech.yaml
target_standard: dsh-plugin-structure
operations:
  ADDED:
    opt-in-setup-actions:
      strength: MUST
      statement: DSH 插件的安装类能力（下载可执行文件、注册技能、修改宿主环境）必须整体置于默认关闭的配置开关之后：开关未开启时不得注册相应路由、不得注入相应宿主服务、不得修改 process.env、不得发起网络请求。下载只由面板显式动作触发，且只允许从本项目发布地址下载固定命名的发布产物（Release Asset，<name>-<os>-<arch> 与 SHA256SUMS），必须先按 SHA256SUMS 记录校验再原子落盘（临时文件加 rename、chmod 755），下载与校验失败不得留下部分文件；下载体积必须有界。spawn wa-cli skills install 物化技能时 cwd 必须是不含 .writing-anything 的目录（临时目录），使启用全程不向任何工作区写审计行；每次宿主启动至多物化一次、每次显式动作至多一次，不得轮询
      rationale: 下载可执行文件与修改宿主环境是插件最高风险的动作，必须默认关闭、显式触发、来源与校验固定；.writing-anything/ 的只读承诺（含 audit.log 例外边界）由 cwd 选择保证
      enforcement:
        method: test
        detail: 单测以注入式 fetch、文件与 spawn 适配器驱动：校验失败断言无落盘、开关关闭断言无路由注册与网络调用、物化断言 spawn 的 cwd 与 target 均在临时目录
    dsh-skill-provider-registration:
      strength: MUST
      statement: DSH 插件向宿主注册内置技能必须走宿主技能注册表的技能提供者（Skill Provider）接口（ctx.skills 的 registerProvider），并遵守其异步契约：list 与 get 必须返回 Promise——每个真实消费方都带 AbortSignal 调用，注册表会对返回值直接调 .then，同步返回会使整个 provider 被静默跳过；候选须含回传 get 的不透明 locator 字段，get 对不可用候选 resolve undefined。候选 rank 必须低于宿主文件系统技能源的全部层级（project 与 user 目录源），使同名时内置优先；不得通过写入用户级或项目级技能目录实现注册或优先；注册的资源基址（resourceBase）省略时技能正文不得引用相对路径资源。假件测试必须按真实调用形态（带 AbortSignal、要求 thenable）驱动 provider，并另以真实注册表包做取证
      rationale: 作者要求内置优先且不改动用户/项目技能目录；rank 机制是宿主提供的同名优先杠杆（文件系统源最低 100，provider 可声明更低值）；wa-* 技能是 CLI 薄封装、无相对资源引用。异步契约与 locator 是评审实证的硬要求：同步实现会被注册表整体跳过而插件自身状态毫无异常
      enforcement:
        method: test
        detail: 单测以注入式假 skills 服务按 waitWithAbort 语义（带 AbortSignal、要求 thenable）驱动 registerProvider 的候选与 rank，断言低于 100、含 locator 且不落盘任何技能目录；另以真实 @deepseek-ai/dsh-skill SkillRegistry 的取证脚本验证带 signal 的 list/get 全链路（证据记 docs/evidence）
    host-env-path-prepend:
      strength: SHOULD
      statement: DSH 插件需要让宿主 shell 优先解析自带 CLI 时，应把二进制目录幂等前置到 process.env.PATH（同一目录不重复插入，仅开关开启后），并在 README 写明该宿主全局副作用的生效边界：只影响本宿主进程后续派生的子进程，不改变用户 shell 配置
      rationale: 宿主子进程环境以宿主 process.env 为基底（过滤敏感键与 DSH_ 前缀），PATH 前置是插件可用的唯一宿主级解析杠杆；幂等与边界说明防止重复叠加与误解
      enforcement:
        method: review
    plugin-write-surface-declaration:
      strength: SHOULD
      statement: DSH 插件新增可选写入能力时，应把全部写入型 node:fs 调用收拢到该能力专用的独立模块（含其真实适配器），并在包内静态只读扫描测试中以显式名单声明这些模块：名单外模块出现任何写入型调用即测试失败，名单内文件名必须存在（防止改名后静默扩大豁免）。查看路径（快照、路由读取）保持零写入调用，不因新能力放宽
      rationale: plugin-builtin-setup 引入可选 setup 写入时采用的结构：写入面集中在一处并由静态测试钉住名单，viewer 路径的只读保证不被稀释，豁免也不会随改名漂移
      enforcement:
        method: test
        detail: 见 plugins/dsh-writing-viewer/src/readonly.test.ts 的 SETUP_WRITE_MODULES 与存在性检查；setupfs.ts 是唯一持有写入型 node:fs 调用的适配器模块
  MODIFIED: {}
  REMOVED: {}
