  id: lesson-234cd1
  title: 安装到第三方工具的目录前，要按其官方文档核对目录约定
category: coding
status: active
created_at: '2026-10-01T03:21:50.270Z'
updated_at: '2026-10-01T03:21:50.270Z'
context: agent-skills-package 的 skills install --agent codex 起初写入 .codex/skills。
observation: fresh-context 审查依据 OpenAI 官方文档指出 Codex 在仓库中扫描 .agents/skills，.codex/skills 不在发现位置之列：安装成功但 Codex 发现不了技能，完成标准形同未达成。
takeaway: 为第三方工具写入配置或技能前，以其官方文档为准确认发现路径，并在 design 中写明出处；测试断言写入的具体路径，路径改动时随文档同步。
applies_when: 命令把文件安装到其他工具（Agent、编辑器、包管理器）会读取的目录时
