schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: review
operations:
  ADDED: {}
  MODIFIED:
    accept-gate:
      strength: MUST
      statement: 'wa-cli accept <unit> 必须按工作区配置的关卡强度（Gate Level）检查验收的阻塞项，有阻塞项时为每项给出一条 error 级诊断、不写任何文件、退出码为 1。所有关卡强度下的阻塞项：本单元文本检查未被豁免的 error 级发现项（accept.lint-errors，path 为 draft.md，next 包含 wa-cli lint <unit> --dir <dir> --json）、使文本检查无法完成的 error 级问题（保留其错误码）、关联该单元的 open 阻塞决策（decision.blocking，next 包含 wa-cli decisions --dir <dir> --json），决策队列无法加载（decision.invalid-queue，message 说明决策队列无法加载），以及写后收口（Close-out）阻塞项——单元为场景且其大纲任一节声明了非空的 state_changes、plants、recovers 或 events（契约要求收口的场景）时：单元目录下没有 closeout.yaml 报告 closeout.missing（path 为单元目录，next 包含 wa-cli scene close-out <unit> --dir <dir> --json 与 wa-cli help scene close-out --json）；closeout.yaml 不通过校验或途经符号链接时报告 closeout.invalid（保留其诊断，next 同上）；closeout.yaml 的 draft_sha256 与当前正文 draft.md 不同报告 closeout.stale（path 为 closeout.yaml，next 同上）；closeout.yaml 记录的 state 与 knowledge 提议仍有 status 为 proposed 的条目报告 closeout.pending-proposals（next 另含 wa-cli state list <work> --dir <dir> --json 与 wa-cli knowledge list <work> --dir <dir> --json）；按当前契约与台账复查收口的契约对照失败时报告 closeout.missing-state-change、closeout.missing-recovery、closeout.missing-plant 或 closeout.missing-event（path 为 closeout.yaml，next 同上）。场景大纲没有声明上述契约字段且单元目录下没有 closeout.yaml 时不做任何收口检查。standard 与 strict 另有：没有 review.yaml（accept.review-missing）、review.yaml 不通过校验（保留其诊断）、审稿的 draft_sha256 与当前正文不同（accept.review-stale）、单元的评分项（见 review-record）没有结论（review.missing-verdict），每个 status 为 open 的审稿发现项（accept.open-finding，next 包含 wa-cli help review resolve --json）与每条未处理的作者反馈（accept.open-feedback，next 包含 wa-cli feedback list <unit> --dir <dir> --json）。strict 另有：单元的评分项（来自文体、规范包或选用的写作法）声明 blocking: true 且审稿结论为 fail（accept.blocking-rubric），以及没有给出 --confirmed-by-author 与 --confirmation（accept.unconfirmed，next 包含 wa-cli help accept --json）。审稿结论为 fail 在 fast、standard 下以及未声明 blocking 的评分项上都不阻塞。每条阻塞项诊断的 next 都包含能复查它的 wa-cli review show <unit> --dir <dir> --json。'
      scenarios:
        closeout-missing-all-gates:
          - GIVEN: novel 作品 my-novel 的场景 s1 处于审稿阶段，其大纲节声明 state_changes 与 events，正文与审稿齐备，没有 closeout.yaml，gate_level 为 fast
          - WHEN: 运行 wa-cli accept my-novel/s1 --dir D --json
          - THEN: diagnostics 中有一条错误码为 closeout.missing、next 含 wa-cli scene close-out my-novel/s1 的诊断，没有写出 acceptance.yaml，退出码为 1
        closeout-pending-proposals:
          - GIVEN: 场景 s1 已收口（closeout.yaml 合法且不过期），其记录的 state 提议 state-3 与知情提议 know-2 均为 proposed，gate_level 为 standard，其余阻塞项均无
          - WHEN: 运行 wa-cli accept my-novel/s1 --dir D --json
          - THEN: diagnostics 中有一条错误码为 closeout.pending-proposals 的诊断，退出码为 1；运行 wa-cli state confirm 与 wa-cli knowledge confirm 处理全部提议后再次 accept，验收成功，退出码为 0
        closeout-stale-after-edit:
          - GIVEN: 场景 s1 已收口并满足其他验收条件，之后作者直接编辑了正文 draft.md
          - WHEN: 运行 wa-cli accept my-novel/s1 --dir D --json
          - THEN: diagnostics 中有一条错误码为 closeout.stale、path 为 closeout.yaml 的诊断，退出码为 1
        closeout-contract-extended:
          - GIVEN: 场景 s1 已收口，之后作者以 wa-cli scene contract 为其大纲新增一条 state_changes 的 sc-2，台账中没有对应提交
          - WHEN: 运行 wa-cli accept my-novel/s1 --dir D --json
          - THEN: diagnostics 中有一条错误码为 closeout.missing-state-change、message 含 sc-2 的诊断，退出码为 1
        no-contract-closeout-unchanged:
          - GIVEN: short-story 作品 my-story 的场景 s1 大纲只声明 characters、beats 与 reveal（无 state_changes、plants、recovers、events），没有 closeout.yaml，其余验收条件满足
          - WHEN: 运行 wa-cli accept my-story/s1 --dir D --json
          - THEN: 没有 closeout 相关诊断，验收行为与引入写后收口前一致，退出码为 0
  REMOVED: {}
