schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: volume
operations:
  ADDED:
    checkpoint-on-accept:
      strength: MUST
      statement: wa-cli accept <unit>（及阅读页确认渠道的验收）对 scene 单元验收成功、写入 acceptance.yaml 后，若该场景有部单元祖先（卷，见 checkpoint-artifact）且是该部子树按单元树先序的最后一个场景，必须按 checkpoint-commands 的同一逻辑自动生成该部的卷末检查点（Volume Checkpoint）：把刚验收的场景视为已完成，本部其他场景须 stage 为 done；生成的 checkpoint.yaml 的 confirmed_by_author 为 false（只写汇总、不代作者确认，确认仍经 wa-cli volume confirm 或阅读页），写出时 changedPaths 在 acceptance.yaml 之后追加该 checkpoint.yaml；已有检查点的 scene 与指纹都与当前一致时不写文件、不列出。本部其他场景尚未 done 时不生成检查点，验收照常成功，并给出一条 warning 级 volume.scenes-open（path 为该部应有的 checkpoint.yaml，message 列出未完成场景，next 含 wa-cli volume checkpoint <part> --dir <dir> --json）；生成遇到其他问题时同样不撤销验收，以 warning 级诊断报告。不是部最后一个场景的验收、没有部单元祖先的单元与验收被阻塞时都不生成检查点。手动 wa-cli volume checkpoint 保留用于重新生成。
      scenarios:
        auto-generate:
          - GIVEN: novel 作品 my-novel 的 part-one 只有 scene-1（stage 为 review，审稿与收口齐备），gate_level 为 strict
          - WHEN: 运行 wa-cli accept my-novel/scene-1 --confirmed-by-author --confirmation 作者：可以 --dir D --json
          - THEN: 退出码为 0；part-one 单元目录下出现 checkpoint.yaml，confirmed_by_author 为 false；changedPaths 依次为 scene-1 的 acceptance.yaml 与 part-one 的 checkpoint.yaml
        others-open:
          - GIVEN: part-one 下 scene-1 还在 draft 阶段，scene-2（先序最后）处于审稿阶段且验收条件满足
          - WHEN: 运行 wa-cli accept my-novel/scene-2 --dir D --json（gate_level 为 fast）
          - THEN: 验收成功、退出码为 0；没有生成 checkpoint.yaml；diagnostics 中有一条 severity 为 warning、错误码为 volume.scenes-open 的诊断，message 含 my-novel/scene-1
        not-last-scene:
          - GIVEN: part-one 下有 scene-1 与 scene-2，scene-1 处于审稿阶段
          - WHEN: 运行 wa-cli accept my-novel/scene-1 --dir D --json
          - THEN: changedPaths 只含 scene-1 的 acceptance.yaml，没有生成 checkpoint.yaml
  MODIFIED:
    volume-accept-gate:
      strength: MUST
      statement: wa-cli accept <unit> 对 scene 单元必须检查更早各部的卷末检查点：按单元树先序早于该单元、子树含至少一个场景的每个部单元（不含该单元所属的部）——目录下没有 checkpoint.yaml 时报告 volume.missing（path 为该部应有的 checkpoint.yaml，message 含部单元引用，next 含 wa-cli volume checkpoint <part> --dir <dir> --json、wa-cli help volume checkpoint --json 与 wa-cli review show <unit> --dir <dir> --json）；存在 checkpoint.yaml 而 confirmed_by_author 不为 true 时报告 volume.unconfirmed（path 为该 checkpoint.yaml，message 含部单元引用，next 含 wa-cli volume confirm <part> --dir <dir> --json 与 wa-cli review show <unit> --dir <dir> --json）；checkpoint.yaml 不通过校验或途经符号链接时报告 volume.invalid（保留其诊断，path 为该 checkpoint.yaml，message 提示修复或删除后重新生成，next 含 wa-cli validate <path> --dir <dir> --json 与 wa-cli help volume checkpoint --json，不含 volume confirm）。strict 关卡强度下这三者为 error 级并阻塞验收；fast 与 standard 关卡强度下以 warning 级同名诊断提示，不阻塞。wa-cli review show 的 gate.blockers 同样列出 strict 下的这些阻塞项。该单元所属部的检查点不阻塞本部场景的验收；子树没有任何场景的部不参与检查。
      scenarios:
        strict-blocks-next-part:
          - GIVEN: gate_level 为 strict，part-one 已生成 checkpoint.yaml 但未经确认，part-two 的 scene-9 处于审稿阶段且其余验收条件满足
          - WHEN: 运行 wa-cli accept my-novel/scene-9 --confirmed-by-author --confirmation 作者：可以 --dir D --json
          - THEN: diagnostics 中有一条错误码为 volume.unconfirmed、path 为 part-one 的 checkpoint.yaml 的诊断，没有写出 acceptance.yaml，退出码为 1
        strict-blocks-missing:
          - GIVEN: gate_level 为 strict，part-one 的场景都已 done 但没有 checkpoint.yaml，part-two 的 scene-9 处于审稿阶段且其余验收条件满足
          - WHEN: 运行 wa-cli accept my-novel/scene-9 --confirmed-by-author --confirmation 作者：可以 --dir D --json
          - THEN: diagnostics 中有一条错误码为 volume.missing、path 为 part-one 应有的 checkpoint.yaml 的诊断，其 next 含 wa-cli volume checkpoint my-novel/part-one --dir D --json；没有写出 acceptance.yaml，退出码为 1
        strict-passes-after-confirm:
          - GIVEN: 同 strict-blocks-next-part，但 part-one 的检查点已经 wa-cli volume confirm 确认
          - WHEN: 运行 wa-cli accept my-novel/scene-9 --confirmed-by-author --confirmation 作者：可以 --dir D --json
          - THEN: 没有 volume.unconfirmed 与 volume.missing 诊断，验收成功，退出码为 0
        fast-warns-only:
          - GIVEN: 同 strict-blocks-next-part，但 gate_level 为 fast
          - WHEN: 运行 wa-cli accept my-novel/scene-9 --dir D --json
          - THEN: diagnostics 中有一条 severity 为 warning、错误码为 volume.unconfirmed 的诊断，验收成功，退出码为 0
        standard-missing-warns:
          - GIVEN: 同 strict-blocks-missing，但 gate_level 为 standard
          - WHEN: 运行 wa-cli accept my-novel/scene-9 --dir D --json
          - THEN: diagnostics 中有一条 severity 为 warning、错误码为 volume.missing 的诊断，验收成功，退出码为 0
        same-part-not-blocked:
          - GIVEN: gate_level 为 strict，scene-2 与 scene-1 同属 part-one，part-one 已有未确认的 checkpoint.yaml
          - WHEN: 运行 wa-cli accept my-novel/scene-2 --confirmed-by-author --confirmation 作者：可以 --dir D --json
          - THEN: 没有 volume.unconfirmed 诊断（本部检查点不阻塞本部场景），退出码为 0
        empty-part-exempt:
          - GIVEN: gate_level 为 strict，part-one 下没有任何场景，part-two 的 scene-9 处于审稿阶段且其余验收条件满足
          - WHEN: 运行 wa-cli accept my-novel/scene-9 --confirmed-by-author --confirmation 作者：可以 --dir D --json
          - THEN: 没有 volume.missing 诊断，验收成功，退出码为 0
  REMOVED: {}
