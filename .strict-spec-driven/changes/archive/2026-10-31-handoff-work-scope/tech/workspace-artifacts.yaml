schema: strict-spec-driven/delta-tech/v1
schema_version: 1
artifact_type: delta_tech
schema_file: templates/strict-spec-driven/schemas/delta-tech.yaml
target_standard: workspace-artifacts
operations:
  ADDED:
    optional-work-association:
      strength: MUST
      statement: 工作区级产物（如交接记录（Handoff Note））为条目新增可选的作品（Work）关联字段时：Schema 中该字段可选、只约束作品 id 形态、不升级 schema_version；写入命令接受单元引用（Unit Reference，作品或其任一单元）并归到所属作品，引用或输入中的作品不存在时报错，不得写出关联到不存在作品的记录（否则该记录在任何作品的过滤下都不可见）；既有无该字段的记录必须保持原有可见性（对所有作品可见）；按作品消费（如 wa-cli next 逐步骤附带）时取「关联该作品的最近记录」与「未关联的最近记录」中较新的一条，且每条命令只加载一次该产物再逐作品过滤，不在逐单元循环中重复读取；同一产物的只读入口（如 handoff show --unit）与 next 采用同一过滤口径。
      rationale: 可选关联是向后兼容地给工作区级产物加作用域的唯一途径：升级 schema_version 会让所有既有工作区不合法，而缺省的存在性校验会让拼错的作品 id 写出永远不可见的记录（静默失败）；「未关联对所有作品可见、关联只对本作品可见、取较新者」让旧记录无需迁移即保持行为；逐作品过滤若在逐单元循环中重新加载文件，既违反 load-once-per-command 又可能读到不同版本；两个入口口径分叉会让同一记录在一处可见、另一处不可见。
      enforcement:
        method: test
        detail: internal/handoff 的测试覆盖 work 缺省不写键、按作品过滤含未关联记录、关联与未关联中取较新者；internal/cli 的测试覆盖两个作品各写一条关联记录后 next 互不串入、只有未关联记录时行为与之前一致、--unit 指向不存在的单元或作品时报错且文件未变、handoff show --unit 与 next 同口径；代码审查确认 runNext 每条命令只加载一次交接记录。
      examples:
        good:
          - handoff write --unit w1/s1 把记录归到作品 w1；旧 handoffs.yaml 中无 work 字段的记录在 next 与 handoff show --unit w1 中都可见
        bad:
          - handoff write 接受任意字符串作为 work 写入而不校验作品存在；next 对每个单元重新读取并校验 handoffs.yaml
  MODIFIED: {}
  REMOVED: {}
