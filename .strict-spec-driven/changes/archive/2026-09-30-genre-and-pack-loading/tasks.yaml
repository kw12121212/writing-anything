schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: genre-and-pack-loading
sections:
  Implementation:
    schemas:
      text: 在 internal/schema 新增 genre.schema.json 与 pack.schema.json 并登记产物类型（pack 按 .writing-anything/packs/*.yaml 识别，genre 不匹配工作区路径）；config.schema.json 新增可选的 rules 与 waivers 字段，形状与规范包相同
      status: complete
    executable-content:
      text: 实现可执行内容检查：在 YAML 节点树上拒绝核心 Schema 以外的标签，以及任意深度上名为 script、scripts、command、commands、exec、shell、hook、hooks、plugin、plugins、run、eval 的字段，报告 artifact.executable-content 并给出行号
      status: complete
    catalog:
      text: 新增 internal/catalog：embed 内置文体与规范包，按 id 查找内置与工作区规范包（文件名等于 id、不与内置同名），登记已知规则类型，检查 id 重复、children 引用与未知规则类型，只返回结构化问题
      status: complete
    builtin-data:
      text: 编写内置 default 规范包与 minimal 文体的数据文件，确保通过各自的 Schema 与 catalog 校验
      status: complete
    resolve:
      text: 新增 internal/resolve：按 文体 → packs 顺序的规范包 → 项目配置 逐层合并规则、豁免、术语表、禁用词、文风与评分标准，逐项记录 source（genre:<id>、pack:<id>、project），报告 rule.missing-type、rule.type-conflict、rule.unknown-waiver-target、config.unknown-genre、config.unknown-pack
      status: complete
    default-pack-activation:
      text: 实现 default 规范包的启用方式：packs 为空时隐式应用 default，packs 非空时只应用列出的规范包
      status: complete
    config-resolved-command:
      text: 在 internal/cli 注册表新增 config resolved 命令：共享 --dir，输出键 resolved，登记退出码与 sampleArgs，诊断的 next 为可直接运行的命令；不加 --json 时输出人读摘要
      status: complete
    validate-integration:
      text: 扩展 wa-cli validate：整体校验时校验 .writing-anything/packs/*.yaml、检查 default_genre 与 packs 引用及合并问题并把规范包路径计入 checked；validate <path> 支持单个规范包文件；把已有测试中不存在的 tech-blog 文体改为 minimal
      status: complete
    glossary:
      text: 在 docs/GLOSSARY.md 加入本变更引入的术语：禁用词（Banned Term）、规则类型（Rule Type）、配置层（Config Layer）、解析后配置（Resolved Config）、内置（Built-in）、可执行内容（Executable Content）等尚未收录的词
      status: complete
  Testing:
    unit-tests:
      text: 为 schema、catalog、resolve 与 cli 编写单元测试与 testdata/ 夹具：合法与非法的文体和规范包、含可执行内容与未知规则类型的规范包、规则合并与来源、豁免、引用不存在的文体或规范包、config resolved 与 validate 的 --json 输出；断言使用规格中的字面量
      status: complete
      command: go test ./internal/...
    full-regression:
      text: 运行完整回归命令，覆盖率不低于 80%
      status: complete
      command: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out
  Verification:
    spec-alignment:
      text: 对照 workspace 与 genres-and-packs delta spec 的每个场景确认实现与测试覆盖，并按实际实现修正 delta spec 与 delta tech
      status: complete
    strict-ready:
      text: 运行 strict-spec-cli ready 与 strict-spec-cli verify，确认变更产物有效
      status: complete
      command: strict-spec-cli ready genre-and-pack-loading && strict-spec-cli verify genre-and-pack-loading
    archive-readiness:
      text: 确认 delta spec 与 delta tech 能合并进 workspace 主规格、新建的 genres-and-packs 主规格与 workspace-artifacts 技术标准，归档后路线图中的 genre-and-pack-loading 标记为完成
      status: complete
testing_gates:
  validation_task: full-regression
  unit_test_task: unit-tests
