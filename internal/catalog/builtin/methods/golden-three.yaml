# 黄金三章（Golden Three Chapters）：网文开篇的结构模板——前三章必须完成的钩子、主角亮相、核心冲突与金手指揭示。
# 选用在覆盖开头三章的单元（根单元或包含开头三章的部），大纲节以 role 承担各节拍，节拍位置按该单元正文的字数比例核对。
schema_version: 1
id: golden-three
title: 黄金三章
description: 网文开篇模板：第一章以钩子留住读者，第二章完成主角亮相，第三章揭示核心冲突与金手指，前三章立住故事的主线与卖点。
kind: structure
beats:
  - id: hook
    title: 钩子
    description: 第一章开场即抛出悬念或危机，让读者在第一屏之内产生「接下来会怎样」的期待。
    position: {min: 0, max: 0.34}
    tension: 6
  - id: protagonist
    title: 主角亮相
    description: 主角的处境、欲望与短板集中亮相，读者能说出他是谁、想要什么、为什么在意。
    position: {min: 0.3, max: 0.67}
    tension: 4
  - id: core-conflict
    title: 核心冲突与金手指
    description: 核心冲突全面摆上台面，主角的金手指（独特优势）揭示，主线目标与对立面同时成立。
    position: {min: 0.6, max: 1}
    tension: 8
