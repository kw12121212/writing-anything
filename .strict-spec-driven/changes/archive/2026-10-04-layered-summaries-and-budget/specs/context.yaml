schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: context
operations:
  ADDED: {}
  MODIFIED:
    scene-context:
      strength: MUST
      statement: wa-cli context 对单元类型为 scene 的单元必须在上下文包（Context Pack）中额外输出场景级内容，其余内容与裁剪行为不变；对其他单元这九个字段为空值（characters、priorScenes、knowledge、readerOnly、reveal、threads、states、priorEndings 与 summaries 为空数组），不输出场景级诊断。characters 为出场人物的当前设定：按场景自身 outline.yaml 各大纲节 characters 声明的顺序去重后，取作品 canon.yaml 中 name 与之相同的 character 条目（同名的按 canon 条目顺序），每项含 id、name、text 与 protection；声明的人物没有同名 character 条目时逐个给出 severity 为 warning 的诊断 context.character-not-in-canon（message 含该人物名，next 含 wa-cli help canon add --json 与 wa-cli canon list <work> --dir <dir> --json），作品没有 canon.yaml 时对应项缺失但不报告；canon.yaml 存在但不通过校验时报告其诊断，context 为 null，退出码为 1（同 context-command 对写作简报与大纲等产物的处理）。priorScenes 为前序场景摘要（Prior Scene Summary）：父单元 units 中排在本单元之前、单元类型为 scene 且单元目录下有 summary.yaml 的兄弟单元，按 units 顺序，每项含 unit、text 与 stale；summary.yaml 无法读取或不合法时以 warning 报告其诊断并跳过该摘要；前序场景没有 summary.yaml 时给出 severity 为 warning 的诊断 context.summary-missing（next 含 wa-cli help summary set --json）。reveal 为揭示边界（Reveal Boundary）：场景自身 outline.yaml 各节 reveal 的取值，按节顺序，每项含 section（节 id）与 text；场景没有 outline.yaml 或各节都没有 reveal 时为空数组。threads 为未回收伏笔（Open Foreshadowing）：作品根单元目录 threads.yaml（伏笔台账，见 threads 主规格）中 status 为 open 且与本场景契约相关的条目——planted_in 为本场景、planned_recover 为本场景，或本场景大纲节 recovers 引用该条目——按 planted_in 的单元树先序排序（同 threads 主规格 threads-commands），每项含 id、text、planted_in、planned_recover 与 overdue（语义同 threads 主规格）；作品没有 threads.yaml 时 threads 为空数组且不报告；threads.yaml 存在但不通过校验时报告其诊断，context 为 null，退出码为 1（同 canon.yaml 的处理）。knowledge 为视角人物（POV）已知的条目：视角人物取场景自身 outline.yaml 中第一个声明 pov 的大纲节的 pov（非空文本），解析为作品 canon.yaml 中 name 与该 pov 相同的第一个 character 条目；按 knowledge 主规格 knowledge-at 的语义重放该视角人物的适用事件（status 为 confirmed、character 为该条目 id、scene 按先序严格早于本场景，同一 entry 取最早事件），每项含 entry、name、text（设定集条目的 text）、event 与 scene，按 entry 升序。readerOnly 为读者已知、视角人物未知的条目：按同样语义重放 character 为 reader 的适用事件得到的条目（字段同 knowledge），去掉 knowledge 已含的 entry，按 entry 升序，与揭示边界配合供营造悬念使用。states 为出场人物的状态快照（State Snapshot）：契约出场人物（characters 顺序去重解析的条目，加上解析成功的视角人物条目，重复取首个）按 state 主规格 state at 本场景的语义重放（status 为 confirmed 且 scene 按先序严格早于本场景，每条目取最后生效者），每项含 entry、name（canon 条目的 name，未设置为 null）、state、proposal 与 scene，按 entry 升序；作品没有 state.yaml 时 states 为空数组且不报告；state.yaml 存在但不通过校验时报告其诊断，context 为 null，退出码为 1（同 threads.yaml 的处理）。priorEndings 为前序场景结尾（Prior Ending）：同作品中按单元树先序早于本场景、类型为 scene 且有 draft.md 的最近两个场景，最近的在前，每项含 unit 与 excerpt（其 draft.md 去掉 HTML 注释（包括作者批注）后的正文末尾至多 400 个 Unicode 码点，换行换成空格；draft.md 途经符号链接时跳过该场景）；没有任何前序场景有 draft.md 时为空数组且不报告。summaries 为分层摘要（Layered Summary）：本场景所属的章（chapter 类型祖先）、部（part 类型祖先）与作品根单元的 summary.yaml，按章、部、全书的顺序，每项含 unit、level（chapter、part 或 book）、text 与 stale（按 series 主规格 summary-show 的语义推导）；某一层没有 summary.yaml 时跳过该层并给出 severity 为 warning 的诊断 context.summary-missing（next 含 wa-cli help summary set --json）；summary.yaml 无法读取或不合法时以 warning 报告其诊断并跳过；一层都没有时为空数组。场景大纲没有声明 pov、或 pov 没有解析到 character 条目时（后者以 severity 为 warning 的诊断 knowledge.pov-not-in-canon 报告，message 含该 pov 文本，next 含 wa-cli canon list <work> --dir <dir> --json 与 wa-cli help scene contract --json）knowledge、readerOnly 与 states 的视角人物部分为空（states 仍含 characters 解析的条目）；作品没有 knowledge.yaml 时 knowledge 与 readerOnly 为空数组且不报告；knowledge.yaml 存在但不通过校验时报告其诊断，context 为 null，退出码为 1（同 threads.yaml 的处理）。九个内容项计入上下文预算并按 context-trim 的优先级裁剪；不加 --json 的 Markdown 输出新增「出场人物（Characters）」「前序场景（Prior Scenes）」「揭示边界（Reveal Boundary）」「未回收伏笔（Open Foreshadowing）」「视角人物已知（POV Knowledge）」「读者已知、人物未知（Reader Only）」「出场人物状态（Character States）」「前序场景结尾（Prior Endings）」与「分层摘要（Layered Summaries）」小节，按裁剪结果输出保留的内容，被整项裁剪的小节不输出。
      scenarios:
        scene-states:
          - GIVEN: my-novel 的 state.yaml 有绑定 my-novel/scene-1 的 confirmed 条目（canon-1 的 state 为 受伤）与绑定 my-novel/scene-2 的 proposed 条目（canon-1 的 state 为 痊愈），场景 my-novel/scene-2 的契约出场人物解析到 canon-1
          - WHEN: 运行 wa-cli context my-novel/scene-2 --dir D --json
          - THEN: states 含 canon-1 一项且 state 为 受伤（proposed 不参与），退出码为 0
        scene-prior-endings:
          - GIVEN: 场景 my-novel/scene-1 与 my-novel/scene-2 已有正文，scene-3 紧随其后
          - WHEN: 运行 wa-cli context my-novel/scene-3 --dir D --json
          - THEN: priorEndings 依次为 scene-2 与 scene-1（最近在前），每项 excerpt 至多 400 个字符，退出码为 0
        scene-layered-summaries:
          - GIVEN: 章 chapter-one、部 part-one 与根单元各有摘要，场景 my-novel/scene-2 属于 chapter-one
          - WHEN: 运行 wa-cli context my-novel/scene-2 --dir D --json
          - THEN: summaries 依次为 level 为 chapter（unit 为 my-novel/chapter-one）、part 与 book 的三项，stale 按各层推导，退出码为 0
    context-trim:
      strength: MUST
      statement: 上下文包必须把内容控制在上下文预算（Context Budget，见 context-budget）之内：每个内容项按其 Markdown 文本的字符数（Unicode 码点）计入预算。非 scene 单元按以下优先级从高到低依次放入：写作简报、本单元大纲、本节大纲条目、每个 canon 人物设定项、每条作者反馈、每个决策、每条系列事实、每份前序作品摘要、每份前序场景摘要（priorScenes）、规范要点的规则、术语表、禁用词、文风、每份素材原文、每个相邻节。scene 单元按以下优先级从高到低依次放入：场景契约（本单元大纲各节，含契约字段）、写作简报、本节大纲条目、每个出场人物状态快照条目（states）、每条视角人物已知条目（knowledge）、每条读者已知人物未知条目（readerOnly）、每条揭示边界（reveal）、每条未回收伏笔（threads）、每条前序场景结尾（priorEndings）、每份分层摘要（章、部、全书，按此顺序）、每条作者反馈、每个决策、每条系列事实、每份前序作品摘要、每份前序场景摘要（priorScenes）、规范要点的规则、术语表、禁用词、文风、每份素材原文、每个相邻节；canon 人物设定项、states、knowledge、readerOnly、reveal、threads、priorEndings、分层摘要与前序场景摘要只在 scene 单元出现（见 scene-context）。单元信息头与裁剪报告不计入预算。放入某项会超出预算时：素材原文与前序场景结尾在剩余预算大于其标题行所占字符数加 1 时截断到剩余字符数（截断后的内容仍以换行结尾），否则与其他项一样整项裁剪，继续尝试之后的项。used 为保留的内容项字符数之和，不超过预算；trimmed 为被裁剪或截断的项，按优先级顺序，每项含 part（brief、outline、section、character、state、knowledge、reader-only、reveal、thread、prior-ending、chapter-summary、part-summary、book-summary、feedback、decision、fact、summary、scene-summary、rules、glossary、bannedTerms、style、source 或 neighbor）、id（反馈、决策、事实、素材、canon 人物设定、状态快照与知情条目对应设定条目、未回收伏笔的 id，前序场景结尾与分层摘要的单元引用，摘要的作品 id、前序场景摘要的场景单元引用与相邻节的单元引用，其他为 null）、chars（原字符数）与 keptChars（保留的字符数，整项裁剪时为 0）；被整项裁剪的内容不出现在 context 的对应字段中（对应字段为 null 或不含该项）。
      scenarios:
        trim-scene-priority:
          - GIVEN: 场景 my-novel/scene-2 的预算只放得下场景契约与部分状态快照
          - WHEN: 运行 wa-cli context my-novel/scene-2 --dir D --json
          - THEN: 契约与 states 在场，被裁剪的 knowledge 条目进入 trimmed（keptChars 为 0），used 不超过预算，退出码为 0
        trim-prior-ending:
          - GIVEN: 场景预算在放入一条前序场景结尾时只剩标题行以下不足 400 字符
          - WHEN: 运行 wa-cli context <该场景> --dir D --json
          - THEN: 该结尾截断到剩余字符数（keptChars 为保留数且大于 0），不足标题行时整项裁剪（keptChars 为 0），退出码为 0
  REMOVED: {}
