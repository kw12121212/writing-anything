schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: skills
  title: 技能（Skill）
requirements:
  builtin-skills:
    strength: MUST
    statement: wa-cli 必须随二进制提供十三个技能（Skill）：wa-init、wa-brief、wa-outline、wa-draft、wa-review、wa-revise、wa-illustrate、wa-publish、wa-plan、wa-scene、wa-continuity、wa-assemble 与 wa-auto，不需要网络访问或额外文件。每个技能是一个目录，含 SKILL.md：开头为 --- 包住的 YAML 文件头，只含 name（与目录名相同，小写字母、数字与连字符，不超过 64 个字符）与 description（非空，不超过 1024 个字符），之后为非空的正文；目录结构与通用的 Agent Skills 格式兼容。技能的正文只说明何时调用哪些 wa-cli 命令、何时必须停下来询问作者（含「必须停下来问作者」一节）与逐条检查退出码的会话协议（含「会话协议」一节：可执行的 wrapper 模板——set -euo pipefail、失败即停读诊断、不用 || true 或输出重定向吞错——以及「经 harness 提问工具得到的作者决定用 decision add / decide 回写决策队列」的映射指引；模板与指引不是业务逻辑），不实现业务逻辑；正文中 wa-cli 之后的命令名（一个或两个小写词）都必须是 wa-cli help --json 列出的命令，同一处写出的 --参数 都必须是该命令声明的参数。wa-cli skills list 必须只读地输出 skills 数组（按名称排序），每项含 name、description 与 commands（引用的 wa-cli 命令，按命令注册表规范化：两个词组成已登记的命令时取两个词，否则只取命令名；去重、按出现顺序），不需要工作区。
    scenarios:
      commands-exist:
        - GIVEN: 内置的十三个技能
        - WHEN: 把每个技能引用的命令与 wa-cli help --json 的 commands 对照
        - THEN: 每个引用的命令都在其中
      list-skills:
        - GIVEN: 任意目录
        - WHEN: 运行 wa-cli skills list --json
        - THEN: skills 依次为 wa-assemble、wa-auto、wa-brief、wa-continuity、wa-draft、wa-illustrate、wa-init、wa-outline、wa-plan、wa-publish、wa-review、wa-revise 与 wa-scene，每项的 commands 非空，退出码为 0
      session-protocol-present:
        - GIVEN: 内置的十三个技能
        - WHEN: 读取每个技能的 SKILL.md 正文
        - THEN: 每个技能都含「会话协议」一节，节内有 set -euo pipefail 的 wrapper 模板、吞错（|| true 或输出重定向）的禁止说明与经 harness 提问工具得到作者决定后用 decision add / decide 回写的映射指引
  skills-install:
    strength: MUST
    statement: wa-cli skills install 必须把全部内置技能写入技能目录下的 <name>/SKILL.md：--agent claude-code 的技能目录为 --dir 下的 .claude/skills，--agent codex 为 .agents/skills（Codex 扫描的位置）；给出 --target 时技能目录为它（相对 --dir 或为绝对路径），此时不需要 --agent。不需要工作区。写入之前先完成全部检查，任何一项不通过都不写任何文件：从技能目录向上第一个已存在的路径、已存在的各技能目录都必须是真实目录，已存在的技能文件必须是普通文件，否则报告 skills.invalid-path（不跟随符号链接写入）；已有的技能文件与当前内置内容不同时：内容（把 CRLF 换行规范为 LF 后）等于该技能自己某个已提交版本（含开发构建）的内置内容（wa-cli 升级前安装、未被改过）的视为旧版本，直接更新；与该技能任何已提交的内置版本都不同（可能被作者改过）的报告 skills.modified，给出 --force 时改为覆盖。检查通过后缺少的目录逐级创建，内容不同或不存在的技能文件原子写入（覆盖时保留原有权限），内容相同的不写。诊断的 path 在项目目录之内时为相对项目目录的路径，在项目目录之外时不填 path、把绝对路径写进 message；所有诊断的 next 为 wa-cli help skills install --json。成功时 --json 输出的 skills 为每个技能的 name、path（在项目目录之内时相对项目目录，否则为绝对路径）与 changed，launchDir 在给出 --agent 而没有 --target 时为项目目录的绝对路径（归一为真实路径拼写），否则为 null，changedPaths 为项目目录之内新建的目录与新写入或覆盖的技能文件，退出码为 0；检查不通过时 skills 为空数组、不写任何文件；写入中途发生读写错误（如目录没有写权限）时报告 workspace.write-failed，skills 与 changedPaths 只列出已写入的部分；有问题时退出码为 1，检查不通过或写入失败时 launchDir 为 null。安装成功且 launchDir 不为 null 时，不加 --json 的文本输出另有一行提示：在项目目录 <launchDir> 中启动 <agent>，技能才会被加载，在上级目录或项目之外启动时不会加载。--agent 给出但不是 claude-code 或 codex 时（即使同时给出 --target）、既没有 --agent 也没有 --target 时、--target 落在工作区 .writing-anything/ 中（解析为绝对路径后按不区分大小写比较，并按文件身份确认；绝对路径、经由上级目录的相对路径与大小写变体都算）时报告 input.invalid-value。--dir 与 --target 为相对路径时都相对当前目录解析为绝对路径后再判断是否在项目目录之内。
    scenarios:
      install-claude:
        - GIVEN: 不含 .claude/ 的目录 D
        - WHEN: 运行 wa-cli skills install --agent claude-code --dir D --json
        - THEN: D/.claude/skills 下有十三个技能目录，各含与内置内容相同的 SKILL.md；skills 每项的 changed 为 true，changedPaths 列出新建的 .claude、.claude/skills、十三个技能目录与十三个文件，退出码为 0
      install-codex-again:
        - GIVEN: 已在 D 中运行过 wa-cli skills install --agent codex
        - WHEN: 再次运行 wa-cli skills install --agent codex --dir D --json
        - THEN: changedPaths 为空数组，skills 每项的 changed 为 false，退出码为 0
      install-launch-dir:
        - GIVEN: 空目录 D
        - WHEN: 运行 wa-cli skills install --agent claude-code --dir D，再运行 wa-cli skills install --target custom --dir D --json
        - THEN: 前者的文本输出含「在项目目录 <D 的绝对路径> 中启动 claude-code」；后者的 launchDir 为 null
      install-outdated-builtin:
        - GIVEN: .agents/skills/wa-auto/SKILL.md 的内容是上一个发布版本 wa-cli 的内置 wa-auto，作者没有改过，其余技能与当前内置内容相同
        - WHEN: 运行 wa-cli skills install --agent codex --dir D --json
        - THEN: 没有诊断，退出码为 0；wa-auto 的 changed 为 true、内容更新为当前内置版本，其余技能的 changed 为 false
      modified-skill:
        - GIVEN: D/.agents/skills/wa-init/SKILL.md 被作者改过
        - WHEN: 运行 wa-cli skills install --agent codex --dir D --json
        - THEN: diagnostics 中有一条错误码为 skills.modified 的诊断，没有写入任何文件（缺少的其他技能文件也没有写入），退出码为 1；加 --force 后该文件被覆盖为内置内容，退出码为 0
      outside-target:
        - GIVEN: D 之外的目录 O 中 wa-init/SKILL.md 被改过
        - WHEN: 运行 wa-cli skills install --target O --dir D --json
        - THEN: skills.modified 诊断不填 path，message 含 O 下该文件的绝对路径，退出码为 1
      symlinked-target:
        - GIVEN: D 下的 linked 是指向 D 之外目录的符号链接，链接目标中已有 wa-auto 目录
        - WHEN: 运行 wa-cli skills install --target linked --dir D --json
        - THEN: diagnostics 中有一条错误码为 skills.invalid-path、path 为 linked 的诊断，链接目标中没有写入任何文件，退出码为 1
      unknown-agent:
        - GIVEN: 任意目录 D
        - WHEN: 运行 wa-cli skills install --agent vim --dir D --json
        - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 agent 的诊断，退出码为 1
  novel-skill-coverage:
    strength: MUST
    statement: 内置技能必须覆盖长篇（novel）生命周期：wa-cli scene contract、scene close-out、state confirm、knowledge confirm、continuity、review plan、review submit、impact mark、volume checkpoint、volume confirm、assemble 与 handoff write 这十二条命令都必须至少被一个内置技能引用（出现在 wa-cli skills list 某个技能的 commands 中），且都是 wa-cli help --json 列出的命令。wa-auto 必须按作品的文体（Genre）分流文章路径与小说路径，并说明会话结束前用 wa-cli handoff write 写交接记录（Handoff Note）、新会话先读 wa-cli next 输出中的 handoff。长篇技能必须在「必须停下来问作者」一节写明作者确认节点：状态变更提议与知情事件的确认、卷末检查点（Volume Checkpoint）的确认、复查标记（Recheck Mark）以作者确认解除与场景验收，都只能在作者明确同意后以作者的原话摘要记录，不能由 Agent 代填。
    scenarios:
      novel-commands-covered:
        - GIVEN: 内置技能
        - WHEN: 运行 wa-cli skills list --json 并合并各技能的 commands
        - THEN: 并集包含 scene contract、scene close-out、state confirm、knowledge confirm、continuity、review plan、review submit、impact mark、volume checkpoint、volume confirm、assemble 与 handoff write，且每条都在 wa-cli help --json 的 commands 中
      auto-novel-path:
        - GIVEN: 内置的 wa-auto 技能
        - WHEN: 读取其正文
        - THEN: 正文按文体分出文章路径与 novel 路径，novel 路径引用 wa-plan、wa-scene、wa-continuity 与 wa-assemble，并写明 wa-cli handoff write 与新会话读取 wa-cli next 中的 handoff
  preview-serve-guidance:
    strength: MUST
    statement: 使用本地阅读页（wa-cli preview <作品> --serve）的内置技能（wa-assemble、wa-auto、wa-publish、wa-revise）在任何交出阅读页地址（preview.url 或 pendingAuthorReviews 的 command 给出的地址）的步骤中，都必须先读取工作区的审阅位置（wa-cli status --json 输出的 config.reviewSurface）再给出指引。为 browser 时必须说明：该命令是作者确认期间持续运行的本地服务，要用客户端的后台任务运行、在作者确认完成前不得停止；读取首行输出的 preview.url 后，先确认该地址可以访问再交给作者；作者说打不开时，重新运行该命令并交出新的地址。为 dsh 时必须说明：不启动 wa-cli preview --serve、不交出 127.0.0.1 地址，而是请作者打开 DSH 插件面板，在标为「待审阅」的作品或单元上点「审阅」完成反馈、确认与复核；作者说完成后，用 wa-cli review show 或 wa-cli next 的 --json 输出复查结果再继续；作者说 DSH 面板里没有「待审阅」入口（DSH 未安装 dsh-writing-viewer 插件）时，改按 browser 的做法交出浏览器阅读页。技能不得自行探测运行环境，只以 config.reviewSurface 为准（未设置 review_surface 时由 wa-cli 按环境判断）
    scenarios:
      serve-guidance-present:
        - GIVEN: 内置技能中正文含 preview --serve 的技能（wa-assemble、wa-auto、wa-publish、wa-revise）
        - WHEN: 检查它们的正文
        - THEN: 每个都说明先读取 config.reviewSurface，并在 browser 分支说明持续运行、后台运行、确认该地址可以访问与作者打不开时重新运行
      dsh-guidance-present:
        - GIVEN: 同上四个技能
        - WHEN: 检查它们的正文
        - THEN: 每个都说明 reviewSurface 为 dsh 时不启动 --serve、不交出 127.0.0.1 地址，请作者到 DSH 插件面板的「待审阅」入口审阅，并在作者完成后以 wa-cli review show 或 wa-cli next 复查
      every-handoff-step-branches:
        - GIVEN: 同上四个技能
        - WHEN: 逐个检查提到 preview.url 或阅读页地址的步骤
        - THEN: 每个这样的步骤都写明 reviewSurface 为 dsh 时的做法
      dsh-fallback-present:
        - GIVEN: 内置技能中正文含 preview --serve 的技能
        - WHEN: 检查它们的 dsh 分支
        - THEN: 每个都说明作者说面板里没有「待审阅」入口时改按 browser 的做法
  illustrate-skill:
    strength: MUST
    statement: 内置技能 wa-illustrate 必须指导 Agent 完成可选的配图（Illustration）环节，只说明何时调用哪些 wa-cli 命令与外部步骤，不实现业务逻辑；其 commands 必须包含 illustration add、illustration list、illustration remove、draft write、review record、claim list、source list、decision add 与 decide。正文必须写明：（1）渲染工具为外部风格库 lemo-opuscar，由 Agent 在会话中运行，wa-cli 不运行它：按环境变量 LEMO_OPUSCAR_HOME、默认位置 ~/lemo-opuscar 的顺序定位库，需要 Node 20 以上版本；找不到时给出安装方式（克隆其仓库或安装其 Claude Code 插件后运行 setup.sh deps）并询问作者，作者不同意安装时跳过整个配图环节；（2）风格从 lemo-opuscar 的风格索引（styles/README.md）与作者保存的风格（~/lemo-my-styles/README.md）中由作者选定，渲染遵守所选风格的 STYLE.md；（3）渲染前提出配图计划（Illustration Plan）：封面构思，以及每张正文配图所在段落、表现内容、氛围图（Mood Image）或信息图（Infographic）与信息图关联的论断或素材，经作者确认后用 decision add 与 decide 回写；（4）信息图只能呈现已登记论断或素材中的数据与事实，登记时用 --claims 或 --sources 关联；（5）渲染页面与中间文件放在工作区 .writing-anything/ 之外，用 lemo-opuscar 的 node core/render/still.mjs 加 --size 渲染静帧，封面按公众号封面比例（如 1800×766，主体居中以便裁出方形分享图）；（6）用 wa-cli illustration add 登记，Agent 渲染的图 --origin 为 agent，只有作者亲自提供的图片 --origin 为 author，封面用 --role cover 登记在作品根单元；（7）用 add 输出的 markdown 字段与 wa-cli draft write 把引用插入计划的段落之后，作者改过正文时按人工编辑保护处理；只插入了配图引用时用 wa-cli review record --reaffirm 沿用原来的审稿结论，改动了文字时重新审稿；（8）作者对某张图不满意时重新渲染并用 --replace 替换；（9）图文审看与验收交回 wa-publish。「必须停下来问作者」一节必须写明：风格选择、配图计划、安装 lemo-opuscar，以及以作者名义（--origin author）登记任何图片，都只能在作者明确同意后进行，不能由 Agent 代为决定。
    scenarios:
      illustrate-skill-content:
        - GIVEN: 内置技能 wa-illustrate
        - WHEN: 读取其 SKILL.md 正文并运行 wa-cli skills list --json
        - THEN: 正文含 lemo-opuscar、LEMO_OPUSCAR_HOME、still.mjs、--size、配图计划与「必须停下来问作者」一节；wa-illustrate 的 commands 包含 illustration add、illustration list、illustration remove、draft write、claim list、source list、decision add 与 decide
      illustrate-skill-no-runtime-dependency:
        - GIVEN: wa-cli 的源码与内置技能
        - WHEN: 检查 wa-cli 非测试源码
        - THEN: 不调用 node、lemo-opuscar 或任何图像生成服务；只有 wa-illustrate 的正文提到 lemo-opuscar
  illustrate-skill-prompt:
    strength: MUST
    statement: 内置技能 wa-publish 与 wa-auto 必须在请作者验收之前加入可选的配图询问：作品文体为 tech-blog 或 wechat-marketing、且单元还没有登记配图时，询问作者是否需要正文配图与封面图（Cover Image）；其他文体只在作者提出时进入配图环节。作者需要时转到 wa-illustrate，完成后回到验收步骤；作者不需要时跳过，验收与导出按原有步骤继续。wa-publish 的导出步骤必须写明：导出后把导出文件旁的资产目录与 export.assets 交给作者，公众号文章同时交出配图清单（Image List），其中封面与标注「AI 生成」的配图按清单上传；不要自己删改 AI 参与说明中的配图说明。wa-publish 与 wa-auto 的 commands 必须包含 illustration list。
    scenarios:
      publish-asks-illustration:
        - GIVEN: 内置技能 wa-publish 与 wa-auto
        - WHEN: 读取其 SKILL.md 正文并运行 wa-cli skills list --json
        - THEN: 两者的正文都在请作者验收之前写明配图询问并指向 wa-illustrate，写明作者不需要时跳过；两者的 commands 都包含 illustration list；wa-publish 的导出步骤提到资产目录、export.assets 与配图清单
