  - id: q-prior-scene-summaries
    question: 前序场景的「已验收摘要」数据从哪里来？
    context: 计划变更 scene-context-and-fiction-rules 只写「前序场景的已验收摘要」，未指明数据来源；该不确定性影响提案范围、context 主规格的 delta、实现文件与测试。
    answer: 复用单元摘要 summary.yaml：wa-cli summary set 写入、写入以单元已验收为前提（summary.not-accepted），天然满足「已验收」语义，与系列前序作品摘要（series 主规格 context-series 的 summaries）行为一致；前序场景没有摘要时以 warning 级 context.summary-missing 提示。依据 sources-and-provenance 与 series 主规格的既有行为，无需新产物类型。
    status: resolved
    kind: requirement
