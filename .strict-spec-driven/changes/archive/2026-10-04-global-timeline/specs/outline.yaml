schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: outline
operations:
  ADDED: {}
  MODIFIED:
    outline-artifact:
      strength: MUST
      statement: 单元目录下的 outline.yaml 是大纲（Outline）：含 schema_version（1）与按顺序排列的 sections；每个大纲节（Outline Section）含 id 与非空的 title，以及可选的 covers（覆盖的核心观点（Key Message）id，不重复）、uses（使用的素材（Source）id，不重复）、reason（不覆盖任何核心观点的理由，非空文本）与 role（承担的写作法章节或节拍 id，见 methods 主规格的 method-outline-check）；节还可声明轻量场景契约（Scene Contract）字段：characters（出场人物，非空文本数组，不重复）、beats（承担的情节节拍（Story Beat）id，不重复）与 reveal（揭示边界（Reveal Boundary），非空文本，本场景不能提前透露的信息）；节还可声明长篇场景契约扩展字段：pov（视角人物，非空文本）、location（地点，非空文本）、state_changes（必须发生的状态变化，每项含符合 id 格式且节内不重复的 id 与非空文本）、plants（要埋设的伏笔（Foreshadowing）id，不重复）、recovers（要回收的伏笔 id，不重复）、causes（起因（Cause），引用前文已发生事件的 id，不重复）与 events（预期产生的事件（Event）id，不重复），plants、recovers、causes 与 events 的每个取值都必须符合 id 格式；这些字段不符合上述要求时报告 artifact.schema-violation（field 为对应点分路径，如 sections[i].state_changes[j].id）。wa-cli validate 整体校验时，必须对每个可加载作品的每个单元目录中存在的 outline.yaml 做 Schema 校验并计入 checked，且满足：节 id 在文件内唯一，否则报告 artifact.duplicate-id（field 为 sections[i].id）；covers 中的每个 id 都是同一单元目录下 brief.yaml 中的核心观点，否则报告 outline.unknown-message（field 为 sections[i].covers[j]；没有 brief.yaml 时任何 covers 都不存在，brief.yaml 不通过校验时不做此项检查）；uses 中的素材都已登记，否则报告 outline.unknown-source（field 为 sections[i].uses[j]）；beats 中的每个 id 都是同一作品根单元大纲（根单元目录下的 outline.yaml）的节 id，否则报告 outline.unknown-beat（field 为 sections[i].beats[j]；根单元没有大纲或根单元大纲不通过校验时不做此项检查）；场景单元大纲节的 causes 与 events 还必须通过因果链（Causality Chain）检查（见 scene-causality）。这些检查都通过时，validate 还必须把每个覆盖缺口（Coverage Gap，见 outline-show）报告为一条 error 级诊断：outline.uncovered-message（path 为 outline.yaml，不填 field，message 含核心观点的 id 与内容）与 outline.missing-reason（field 为 sections[i]），next 为 wa-cli outline show <unit> --dir <dir> --json 与 wa-cli help outline set --json；以及单元选用写作法时的写作法缺口（outline.missing-method-part、outline.method-order 与 outline.unknown-role，见 methods 主规格的 method-outline-check），next 另含 wa-cli method list --dir <dir> --json。wa-cli validate <path> 对该位置的 outline.yaml 执行同样的检查。outline.yaml 存在但途经符号链接或不是普通文件时，validate、outline set、outline remove、outline show 与 scene contract 都报告 artifact.not-found（path 为该 outline.yaml），不读取也不覆盖它。 长篇场景契约扩展字段还包括时间线（Timeline）的 time（故事时间（Story Time）：非空文本标记，相同文本视为同时）与 after（时间线：声明本场景晚于的前文场景引用，非空文本数组，不重复，元素可跨作品，格式 <work>/<scene>）；这两个字段与其他契约字段同样受 Schema 约束（artifact.schema-violation）。
      scenarios: {}
    scene-contract-set:
      strength: MUST
      statement: wa-cli scene contract <unit> <section> 必须以命名参数写入场景单元大纲节的场景契约字段：--pov、--location 与 --reveal 设置非空文本；--characters、--beats、--plant、--recover、--cause 与 --event 为逗号分隔的取值，整体替换；--state-change <id>=<文本> 按节内 id 与既有条目合并（新增或更新，保留未涉及的条目），可重复给出；--title 设置节的标题。section 不存在时新增一节并追加在末尾，此时必须给出 --title；section 已存在时只修改给出的字段，位置不变。文本参数（--pov、--location、--reveal）取值为空字符串时删除该字段，列表参数（--characters、--beats、--plant、--recover、--cause、--event）取值为空字符串时清空该列表，id 列表中的空白取值被忽略，--characters 的空白取值报告 input.invalid-value（与 outline set 一致）；修改后的取值与原有取值相同时不写文件，changedPaths 为空数组；否则 outline.yaml 不存在时创建（含 schema_version 1 与 sections），单元目录不存在时先创建，只修改涉及的节并保留其他内容与 YAML 注释，changedPaths 为新建的单元目录（如有）与该 outline.yaml。给出 --beats 时的引用检查与 outline set 的 outline.unknown-beat 相同；给出 --cause 或 --event 时按写入后的状态即时执行 scene-causality 的因果链检查，本次写入引起、报告在被编辑节上的问题以 error 报告并拒绝写入，诊断不填 path，字段为参数名（如 causes[i]），其他节或其他场景的既有问题不阻止写入，由整体校验报告；单元的 type 不是 scene 时报告 scene.not-scene（message 含该单元的实际类型）；section 不符合 id 格式时报告 artifact.schema-violation（field 为 section）；新节缺少 --title、--title/--pov/--location/--reveal 的取值非空但只含空白、--state-change 的格式不是 <id>=<文本>、--state-change 的 id 不符合 id 格式、重复或文本为空或只含空白、--beats/--plant/--recover/--cause/--event 中有重复的取值、节已存在而没有给出任何修改参数时报告 input.invalid-value；--beats/--plant/--recover/--cause/--event 中不符合 id 格式的取值由写前复查的 Schema 校验报告 artifact.schema-violation（不填 path，字段为参数名，如 events[i]）；已有的 outline.yaml 有解析、Schema 或节 id 重复问题时报告其诊断（covers、uses 的引用问题不阻止修改）；要修改之处经由 YAML 锚点、别名或合并键得到时报告 outline.anchored-value。成功时 --json 输出与 outline show 相同的 outline、coverage 与 gaps，退出码为 0。由参数引起的诊断不填 path，next 含 wa-cli help scene contract --json；这些失败情况都不修改任何文件，退出码为 1。 --time 设置节的故事时间（非空文本）；--after 为逗号分隔的时间线引用，整体替换（空字符串时删除）；两者的写入与校验同其他文本/列表参数。
      scenarios: {}
  REMOVED: {}
