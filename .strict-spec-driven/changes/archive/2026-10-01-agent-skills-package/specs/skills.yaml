schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: skills
spec:
  title: 技能（Skill）
  path: .strict-spec-driven/specs/skills.yaml
operations:
  ADDED:
    builtin-skills:
      strength: MUST
      statement: wa-cli 必须随二进制提供八个技能（Skill）：wa-init、wa-brief、wa-outline、wa-draft、wa-review、wa-revise、wa-publish 与 wa-auto，不需要网络访问或额外文件。每个技能是一个目录，含 SKILL.md：开头为 --- 包住的 YAML 文件头，只含 name（与目录名相同，小写字母、数字与连字符，不超过 64 个字符）与 description（非空，不超过 1024 个字符），之后为非空的正文；目录结构与通用的 Agent Skills 格式兼容。技能的正文只说明何时调用哪些 wa-cli 命令、何时必须停下来询问作者（含「必须停下来问作者」一节），不实现业务逻辑；正文中 wa-cli 之后的命令名（一个或两个小写词）都必须是 wa-cli help --json 列出的命令，同一处写出的 --参数 都必须是该命令声明的参数。wa-cli skills list 必须只读地输出 skills 数组（按名称排序），每项含 name、description 与 commands（引用的 wa-cli 命令，按命令注册表规范化：两个词组成已登记的命令时取两个词，否则只取命令名；去重、按出现顺序），不需要工作区。
      scenarios:
        list-skills:
          - GIVEN: 任意目录
          - WHEN: 运行 wa-cli skills list --json
          - THEN: skills 依次为 wa-auto、wa-brief、wa-draft、wa-init、wa-outline、wa-publish、wa-review 与 wa-revise，每项的 commands 非空，退出码为 0
        commands-exist:
          - GIVEN: 内置的八个技能
          - WHEN: 把每个技能引用的命令与 wa-cli help --json 的 commands 对照
          - THEN: 每个引用的命令都在其中
    skills-install:
      strength: MUST
      statement: wa-cli skills install 必须把全部内置技能写入技能目录下的 <name>/SKILL.md：--agent claude-code 的技能目录为 --dir 下的 .claude/skills，--agent codex 为 .agents/skills（Codex 扫描的位置）；给出 --target 时技能目录为它（相对 --dir 或为绝对路径），此时不需要 --agent。不需要工作区。写入之前先完成全部检查，任何一项不通过都不写任何文件：从技能目录向上第一个已存在的路径、已存在的各技能目录都必须是真实目录，已存在的技能文件必须是普通文件，否则报告 skills.invalid-path（不跟随符号链接写入）；已有的技能文件与内置内容不同（可能被改过）时报告 skills.modified，给出 --force 时改为覆盖。检查通过后缺少的目录逐级创建，内容不同或不存在的技能文件原子写入（覆盖时保留原有权限），内容相同的不写。诊断的 path 在项目目录之内时为相对项目目录的路径，在项目目录之外时不填 path、把绝对路径写进 message；所有诊断的 next 为 wa-cli help skills install --json。成功时 --json 输出的 skills 为每个技能的 name、path（在项目目录之内时相对项目目录，否则为绝对路径）与 changed，changedPaths 为项目目录之内新建的目录与新写入或覆盖的技能文件，退出码为 0；检查不通过时 skills 为空数组、不写任何文件；写入中途发生读写错误（如目录没有写权限）时报告 workspace.write-failed，skills 与 changedPaths 只列出已写入的部分；有问题时退出码为 1。--agent 给出但不是 claude-code 或 codex 时（即使同时给出 --target）、既没有 --agent 也没有 --target 时、--target 落在工作区 .writing-anything/ 中（解析为绝对路径后按不区分大小写比较，并按文件身份确认；绝对路径、经由上级目录的相对路径与大小写变体都算）时报告 input.invalid-value。--dir 与 --target 为相对路径时都相对当前目录解析为绝对路径后再判断是否在项目目录之内。
      scenarios:
        install-claude:
          - GIVEN: 不含 .claude/ 的目录 D
          - WHEN: 运行 wa-cli skills install --agent claude-code --dir D --json
          - THEN: D/.claude/skills 下有八个技能目录，各含与内置内容相同的 SKILL.md；skills 每项的 changed 为 true，changedPaths 列出新建的 .claude、.claude/skills、八个技能目录与八个文件，退出码为 0
        install-codex-again:
          - GIVEN: 已在 D 中运行过 wa-cli skills install --agent codex
          - WHEN: 再次运行 wa-cli skills install --agent codex --dir D --json
          - THEN: changedPaths 为空数组，skills 每项的 changed 为 false，退出码为 0
        modified-skill:
          - GIVEN: D/.agents/skills/wa-init/SKILL.md 被作者改过
          - WHEN: 运行 wa-cli skills install --agent codex --dir D --json
          - THEN: diagnostics 中有一条错误码为 skills.modified 的诊断，没有写入任何文件（缺少的其他技能文件也没有写入），退出码为 1；加 --force 后该文件被覆盖为内置内容，退出码为 0
        symlinked-target:
          - GIVEN: D 下的 linked 是指向 D 之外目录的符号链接，链接目标中已有 wa-auto 目录
          - WHEN: 运行 wa-cli skills install --target linked --dir D --json
          - THEN: diagnostics 中有一条错误码为 skills.invalid-path、path 为 linked 的诊断，链接目标中没有写入任何文件，退出码为 1
        outside-target:
          - GIVEN: D 之外的目录 O 中 wa-init/SKILL.md 被改过
          - WHEN: 运行 wa-cli skills install --target O --dir D --json
          - THEN: skills.modified 诊断不填 path，message 含 O 下该文件的绝对路径，退出码为 1
        unknown-agent:
          - GIVEN: 任意目录 D
          - WHEN: 运行 wa-cli skills install --agent vim --dir D --json
          - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 agent 的诊断，退出码为 1
  MODIFIED: {}
  REMOVED: {}
