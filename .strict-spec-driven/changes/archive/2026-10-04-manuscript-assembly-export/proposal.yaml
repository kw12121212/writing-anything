schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: manuscript-assembly-export
  status: proposed
summary:
  what:
    - 新增 wa-cli assemble <work> [--output <路径>] [--format markdown|text]：按单元树先序把作品中 stage 为 done 的场景正文组成书稿——部标题（# 部名，取部大纲节标题或部单元 id）、章标题（## 章名，取章大纲节标题或章单元 id）、场景正文（去 HTML 注释与作者批注的 draft.md），场景之间以分隔线连接；正文之间插入书名（根单元大纲首个节标题或作品 id）与自动生成的目录（部、章两级，带锚点链接）
    - 组稿关卡：作品存在 stage 不为 done 的单元（汇总单元按推导阶段）、任一场景有未豁免的 error 级连续性发现（continuity 的 error 级 finding）、或任一 open 复查标记（Recheck Mark）时，wa-cli assemble 拒绝组稿，逐项列出阻塞项（assemble.scenes-open：未完成场景引用列表；assemble.continuity：连续性发现的场景与错误码；assemble.rechecks：open 复查标记的场景与目标），next 含 wa-cli status / wa-cli continuity / wa-cli impact list；不写任何文件
    - 导出交付：--output 指定输出文件（默认 .writing-anything/exports/<work>-manuscript.md），复用 internal/export 的输出路径检查与原子写入；--format text 输出纯文本（同 Markdown 的内容但标题降为文本行、去链接），Markdown 为缺省；文件末尾按出处附上 AI 参与说明（沿用 export 主规格的 AI 参与说明规则与合并后的模板），并在书稿头部列出各场景的验收记录摘要（已验收场景数与最后验收时间）
  why:
    - 路线图 novel-continuity 里程碑最后一个计划变更 manuscript-assembly-export：完成标准「存在未验收单元、连续性阻塞或需复查标记时，wa-cli assemble 拒绝组稿并列出阻塞项」的承载者；依赖的四个变更均已归档，当前是唯一可推荐的计划变更（session-handoff 不依赖本变更但排序在其后）
    - 长篇逐场景推进的终点是成书：散落在各场景目录的正文需要按单元树先序拼成整书，且成书前必须确认全部场景验收、连续性干净、复查清零——组稿关卡把三个前置（未完成、连续性、复查）汇成一处硬检查，防止带伤成书
    - 导出复用既有分层：单元选择（done 场景）、注释剥离（StripComments）、输出路径检查与原子写入、AI 参与说明都是 export 主规格的既有能力，本变更只新增书稿的组装与目录渲染
scope:
  in:
    - internal/export（或新包 internal/assembly 复用 internal/export 的输出与说明函数）：按先序收集 done 场景正文（去注释）、部/章/书标题解析（大纲节标题优先）、目录渲染、组稿关卡（未完成单元、continuity error 发现、open 复查标记）、Markdown 与纯文本两种渲染、AI 参与说明追加
    - internal/cli：assemble 命令注册（args：work；flags：--dir、--output、--format；outputKeys、exitCodes、sampleArgs 与 mutatingSamples、--json 与人读输出、诊断与 next）
    - docs/GLOSSARY.md：组稿（Assembly）词条
    - 测试夹具：多章长篇夹具（部一含两章、场景收口与验收齐备），覆盖组装顺序与标题、三种阻塞的拒绝与解除后通过、两种格式导出与路径检查、AI 参与说明
  out:
    - 会话交接记录——属 session-handoff 计划变更（novel-continuity 最后一个）
    - 跨作品共享设定与时间线——属 novel-series 里程碑
    - 电子书（EPUB 等）与其他排版格式：只交付 Markdown 与纯文本，格式渲染复用既有分层
    - 组稿后的增量更新（只重排变化的场景）：每次 assemble 整体重组，YAGNI
    - MCP 服务与内置技能不单独编写（assemble 经命令注册表自动暴露）
unchanged_behavior:
  - 作品全部场景 done、无连续性发现、无 open 复查标记时，validate、next、accept、advance、export 的输出、退出码与错误码不变；既有 export 命令（单单元导出）行为不变
  - continuity、impact、closeout、volume 命令组语义不变；assemble 只读消费它们的状态
  - MCP 服务与内置技能内容不变
roadmap:
  milestone: novel-continuity
  planned_change: manuscript-assembly-export
