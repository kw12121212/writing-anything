schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: review-and-acceptance
sections:
  Implementation:
    schemas:
      text: internal/schema：review、review-input 与 acceptance 三个 Schema；common.schema.json 的评分项新增可选的 blocking；validate 按位置识别 review.yaml 与 acceptance.yaml
      status: complete
    review-package:
      text: internal/review：加载与校验 review.yaml、acceptance.yaml；Record（输入校验：评分项结论、段落、引文、发现项 id）；Resolve（结构化编辑）；修订任务与验收关卡（Gate）的纯函数；Accept 写出 acceptance.yaml
      status: complete
    lint-core:
      text: internal/cli：把 lint 的核心逻辑抽成 runUnitLint，lint、review show 与 accept 共用，lint 命令的输出不变
      status: complete
    commands:
      text: internal/cli：review record、review show、review resolve 与 accept 命令，登记到命令注册表与样例调用，诊断带可执行的下一步
      status: complete
    lifecycle:
      text: internal/work 与 internal/cli：acceptance 必需产物的 acceptance.invalid 与 acceptance.stale 阻塞项；next 为缺失的 review 与 acceptance 给出命令；validate 整体校验单元目录中的 review.yaml 与 acceptance.yaml
      status: complete
    catalog:
      text: internal/catalog：minimal 文体审稿阶段的必需产物为 [review, acceptance]；RubricItem 新增 Blocking
      status: complete
    docs:
      text: docs/GLOSSARY.md 新增修订任务（Revision Task）
      status: complete
  Testing:
    lint:
      text: gofmt 检查本变更的 Go 文件
      status: complete
      command: test -z "$(gofmt -l internal/review internal/schema internal/catalog internal/work internal/cli/review.go internal/cli/review_test.go internal/cli/lint.go internal/cli/units.go internal/cli/registry.go internal/cli/cli_test.go internal/cli/workspace.go)"
    unit-tests:
      text: 单元测试：review 包（输入校验的每类错误、记录与替换、resolve 与 waived 理由、三种关卡强度的阻塞项、验收写出与过期）；CLI 端到端（review record、review show、review resolve、accept、advance 与 next 的验收阻塞项、validate）
      status: complete
      command: go test ./internal/...
    full-regression:
      text: 运行完整回归命令，覆盖率不低于 80%
      status: complete
      command: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out
  Verification:
    spec-alignment:
      text: 对照 review 与 units-and-lifecycle delta spec 的每个场景确认实现与测试覆盖，并按实际实现修正 delta spec
      status: complete
    strict-ready:
      text: 运行 strict-spec-cli ready 与 strict-spec-cli verify，确认变更产物有效
      status: complete
      command: strict-spec-cli ready review-and-acceptance && strict-spec-cli verify review-and-acceptance
    archive-readiness:
      text: 确认 delta spec 能合并进主规格（review 为新主规格），归档后路线图中的 review-and-acceptance 标记为完成
      status: complete
testing_gates:
  validation_task: full-regression
  unit_test_task: unit-tests
