      text: client.test.ts 增补：待决决策磁贴点击进入决策清单且渲染 testdata 决策内容；待复核磁贴进入复核清单；返回总览；decisions 缺失或解析失败时清单显示提示不崩溃；无编辑控件
      status: complete
      command: pnpm --dir plugins/dsh-writing-viewer exec vitest run src/client.test.ts
    plugin-package-check:
      text: 插件统一检查（含新模块与新测试，重建 dist）
      status: complete
      command: pnpm --dir plugins/dsh-writing-viewer run check
  Verification:
    strict-ready-and-verify:
      text: strict ready 与 verify 干净
      status: complete
      command: strict-spec-cli ready plugin-queue-views && strict-spec-cli verify plugin-queue-views
    full-project-regression:
      text: config.yaml 完整项目级回归，归档前通过
      status: complete
      command: go vet ./... && go build ./... && go test -coverprofile=coverage.out ./... && go run ./internal/tools/covercheck -min 80 -profile coverage.out
