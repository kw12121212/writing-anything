    spec-alignment:
      text: 对照 genres-and-packs delta spec 与 cli-contract delta tech 的每个场景与规则确认实现与测试覆盖，并按实际实现修正
      status: complete
    strict-ready:
      text: 运行 strict-spec-cli ready 与 strict-spec-cli verify，确认变更产物有效
      status: complete
      command: strict-spec-cli ready pack-install-distribution && strict-spec-cli verify pack-install-distribution
    archive-readiness:
      text: 确认 delta spec 与 delta tech 能合并，归档后路线图中的 pack-install-distribution 标记为完成
      status: complete
