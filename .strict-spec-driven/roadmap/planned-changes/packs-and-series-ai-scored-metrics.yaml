schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: ai-scored-metrics
  milestone: packs-and-series
status: planned
summary: AI 量化评分：锚定评分（Anchored Scale）、多次独立打分与作者校准（Calibration）
details: 文体或规范包声明评分维度（例如情绪倾向、紧张度、悬念强度、信息密度、开头吸引力），每个维度采用锚定评分：每个分值都附带示例片段。wa-cli metrics plan <unit> 生成打分任务（片段、维度、锚定说明）；Agent 用多个全新的独立会话分别打分，通过 wa-cli metrics record 写入；wa-cli 取中位数并报告分歧，分歧超过阈值的片段转为作者决策，不自动下结论。wa-cli metrics calibrate 让作者给少量样本打分，计算 AI 与作者的一致率（Agreement Rate）；一致率低于阈值的维度，在该规范包中自动降级为仅供参考。wa-cli 只负责任务、结构与统计，不调用模型。
depends_on:
  - review-and-acceptance
  - pack-install-distribution
