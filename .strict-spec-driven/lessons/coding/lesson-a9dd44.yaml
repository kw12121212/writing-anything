lesson:
  id: lesson-a9dd44
  title: 按字符串前缀限制写入位置，在不区分大小写的文件系统上会被绕过
category: coding
status: active
created_at: '2026-10-01T03:04:25.105Z'
updated_at: '2026-10-01T03:04:25.105Z'
context: tech-blog-genre-and-export 的 export 用 strings.HasPrefix 拒绝写入 .writing-anything/ 中 exports 之外的路径。
observation: fresh-context 审查在 NTFS（等同 Windows 与 macOS 的默认文件系统）上复现：--output .Writing-Anything/config.yaml 通过字符串检查，Lstat 却找到真实的工作区目录，覆盖了 config.yaml。
takeaway: 限制写入范围时，除规整后的字符串比较（不区分大小写）外，写入前逐级 Lstat 已存在的目录并用 os.SameFile 与受保护的目录比较；测试直接调用按身份检查的函数，证明它不依赖字符串比较。
applies_when: 命令接受作者或 Agent 给出的输出路径、并且要禁止写入某些目录（如工作区产物）时
occurrences:
  - origin: tech-blog-genre-and-export
    date: '2026-10-01'
    evidence: internal/export 的 cleanOutput（EqualFold）与 ensureParents（os.SameFile）；export_test.go 的 TestOutputPath。
