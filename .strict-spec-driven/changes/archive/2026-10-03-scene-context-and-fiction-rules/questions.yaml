  - id: q-canon-character-match
    question: 场景大纲声明的出场人物如何关联设定集（Canon）条目？
    context: outline 主规格已把场景契约的 characters 定型为自由文本人物名数组，canon 条目有 name 字段；关联方式影响 context 主规格 delta 与 internal/ctxpack 的实现。
    answer: 按 name 精确匹配 canon.yaml 中 type 为 character 的条目；声明的人物没有同名条目时逐个给出 warning 级 context.character-not-in-canon（next 含 canon add 帮助），作品没有 canon.yaml 时不报告。不改任何现有产物结构。
    status: resolved
