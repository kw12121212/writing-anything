    answer: 「项目技能」指仓库内的开发流程技能（.agents/skills/release/SKILL.md），不是 wa-cli 内置写作技能；「版本号要更新」指通过新的 v* git 标签表达（构建时注入），不落版本文件；发布产物本地构建并用 gh CLI 发布到 GitHub Release；.github/workflows/release.yml 删除；首个正式版本 v0.1.0；本次只交付技能，不实际执行发布
