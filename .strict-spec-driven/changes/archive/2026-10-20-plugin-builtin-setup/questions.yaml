resolved:
  - id: requirement-problem
    question: 今天具体是什么不方便？对谁？
    context: 需求拷问：确认问题本身而非解决方案
    answer: 装入 DSH 插件只得到只读查看面板；要完整使用 writing-anything，作者还得手动用 install.sh 安装 wa-cli、再手动执行 wa-cli skills install 安装内置技能，Agent 才具备 wa-* 技能。步骤分散在插件之外，新用户容易漏
    status: resolved
    kind: requirement
    answered_by: human
  - id: requirement-outcome
    question: 什么可观察的差异证明问题已解决？
    context: 需求拷问：完成判据
    answer: 安装本插件并打开开关、点击启用后：DSH 技能清单出现全部内置 wa-* 技能，Agent shell 中 wa-cli 可用且为插件提供的内置版本；存在同名外部技能或外部 wa-cli 时内置版本优先；面板设置区如实显示状态
    status: resolved
    kind: requirement
    answered_by: human
  - id: requirement-trigger
    question: 为什么现在做？
    context: 需求拷问：触发时机
    answer: 插件已稳定提供查看能力（dsh-workspace-viewer 里程碑完成），作者希望安装插件即完整可用，减少分发与上手成本
    status: resolved
    kind: requirement
    answered_by: human
  - id: requirement-non-goals
    question: 什么必须明确不变？
    context: 需求拷问：非目标
    answer: 面板既有只读查看行为、两条既有路由与快照响应结构、.writing-anything/ 永不被插件写入、wa-cli 内核与 Go 代码、GitHub Releases 发布流程；开关默认关闭时插件行为与本变更之前完全一致
    status: resolved
    kind: requirement
    answered_by: human
  - id: requirement-interpretation
    question: 「开关允许内置 skill、cli 启用」取哪种读法？
    context: 需求拷问：歧义消解。作者在选项中选定：插件完整代劳（下载发布产物到可配置目录，默认 ~/.local/bin）；技能不写用户目录、直接注册进 DSH；开关形态为配置开关+面板按钮；后续追问补充：存在外部同名技能与 CLI 时内置优先
    answer: 配置开关 enableSetup（默认关）+面板显式「启用」动作：插件从本项目 GitHub Releases 下载校验 wa-cli 到配置目录（默认 ~/.local/bin，为 PATH 常规安装位而非 Agent 技能目录），内置技能经 DSH 技能注册表进程内注册（不写 ~/.agents/skills、.claude/skills、项目 .agents/skills），同名时内置优先于外部技能与外部 CLI
    status: resolved
    kind: requirement
    answered_by: human
