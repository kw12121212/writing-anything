schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: export
operations:
  ADDED:
    plain-text-export:
      strength: MUST
      statement: 'wa-cli export <work> --format text 必须按 export-markdown 同样的规则选出验收记录有效的单元、去掉作者批注与单处豁免注释、去掉各单元正文开头的 BOM、CRLF 换成 LF，按单元树先序拼接各单元正文（单元之间空一行，文件以换行结尾），并把正文转为纯文本（Plain Text）：ATX 标题去掉行首的 1 至 6 个 # 与其后的空白，保留标题文字；行内代码与强调（**文字** 与 __文字__ 为加粗、*文字* 与 _文字_ 为斜体，_ 在单词中间时不是强调）只保留文字；链接 [文字](地址) 只保留文字，图片 ![替代文字](地址) 输出「【图：替代文字】」；引用块行去掉行首的 > 与其后的一个空格（没有空格时只去掉 >）；围栏代码块去掉开头与结束的围栏行，内容行原样保留；不跨越空行的已闭合 HTML 注释去掉（跨越空行的按文字输出）；其余文字原样保留。去掉标记后只剩空白的行整行去掉，连续的空行规整为一个；标记延伸到行尾时去掉它之前留下的行尾空白，其余空白（如行尾两个空格的硬换行）原样保留。AI 参与说明（AI-generated Content Label，见 ai-disclosure）在放置位置含 footer 时按 export-markdown 的文末格式追加；placement 为 metadata 或 both 时纯文本没有元数据位置，同样只按 footer 追加。--output 省略时为 .writing-anything/exports/<work>.txt，输出路径检查与原子写入同 export-output；图片占位是纯文字，没有配图清单。成功时 --json 输出的 export.format 为 text、images 为空数组、imageList 为 null，其余字段与 changedPaths 同 export-markdown，退出码为 0。--front-matter 与 --format text 同时给出时报告 input.invalid-value（field 为 front-matter），不写文件，退出码为 1。'
      scenarios:
        plain-text-content:
          - GIVEN: 已验收作品的正文含二级标题、加粗、行内代码、链接、引用块、围栏代码块与图片
          - WHEN: 运行 wa-cli export post --format text --dir D --json
          - THEN: '.writing-anything/exports/post.txt 的标题行没有 # 前缀，加粗与行内代码只剩文字，链接只剩链接文字，图片为「【图：替代文字】」，引用块行没有 > 前缀，代码内容保留且没有围栏行，退出码为 0'
        text-front-matter-rejected:
          - GIVEN: 作品 post 已验收
          - WHEN: 运行 wa-cli export post --format text --front-matter --dir D --json
          - THEN: diagnostics 中有一条错误码为 input.invalid-value、field 为 front-matter 的诊断，不写文件，退出码为 1
        text-skips-unaccepted:
          - GIVEN: 作品 post 的根单元未验收，子单元 s1 已验收
          - WHEN: 运行 wa-cli export post --format text --dir D --json
          - THEN: 导出文件只含 s1 的正文，diagnostics 中有一条 warning 级 export.unaccepted（path 为根单元目录），退出码为 0
        text-ai-footer:
          - GIVEN: 作品 post 的正文全部由 Agent 起草且已验收，config.yaml 的 ai_disclosure 为 footer
          - WHEN: 运行 wa-cli export post --format text --dir D --json
          - THEN: 导出文件末尾为空行、一行 ---、空行与 AI 参与说明文字；export.disclosure 的 placement 为 footer，退出码为 0
  MODIFIED:
    export-markdown:
      strength: MUST
      statement: 'wa-cli export <work> [--format markdown] 必须把作品中验收记录有效的单元导出为一个 Markdown 文件：按单元树先序（根单元在前）拼接各单元的 draft.md，单元之间空一行，文件以换行结尾；去掉作者批注（<!-- 之后为 @me: 或 @me(kind): 且有非空文字的注释，可以跨行但不能跨空行、不能包含另一个 <!--，与作者反馈的批注一致）与单处豁免注释（与文本检查一致：内容为 lint-ignore <规则 id>: 理由，注释到其后第一个 -->，行首的注释可以跨空行，不在行首的不能）；没有对应 --> 或不满足这些条件的写法不是注释，原样保留；去掉后只剩空白的行整行去掉，不因此留下连续空行，注释一直延伸到行尾时去掉它之前留下的行尾空白，其余空白（如 Markdown 行尾两个空格的硬换行）原样保留；围栏代码块与行内代码（识别与文本检查、作者反馈一致：围栏的结束行为同一字符且长度不短于开头，行内代码为 n 个反引号到之后恰好 n 个反引号）及其他 HTML 注释原样保留；各单元正文开头的 BOM 去掉，CRLF 换成 LF。正文超过 2 MiB 的单元不导出（同 export.unaccepted）。验收记录有效指单元目录下有 acceptance.yaml、通过校验、draft_sha256 与当前正文一致且 gate_level 不比工作区当前的关卡强度宽松（见 units-and-lifecycle 主规格的 advance-stage）。没有正文或验收无效的单元不导出，各给出一条 warning 级 export.unaccepted（path 为单元目录，next 包含 wa-cli review show <unit> --dir <dir> --json）；没有任何可导出的单元时报告 export.nothing-accepted（next 包含 wa-cli next --dir <dir> --json），不写文件，退出码为 1。给出 --front-matter 时在开头附带 YAML 文件头元数据（Front Matter），依次含 title（第一个导出单元正文中围栏代码块之外的第一个一级标题，结尾的 # 只在与文字之间有空白时视为关闭序列；没有时为作品 id）、description（根单元写作简报的 purpose，没有时省略）、genre、units 与 accepted_at（导出单元中最晚的验收时间），有 AI 参与说明且放置位置含 metadata 时再含 ai_disclosure（见 ai-disclosure）。有 AI 参与说明且放置位置含 footer 时，在正文末尾追加一个空行、一行 ---、一个空行与说明文字。成功时 --json 输出的 export 含 work、format、path、units（导出的单元引用，按顺序）、skipped（每项含 unit 与 reason）、chars、images（Markdown 格式为空数组）与 imageList（Markdown 格式为 null），changedPaths 为新建的目录与导出文件，退出码为 0。--format 不是 markdown、wechat-html（见 wechat-html-export）或 text（见 plain-text-export）时报告 input.invalid-value（field 为 format）；<work> 是子单元引用时报告 work.not-found（field 为 work）；这些情况不写文件，退出码为 1。'
      scenarios:
        export-accepted:
          - GIVEN: 作品 my-post 已验收，子单元 intro 没有验收
          - WHEN: 运行 wa-cli export my-post --output dist/post.md --dir D --json
          - THEN: dist/post.md 只含 my-post 的正文；diagnostics 中有一条 severity 为 warning、错误码为 export.unaccepted、path 为 .writing-anything/works/my-post/units/intro 的诊断；changedPaths 为 [dist, dist/post.md]，退出码为 0
        nothing-accepted:
          - GIVEN: 作品 my-post 没有验收
          - WHEN: 运行 wa-cli export my-post --dir D --json
          - THEN: diagnostics 中有一条错误码为 export.nothing-accepted 的诊断，没有写出文件，退出码为 1
        strip-process-comments:
          - GIVEN: '已验收单元的正文含独占一行的 <!-- lint-ignore ai-cliche: 引用原话 --> 与行尾的 <!-- @me: 太长 -->'
          - WHEN: 运行 wa-cli export my-post --dir D --json
          - THEN: 导出文件中没有这两处注释，独占一行的注释所在行被去掉
        unclosed-annotation:
          - GIVEN: '已验收单元的正文为「段落 A。<!-- @me: 这里太长」、空行、「段落 B。」'
          - WHEN: 运行 wa-cli export my-post --dir D --json
          - THEN: 导出文件含段落 A 与段落 B 的全部文字（漏写 --> 的不是批注）
  REMOVED: {}
