  - id: project-path-switch
    question: 里程碑定案的「面板内切换到显式输入的项目路径」是否纳入本变更？
    context: 背景：里程碑 intake 问题 workspace-root 已定案「默认跟随 DSH 工作区根/会话工作目录，面板内支持切换到显式输入的项目路径」，plugin-scaffold 已实现前半（注册表定位与配置固定），但 overview-navigation、artifact-views、polish-release 三个计划变更的 summary/details 都没有认领后半的面板内切换。影响：纳入会改变本变更的提案范围、需要新增 delta 规格要求，并要求改动 host 侧快照路由（接受项目路径参数及其校验，属读取任意本机路径的安全边界），违反本变更「host 路由形状不变」的约束，同时影响实现文件（host.ts、root.ts、client.ts）与测试；不纳入则里程碑 done criteria 不受影响（done criteria 未列出该能力），但定案的能力在里程碑内无人承接。推荐：不纳入本变更，保持 host 零改动；由作者经 /strict-roadmap-plan 在本里程碑新增一个计划变更（或并入 polish-release）专门承接面板内路径切换与路径校验。选项：A 不纳入、另立计划变更（推荐）；B 纳入本变更，同时扩大到 host 路由与定位逻辑；C 认为该定案已不需要，在里程碑中撤销
    answer: 纳入本变更（作者 2026-10-20 选择选项 B）：范围扩大到 host 侧——快照路由接受可选的项目路径查询参数并做校验，client 提供路径输入与切换；同步修改 host.ts、root.ts、client.ts，新增 delta 规格要求与测试；proposal 的「host 路由形状不变」约束相应收窄为「不带参数时行为与响应形状不变」
    status: resolved
