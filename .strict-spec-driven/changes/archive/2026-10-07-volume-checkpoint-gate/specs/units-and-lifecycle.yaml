schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: units-and-lifecycle
operations:
  ADDED: {}
  MODIFIED:
    derived-stage:
      strength: MUST
      statement: 文体（Genre）可以把单元类型声明为汇总单元（Aggregated Unit）：单元类型上的布尔字段 stage_from_children 为 true（声明与校验见 genres-and-packs 主规格的 aggregated-unit-types）。汇总单元的阶段（Stage）不由推进得出，而是由子单元汇总的推导阶段（Derived Stage）：取其子单元树中所有非汇总子孙单元（走生命周期的单元）里最落后者的阶段——按该文体阶段序列排序最靠前的阶段；没有非汇总子孙单元时为文体的第一个阶段；全部为 done 时为 done。work.yaml 中汇总单元仍必须存有合法 stage（JSON Schema 不变，wa-cli unit add 写入文体的第一个阶段作为存储值），wa-cli 的行为以推导阶段为准：wa-cli advance <汇总单元> 不修改文件，报告错误码 lifecycle.derived-stage（path 为该 work.yaml，next 包含 wa-cli status --dir <dir> --json），退出码 1。wa-cli next 对汇总单元：steps 中该单元的 stage 为推导阶段，blockers 为其未完成非汇总子孙单元的阻塞项按 next-steps 规定顺序去重后的并集（同一 code、artifact、path 与 decision 的阻塞项只保留一条），commands 为空数组——唯一例外是部单元（卷，见 volume 主规格）目录下已有通过校验而 confirmed_by_author 不为 true 的卷末检查点（Volume Checkpoint）checkpoint.yaml 时，commands 为 [wa-cli volume confirm <part> --dir <dir> --json, wa-cli help volume confirm --json]，action 另提示请作者核对并确认该检查点；action 提示未完成的非汇总子孙单元数量，feedback 仍为该单元自身的未处理反馈；推导阶段为 done 的汇总单元不出现在不带 unit 参数的 next 输出中（同 next-skips-done）。给出 unit 参数且该单元为汇总单元时同样输出上述条目；wa-cli status 的 units 中汇总单元的 blockers 与 commands 与 next 相同。非汇总单元在 next 中的行为不变。
      scenarios:
        derive-weakest:
          - GIVEN: novel 作品 my-novel 有 part-one（chapter-one 下 scene-1 的 stage 为 done、scene-2 为 draft，chapter-two 下 scene-3 为 brief）
          - WHEN: 运行 wa-cli status --dir D --json
          - THEN: units 中 chapter-one 的 stage 为 draft、part-one 的 stage 为 brief（scene-3 最落后），退出码为 0
        derive-empty:
          - GIVEN: novel 作品 my-novel 的 chapter-two 下没有任何场景
          - WHEN: 运行 wa-cli status --dir D --json
          - THEN: chapter-two 的 stage 为 brief（novel 的第一个阶段），blockers 与 commands 为空数组，退出码为 0
        advance-derived-rejected:
          - GIVEN: novel 作品 my-novel 有 chapter-one（其下有场景）
          - WHEN: 运行 wa-cli advance my-novel/chapter-one --dir D --json
          - THEN: valid 为 false，diagnostics 中有一条错误码为 lifecycle.derived-stage、path 为 .writing-anything/works/my-novel/work.yaml 的诊断，其 next 包含 wa-cli status 命令；work.yaml 与运行前逐字节相同，退出码为 1
        derive-all-done:
          - GIVEN: novel 作品 my-novel 的 part-one 下所有场景的 stage 都为 done
          - WHEN: 运行 wa-cli next --dir D --json
          - THEN: steps 不含 part-one 及其下汇总单元，只含尚未完成的非汇总单元（如根单元），退出码为 0
        next-derived-blockers:
          - GIVEN: novel 作品 my-novel 的 chapter-one 下 scene-1 缺 brief 产物、scene-2 缺 brief 产物
          - WHEN: 运行 wa-cli next my-novel/chapter-one --dir D --json
          - THEN: steps 只含 chapter-one 一项，stage 为 brief，blockers 为 scene-1 与 scene-2 的 lifecycle.missing-artifact 阻塞项去重后的并集（两条，path 各为场景的单元目录），commands 为空数组，action 提示未完成的场景数量，退出码为 0
        next-volume-confirm:
          - GIVEN: novel 作品 my-novel 的 part-one 最后一个场景已验收，wa-cli accept 自动生成了未确认的 checkpoint.yaml
          - WHEN: 运行 wa-cli next my-novel/part-one --dir D --json
          - THEN: steps 只含 part-one 一项，commands 依次为 wa-cli volume confirm my-novel/part-one --dir D --json 与 wa-cli help volume confirm --json，action 提到 wa-cli volume confirm，退出码为 0；确认后 commands 为空数组
  REMOVED: {}
